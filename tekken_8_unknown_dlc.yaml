class PatchManager:
    def __init__(self, version: str):
        self.version = version
        self.patch_notes = []

    def register_patch_note(self, note: str):
        self.patch_notes.append(note)

    def apply_patch(self):
        print(f"Applying Patch Version {self.version}...")
        for note in self.patch_notes:
            print(f" -> FIX/FEATURE: {note}")


