import cairo
import numpy as np
import math

# --- Configuration for Gilbert Algordo ---
OUTPUT_PREFIX = "gilbert_algordo_mensa_ai"
ICON_SIZE = 512
# Deep Blue, Gold, and White for intelligence, achievement, and clarity
COLOR_BG = (0.06, 0.12, 0.24, 1.0) # #0F1F3D
COLOR_PRIMARY = (0.93, 0.75, 0.31, 1.0) # #EDBF4F (Gold)
COLOR_ACCENT = (0.33, 0.82, 0.96, 1.0) # #54D1F5 (Light Blue)
COLOR_TEXT = (1.0, 1.0, 1.0, 1.0)

def setup_context(surface):
    ctx = cairo.Context(surface)
    # Enable anti-aliasing for smooth lines
    ctx.set_antialias(cairo.ANTIALIAS_BEST)
    return ctx

def draw_rounded_background(ctx):
    """Creates a deep blue rounded square canvas."""
    ctx.set_source_rgba(*COLOR_BG)
    # Draw a rounded rectangle covering the full size
    radius = ICON_SIZE * 0.1
    ctx.new_sub_path()
    ctx.arc(radius, radius, radius, math.pi, 3*math.pi/2)
    ctx.arc(ICON_SIZE - radius, radius, radius, 3*math.pi/2, 0)
    ctx.arc(ICON_SIZE - radius, ICON_SIZE - radius, radius, 0, math.pi/2)
    ctx.arc(radius, ICON_SIZE - radius, radius, math.pi/2, math.pi)
    ctx.close_path()
    ctx.fill()

def draw_glowing_line(ctx, points, color, line_width):
    """Draws a smooth, glowing path using Bézier curves."""
    if len(points) < 2:
        return
    
    ctx.set_source_rgba(*color)
    ctx.set_line_width(line_width)
    ctx.set_line_cap(cairo.LINE_CAP_ROUND)
    ctx.set_line_join(cairo.LINE_JOIN_ROUND)

    # Add a subtle outer glow (shadow)
    ctx.set_shadow_blur(10)
    ctx.set_shadow_color(cairo.Color(color[0], color[1], color[2], 0.4))

    # Start the path
    ctx.move_to(*points[0])
    
    # Use curves for a fluid connection
    for i in range(len(points) - 2):
        p0 = points[i]
        p1 = points[i+1]
        p2 = points[i+2]
        # Simple control point logic for smoothing
        ctx.curve_to(p0[0], p0[1], p1[0], p1[1], p2[0], p2[1])
    
    # Draw the final segment
    ctx.move_to(*points[-2])
    ctx.line_to(*points[-1])
    
    ctx.stroke()
    # Clear shadow for subsequent drawings
    ctx.set_shadow_blur(0)

def draw_corner_accents(ctx):
    """Adds small, precise tick marks indicating Top Tier status."""
    ctx.set_source_rgba(*COLOR_PRIMARY)
    ctx.set_line_width(4)
    
    # Top Left
    ctx.move_to(40, 80); ctx.line_to(80, 80)
    ctx.move_to(80, 40); ctx.line_to(80, 80)
    # Bottom Right
    ctx.move_to(ICON_SIZE-40, ICON_SIZE-80); ctx.line_to(ICON_SIZE-80, ICON_SIZE-80)
    ctx.move_to(ICON_SIZE-80, ICON_SIZE-40); ctx.line_to(ICON_SIZE-80, ICON_SIZE-80)
    ctx.stroke()

def create_icon(filename, variant):
    """Generates a specific icon variant."""
    surface = cairo.ImageSurface(cairo.FORMAT_ARGB32, ICON_SIZE, ICON_SIZE)
    ctx = setup_context(surface)
    
    # 1. Base Layer
    draw_rounded_background(ctx)
    
    # 2. Variant Specific Logic
    center = ICON_SIZE / 2
    
    if variant == "catalyst":
        # Concept: Neural Network forming a stylized 'M'
        nodes = [
            (center * 0.4, center * 1.4), (center * 0.4, center * 0.6), # Left M stem
            (center, center * 1.0),                                   # Center V
            (center * 1.6, center * 0.6), (center * 1.6, center * 1.4)  # Right M stem
        ]
        draw_glowing_line(ctx, nodes, COLOR_PRIMARY, 15)
        
        # Add a central glowing orb representing the active core
        ctx.set_source_rgba(*COLOR_ACCENT)
        ctx.arc(center, center * 1.0, 25, 0, 2*math.pi)
        ctx.fill()
        
        draw_corner_accents(ctx)

    elif variant == "nexus":
        # Concept: Abstract Data Streams converging into a "2"
        
        # Draw a subtle, large '2' shape outline
        ctx.set_source_rgba(1, 1, 1, 0.15)
        ctx.set_line_width(6)
        ctx.move_to(center * 0.4, center * 0.5)
        ctx.curve_to(center * 1.5, center * 0.3, center * 1.6, center * 0.9, center * 0.6, center * 1.4)
        ctx.line_to(center * 1.6, center * 1.4)
        ctx.stroke()
        
        # Draw data streams
        stream_color = (COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2], 0.7)
        for i in range(4):
            offset_y = (i - 1.5) * 60
            points = [
                (center * 0.2, center + offset_y),
                (center * 0.6, center + offset_y + (i * 10)),
                (center * 1.0, center + offset_y - (i * 10)),
                (center * 1.4, center + offset_y)
            ]
            draw_glowing_line(ctx, points, stream_color, 8)
            
    elif variant == "apex":
        # Concept: Predictive Analysis / Peak Performance Graph
        
        # Draw a 3D-effect wireframe pyramid/peak
        pyramid_points = [
            (center, center * 0.3),      # Apex
            (center * 1.6, center * 1.5), # Base Right
            (center, center * 1.2),      # Base Center
            (center * 0.4, center * 1.5)  # Base Left
        ]
        
        # Back face
        ctx.set_source_rgba(*COLOR_BG) # Use darker blue for depth
        ctx.move_to(*pyramid_points[0]); ctx.line_to(*pyramid_points[1]); ctx.line_to(*pyramid_points[2]); ctx.fill()
        # Front face
        ctx.set_source_rgba(*COLOR_ACCENT); ctx.set_line_width(6)
        ctx.move_to(*pyramid_points[0]); ctx.line_to(*pyramid_points[3]); ctx.line_to(*pyramid_points[2]); ctx.stroke()
        # Connecting ridge
        ctx.set_source_rgba(*COLOR_PRIMARY)
        ctx.move_to(*pyramid_points[0]); ctx.line_to(*pyramid_points[1]); ctx.stroke()

        # Add an upward trajectory arrow
        arrow_path = [
            (center * 0.7, center * 1.4),
            (center * 1.3, center * 0.9)
        ]
        draw_glowing_line(ctx, arrow_path, COLOR_PRIMARY, 12)
        # Arrowhead
        ctx.move_to(center * 1.25, center * 0.95); ctx.line_to(center * 1.3, center * 0.9); ctx.line_to(center * 1.2, center * 0.85)
        ctx.fill()

    # 3. Text Overlay (Optional but good for branding)
    ctx.select_font_face("San Francisco", cairo.FONT_SLANT_NORMAL, cairo.FONT_WEIGHT_BOLD)
    ctx.set_font_size(36)
    ctx.set_source_rgba(*COLOR_TEXT)
    
    # Add "GA" monogram (Gilbert Algordo)
    x_bearing, y_bearing, width, height, x_advance, y_advance = ctx.text_extents("GA")
    ctx.move_to(center - width / 2, ICON_SIZE - 30)
    ctx.show_text("GA")

    # Save the final image
    surface.write_to_png(filename)
    print(f"Generated: {filename}")

# --- Generate the three icons ---

create_icon(f"{OUTPUT_PREFIX}_catalyst.png", "variant=catalyst")
create_icon(f"{OUTPUT_PREFIX}_nexus.png", "variant=nexus")
create_icon(f"{OUTPUT_PREFIX}_apex.png", "variant=apex")

print("\nIcon generation complete. Files are saved in the current directory.")
