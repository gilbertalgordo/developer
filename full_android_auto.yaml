#version 460 core

#include <flutter/runtime_effect.glsl>

uniform vec2 uSize;
uniform float uTime;
out vec4 fragColor;

void main() {
    vec2 uv = FlutterFragCoord().xy / uSize;
    vec2 p = (FlutterFragCoord().xy - 0.5 * uSize) / min(uSize.x, uSize.y);

    // Deep dark glassmorphic background gradient (Indigo / Midnight Blue)
    vec3 col = mix(vec3(0.02, 0.03, 0.08), vec3(0.05, 0.01, 0.12), uv.y);

    // Sci-fi perspective grid lines
    float grid = abs(fract(p.x * 10.0 - 0.5) - 0.5) / fwidth(p.x * 10.0);
    grid += abs(fract(p.y * 10.0 + uTime * 0.2) - 0.5) / fwidth(p.y * 10.0);
    
    // Cyan and Giallo Modena yellow telemetry glow accents
    float scanline = sin(FlutterFragCoord().y * 2.0 + uTime * 5.0) * 0.04;
    vec3 hudTint = vec3(0.0, 0.85, 1.0) * (1.0 - min(grid, 1.0)) * 0.3;
    
    col += hudTint + scanline;

    // Radial vignette for immersive cockpit styling
    col *= 1.0 - dot(p, p) * 0.4;

    fragColor = vec4(col, 1.0);
}



