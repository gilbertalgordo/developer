# Gilbert Algordo - Automotive Telemetry E2E Integration Test Suite
import os
import pytest
import requests
from datetime import datetime, timezone

# Base URL configurable via environment variable for staging/production testing
BASE_URL = os.getenv("TELEMETRY_API_URL", "https://telemetry.algordo.dev")
TIMEOUT_SECONDS = 10.0

@pytest.fixture(scope="session")
def api_client():
    session = requests.Session()
    # Enforce strict TLS verification by default
    session.verify = True
    return session

def test_tls_health_probe(api_client):
    """Validates that the liveness probe responds successfully over secure HTTPS/TLS."""
    url = f"{BASE_URL}/healthz"
    response = api_client.get(url, timeout=TIMEOUT_SECONDS)
    
    assert response.status_code == 200, f"Expected 200 OK, got {response.status_code}"
    data = response.json()
    assert data.get("status") == "healthy"
    assert data.get("service") == "telemetry-sync"
    print(f"\n[PASS] TLS Health Probe verified successfully at {url}")

def test_tls_readiness_probe(api_client):
    """Validates that the readiness probe confirms the backend is ready to accept traffic."""
    url = f"{BASE_URL}/ready"
    response = api_client.get(url, timeout=TIMEOUT_SECONDS)
    
    assert response.status_code == 200, f"Expected 200 OK, got {response.status_code}"
    assert response.json().get("status") == "ready"
    print(f"\n[PASS] TLS Readiness Probe verified successfully at {url}")

def test_secure_telemetry_ingest_pipeline(api_client):
    """Validates full telemetry batch upload over TLS matching regional vehicle standards."""
    url = f"{BASE_URL}/api/v1/telemetry/ingest"
    
    payload = {
        "timestamp": datetime.now(timezone.utc).isoformat(),
        "vehicle_id": "ALGORDO_E2E_TEST_NODE_01",
        "region_standard": "EU_ISO_15765",
        "metrics": {
            "speed_kmh": 145.2,
            "engine_rpm": 6800.0,
            "boost_bar": 1.52,
            "battery_temp_c": 89.4
        }
    }
    
    headers = {
        "Content-Type": "application/json",
        "User-Agent": "AlgordoAutomotiveE2ETester/1.0"
    }

    response = api_client.post(url, json=payload, headers=headers, timeout=TIMEOUT_SECONDS)
    
    assert response.status_code == 200, f"Telemetry ingestion failed with status {response.status_code}: {response.text}"
    
    result = response.json()
    assert result.get("status") == "success"
    assert result.get("vehicle_id") == "ALGORDO_E2E_TEST_NODE_01"
    assert result.get("processed_metrics") == 4
    print(f"\n[PASS] Secure Telemetry Ingestion over TLS verified. Processed 4 metrics successfully.")

def test_invalid_telemetry_payload_rejection(api_client):
    """Ensures malformed telemetry payloads are safely rejected with 422 Unprocessable Entity."""
    url = f"{BASE_URL}/api/v1/telemetry/ingest"
    
    # Missing required 'metrics' field
    malformed_payload = {
        "timestamp": datetime.now(timezone.utc).isoformat(),
        "vehicle_id": "MALFORMED_NODE",
        "region_standard": "US_SAE_J1939"
    }

    response = api_client.post(url, json=malformed_payload, timeout=TIMEOUT_SECONDS)
    assert response.status_code == 422, f"Expected 422 validation error, got {response.status_code}"
    print(f"\n[PASS] Malformed payload correctly rejected with status 422.")



