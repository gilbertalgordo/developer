class HUDDashboardWidget extends StatefulWidget {
  const HUDDashboardWidget({Key? key}) : super(key: key);

  @override
  State<HUDDashboardWidget> createState() => _HUDDashboardWidgetState();
}

class _HUDDashboardWidgetState extends State<HUDDashboardWidget> with SingleTickerProviderStateMixin {
  late Ticker _ticker;
  double _elapsedTime = 0.0;
  ui.FragmentShader? _shader;

  // Live Telemetry Mock State
  double _speed = 142.5;
  double _rpm = 6400.0;
  double _boostPressure = 1.45; // bar
  double _batteryTemp = 88.2;   // °C

  @override
  void initState() {
    super.initState();
    _loadShader();
    _ticker = createTicker((elapsed) {
      setState(() {
        _elapsedTime = elapsed.inMilliseconds / 1000.0;
        // Simulate live vehicle micro-fluctuations
        _speed = 142.0 + (ui.window.hashCode % 5) * 0.1;
      });
    })..start();
  }

  Future<void> _loadSessionShader() async {
    // Load compiled fragment shader asset
    try {
      final program = await ui.FragmentProgram.fromAsset('assets/shaders/hud_background.frag');
      setState(() {
        _shader = program.fragmentShader();
      });
    } catch (e) {
      debugPrint("Shader fallback active: $e");
    }
  }

  Future<void> _loadShader() async {
    await _loadSessionShader();
  }

  @override
  void dispose() {
    _ticker.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: Colors.black,
      body: Stack(
        children: [
          // Background Shader / Custom Canvas Layer
          Positioned.fill(
            child: _shader != null
                ? CustomPaint(painter: HUDShaderPainter(shader: _shader!, time: _elapsedTime))
                : Container(color: const Color(0xFF030510)),
          ),
          
          // Foreground HUD Glassmorphic Telemetry Interface
          SafeArea(
            child: Padding(
              padding: const EdgeInsets.all(20.0),
              child: Column(
                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                children: [
                  _buildTopStatusBar(),
                  _buildCentralTelemetryHub(),
                  _buildBottomG-ForceDock(),
                ],
              ),
            ),
          ),
        ],
      ),
    );
  }

  Widget _buildTopStatusBar() {
    return Row(
      mainAxisAlignment: MainAxisAlignment.spaceBetween,
      children: [
        const Text("ALGORDOSW // HUD-TELEMETRY-OS", 
             style: TextStyle(color: Colors.cyanAccent, fontFamily: 'monospace', letterSpacing: 1.5, fontSize: 12)),
        Row(
          children: [
            const Icon(Icons.bolt, color: Color(0xFFFFD700), size: 16),
            const SizedBox(width: 4),
            Text("HYBRID POWERTRAIN ACTIVE", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
          ],
        ),
      ],
    );
  }

  Widget _buildCentralTelemetryHub() {
    return Row(
      mainAxisAlignment: MainAxisAlignment.spaceAround,
      children: [
        // RPM Circular Gauge Pod
        _buildGlassPod(
          title: "ENGINE RPM",
          value: "${_rpm.toStringAsFixed(0)}",
          unit: "RPM",
          accentColor: Colors.deepPurpleAccent,
        ),
        
        // Primary Velocity Readout (Center)
        Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            Text(
              _speed.toStringAsFixed(1),
              style: const TextStyle(fontSize: 72, fontWeight: FontWeight.w900, color: Colors.white, shadows: [
                Shadow(color: Colors.cyanAccent, blurRadius: 20)
              ]),
            ),
            const Text("KM/H", style: TextStyle(color: Colors.cyanAccent, letterSpacing: 2, fontWeight: FontWeight.bold)),
          ],
        ),

        // Boost & Thermal Pod
        _buildGlassPod(
          title: "TURBO BOOST",
          value: "${_boostPressure.toStringAsFixed(2)}",
          unit: "BAR",
          accentColor: const Color(0xFFFFD700), // Giallo Modena Yellow
        ),
      ],
    );
  }

  Widget _buildGlassPod({required String title, required String value, required String unit, required Color accentColor}) {
    return ClipRRect(
      borderRadius: BorderRadius.circular(16),
      child: BackdropFilter(
        filter: ui.ImageFilter.blur(sigmaX: 10, sigmaY: 10),
        child: Container(
          padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 16),
          decoration: BoxDecoration(
            color: Colors.white.withOpacity(0.05),
            border: Border.all(color: accentColor.withOpacity(0.4), width: 1.5),
            borderRadius: BorderRadius.circular(16),
          ),
