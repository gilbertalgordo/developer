    func templateApplicationScene(_ templateApplicationScene: CPTemplateApplicationScene, 
                                  didConnect interfaceController: CPInterfaceController) {
        self.interfaceController = interfaceController
        
        // Constructing interactive AI widget item for the vehicle display
        let aiWidgetRow = CPListItem(text: "Algordo CarPlay Active AI", detailText: "Hybrid local/cloud inference online")
        aiWidgetRow.handler { _, completion in
            print("CarPlay AI Widget interaction dispatched.")
            // Trigger local offline fallback model or cloud assistant query here
            completion()
        }

        let section = CPListSection(items: [aiWidgetRow])
        let listTemplate = CPListTemplate(title: "Universal Auto Hub", sections: [section])
        
        interfaceController.setRootTemplate(listTemplate, animated: true) { success, error in
            if let error = error {
                print("Failed to set root CarPlay template: \(error.localizedDescription)")
