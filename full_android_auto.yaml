  Future<void> _initializeVehicleBus() async {
    // Establish bi-directional platform channel bridge to Android Auto / CarPlay HAL
    const channel = MethodChannel('com.gilbertalgordo.auto/hal');
    try {
      final bool status = await channel.invokeMethod('connectHAL', {'region': widget.regionStandard});
      setState(() => _isConnected = status);
