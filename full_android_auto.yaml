name: Universal Automotive CI/CD

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-automotive:
    name: Build & Sign Android (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [UsRegionRelease, EuRegionRelease, AsiaRegionRelease]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Caching
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          fi

      - name: Assemble Signed Regional App Package
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assemble${{ matrix.flavor }}

      - name: Upload Android Automotive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-auto-${{ matrix.flavor }}
          path: app/build/outputs/apk/**/*.apk

  build-ios-carplay:
    name: Build & Archive iOS CarPlay App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Configure iOS Code Signing & Provisioning Profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain for secure builds
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

          # Import Apple Distribution Certificate (.p12)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A
          security set-keychain-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Install Mobile Provisioning Profile for CarPlay Navigation
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/carplay_profile.mobileprovision

      - name: Archive iOS CarPlay Project
        run: |
          xcodebuild -project AlgordoAuto.xcodeproj \
                     -scheme "AlgordoAuto" \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $PWD/build/AlgordoAuto.xcarchive \
                     archive \
                     CODE_SIGN_STYLE=Manual

      - name: Export IPA Artifact
        run: |
          # Export options archive conversion step
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/AlgordoAuto.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $PWD/build/export
        continue-on-error: true

      - name: Upload CarPlay iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-carplay-ipa
          path: build/export/*.ipa



# Fastfile - Gilbert Algordo Automotive Delivery Pipeline

default_platform(:android)

platform :android do
  desc "Deploy Android Automotive multi-region builds to Google Play Console"
  lane :deploy_play_store do |options|
    flavor = options[:flavor] || "usRegionRelease"
    
    upload_to_play_store(
      track: 'internal',
      apk_paths: Dir["app/build/outputs/apk/#{flavor.downcase}/release/*.apk"],
      skip_upload_images: true,
      skip_upload_screenshots: true
    )
  end
end

platform :ios do
  desc "Upload iOS CarPlay archive to Apple TestFlight"
  lane :deploy_testflight do
    upload_to_testflight(
      ipa: "build/export/AlgordoAuto.ipa",
      skip_waiting_for_build_processing: true
    )
  end
end



name: Automotive Continuous Deployment

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

jobs:
  publish-google-play:
    name: Publish to Google Play (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [UsRegionRelease, EuRegionRelease, AsiaRegionRelease]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Google Play Service Account JSON
        env:
          GOOGLE_PLAY_JSON_KEY_BASE64: ${{ secrets.GOOGLE_PLAY_JSON_KEY_BASE64 }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY_BASE64" | base64 --decode > android/fastlane/google-play-key.json

      - name: Build and Upload via Fastlane
        env:
          SUPPLY_JSON_KEY: 'android/fastlane/google-play-key.json'
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Decode keystore
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          
          # Run fastlane android deployment lane
          bundle exec fastlane android deploy_play_store flavor:${{ matrix.flavor }}

  publish-testflight:
    name: Publish iOS CarPlay to TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Authenticate App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive and Upload to TestFlight via Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Execute iOS build archiving and TestFlight upload
          bundle exec fastlane ios deploy_testflight



package com.gilbertalgordo.auto.telemetry

import android.content.Context
import io.opentelemetry.api.GlobalOpenTelemetry
import io.opentelemetry.api.trace.Tracer
import io.sentry.android.core.SentryAndroid
import io.sentry.Sentry

class AutomotiveTelemetryClient private constructor(context: Context) {
    private val tracer: Tracer = GlobalOpenTelemetry.getTracer("com.gilbertalgordo.auto.telemetry")

    init {
        // Initialize Sentry for crash reporting and performance tracing
        SentryAndroid.init(context) { options ->
            options.dsn = "YOUR_SENTRY_DSN_KEY"
            options.tracesSampleRate = 1.0
            options.isEnableAutoSessionTracking = true
        }
    }

    companion object {
        @Volatile
        private var INSTANCE: AutomotiveTelemetryClient? = null

        fun getInstance(context: Context): AutomotiveTelemetryClient {
            return INSTANCE ?: synchronized(this) {
                INSTANCE ?: AutomotiveTelemetryClient(context).also { INSTANCE = it }
            }
        }
    }

    fun recordVehicleMetric(metricName: String, value: Double, attributes: Map<String, String>) {
        val span = tracer.spanBuilder("metric_$metricName").startSpan()
        try {
            span.setAttribute("vehicle.metric.value", value)
            attributes.forEach { (k, v) -> span.setAttribute(k, v) }
            Sentry.addBreadcrumb("Telemetry recorded: $metricName = $value")
        } catch (e: Exception) {
            Sentry.captureException(e)
        } finally {
            span.end()
        }
    }

    fun captureHeadUnitCrash(throwable: Throwable, contextMetadata: String) {
        Sentry.withScope { scope ->
            scope.setTag("head_unit.context", contextMetadata)
            Sentry.captureException(throwable)
        }
    }
}



import Foundation
import Sentry

public class AutomotiveTelemetryEngine {
    public static let shared = AutomotiveTelemetryEngine()

    private init() {
        SentrySDK.start { options in
            options.dsn = "YOUR_SENTRY_DSN_KEY"
            options.debug = false
            options.tracesSampleRate = 1.0
            options.enableAutoSessionTracking = true
        }
    }

    public func trackSpan(name: String, operation: String, block: () -> Void) {
        let transaction = SentrySDK.startTransaction(name: name, operation: operation)
        
        let breadcrumb = Breadcrumb()
        breadcrumb.category = "carplay.lifecycle"
        breadcrumb.message = "Executing operation: \(name)"
        breadcrumb.level = .info
        SentrySDK.addBreadcrumb(breadcrumb)

        do {
            block()
            transaction.finish(status: .ok)
        } catch {
            transaction.finish(status: .internalError)
            SentrySDK.capture(error: error)
        }
    }
}



