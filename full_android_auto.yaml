class HUDShaderPainter extends CustomPainter {
  final ui.FragmentShader shader;
  final double time;

  HUDShaderPainter({required this.shader, required this.time});

  @override
  void paint(Canvas canvas, Size size) {
    shader.setFloat(0, size.width);
    shader.setFloat(1, size.height);
    shader.setFloat(2, time);

    final paint = Paint()..shader = shader;
    canvas.drawRect(Rect.fromLTWH(0, 0, size.width, size.height), paint);
  }

  @override
  bool shouldRepaint(covariant HUDShaderPainter oldDelegate) {
    return oldDelegate.time != time;
  }
}



// ============================================================================
// Gilbert Algordo - Parametric Automotive Display Enclosure & Mounting Brackets
// Target: Universal FDM 3D Printing (PETG / ABS Recommended for Cabin Heat)
// ============================================================================

/* [Enclosure Dimensions] */
screen_width = 185;   // Internal width for display module (mm)
screen_height = 115;  // Internal height for display module (mm)
screen_depth = 22;    // Internal depth/clearance (mm)
wall_thickness = 3.5; // Robust wall thickness for vibration resistance (mm)
tolerance = 0.6;      // FDM printing fit tolerance (mm)

/* [Hardware & Mounting] */
screw_dia = 3.2;      // M3 screw diameter with clearance
boss_dia = 7.5;       // Corner screw pillar diameter
bracket_angle = 32;   // Dashboard viewing angle adjustment (degrees)

/* [Render Selector: 1 = Main Enclosure, 2 = Removable Back Cover, 3 = Mounting Brackets] */
part_selector = 1; 

$fn = 64; // Smooth cylinder rendering resolution

module display_enclosure() {
    outer_w = screen_width + (wall_thickness * 2) + tolerance;
    outer_h = screen_height + (wall_thickness * 2) + tolerance;
    outer_d = screen_depth + wall_thickness + tolerance;

    difference() {
        // Main Outer Shell with rounded aerodynamic corners
        translate([-outer_w/2, -outer_h/2, 0])
        hull() {
            for (x = [wall_thickness, outer_w - wall_thickness], 
                 y = [wall_thickness, outer_h - wall_thickness]) {
                translate([x, y, 0])
                cylinder(r=wall_thickness+2, h=outer_d);
            }
        }

        // Internal Hollow Cavity for Display Module
        translate([-screen_width/2 - tolerance/2, -screen_height/2 - tolerance/2, wall_thickness])
        cube([screen_width + tolerance, screen_height + tolerance, screen_depth + 1]);

        // Front Display Screen Bezel Opening (Leaves 6mm structural lip)
        translate([-screen_width/2 + 6, -screen_height/2 + 6, -1])
        cube([screen_width - 12, screen_height - 12, wall_thickness + 2]);

        // Thermal Ventilation Slots on Top & Bottom Walls
        for (i = [-4, -2, 0, 2, 4]) {
            translate([i * 12, outer_h/2 - wall_thickness - 1, outer_d / 2])
            cube([4, wall_thickness + 2, 12], center=true);
        }
    }

    // Corner Screw Bosses for Back Plate Securing
    for (x = [-screen_width/2 - tolerance/2 + 3, screen_width/2 + tolerance/2 - 9],
         y = [-screen_height/2 - tolerance/2 + 3, screen_height/2 + tolerance/2 - 9]) {
        translate([x, y, wall_thickness])
        difference() {
            cylinder(d=boss_dia, h=screen_depth);
            translate([0, 0, -1])
            cylinder(d=screw_dia, h=screen_depth + 2);
        }
    }
}

module back_cover() {
    cover_w = screen_width + (wall_thickness * 2) + tolerance - 0.4;
    cover_h = screen_height + (wall_thickness * 2) + tolerance - 0.4;
    cover_thickness = 3.0;

    union() {
        // Base plate matching enclosure inner dimension
        translate([-cover_w/2, -cover_h/2, 0])
        cube([cover_w, cover_h, cover_thickness]);

        // Interlocking Step Lip to snap securely inside enclosure
        translate([-cover_w/2 + 2, -cover_h/2 + 2, cover_thickness])
        cube([cover_w - 4, cover_h - 4, 2]);

        // Corner screw alignment tabs
        for (x = [-screen_width/2 - tolerance/2 + 3, screen_width/2 + tolerance/2 - 9],
             y = [-screen_height/2 - tolerance/2 + 3, screen_height/2 + tolerance/2 - 9]) {
            translate([x + 3, y + 3, 0])
            difference() {
                cylinder(d=boss_dia, h=cover_thickness);
                translate([0, 0, -1])
                cylinder(d=screw_dia, h=cover_thickness + 2);
            }
        }
    }
}

module mounting_brackets() {
    bracket_length = 70;
    bracket_width = 25;
    bracket_thickness = 6;

    difference() {
        union() {
            // Base mounting foot for dashboard chassis anchoring
            cube([bracket_length, bracket_width, bracket_thickness]);
            
            // Angled arm rising to connect to enclosure rear spine
            rotate([bracket_angle, 0, 0])
            translate([0, 0, 0])
            cube([bracket_length, bracket_thickness, 55]);

            // Structural Gusset / Load-Bearing Reinforcement Rib
            translate([bracket_length/2 - 2, 0, 0])
            linear_extrude(height=40)
            polygon(points=[[0,0], [bracket_width, 0], [0, 45]]);
        }

        // Chassis Mounting Screw Holes (M4 Clearance)
        translate([15, bracket_width/2, -1])
        cylinder(d=4.5, h=bracket_thickness + 2);
        
        translate([bracket_length - 15, bracket_width/2, -1])
        cylinder(d=4.5, h=bracket_thickness + 2);
    }
}

// Part Selector Execution Switch
if (part_selector == 1) {
    display_enclosure();
} else if (part_selector == 2) {
    back_cover();
} else if (part_selector == 3) {
    mounting_brackets();
}



