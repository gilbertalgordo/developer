import androidx.car.app.model.*
import androidx.car.app.validation.HostValidator

class AlgordoCarAppService : CarAppService() {
    override fun createHostValidator(): HostValidator {
        // Allows verified automotive and projection hosts (US, EU, Asia standards)
        return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR
    }

    override fun onCreateSession(): Session {
        return AlgordoCarSession()
    }
}

class AlgordoCarSession : Session() {
    override fun onCreateScreen(intent: Intent): Screen {
        return AlgordoMainScreen(carContext)
    }
}

class AlgordoMainScreen(carContext: CarContext) : Screen(carContext) {
    override fun onGetTemplate(): Template {
        val row = Row.Builder()
            .setTitle("Active AI Core: Online/Offline Ready")
            .addText("Telemetry routed securely via Vehicle HAL bus.")
            .build()

        val pane = Pane.Builder()
            .addRow(row)
            .addAction(
                Action.Builder()
                    .setTitle("Trigger Voice AI")
                    .setOnClickListener {
                        CarToast.makeText(carContext, "AI Active Sync Triggered", CarToast.LENGTH_SHORT).show()
                    }
                    .build()
            )
            .build()

        return PaneTemplate.Builder(pane)
            .setTitle("Algordo Automotive Intelligence")
            .setHeaderAction(Action.APP_ICON)
            .build()
    }
}



