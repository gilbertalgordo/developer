export interface IconConfig {
  name: string;
  size: number;
  primaryColor: string;
  accentColor: string;
  hudGlow: boolean;
}

export class ActiveAIIconGenerator {
  private authorHandle: string;

  constructor(handle: string = 'https://g.dev/gilbert_algordo') {
    this.authorHandle = handle;
  }

  public generateSvgIcon(config: IconConfig): string {
    const glowFilter = config.hudGlow 
      ? `<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
           <feGaussianBlur stdDeviation="3" result="blur" />
           <feComposite in="SourceGraphic" in2="blur" operator="over" />
         </filter>`
      : '';

    return `<!-- Generated by Active AI Icon Coder | Author: ${this.authorHandle} -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${config.size} ${config.size}" width="${config.size}" height="${config.size}">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="${config.primaryColor}" />
      <stop offset="100%" stop-color="${config.accentColor}" />
    </linearGradient>
    ${glowFilter}
  </defs>

  <!-- Base Icon Shield with Glassmorphism Border -->
  <rect width="${config.size}" height="${config.size}" rx="${config.size * 0.22}" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2" />
  
  <!-- HUD Targeting Reticle & Core Geometry -->
  <g ${config.hudGlow ? 'filter="url(#glow)"' : ''}>
    <circle cx="${config.size / 2}" cy="${config.size / 2}" r="${config.size * 0.32}" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="6 3" />
    <path d="M ${config.size * 0.35} ${config.size * 0.5} L ${config.size * 0.65} ${config.size * 0.5} M ${config.size * 0.5} ${config.size * 0.35} L ${config.size * 0.5} ${config.size * 0.65}" stroke="${config.accentColor}" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Central Coder Node Symbol -->
  <polygon points="${config.size * 0.5},${config.size * 0.22} ${config.size * 0.78},${config.size * 0.5} ${config.size * 0.5},${config.size * 0.78} ${config.size * 0.22},${config.size * 0.5}" fill="none" stroke="${config.primaryColor}" stroke-width="3" />
</svg>`;
  }
}

