from fastapi import FastAPI, Depends, HTTPException, status
from pydantic import BaseModel, Field
from typing import List, Dict, Optional
from datetime import datetime
import json

from sqlalchemy import create_engine, Column, String, Text, Float, DateTime, Integer, ForeignKey
from sqlalchemy.orm import declarative_base, sessionmaker, relationship, Session

# ==========================================
# Database Configuration (SQLite & SQLAlchemy)
# ==========================================
SQLALCHEMY_DATABASE_URL = "sqlite:///./judgments_archive.db"

engine = create_engine(
    SQLALCHEMY_DATABASE_URL, connect_args={"check_same_thread": False}
)
SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)
Base = declarative_base()

# Database Models
class CaseDB(Base):
    __tablename__ = "cases"

    case_id = Column(String, primary_key=True, index=True)
    title = Column(String, nullable=False)
    facts = Column(Text, nullable=False)  # Stored as JSON string
    petitioner_arguments = Column(Text, nullable=False)  # Stored as JSON string
    respondent_arguments = Column(Text, nullable=False)  # Stored as JSON string
    governing_framework = Column(String, nullable=False)
    created_at = Column(DateTime, default=datetime.utcnow)

    judgment = relationship("JudgmentDB", back_populates="case", uselist=False)

class JudgmentDB(Base):
    __tablename__ = "judgments"

    id = Column(Integer, primary_key=True, index=True, autoincrement=True)
    case_id = Column(String, ForeignKey("cases.case_id"), unique=True)
    verdict = Column(String, nullable=False)
    constitutional_basis = Column(String, nullable=False)
    reasoning_summary = Column(Text, nullable=False)
    detailed_opinion = Column(Text, nullable=False)
    balance_metrics = Column(Text, nullable=False)  # Stored as JSON string
    adjudicated_at = Column(DateTime, default=datetime.utcnow)

    case = relationship("CaseDB", back_populates="judgment")

# Create database tables
Base.metadata.create_all(bind=engine)

# Dependency to get DB session
def get_db():
    db = SessionLocal()
    try:
        yield db
    finally:
        db.close()

# ==========================================
# Pydantic Schemas
# ==========================================

class CaseSubmissionSchema(BaseModel):
    case_id: str = Field(..., example="GR-2026-0821", description="Unique alphanumeric case identifier.")
    title: str = Field(..., example="Digital Privacy vs. Public Security Oversight", description="Short title of the dispute.")
