  });
  const [submitting, setSubmitting] = useState(false);
  const [successMsg, setSuccessMsg] = useState(null);

  useEffect(() => {
    fetchJudgments();
  }, []);

  const fetchJudgments = async () => {
    try {
      setLoading(true);
      const res = await fetch(`${API_BASE_URL}/judgments`);
      const data = await res.json();
      setJudgments(data);
      if (data.length > 0 && !selectedJudgment) {
        setSelectedJudgment(data[0]);
      }
    } catch (err) {
      console.error("Failed to fetch advanced judgments:", err);
    } finally {
      setLoading(false);
    }
  };

  const handleCaseSubmit = async (e) => {
    e.preventDefault();
    setSubmitting(true);
    setSuccessMsg(null);

    const payload = {
      case_id: formData.case_id,
      title: formData.title,
      jurisdiction: formData.jurisdiction,
      governing_framework: formData.governing_framework.split('\n').filter(Boolean),
