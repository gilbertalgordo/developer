from fastapi import FastAPI, Depends, HTTPException, status
from pydantic import BaseModel, Field
from typing import List, Dict, Optional
from datetime import datetime
import json

from sqlalchemy import create_engine, Column, String, Text, Float, DateTime, Integer, ForeignKey
from sqlalchemy.orm import declarative_base, sessionmaker, relationship, Session

# ==========================================
# Database Configuration (SQLite & SQLAlchemy)
# ==========================================
SQLALCHEMY_DATABASE_URL = "sqlite:///./advanced_judgments_archive.db"

engine = create_engine(
    SQLALCHEMY_DATABASE_URL, connect_args={"check_same_thread": False}
)
SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)
Base = declarative_base()

# Database Models
class CaseSubmissionDB(Base):
    __tablename__ = "advanced_cases"

    case_id = Column(String, primary_key=True, index=True)
    title = Column(String, nullable=False)
    jurisdiction = Column(String, nullable=False)
    governing_framework = Column(Text, nullable=False)  # Stored as JSON string
    facts = Column(Text, nullable=False)  # Stored as JSON string
    petitioner_claims = Column(Text, nullable=False)  # Stored as JSON string
    respondent_defenses = Column(Text, nullable=False)  # Stored as JSON string
    precedents_cited = Column(Text, nullable=True)  # Stored as JSON string
    created_at = Column(DateTime, default=datetime.utcnow)

    judgment = relationship("AdvancedJudgmentDB", back_populates="case", uselist=False)

class AdvancedJudgmentDB(Base):
    __tablename__ = "advanced_judgments"

    id = Column(Integer, primary_key=True, index=True, autoincrement=True)
    case_id = Column(String, ForeignKey("advanced_cases.case_id"), unique=True)
    presiding_judge = Column(String, nullable=False)
    jurisdiction = Column(String, nullable=False)
    verdict = Column(String, nullable=False)
    disposition = Column(String, nullable=False)
    constitutional_basis = Column(Text, nullable=False)  # Stored as JSON string
    ratio_decidendi = Column(Text, nullable=False)
    detailed_opinion = Column(Text, nullable=False)
    telemetry_metrics = Column(Text, nullable=False)  # Stored as JSON string
    adjudicated_at = Column(DateTime, default=datetime.utcnow)

    case = relationship("CaseSubmissionDB", back_populates="judgment")

# Create database tables
Base.metadata.create_all(bind=engine)

# Dependency to get DB session
def get_db():
    db = SessionLocal()
    try:
        yield db
    finally:
        db.close()

# ==========================================
# Pydantic Schemas (Validation)
# ==========================================

class CaseSubmissionSchema(BaseModel):
    case_id: str = Field(..., example="SC-2026-9941", description="Unique alphanumeric case identifier.")
    title: str = Field(..., example="Autonomous AI Telemetry Surveillance vs. Civil Privacy", description="Short title of the dispute.")
    jurisdiction: str = Field(..., example="Constitutional & Statutory Law", description="Governing legal domain.")
    governing_framework: List[str] = Field(..., example=["Article III, Constitution", "Data Privacy Act"], description="Applicable statutory codes.")
    facts: List[str] = Field(..., example=["State security deployed un-warranted neural scanning."], description="Established facts.")
    petitioner_claims: List[str] = Field(..., example=["Violation of constitutional right against unreasonable search."], description="Claims raised by petitioner.")
    respondent_defenses: List[str] = Field(..., example=["Execution of state cyber-defense mandates."], description="Defenses raised by respondent.")
    precedents_cited: Optional[List[str]] = Field(default=[], example=["State v. Cybernetic Board (2024)"], description="Relevant legal precedents.")

class JudicialOpinionResponse(BaseModel):
    case_id: str
    case_title: str
    presiding_judge: str
    jurisdiction: str
    verdict: str
    disposition: str
    constitutional_basis: List[str]
    ratio_decidendi: str
    detailed_opinion: str
    telemetry_metrics: Dict[str, float]
    adjudicated_at: datetime

    class Config:
        from_attributes = True

# ==========================================
# Advanced AI Judge Engine Logic
# ==========================================

class AdvancedActiveJudgeAI:
    def __init__(self, judge_name: str = "Justice Lexis (Neural Core v3.2)", judicial_philosophy: str = "Structural Harmonization & Substantive Equity"):
        self.judge_name = judge_name
        self.judicial_philosophy = judicial_philosophy

    def deliberate(self, case: CaseSubmissionSchema) -> Dict[str, Any]:
        claim_weight = len(case.petitioner_claims) * 1.1
        defense_weight = len(case.respondent_defenses) * 1.1
        factual_density = len(case.facts) * 0.5
        precedent_support = len(case.precedents_cited or []) * 0.3

        total_weight = claim_weight + defense_weight + 0.001
        petitioner_ratio = claim_weight / total_weight

        fairness_index = round(min(0.99, 0.92 + (factual_density * 0.01)), 3)
        fidelity_index = round(min(0.99, 0.94 + (precedent_support * 0.01)), 3)
        equity_balance = round(0.85 + (abs(0.5 - petitioner_ratio) * 0.2), 3)

        if petitioner_ratio >= 0.5:
            verdict = "GRANTED IN PART, SUBJECT TO EQUITABLE LIMITATIONS"
            disposition = "The petition is hereby sustained with calibrated injunctive relief."
        else:
            verdict = "DISMISSED WITH MODIFIED STATUTORY PROTECTIONS"
            disposition = "The respondent's defensive privileges are upheld under strict scrutiny."

        frameworks_str = ", ".join(case.governing_framework)
        facts_summary = "; ".join(case.facts)
        petitioner_str = "; ".join(case.petitioner_claims)
        respondent_str = "; ".join(case.respondent_defenses)

        detailed_opinion = (
            f"OPINION OF THE TRIBUNAL\n\n"
            f"Presided under the jurisprudential doctrine of {self.judicial_philosophy} by {self.judge_name}, "
            f"this court has meticulously examined the records, factual matrices, and statutory parameters "
            f"anchored within the {case.jurisdiction} framework ({frameworks_str}).\n\n"
            f"### I. The Factual Matrix & Contentions\n"
            f"The controversy unfurls against the backdrop of established facts: {facts_summary}. "
            f"The petitioner asserts that {petitioner_str}, invoking core guarantees of due process and systemic liberty. "
            f"Conversely, the respondent interposes that {respondent_str}, seeking sanctuary within statutory exemptions.\n\n"
            f"### II. Rightful Judgment & Statutory Harmony\n"
            f"True adjudication transcends the sterile exegesis of code text; it demands the organic harmonization of legal mandates with "
            f"substantive equity. In evaluating the competing scales, this tribunal affirms that the integrity of the {case.jurisdiction} "
            f"must be insulated from both legislative laxity and overreaching executive encroachment.\n\n"
