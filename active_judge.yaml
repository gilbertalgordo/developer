app = FastAPI(
    title="Active Judge AI Archive Service",
    description="Persistent judicial arbitration engine with SQLite historical logging.",
    version="2.0.0"
)

@app.get("/", tags=["System Status"])
def read_root():
    return {
        "status": "online",
        "database": "SQLite connected (judgments_archive.db)",
        "presiding_judge": court_judge.judge_name
    }

@app.post("/api/v1/adjudicate", response_model=JudicialOpinionResponse, status_code=status.HTTP_201_CREATED, tags=["Judicial Adjudication"])
def adjudicate_and_log(case_data: CaseSubmissionSchema, db: Session = Depends(get_db)):
    """
    Submits a case file, computes the judicial decision using Active Judge AI,
    and persists both the case data and the judgment to the SQLite database.
    """
    # Check if case_id already exists
    existing_case = db.query(CaseDB).filter(CaseDB.case_id == case_data.case_id).first()
    if existing_case:
        raise HTTPException(
            status_code=status.HTTP_400_BAD_REQUEST,
            detail=f"Case ID '{case_data.case_id}' already exists in historical records."
        )

    # Run AI Deliberation
    deliberation_result = court_judge.deliberate(case_data)

    # Save Case Record
    db_case = CaseDB(
        case_id=case_data.case_id,
        title=case_data.title,
        facts=json.dumps(case_data.facts),
        petitioner_arguments=json.dumps(case_data.petitioner_arguments),
        respondent_arguments=json.dumps(case_data.respondent_arguments),
        governing_framework=case_data.governing_framework
    )
    db.add(db_case)
    db.commit()

    # Save Judgment Record
    db_judgment = JudgmentDB(
        case_id=case_data.case_id,
        verdict=deliberation_result["verdict"],
        constitutional_basis=deliberation_result["constitutional_basis"],
        reasoning_summary=deliberation_result["reasoning_summary"],
        detailed_opinion=deliberation_result["detailed_opinion"],
        balance_metrics=json.dumps(deliberation_result["balance_metrics"])
    )
    db.add(db_judgment)
    db.commit()
    db.refresh(db_judgment)

    return JudicialOpinionResponse(
        case_id=db_case.case_id,
        case_title=db_case.title,
        verdict=db_judgment.verdict,
        constitutional_basis=db_judgment.constitutional_basis,
        reasoning_summary=db_judgment.reasoning_summary,
        detailed_opinion=db_judgment.detailed_opinion,
        balance_metrics=json.loads(db_judgment.balance_metrics),
        adjudicated_at=db_judgment.adjudicated_at
    )

@app.get("/api/v1/judgments", response_model=List[JudicialOpinionResponse], tags=["Historical Archive"])
def list_historical_judgments(skip: int = 0, limit: int = 10, db: Session = Depends(get_db)):
    """
    Retrieves a paginated list of all historical judgments logged in the SQLite database.
    """
    judgments = db.query(JudgmentDB).offset(skip).limit(limit).all()
    response_list = []
    for j in judgments:
        response_list.append(JudicialOpinionResponse(
            case_id=j.case_id,
            case_title=j.case.title,
            verdict=j.verdict,
            constitutional_basis=j.constitutional_basis,
            reasoning_summary=j.reasoning_summary,
            detailed_opinion=j.detailed_opinion,
            balance_metrics=json.loads(j.balance_metrics),
            adjudicated_at=j.adjudicated_at
        ))
    return response_list

@app.get("/api/v1/judgments/{case_id}", response_model=JudicialOpinionResponse, tags=["Historical Archive"])
def get_judgment_by_id(case_id: str, db: Session = Depends(get_db)):
    """
    Retrieves a specific historical judgment and case file by its unique Case ID.
    """
    judgment = db.query(JudgmentDB).filter(JudgmentDB.case_id == case_id).first()
    if not judgment:
        raise HTTPException(
            status_code=status.HTTP_404_NOT_FOUND,
            detail=f"No judgment found for Case ID '{case_id}'."
        )
    
    return JudicialOpinionResponse(
        case_id=judgment.case_id,
        case_title=judgment.case.title,
        verdict=judgment.verdict,
        constitutional_basis=judgment.constitutional_basis,
        reasoning_summary=judgment.reasoning_summary,
        detailed_opinion=judgment.detailed_opinion,
        balance_metrics=json.loads(judgment.balance_metrics),
        adjudicated_at=judgment.adjudicated_at
    )



