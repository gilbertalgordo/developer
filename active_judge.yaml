court_judge = AdvancedActiveJudgeAI()

# ==========================================
# FastAPI App Initialization
# ==========================================

app = FastAPI(
    title="Advanced Active Judge AI Microservice",
    description="Multi-Tiered judicial arbitration engine with SQLite telemetry logging and appellate-grade explanations.",
    version="3.0.0"
)

@app.get("/", tags=["System Status"])
def read_root():
    return {
        "status": "online",
        "engine": "Advanced Active Judge AI Core v3.2",
        "database": "SQLite connected (advanced_judgments_archive.db)",
        "presiding_judge": court_judge.judge_name
    }

@app.post("/api/v3/adjudicate", response_model=JudicialOpinionResponse, status_code=status.HTTP_201_CREATED, tags=["Judicial Adjudication"])
def adjudicate_and_log(case_data: CaseSubmissionSchema, db: Session = Depends(get_db)):
    """
    Submits a complex case file, computes advanced AI judicial deliberation with telemetry, 
    and persists records securely to SQLite.
    """
    existing = db.query(CaseSubmissionDB).filter(CaseSubmissionDB.case_id == case_data.case_id).first()
    if existing:
        raise HTTPException(
            status_code=status.HTTP_400_BAD_REQUEST,
            detail=f"Case ID '{case_data.case_id}' already exists in permanent records."
        )

    # Run AI Deliberation
    result = court_judge.deliberate(case_data)

    # Save Case Record
    db_case = CaseSubmissionDB(
        case_id=case_data.case_id,
        title=case_data.title,
        jurisdiction=case_data.jurisdiction,
        governing_framework=json.dumps(case_data.governing_framework),
        facts=json.dumps(case_data.facts),
        petitioner_claims=json.dumps(case_data.petitioner_claims),
        respondent_defenses=json.dumps(case_data.respondent_defenses),
        precedents_cited=json.dumps(case_data.precedents_cited or [])
    )
    db.add(db_case)
    db.commit()

    # Save Judgment Record
    db_judgment = AdvancedJudgmentDB(
        case_id=case_data.case_id,
        presiding_judge=result["presiding_judge"],
        jurisdiction=result["jurisdiction"],
        verdict=result["verdict"],
        disposition=result["disposition"],
        constitutional_basis=json.dumps(result["constitutional_basis"]),
        ratio_decidendi=result["ratio_decidendi"],
        detailed_opinion=result["detailed_opinion"],
        telemetry_metrics=json.dumps(result["telemetry_metrics"])
    )
    db.add(db_judgment)
    db.commit()
    db.refresh(db_judgment)

    return JudicialOpinionResponse(
        case_id=db_case.case_id,
        case_title=db_case.title,
        presiding_judge=db_judgment.presiding_judge,
        jurisdiction=db_judgment.jurisdiction,
        verdict=db_judgment.verdict,
        disposition=db_judgment.disposition,
        constitutional_basis=json.loads(db_judgment.constitutional_basis),
        ratio_decidendi=db_judgment.ratio_decidendi,
        detailed_opinion=db_judgment.detailed_opinion,
        telemetry_metrics=json.loads(db_judgment.telemetry_metrics),
        adjudicated_at=db_judgment.adjudicated_at
    )

@app.get("/api/v3/judgments", response_model=List[JudicialOpinionResponse], tags=["Historical Archive"])
def list_judgments(skip: int = 0, limit: int = 10, db: Session = Depends(get_db)):
    """
    Retrieves a paginated list of advanced historical judgments from storage.
    """
    records = db.query(AdvancedJudgmentDB).offset(skip).limit(limit).all()
    response_list = []
    for r in records:
        response_list.append(JudicialOpinionResponse(
            case_id=r.case_id,
            case_title=r.case.title,
            presiding_judge=r.presiding_judge,
            jurisdiction=r.jurisdiction,
            verdict=r.verdict,
            disposition=r.disposition,
            constitutional_basis=json.loads(r.constitutional_basis),
            ratio_decidendi=r.ratio_decidendi,
            detailed_opinion=r.detailed_opinion,
            telemetry_metrics=json.loads(r.telemetry_metrics),
            adjudicated_at=r.adjudicated_at
        ))
    return response_list

@app.get("/api/v3/judgments/{case_id}", response_model=JudicialOpinionResponse, tags=["Historical Archive"])
def get_judgment_detail(case_id: str, db: Session = Depends(get_db)):
    """
    Fetches a specific advanced judicial opinion and case submission by Case ID.
    """
    record = db.query(AdvancedJudgmentDB).filter(AdvancedJudgmentDB.case_id == case_id).first()
    if not record:
        raise HTTPException(
            status_code=status.HTTP_404_NOT_FOUND,
            detail=f"Judgment record for Case ID '{case_id}' not found."
        )

    return JudicialOpinionResponse(
        case_id=record.case_id,
        case_title=record.case.title,
        presiding_judge=record.presiding_judge,
        jurisdiction=record.jurisdiction,
        verdict=record.verdict,
        disposition=record.disposition,
        constitutional_basis=json.loads(record.constitutional_basis),
        ratio_decidendi=record.ratio_decidendi,
        detailed_opinion=record.detailed_opinion,
        telemetry_metrics=json.loads(record.telemetry_metrics),
        adjudicated_at=record.adjudicated_at
    )



