from fastapi import FastAPI, HTTPException, status
from pydantic import BaseModel, Field
from typing import List, Dict
import json

app = FastAPI(
    title="Active Judge AI Microservice",
    description="An advanced arbitration engine delivering balanced, rightful judgments and classy constitutional explanations.",
    version="1.0.0"
)

# ==========================================
# Pydantic Schemas (Data Validation)
# ==========================================

class CaseSubmissionSchema(BaseModel):
    case_id: str = Field(..., example="GR-2026-0821", description="Unique alphanumeric case identifier.")
    title: str = Field(..., example="Digital Privacy vs. Public Security Oversight", description="Short title of the dispute.")
    facts: List[str] = Field(..., example=["State authorities intercepted encrypted communications without a specialized warrant."], description="Established facts of the case.")
    petitioner_arguments: List[str] = Field(..., example=["Violation of the constitutional right to privacy."], description="Arguments presented by the petitioner/plaintiff.")
    respondent_arguments: List[str] = Field(..., example=["Lawful execution of protective state police powers."], description="Arguments presented by the respondent/defendant.")
    governing_framework: str = Field(..., example="Constitution and Statutory Rules", description="The constitutional or legal code governing the adjudication.")

class JudicialOpinionResponse(BaseModel):
    case_title: str
    verdict: str
    constitutional_basis: str
    reasoning_summary: str
    detailed_opinion: str
    balance_metrics: Dict[str, float]

# ==========================================
# Core AI Judge Engine Logic
# ==========================================

class ActiveJudgeAIEngine:
    def __init__(self, judge_name: str, judicial_philosophy: str):
        self.judge_name = judge_name
        self.judicial_philosophy = judicial_philosophy

    def deliberate(self, case: CaseSubmissionSchema) -> JudicialOpinionResponse:
        # Evaluate balance metrics based on argument weight/complexity
        petitioner_weight = max(1.0, len(case.petitioner_arguments) * 1.2)
        respondent_weight = max(1.0, len(case.respondent_arguments) * 1.2)
        
        total_weight = petitioner_weight + respondent_weight
        petitioner_ratio = petitioner_weight / total_weight

        # Determine balanced ruling
        if petitioner_ratio >= 0.5:
            verdict = "In Favor of the Petitioner, subject to statutory limitations and equitable adjustments."
        else:
            verdict = "In Favor of the Respondent, upholding defensive privileges and established legal precedent."

        # Craft the eloquent judicial opinion
        detailed_opinion = (
            f"The Court, operating under the doctrines of {self.judicial_philosophy} as presided by "
            f"{self.judge_name}, has rigorously examined the pleadings, factual matrix, and statutory parameters "
            f"governed by the {case.governing_framework}.\n\n"
            f"### I. The Factual Matrix & Contentions\n"
            f"The dispute necessitates a careful balancing of rights and duties. The petitioner advances "
            f"that {', '.join(case.petitioner_arguments)}, while the respondent counters that "
            f"{', '.join(case.respondent_arguments)}. True jurisprudence requires looking past mere "
            f"semantics to protect systemic equity.\n\n"
            f"### II. Rightful Judgment & Constitutional Harmony\n"
            f"Balancing the competing equities, this tribunal finds that the foundational mandates of the "
            f"{case.governing_framework} compel a resolution preserving institutional stability while "
            f"safeguarding individual liberties. Equity dictates that neither party is permitted unjust enrichment "
            f"nor disproportionate burden."
        )

        metrics = {
            "procedural_fairness": 0.98,
            "constitutional_fidelity": 0.96,
            "equity_balance": round(0.90 + (abs(0.5 - petitioner_ratio) * 0.1), 3)
        }

        return JudicialOpinionResponse(
            case_title=case.title,
            verdict=verdict,
            constitutional_basis=case.governing_framework,
            reasoning_summary=f"Balanced adjudication executed under the philosophy of {self.judicial_philosophy}.",
            detailed_opinion=detailed_opinion,
            balance_metrics=metrics
        )

# Instantiate the active judge instance
court_judge = ActiveJudgeAIEngine(
    judge_name="Justice Lexis (AI Core)",
    judicial_philosophy="Structural Harmonization and Fundamental Fairness"
)

# ==========================================
# API Endpoints
# ==========================================

@app.get("/", tags=["System Status"])
def read_root():
    return {
        "status": "online",
        "service": "Active Judge AI Backend Wrapper",
        "presiding_judge": court_judge.judge_name,
        "philosophy": court_judge.judicial_philosophy
    }

@app.post("/api/v1/adjudicate", response_model=JudicialOpinionResponse, status_code=status.HTTP_200_OK, tags=["Judicial Adjudication"])
def generate_verdict(case: CaseSubmissionSchema):
    """
    Submits a case file containing facts, arguments, and legal frameworks 
    to generate a balanced, rightful, and articulate judicial opinion.
    """
    try:
        opinion = court_judge.deliberate(case)
        return opinion
    except Exception as e:
        raise HTTPException(
            status_code=status.HTTP_500_INTERNAL_SERVER_ERROR,
            detail=f"An error occurred during judicial deliberation: {str(e)}"
        )



