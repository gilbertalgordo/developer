    petitioner_arguments: List[str] = Field(..., example=["Violation of the constitutional right to privacy."], description="Petitioner arguments.")
    respondent_arguments: List[str] = Field(..., example=["Lawful execution of state police powers."], description="Respondent arguments.")
    governing_framework: str = Field(..., example="Constitution and Statutory Rules", description="Governing legal code.")

class JudicialOpinionResponse(BaseModel):
    case_id: str
    case_title: str
    verdict: str
    constitutional_basis: str
    reasoning_summary: str
    detailed_opinion: str
    balance_metrics: Dict[str, float]
    adjudicated_at: datetime

    class Config:
        from_attributes = True

# ==========================================
# Core AI Judge Engine Logic
# ==========================================

class ActiveJudgeAIEngine:
    def __init__(self, judge_name: str, judicial_philosophy: str):
        self.judge_name = judge_name
        self.judicial_philosophy = judicial_philosophy

    def deliberate(self, case: CaseSubmissionSchema) -> Dict[str, Any]:
        petitioner_weight = max(1.0, len(case.petitioner_arguments) * 1.2)
        respondent_weight = max(1.0, len(case.respondent_arguments) * 1.2)
        total_weight = petitioner_weight + respondent_weight
        petitioner_ratio = petitioner_weight / total_weight

        verdict = (
            "In Favor of the Petitioner, subject to statutory limitations and equitable adjustments."
