      respondent_defenses: formData.respondent_defenses.split('\n').filter(Boolean),
      precedents_cited: formData.precedents_cited.split('\n').filter(Boolean)
    };

    try {
      const res = await fetch(`${API_BASE_URL}/adjudicate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      if (!res.ok) throw new Error("Advanced adjudication failed");
      
      const newJudgment = await res.json();
      setJudgments([newJudgment, ...judgments]);
      setSelectedJudgment(newJudgment);
      setSuccessMsg("Advanced case successfully adjudicated and logged to SQLite.");
      setActiveTab('archive');
