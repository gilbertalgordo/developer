const express = require('express');
const path = require('path');
const app = express();

app.use(express.json());
app.use(express.static(path.join(__dirname, 'public')));

// Secure backend proxy route for AI requests
app.post('/api/execute-ai', async (req, res) => {
    const { prompt } = req.body;
    const apiKey = process.env.GEMINI_API_KEY;

    if (!apiKey) {
        return res.status(500).json({ error: "System Error: AI Gateway API Key is missing on host environment." });
    }

    if (!prompt) {
        return res.status(400).json({ error: "Validation Error: Prompt payload cannot be empty." });
    }

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
            })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            res.json({ result: data.candidates[0].content.parts[0].text });
        } else {
            res.status(502).json({ error: "Upstream AI Engine returned invalid payload structure.", details: data });
        }
    } catch (err) {
        res.status(500).json({ error: "Gateway Fault: " + err.message });
    }
});

const PORT = process.env.PORT || 8080;
app.listen(PORT, () => {
    console.log(`Active AI Core Engine online on port ${PORT}`);
});




