<body>
    <div class="hud-wrapper">
        <header>
            <h1>SYS.AI // CLOUD_RUN_HUD</h1>
            <div class="badge">HOSTING: ACTIVE FREE TIER</div>
        </header>

        <div class="grid">
            <div>
                <label for="prompt">COMMAND PROMPT / INSTRUCTION</label>
                <textarea id="prompt" rows="4" placeholder="Enter instructions for the cloud AI cluster..."></textarea>
                <button onclick="dispatchAI()">TRANSMIT QUERY</button>
            </div>

            <div>
                <label>TELEMETRY / RESPONSE STREAM</label>
                <div id="output" class="terminal-output">System initialized. Ready for active dispatch...</div>
            </div>
        </div>
    </div>

    <script>
        async function dispatchAI() {
            const prompt = document.getElementById('prompt').value.trim();
            const output = document.getElementById('output');

            if (!prompt) {
                output.textContent = "ERR: Instruction stack cannot be blank.";
                return;
            }

            output.textContent = "Transmitting packet to Google Cloud Run cluster...";

            try {
                const res = await fetch('/api/execute-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await res.json();
                if (res.ok) {
                    output.textContent = data.result;
                } else {
                    output.textContent = "ERR: " + (data.error || "Unknown execution fault.");
                }
            } catch (err) {
                output.textContent = "FATAL: Connection dropped - " + err.message;
            }
        }
    </script>
</body>
</html>




