const fs = require('fs');
const path = require('path');

// Configuration for Active Free-Tier Hosting Icon Pack
const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><circle cx="256" cy="256" r="240" fill="#0d1117" stroke="#4285F4" stroke-width="16"/><path d="M256 120v272M120 256h272" stroke="#34A853" stroke-width="24" stroke-linecap="round"/></svg>`;

const outputDir = path.join(__dirname, 'public');

if (!fs.existsSync(outputDir)) {
    fs.mkdirSync(outputDir, { recursive: true });
}

// Write master scalable SVG file
fs.writeFileSync(path.join(outputDir, 'favicon.svg'), svgContent);

// Generate Site Manifest for PWA and Cloud Run integrations
const manifestContent = {
  "name": "Active Google Hosted AI",
  "short_name": "AI Cloud HUD",
  "icons": [
    {
      "src": "/favicon.svg",
      "sizes": "any",
      "type": "image/svg+xml"
    }
  ],
  "theme_color": "#0d1117",
  "background_color": "#0d1117",
  "display": "standalone"
};

fs.writeFileSync(path.join(outputDir, 'site.webmanifest'), JSON.stringify(manifestContent, null, 2));

console.log("SUCCESS: Active Google hosting icon pipelines and manifests built successfully in /public.");

