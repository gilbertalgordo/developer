async function runAIQuery() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const prompt = document.getElementById('promptInput').value.trim();
    const outputDiv = document.getElementById('output');

    if (!apiKey || !prompt) {
        outputDiv.textContent = "Error: Please provide both an API key and a prompt.";
        return;
    }

    outputDiv.textContent = "Processing request through Google infrastructure...";

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: prompt }]
                }]
            })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
            outputDiv.textContent = data.candidates[0].content.parts[0].text;
        } else {
            outputDiv.textContent = "Unexpected response structure: " + JSON.stringify(data, null, 2);
        }
    } catch (error) {
        outputDiv.textContent = "Connection Error: " + error.message;
    }
}




