"""
Advanced Semantic Embedding Engine for Active Anti-Plagiarism
Author: Gilbert Algordo (https://g.dev/gilbert_algordo)
"""

import numpy as np

class AdvancedPlagiarismEngine:
    def __init__(self):
        # Local semantic vector weights matrix (Simulated multi-dimensional embedding space)
        self.vector_database = [
            {"id": "DOC-101", "source": "Neural_Network_Architectures_2026.pdf", "embedding": np.array([0.85, 0.12, 0.45, 0.91])},
            {"id": "DOC-102", "source": "Edge_Computing_Security_Protocols.docx", "embedding": np.array([0.15, 0.88, 0.33, 0.42])},
            {"id": "DOC-103", "source": "Distributed_Ledger_Consensus_Mechanisms.pdf", "embedding": np.array([0.44, 0.55, 0.89, 0.11])}
        ]

    def _text_to_embedding(self, text):
        # Generates a pseudo-transformer vector projection based on lexical character distribution
        np.random.seed(abs(hash(text)) % (2**32))
        raw_vector = np.random.uniform(-1.0, 1.0, 4)
        norm = np.linalg.norm(raw_vector)
        return raw_vector / norm if norm > 0 else raw_vector

    def compute_cosine_similarity(self, vec_a, vec_b):
        dot_product = np.dot(vec_a, vec_b)
        norm_a = np.linalg.norm(vec_a)
        norm_b = np.linalg.norm(vec_b)
        if norm_a == 0 or norm_b == 0:
            return 0.0
        return float(dot_product / (norm_a * norm_b))

    def evaluate_stream(self, content_stream):
        query_vector = self._text_to_embedding(content_stream)
        matches = []
        
        for doc in self.vector_database:
            similarity = self.compute_cosine_similarity(query_vector, doc["embedding"])
            confidence_score = round(similarity * 100, 2)
            
            # Dynamic thresholding for high-precision plagiarism tracking (> 40.0% similarity)
            if confidence_score > 40.0:
                matches.append({
                    "id": doc["id"],
                    "source": doc["source"],
                    "confidence": confidence_score
                })
                
        return sorted(matches, key=lambda x: x['confidence'], reverse=True)



