"""
Semantic Vector Detection Module for Anti-Plagiarism System
"""

import math
from collections import Counter

class PlagiarismDetector:
    def __init__(self):
        # Local reference base index (Mock database of known publications/sources)
        self.knowledge_base = [
            {"source": "AI_Research_Paper_Alpha.pdf", "text": "Artificial intelligence engineering involves building machine learning models that can process vast datasets efficiently."},
            {"source": "OpenSource_Docs_v2.txt", "text": "The quick brown fox jumps over the lazy dog repeatedly while computing algorithms on edge devices."},
            {"source": "Academic_Journal_2025.docx", "text": "Plagiarism detection tools evaluate semantic structure and textual vectors to catch copy pasting accurately."}
        ]

    def _cosine_similarity(self, text1, text2):
        # Basic lightweight vector similarity computation for fast offline execution
        words1 = Counter(text1.lower().split())
        words2 = Counter(text2.lower().split())
        
        intersection = set(words1.keys()) & set(words2.keys())
        numerator = sum([words1[x] * words2[x] for x in intersection])
        
        sum1 = sum([words1[x]**2 for x in words1.keys()])
        sum2 = sum([words2[x]**2 for x in words2.keys()])
        
        denominator = math.sqrt(sum1) * math.sqrt(sum2)
        if not denominator:
            return 0.0
        return float(numerator) / denominator

    def check_similarity(self, query_text):
        results = []
        for item in self.knowledge_base:
            score = self._cosine_similarity(query_text, item["text"])
            percentage = round(score * 100, 2)
            # Threshold configuration for active flagging (> 35% match)
            if percentage > 35.0:
                results.append({
                    "source": item["source"],
                    "score": percentage
                })
        return sorted(results, key=lambda k: k['score'], reverse=True)



