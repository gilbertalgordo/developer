import base64
from email.mime.text import MIMEText
import os.path
from google.auth.transport.requests import Request
from google.oauth2.credentials import Credentials
from google_auth_oauthlib.flow import InstalledAppFlow
from googleapiclient.discovery import build
from googleapiclient.errors import HttpError

# If modifying these scopes, delete the file token.json.
SCOPES = ['https://www.googleapis.com/auth/gmail.compose']

def authenticate_gmail():
    """Shows basic usage of the Gmail API to create drafts."""
    creds = None
    if os.path.exists('token.json'):
        creds = Credentials.from_authorized_user_file('token.json', SCOPES)
    if not creds or not creds.valid:
        if creds and creds.expired and creds.refresh_token:
            creds.refresh(Request())
        else:
            flow = InstalledAppFlow.from_client_secrets_file(
                'credentials.json', SCOPES)
            creds = flow.run_local_server(port=0)
        with open('token.json', 'w') as token:
            token.write(creds.to_json())
    return creds

def create_work_order_draft(service, recipient_email, work_order_data):
    """Creates a draft email for a work order."""
    
    subject = f"Work Order #{work_order_data['order_id']} - {work_order_data['title']}"
    
    # HTML Email Template for the Work Order
    message_body = f"""
    <html>
      <body style="font-family: Arial, sans-serif; color: #333;">
        <h2 style="color: #2c3e50;">New Work Order Notification</h2>
        <p>Hello <strong>{work_order_data['client_name']}</strong>,</p>
        <p>A new work order has been generated and is pending review/action.</p>
        
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
          <tr>
            <td style="padding: 8px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Work Order ID:</strong></td>
            <td style="padding: 8px; border: 1px solid #ddd;">{work_order_data['order_id']}</td>
          </tr>
          <tr>
            <td style="padding: 8px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Service/Task:</strong></td>
            <td style="padding: 8px; border: 1px solid #ddd;">{work_order_data['title']}</td>
          </tr>
          <tr>
            <td style="padding: 8px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Priority:</strong></td>
            <td style="padding: 8px; border: 1px solid #ddd;">{work_order_data['priority']}</td>
          </tr>
          <tr>
            <td style="padding: 8px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Due Date:</strong></td>
            <td style="padding: 8px; border: 1px solid #ddd;">{work_order_data['due_date']}</td>
          </tr>
          <tr>
            <td style="padding: 8px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Description:</strong></td>
            <td style="padding: 8px; border: 1px solid #ddd;">{work_order_data['description']}</td>
          </tr>
        </table>
        
        <p style="margin-top: 20px;">Please reach out if you have any questions or require modifications.</p>
        <p>Best regards,<br><strong>Operations Team</strong></p>
      </body>
    </html>
    """

    message = MIMEText(message_body, 'html')
    message['to'] = recipient_email
    message['subject'] = subject
    
    # Encode the message in URL-safe base64
    raw_message = base64.urlsafe_b64encode(message.as_bytes()).decode('utf-8')
    draft_body = {'message': {'raw': raw_message}}

    try:
        draft = service.users().drafts().create(userId='me', body=draft_body).execute()
        print(f"Draft created successfully! Draft ID: {draft['id']}")
        return draft
    except HttpError as error:
        print(f"An error occurred: {error}")
        return None

if __name__ == '__main__':
    # 1. Authenticate and connect to Gmail API
    creds = authenticate_gmail()
    service = build('gmail', 'v1', credentials=creds)

    # 2. Define Work Order Details
    work_order = {
        "order_id": "WO-2026-0892",
        "client_name": "Acme Corp",
        "title": "HVAC System Maintenance & Inspection",
        "priority": "High",
        "due_date": "2026-08-15",
        "description": "Perform quarterly checkup on primary rooftop cooling units and replace air filters."
    }
    
    recipient = "client@example.com"

    # 3. Create the automated draft
    create_work_order_draft(service, recipient, work_order)





