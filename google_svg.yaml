<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for advanced HUD styling effects -->
  <defs>
    <!-- Glow Effect -->
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Scanlines -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-width="0.5" opacity="0.07" />
    </pattern>

    <!-- Linear Gradients for Premium Metallic/Glass HUD Tech Look -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a75ff" />
      <stop offset="100%" stop-color="#0040c0" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#b30000" />
    </linearGradient>
    <linearGradient id="yellow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcd00" />
      <stop offset="100%" stop-color="#c79a00" />
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#008c3a" />
    </linearGradient>
    
    <!-- Dark HUD Panel Background -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#101622" />
      <stop offset="100%" stop-color="#05070b" />
    </radialGradient>
  </defs>

  <!-- Background Dark Tech Canvas -->
  <rect width="512" height="512" fill="url(#bg-grad)" />
  <rect width="512" height="512" fill="url(#scanlines)" />

  <!-- Outer HUD Matrix & Calibration Framework -->
  <g opacity="0.4" stroke="#00e676" stroke-width="1" fill="none">
    <!-- Outer Target Rings -->
    <circle cx="256" cy="256" r="230" stroke-dasharray="4, 12" opacity="0.3" />
    <circle cx="256" cy="256" r="200" stroke-dasharray="200, 8, 8, 8" />
    <!-- Crosshairs -->
    <line x1="256" y1="10" x2="256" y2="30" />
    <line x1="256" y1="482" x2="256" y2="502" />
    <line x1="10" y1="256" x2="30" y2="256" />
    <line x1="482" y1="256" x2="502" y2="256" />
  </g>

  <!-- Technical Telemetry Overlays -->
  <g font-family="monospace" font-size="10" fill="#00e676" opacity="0.7" letter-spacing="1">
    <text x="35" y="45">SYS.SYS_STATUS: ACTIVE</text>
    <text x="35" y="60">ENGINE.TYPE: GOOGLE_CORE</text>
    <text x="380" y="45" text-anchor="end">KAIZEN.V_2026.4</text>
    <text x="380" y="60" text-anchor="end">AUTH_MODE: OPEN_SRC</text>
    <!-- Corner Tech Brackets -->
    <path d="M 30,50 L 30,30 L 50,30" stroke="#00e676" stroke-width="2" fill="none" />
    <path d="M 482,50 L 482,30 L 462,30" stroke="#00e676" stroke-width="2" fill="none" />
    <path d="M 30,462 L 30,482 L 50,482" stroke="#00e676" stroke-width="2" fill="none" />
    <path d="M 482,462 L 482,482 L 462,482" stroke="#00e676" stroke-width="2" fill="none" />
  </g>

  <!-- Inner Diagnostic Geometric Ring -->
  <circle cx="256" cy="256" r="155" stroke="#2a75ff" stroke-width="1.5" fill="none" stroke-dasharray="15, 5, 2, 5" opacity="0.5" />

  <!-- Core Google "G" Vector Icon Geometry -->
  <g filter="url(#hud-glow)">
    <!-- Blue Segment -->
    <path d="M 383.1,261.3 C 383.1,248.5 382,236.1 380,224 H 256 V 272.7 H 327.3 C 324.3,289.3 314.9,303.4 300.9,312.8 L 300.9,344.4 H 343.5 C 368.4,321.4 383.1,287.5 383.1,261.3 Z" fill="url(#blue-grad)" />
    
    <!-- Green Segment -->
    <path d="M 256,391 C 292.5,391 323,379 343.5,344.4 L 300.9,312.8 C 289.1,320.7 273.9,325.4 256,325.4 C 220.8,325.4 191,301.6 180.3,269.8 H 136.2 L 136.2,304 C 158.4,348.1 203.9,391 256,391 Z" fill="url(#green-grad)" />
    
    <!-- Yellow Segment -->
    <path d="M 180.3,269.8 C 177.8,262.3 176.4,254.3 176.4,246 C 176.4,237.7 177.8,229.7 180.3,222.2 L 180.3,188 H 136.2 C 127.8,204.8 123,224.8 123,246 C 123,267.2 127.8,287.2 136.2,304 L 180.3,269.8 Z" fill="url(#yellow-grad)" />
    
    <!-- Red Segment -->
    <path d="M 256,166.6 C 275.8,166.6 293.6,173.4 307.6,186.8 L 344.2,150.2 C 322.9,130.4 292.4,118 256,118 C 203.9,118 158.4,160.9 136.2,205 L 180.3,222.2 C 191,190.4 220.8,166.6 256,166.6 Z" fill="url(#red-grad)" />
  </g>

  <!-- Concentric Interface Data Accents -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.2" fill="none">
    <circle cx="256" cy="256" r="120" stroke-dasharray="1, 8" />
    <circle cx="256" cy="256" r="85" stroke-dasharray="4, 4" />
  </g>

  <!-- Vector Nodes Overlay (Development/Kaizen aesthetic) -->
  <g fill="#00e676" opacity="0.8">
    <circle cx="256" cy="118" r="3" />
    <circle cx="256" cy="391" r="3" />
    <circle cx="123" cy="246" r="3" />
    <circle cx="383" cy="261" r="3" />
  </g>
</svg>



