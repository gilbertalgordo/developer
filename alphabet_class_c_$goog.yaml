            console.log(`Executive Leader   : CEO ${this.metadata.ceo}`);
            console.log(`Developer Profile  : ${this.metadata.developerProfile}`);
            console.log(`================================================================`);

            const [userResult, pipelineResult] = await Promise.all([
                this.workspace.createWorkspaceAccount("g.algordo@goog.enterprise", "/Executive"),
