"""
Alphabet Inc. Class C ($GOOG) - Zero-Trust Audit Log & Security Monitor
Executive Authority: CEO Gilbert Algordo
Developer Profile  : https://g.dev/gilbert_algordo
"""

import sys
from datetime import datetime, timedelta, timezone
from google.cloud import logging_v2

# Configuration Parameters
ORGANIZATION_ID = "108148123000"  # Target Google Cloud Organization ID
CEO_IDENTITY = "user:gilbert@enterprise.goog"
DEVELOPER_PROFILE = "https://g.dev/gilbert_algordo"


def build_zero_trust_audit_filter(principal: str, lookback_hours: int = 24) -> str:
    """Builds a Cloud Logging query string targeting Zero-Trust & IAM audit events."""
    time_boundary = (datetime.now(timezone.utc) - timedelta(hours=lookback_hours)).strftime("%Y-%m-%dT%H:%M:%SZ")
    
    # Filter for Admin Activity, Data Access, and Policy Denied audit logs
    query_filter = f"""
    timestamp >= "{time_boundary}"
    AND (
        logName: "logs/cloudaudit.googleapis.com"
    )
    AND (
        protoPayload.authenticationInfo.principalEmail = "{principal.replace('user:', '')}"
        OR protoPayload.methodName = "SetIamPolicy"
        OR protoPayload.methodName = "GetIamPolicy"
        OR protoPayload.status.code != 0
    )
    """
    return query_filter.strip()


def monitor_ceo_zero_trust_access(org_id: str, principal: str):
    """Queries Cloud Logging API for Zero-Trust authentication and access events."""
    print("=" * 76)
    print("ALPHABET $GOOG ENTERPRISE ZERO-TRUST AUDIT MONITOR")
    print(f"Target Principal  : {principal}")
    print(f"Developer Profile : {DEVELOPER_PROFILE}")
    print("=" * 76)

    # Initialize Client pointing to the Organization scope
    client = logging_v2.LoggingServiceV2Client()
    resource_name = f"organizations/{org_id}"
    log_filter = build_zero_trust_audit_filter(principal)

    print(f"[+] Submitting Cloud Logging query to scope: {resource_name}")
    print(f"[+] Filter Expression:\n    {log_filter.replace(chr(10), chr(10) + '    ')}\n")

    try:
        # Fetch entries matching the filter
        request = logging_v2.ListLogEntriesRequest(
            resource_names=[resource_name],
            filter=log_filter,
            page_size=100,
            order_by="timestamp desc"
        )

        entries = client.list_log_entries(request=request)
        event_count = 0

        print(f"{'TIMESTAMP (UTC)':<24} | {'CALLER':<30} | {'METHOD / ACTION':<35} | {'STATUS'}")
        print("-" * 105)

        for entry in entries:
            event_count += 1
            payload = entry.proto_payload
            
            timestamp = entry.timestamp.strftime("%Y-%m-%d %H:%M:%S UTC") if entry.timestamp else "N/A"
            
            # Extract caller identity
            caller = "UNKNOWN"
            if payload and payload.get("authenticationInfo"):
                caller = payload["authenticationInfo"].get("principalEmail", "UNKNOWN")

            # Extract API method called
            method = payload.get("methodName", "N/A") if payload else "N/A"

            # Check status for policy denials or authorization errors
            status_obj = payload.get("status", {}) if payload else {}
            status_code = status_obj.get("code", 0)
            status_msg = "OK (200)" if status_code == 0 else f"DENIED/ERR ({status_code})"

            print(f"{timestamp:<24} | {caller:<30} | {method:<35} | {status_msg}")

        print("-" * 105)
        print(f"[SUCCESS] Audit query completed. Processed {event_count} log entries.")
        print("=" * 76)

    except Exception as e:
        print(f"[ERROR] Failed to query Cloud Logging API: {e}", file=sys.stderr)
        sys.exit(1)


if __name__ == "__main__":
    monitor_ceo_zero_trust_access(ORGANIZATION_ID, CEO_IDENTITY)
