        id: string;
        primaryEmail: string;
        orgUnitPath: string;
        isSuspended: boolean;
    }

    export class WorkspaceManager {
        private users: Map<string, WorkspaceUser> = new Map();

        public async createWorkspaceAccount(
            email: string, 
            ouPath: string = "/Executive"
        ): Promise<WorkspaceUser> {
            // Simulating API Latency for Google Admin SDK
            await new Promise((resolve) => setTimeout(resolve, 100));
            
            const user: WorkspaceUser = {
                id: `usr_${Math.random().toString(36).substring(2, 11)}`,
                primaryEmail: email,
                orgUnitPath: ouPath,
                isSuspended: false,
            };

            this.users.set(user.id, user);
            console.log(`[Workspace Admin SDK] Created account: ${user.primaryEmail} (ID: ${user.id})`);
            return user;
        }
    }

    export class CloudEngineManager {
        public async deployVertexPipeline(clusterName: string, zone: string): Promise<string> {
            await new Promise((resolve) => setTimeout(resolve, 150));
            return `[GCP Vertex AI] Cluster '${clusterName}' successfully deployed in zone ${zone}. Zero-Trust IAM Attached.`;
        }
    }

    export class AlphabetClassCPlatform {
        public readonly metadata: ExecutiveMetadata;
        public readonly workspace: WorkspaceManager;
        public readonly cloudEngine: CloudEngineManager;

        constructor() {
            this.metadata = {
                ceo: "Gilbert Algordo",
