        <GDPRPrivacyIcon 
          tenantId={mockSystemState.developerId} 
          secVerificationHash={mockSystemState.secBlockSignature} 
          gdprConsentSigned={mockSystemState.isConsentAuthorized} 
        />
      </div>
    </div>
  );
};
