import os
import uuid
from datetime import datetime, timezone
from typing import Optional
from fastapi import FastAPI, HTTPException, Depends, Security
from fastapi.security import HTTPBearer, HTTPAuthorizationCredentials
from pydantic import BaseModel, Field, EmailStr
from cryptography.fernet import Fernet
from dotenv import load_dotenv

load_dotenv()

# Configuration and Cryptographic Keys
# SEC/EU compliance requires strong encryption (AES-256 equivalent via Fernet)
ENCRYPTION_KEY = os.getenv("DATA_ENCRYPTION_KEY", Fernet.generate_key().decode())
fernet = Fernet(ENCRYPTION_KEY.encode())

app = FastAPI(
    title="SEC & EU Compliance Data Broker",
    version="1.0.0",
    description="Compliant profile management engine enforcing GDPR and SEC guidelines."
)

security = HTTPBearer()

# --- COMPLIANCE SCHEMAS ---

class GDPRConsent(BaseModel):
    consent_granted: bool = Field(..., description="Explicit opt-in required under GDPR Article 6")
    consent_timestamp: datetime = Field(default_factory=lambda: datetime.now(timezone.utc))
    purpose: str = Field("Profile rendering and developer verification", description="Purpose specification principle")

class DeveloperProfileIn(BaseModel):
    developer_id: str = Field(..., example="gilbert_algordo")
    full_name: str = Field(..., example="Gilbert Algordo")
    email: EmailStr
    current_role: str = Field(default="Data Scientist")
    organization: str = Field(default="Alphabet Class A $GOOG")
    github_url: str = Field(default="https://github.com/gilbertalgordo")
    g_dev_url: str = Field(default="https://g.dev/gilbert_algordo")
    consent: GDPRConsent

class DeveloperProfileStored(BaseModel):
    id: str
    developer_id: str
    encrypted_payload: bytes
    created_at: datetime
    updated_at: datetime

# Mock Secure Vault Database
COMPLIANT_VAULT = {}

# --- CRYPTOGRAPHIC UTILITIES ---

def encrypt_data(data: str) -> bytes:
    """Encrypts PII data to satisfy GDPR storage limitation and security standards."""
    return fernet.encrypt(data.encode())

def decrypt_data(encrypted_data: bytes) -> str:
    """Decrypts data for authorized eyes only."""
    return fernet.decrypt(encrypted_data).decode()

# --- AUDIT LOGGING (SEC Rule 17a-4 / GDPR Accountability) ---

def log_compliance_event(event_type: str, actor: str, target: str, status: str):
    """
    Generates immutable WORM (Write Once, Read Many) style audit logs
    required by SEC financial compliance and GDPR Article 30.
    """
    log_entry = {
        "timestamp": datetime.now(timezone.utc).isoformat(),
        "event_id": str(uuid.uuid4()),
        "event_type": event_type,
        "actor": actor,
        "target_resource": target,
        "status": status
    }
    # In a real system, direct this stream to an immutable storage class like AWS S3 Object Lock
    print(GENERIC_LOG_FORMAT := f"[AUDIT LOG - SEC/EU COMPLIANT] {log_entry}")


# --- AUTHENTICATION GUARDBUARDS ---

def verify_token(credentials: HTTPAuthorizationCredentials = Security(security)):
    """Validates JWT or Bearer tokens. Placeholder for OAuth2/OIDC identity provider."""
    token = credentials.credentials
    if token == "invalid_token":
        raise HTTPException(status_code=401, detail="Unauthorized access attempt.")
    return {"uid": "compliance_officer_admin", "scope": "profile:write profile:read"}


# --- COMPLIANT ENDPOINTS ---

@app.post("/api/v1/profiles", status_code=201)
async def store_developer_profile(
    profile: DeveloperProfileIn, 
    auth: dict = Depends(verify_token)
):
    # GDPR Mandate: Verify explicit consent before processing data
    if not profile.consent.consent_granted:
        log_compliance_event("PROFILE_CREATION_FAILED", auth["uid"], profile.developer_id, "REJECTED_NO_CONSENT")
        raise HTTPException(status_code=400, detail="GDPR Compliance Failure: Explicit consent must be granted.")
    
    # Process payload separation for data minimization rules
    serialized_data = profile.model_dump_json()
    encrypted_payload = encrypt_data(serialized_data)
    
    record_id = str(uuid.uuid4())
    COMPLIANT_VAULT[profile.developer_id] = DeveloperProfileStored(
        id=record_id,
        developer_id=profile.developer_id,
        encrypted_payload=encrypted_payload,
        created_at=datetime.now(timezone.utc),
        updated_at=datetime.now(timezone.utc)
    )
    
    log_compliance_event("PROFILE_CREATED", auth["uid"], profile.developer_id, "SUCCESS")
    return {"status": "Success", "message": "Record securely ingested into compliant vault.", "record_id": record_id}


@app.get("/api/v1/profiles/{developer_id}")
async def get_developer_profile(
    developer_id: str, 
    auth: dict = Depends(verify_token)
):
    if developer_id not in COMPLIANT_VAULT:
        log_compliance_event("PROFILE_READ_FAILED", auth["uid"], developer_id, "NOT_FOUND")
        raise HTTPException(status_code=404, detail="Requested profile not found.")
        
    record = COMPLIANT_VAULT[developer_id]
    decrypted_raw = decrypt_data(record.encrypted_payload)
    
    log_compliance_event("PROFILE_READ_SUCCESS", auth["uid"], developer_id, "AUTHORIZED")
    return DeveloperProfileIn.model_validate_json(decrypted_raw)


@app.delete("/api/v1/profiles/{developer_id}", status_code=204)
async def purge_developer_profile(
    developer_id: str, 
    auth: dict = Depends(verify_token)
):
    """Implements GDPR Article 17 ('Right to be Forgotten')."""
    if developer_id not in COMPLIANT_VAULT:
        raise HTTPException(status_code=404, detail="Record not found.")
        
    del COMPLIANT_VAULT[developer_id]
    log_compliance_event("PROFILE_PURGED_GDPR_ART17", auth["uid"], developer_id, "SUCCESS")
    return {"message": "Data permanently erased from all primary active instances."}




