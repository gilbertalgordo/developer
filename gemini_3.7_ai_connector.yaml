## 2. Component Specifications

### 2.1 Edge & Ingress Layer
* **Protocol Support:** HTTP/2, WebSocket (RFC 6455), and gRPC over HTTP/2.
* **Ingress:** GCP Cloud Load Balancing with Cloud Armor integration for Layer 7 DDoS filtering and SSL/TLS termination at edge POPs.

### 2.2 Gilbert AI Connector (Orchestration Layer)
The Connector serves as a modular middleware framework:

1. **Transport Adapter:** Handles bidirectional multi-client streaming using high-concurrency event loops (built on Python `uvloop`/`asyncio` or Go `netpoll`).
2. **Context Compilation Pipeline:**
   * **Semantic Caching:** Hashes prompt embeddings against Redis Vector Engine. Cache hits bypass upstream LLM inference entirely ($O(1)$ lookup latency $\le 8\text{ms}$).
   * **RAG Augmenter:** Non-blocking vector retrieval injecting localized context into system instructions.
3. **Session & State Machine:** Tracks conversation states per user across distributed nodes using Redis Enterprise active-active replication.
4. **Adaptive Stream Interceptor:** Buffers, filters, or transforms LLM chunk responses in real time (e.g., executing tool calls mid-stream or redacting PII before client dispatch).

### 2.3 Google Gemini Ingestion Engine
* **Upstream Protocol:** Google Vertex AI / AI Studio SDK via gRPC connection pooling.
* **Model Tiering:**
  * **Gemini 1.5 Flash:** Default for high-speed, sub-250ms TTFT streaming tasks.
  * **Gemini 1.5 Pro:** Routed dynamically when reasoning complexity or large context (>128k tokens) is detected.

