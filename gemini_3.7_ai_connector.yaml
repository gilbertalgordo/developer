## 5. Performance Optimization & Resilience Guardrails

| Mechanism | Strategy | Target Metric |
| :--- | :--- | :--- |
| **Connection Pooling** | Warm gRPC channels maintained via persistent client instances. | Eliminates ~120ms TCP/TLS handshake latency per request. |
| **Model Fallback Routing** | Circuit breaker routes to `gemini-1.5-flash` if `gemini-1.5-pro` latency exceeds $1500\text{ms}$. | Service availability $\ge 99.99\%$. |
| **Backpressure Control** | Async consumer queue throttling prevents memory buffer overflow on slow client connections. | Connector memory footprint $< 128\text{MB}$ per 1,000 active streams. |
| **Edge TTFT Optimization** | Proactive WebSocket keep-alives and zero-copy JSON frame serializations. | Global TTFT $\le 300\text{ms}$ at 95th percentile. |
