-- Enums for tracking states
CREATE TYPE vehicle_status AS ENUM ('available', 'dispatched', 'maintenance', 'decommissioned');
CREATE TYPE dispatch_type AS ENUM ('regular_mission', 'emergency', 'administrative', 'official_travel');

-- 1. Vehicles Inventory Table
CREATE TABLE vehicles (
    vehicle_id SERIAL PRIMARY KEY,
    plate_number VARCHAR(15) UNIQUE NOT NULL,
    model VARCHAR(50) NOT NULL,
    brand VARCHAR(30) NOT NULL,
    type VARCHAR(30) NOT NULL, -- e.g., Sedan, SUV, Patrol, Ambulance
    current_odometer INT NOT NULL DEFAULT 0,
    status vehicle_status DEFAULT 'available',
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- 2. Vehicle Issuance Log Table
CREATE TABLE vehicle_issuances (
    issuance_id SERIAL PRIMARY KEY,
    vehicle_id INT REFERENCES vehicles(vehicle_id),
    driver_name VARCHAR(100) NOT NULL,
    driver_license VARCHAR(30) NOT NULL,
    purpose TEXT NOT NULL,
    dispatch_type dispatch_type DEFAULT 'regular_mission',
    destination VARCHAR(255) NOT NULL,
    departure_time TIMESTAMP NOT NULL,
    expected_return TIMESTAMP NOT NULL,
    actual_return TIMESTAMP,
    starting_odometer INT NOT NULL,
    ending_odometer INT,
    approved_by VARCHAR(100) NOT NULL,
    is_active BOOLEAN DEFAULT TRUE
);

-- 3. Fuel Stub / Voucher Table
CREATE TABLE fuel_stubs (
    stub_id SERIAL PRIMARY KEY,
    issuance_id INT REFERENCES vehicle_issuances(issuance_id) ON DELETE CASCADE,
    stub_number VARCHAR(50) UNIQUE NOT NULL, -- Format: FS-YYYYMMDD-XXXX
    fuel_type VARCHAR(20) NOT NULL, -- Diesel / Gasoline
    liters_allocated NUMERIC(6, 2) NOT NULL,
    max_amount_allowed NUMERIC(10, 2),
    issued_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    gas_station_partner VARCHAR(100) DEFAULT 'Authorized Government Fuel Depot'
);




import { Request, Response } from 'express';
import { Pool } from 'pg'; // PostgreSQL Client
import crypto from 'crypto';

const pool = new Pool();

interface IssuanceRequest {
  vehicleId: number;
  driverName: string;
  driverLicense: string;
  purpose: string;
  dispatchType: 'regular_mission' | 'emergency' | 'administrative' | 'official_travel';
  destination: string;
  expectedReturn: string;
  fuelType: string;
  allocatedLiters: number;
  approvedBy: string;
}

export const issueVehicleAndStub = async (req: Request, res: Response): Promise<void> => {
  const client = await pool.connect();
  
  try {
    const data: IssuanceRequest = req.body;
    
    // Start Transaction for atomic operations (Kaizen execution logic)
    await client.query('BEGIN');

    // 1. Check vehicle availability and grab current odometer
    const vehicleCheck = await client.query(
      'SELECT status, current_odometer FROM vehicles WHERE vehicle_id = $1 FOR UPDATE',
      [data.vehicleId]
    );

    if (vehicleCheck.rows.length === 0) {
      res.status(404).json({ success: false, error: 'Vehicle not found.' });
      await client.query('ROLLBACK');
      return;
    }

    const vehicle = vehicleCheck.rows[0];
    if (vehicle.status !== 'available' && data.dispatchType !== 'emergency') {
      res.status(400).json({ success: false, error: 'Vehicle is currently unavailable/dispatched.' });
      await client.query('ROLLBACK');
      return;
    }

    // 2. Insert Issuance Log Entry
    const issuanceQuery = `
      INSERT INTO vehicle_issuances 
      (vehicle_id, driver_name, driver_license, purpose, dispatch_type, destination, departure_time, expected_return, starting_odometer, approved_by)
      VALUES ($1, $2, $3, $4, $5, $6, NOW(), $7, $8, $9)
      RETURNING issuance_id;
    `;
    const issuanceValues = [
      data.vehicleId,
      data.driverName,
      data.driverLicense,
      data.purpose,
      data.dispatchType,
      data.destination,
      data.expectedReturn,
      vehicle.current_odometer,
      data.approvedBy
    ];
    
    const issuanceResult = await client.query(issuanceQuery, issuanceValues);
    const newIssuanceId = issuanceResult.rows[0].issuance_id;

    // 3. Generate Secure Fuel Stub Unique Identifier
    const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const randomHex = crypto.randomBytes(2).toString('hex').toUpperCase();
    const uniqueStubNumber = `FS-${dateStr}-${newIssuanceId}${randomHex}`;

    // 4. Insert Fuel Stub Record
    const stubQuery = `
      INSERT INTO fuel_stubs (issuance_id, stub_number, fuel_type, liters_allocated)
      VALUES ($1, $2, $3, $4)
      RETURNING stub_number, issued_date;
    `;
    const stubResult = await client.query(stubQuery, [newIssuanceId, uniqueStubNumber, data.fuelType, data.allocatedLiters]);

    // 5. Update Vehicle Status to Dispatched
    await client.query(
      'UPDATE vehicles SET status = \'dispatched\' WHERE vehicle_id = $1',
      [data.vehicleId]
    );

    // Commit Transaction
    await client.query('COMMIT');

    res.status(201).json({
      success: true,
      message: 'Government vehicle issued successfully and fuel stub generated.',
      data: {
        issuanceId: newIssuanceId,
        stubNumber: stubResult.rows[0].stub_number,
        issuedAt: stubResult.rows[0].issued_date,
        startingOdometer: vehicle.current_odometer
      }
    });

  } catch (error) {
    await client.query('ROLLBACK');
    console.error('Error executing vehicle issuance instance:', error);
    res.status(500).json({ success: false, error: 'Internal Server Error' });
  } finally {
    client.release();
  }
};




