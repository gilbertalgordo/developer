-- Core Enumerations for System Constancy
CREATE TYPE vehicle_status_type AS ENUM ('AVAILABLE', 'DISPATCHED', 'MAINTENANCE', 'DECOMMISSIONED');
CREATE TYPE dispatch_classification AS ENUM ('ROUTINE_MISSION', 'EMERGENCY_RESPONSE', 'TACTICAL_DEPLOYMENT', 'ADMINISTRATIVE');
CREATE TYPE fuel_type_enum AS ENUM ('DIESEL_ENHANCED', 'GASOLINE_UNLEADED', 'HYDROGEN_CELL', 'ELECTRIC_CHARGE');

-- 1. Fleet Asset Management Table
CREATE TABLE fleet_vehicles (
    vehicle_uuid UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    plate_number VARCHAR(20) UNIQUE NOT NULL,
    property_tag VARCHAR(50) UNIQUE NOT NULL,
    make_model VARCHAR(100) NOT NULL,
    engine_displacement VARCHAR(10),
    fuel_type fuel_type_enum NOT NULL,
    current_odometer INT NOT NULL DEFAULT 0 CHECK (current_odometer >= 0),
    current_status vehicle_status_type DEFAULT 'AVAILABLE',
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    CONSTRAINT chk_positive_odometer CHECK (current_odometer >= 0)
);

-- 2. Transactional Issuance Ledger
CREATE TABLE vehicle_issuances (
    issuance_uuid UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    vehicle_uuid UUID REFERENCES fleet_vehicles(vehicle_uuid) ON DELETE RESTRICT,
    operator_id_card VARCHAR(50) NOT NULL, -- Driver ID / Government Badge Number
    operator_fullname VARCHAR(150) NOT NULL,
    mission_classification dispatch_classification NOT NULL DEFAULT 'ROUTINE_MISSION',
    geographical_destination VARCHAR(255) NOT NULL,
    authorized_purpose TEXT NOT NULL,
    
    departure_timestamp TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    expected_return_timestamp TIMESTAMP WITH TIME ZONE NOT NULL,
    actual_return_timestamp TIMESTAMP WITH TIME ZONE,
    
    starting_odometer INT NOT NULL,
    ending_odometer INT,
    
    approving_officer_badge VARCHAR(50) NOT NULL,
    is_active_dispatch BOOLEAN DEFAULT TRUE,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    
    CONSTRAINT chk_odometer_progression CHECK (ending_odometer >= starting_odometer),
    CONSTRAINT chk_timeline CHECK (expected_return_timestamp > departure_timestamp)
);

-- 3. High-Security Cryptographic Fuel Allocations (Stubs)
CREATE TABLE cryptographic_fuel_stubs (
    stub_uuid UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    issuance_uuid UUID REFERENCES vehicle_issuances(issuance_uuid) ON DELETE CASCADE,
    secure_stub_serial VARCHAR(64) UNIQUE NOT NULL, -- Format: STUB-YYYYMMDD-[HASH]
    fuel_type fuel_type_enum NOT NULL,
    allocated_units NUMERIC(8, 2) NOT NULL CHECK (allocated_units > 0.00),
    max_fiat_limit NUMERIC(10, 2) NOT NULL CHECK (max_fiat_limit >= 0.00),
    is_redeemed BOOLEAN DEFAULT FALSE,
    redeemed_timestamp TIMESTAMP WITH TIME ZONE,
    issuing_depot_partner VARCHAR(100) DEFAULT 'State-Authorized Fuel Repository',
    cryptographic_signature TEXT NOT NULL -- Integrity verify payload hash
);

-- Indexes for Fast Search Performance
CREATE INDEX idx_fleet_status ON fleet_vehicles(current_status);
CREATE INDEX idx_issuance_active ON vehicle_issuances(is_active_dispatch) WHERE is_active_dispatch = TRUE;
CREATE INDEX idx_fuel_serial ON cryptographic_fuel_stubs(secure_stub_serial);



import { Request, Response } from 'express';
import { Pool, PoolClient } from 'pg';
import * as crypto from 'crypto';

const dbPool = new Pool({
  connectionString: process.env.DATABASE_URL,
  max: 20,
  idleTimeoutMillis: 30000,
  connectionTimeoutMillis: 2000,
});

// Structural Typings for Transaction Payload
interface DispatchPayload {
  vehicleUuid: string;
  operatorIdCard: string;
  operatorFullname: string;
  classification: 'ROUTINE_MISSION' | 'EMERGENCY_RESPONSE' | 'TACTICAL_DEPLOYMENT' | 'ADMINISTRATIVE';
  destination: string;
  purpose: string;
  expectedReturn: string;
  allocatedUnits: number;
  maxFiatLimit: number;
  approverBadge: string;
}

export const processAdvancedVehicleIssuance = async (req: Request, res: Response): Promise<void> => {
  const payload: DispatchPayload = req.body;
  const client: PoolClient = await dbPool.connect();

  try {
    // Initiate Serialized / Write-Lock Transaction Boundary
    await client.query('BEGIN');

    // 1. Thread-safe Resource Evaluation via Row-Level Pessimistic Locking
    const vehicleQuery = `
      SELECT current_status, current_odometer, fuel_type 
      FROM fleet_vehicles 
      WHERE vehicle_uuid = $1 
      FOR UPDATE;
    `;
    const vehicleRes = await client.query(vehicleQuery, [payload.vehicleUuid]);

    if (vehicleRes.rows.length === 0) {
      res.status(404).json({ error: 'TARGET_VEHICLE_NOT_FOUND' });
      await client.query('ROLLBACK');
      return;
    }

    const vehicleData = vehicleRes.rows[0];

    // Emergency Bypass Logic: Allow dispatches if context is classified as EMERGENCY_RESPONSE
    if (vehicleData.current_status !== 'AVAILABLE' && payload.classification !== 'EMERGENCY_RESPONSE') {
      res.status(409).json({ 
        error: 'RESOURCE_LOCKED', 
        message: `Asset status: ${vehicleData.current_status}. Dispatch rejected.` 
      });
      await client.query('ROLLBACK');
      return;
    }

    // 2. Persist the Vehicle Issuance Record Ledger
    const issuanceInsertQuery = `
      INSERT INTO vehicle_issuances (
        vehicle_uuid, operator_id_card, operator_fullname, mission_classification, 
        geographical_destination, authorized_purpose, expected_return_timestamp, starting_odometer, approving_officer_badge
      ) VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9)
      RETURNING issuance_uuid, departure_timestamp;
    `;
    const issuanceValues = [
      payload.vehicleUuid,
      payload.operatorIdCard,
      payload.operatorFullname,
      payload.classification,
      payload.destination,
      payload.purpose,
      payload.expectedReturn,
      vehicleData.current_odometer,
      payload.approverBadge
    ];
    
    const issuanceRes = await client.query(issuanceInsertQuery, issuanceValues);
    const currentIssuanceUuid = issuanceRes.rows[0].issuance_uuid;
    const departureTime = issuanceRes.rows[0].departure_timestamp;

    // 3. Cryptographic Token Generation for the Fuel Stub
    const dateSegment = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const entropyHex = crypto.randomBytes(4).toString('hex').toUpperCase();
    const generatedSerial = `STUB-${dateSegment}-${entropyHex}`;

    // Compute Cryptographic Digital Signature for Verification and Fraud Mitigation
    const signaturePayload = `${generatedSerial}:${currentIssuanceUuid}:${payload.allocatedUnits}:${payload.maxFiatLimit}`;
    const digitalSignature = crypto
      .createHmac('sha256', process.env.SYSTEM_HMAC_SECRET || 'SYS_SECRET_KEY')
      .update(signaturePayload)
      .digest('hex');

    // 4. Persist Fuel Stub Allocation Data
    const fuelStubInsertQuery = `
      INSERT INTO cryptographic_fuel_stubs (
        issuance_uuid, secure_stub_serial, fuel_type, allocated_units, max_fiat_limit, cryptographic_signature
      ) VALUES ($1, $2, $3, $4, $5, $6)
      RETURNING secure_stub_serial;
    `;
    await client.query(fuelStubInsertQuery, [
      currentIssuanceUuid,
      generatedSerial,
      vehicleData.fuel_type,
      payload.allocatedUnits,
      payload.maxFiatLimit,
      digitalSignature
    ]);

    // 5. Mutate Vehicle Asset Registry State
    const updateVehicleStateQuery = `
      UPDATE fleet_vehicles 
      SET current_status = 'DISPATCHED', updated_at = CURRENT_TIMESTAMP 
      WHERE vehicle_uuid = $1;
    `;
    await client.query(updateVehicleStateQuery, [payload.vehicleUuid]);

    // Commit Transactional Pipeline safely
    await client.query('COMMIT');

    // Return Telemetry Packet
    res.status(201).json({
      status: 'SUCCESS',
      issuance_id: currentIssuanceUuid,
      stub_serial: generatedSerial,
      departure_time: departureTime,
      starting_odometer: vehicleData.current_odometer,
      integrity_hash: digitalSignature
    });

  } catch (err) {
    await client.query('ROLLBACK');
    console.error('SYSTEM_TRANSACTION_FAILURE -> Rollback Executed.', err);
    res.status(500).json({ error: 'INTERNAL_LEDGER_ERROR', technical_details: (err as Error).message });
  } finally {
    client.release();
  }
};



