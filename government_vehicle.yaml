WITH closed_issuance AS (
    UPDATE vehicle_issuances 
    SET 
        actual_return_timestamp = CURRENT_TIMESTAMP,
        ending_odometer = 142500, -- Dynamic Inspection Variable Input
        is_active_dispatch = FALSE
    WHERE issuance_uuid = 'YOUR_ISSUANCE_UUID_HERE'
    RETURNING vehicle_uuid, starting_odometer, ending_odometer
)
UPDATE fleet_vehicles 
SET 
    current_odometer = (SELECT ending_odometer FROM closed_issuance),
    current_status = 'AVAILABLE',
    updated_at = CURRENT_TIMESTAMP
WHERE vehicle_uuid = (SELECT vehicle_uuid FROM closed_issuance);



