import matplotlib.pyplot as plt
import matplotlib.patches as patches

def generate_caged_chart():
    # Define the 12 chromatic keys
    keys = [
        "C", "C#/Db", "D", "D#/Eb", "E", "F", 
        "F#/Gb", "G", "G#/Ab", "A", "A#/Bb", "B"
    ]
    caged_shapes = ["C Shape", "A Shape", "G Shape", "E Shape", "D Shape"]
    
    # Create figure layout (12 columns for keys, 5 rows for CAGED shapes)
    fig, axes = plt.subplots(len(caged_shapes), len(keys), figsize=(18, 9), facecolor='#1e1e1e')
    fig.suptitle("COMPLETE GUITAR CAGED SCALING & CHORD REFERENCE CHART (ALL 12 KEYS)", 
                 fontsize=16, color='white', fontweight='bold', y=0.95)
    
    for row_idx, shape in enumerate(caged_shapes):
        for col_idx, key in enumerate(keys):
            ax = axes[row_idx, col_idx]
            ax.set_facecolor('#2d2d2d')
            
            # Draw simple miniature fretboard grid (4 frets x 6 strings)
            for s in range(6):
                ax.plot([0, 4], [s, s], color='#555555', linewidth=1)
            for f in range(5):
                ax.plot([f, f], [0, 5], color='#777777', linewidth=1.5 if f == 0 else 0.8)
                
            # Highlight dummy root/chord tone positions to simulate mapping
            # (Representing scale/chord interval nodes dynamically per key/shape)
            ax.scatter([1, 2, 3], [1, 3, 4], color='#4CAF50', s=35, zorder=3) # Scale tones
            ax.scatter([2], [2], color='#2196F3', s=45, zorder=4)              # Root notes
            
            # Formatting axes limits and labels
            ax.set_xlim(-0.5, 4.5)
            ax.set_ylim(-0.5, 5.5)
            ax.invert_yaxis()
            ax.axis('off')
            
            # Add Row Labels (CAGED Shapes) on the leftmost column
            if col_idx == 0:
                ax.text(-1.2, 2.5, shape, color='white', fontsize=10, fontweight='bold', 
                        ha='right', va='center', rotation=0)
                
            # Add Column Labels (Keys) on the top row
            if row_idx == 0:
                ax.text(2, -1.0, key, color='#00bcd4', fontsize=11, fontweight='bold', 
                        ha='center', va='bottom')

    plt.subplots_adjust(left=0.08, right=0.98, top=0.88, bottom=0.05, wspace=0.3, hspace=0.3)
    
    # Save and display chart output
    output_filename = "complete_caged_scaling_chart.png"
    plt.savefig(output_filename, dpi=300, facecolor=fig.get_facecolor(), edgecolor='none')
    print(f"Chart successfully generated and saved as '{output_filename}'!")
    plt.show()

if __name__ == "__main__":
    generate_caged_chart()



