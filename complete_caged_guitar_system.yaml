    <h2>Introduction to the CAGED System</h2>
    <p>The CAGED system connects open-position major chords to movable barre shapes across the fretboard (C, A, G, E, and D shapes). By mastering these five anchor positions, you can map out major scales, arpeggios, and chord voicings seamlessly across all 12 chromatic keys and all frets (0-22).</p>
    <div class="audio-note">
        <b>Listening Tip:</b> This e-book supports text-to-speech readers on Apple Books, Google Play Books, and Kindle apps for hands-free audio walkthroughs while practicing your instrument.
    </div>
    
    <h2>Master Reference Matrix (All 12 Keys)</h2>
    <p>Below is the complete blueprint mapping the fundamental root keys from C through B across structural positions:</p>
    <table>
        <tr>
            <th>Key / Root</th>
            <th>C-Shape Position</th>
            <th>A-Shape Position</th>
            <th>G-Shape Position</th>
            <th>E-Shape Position</th>
            <th>D-Shape Position</th>
        </tr>
"""

    for key in keys:
        html_content += f"""
        <tr>
            <td><b>{key}</b></td>
            <td>Fret 0-3 Root</td>
            <td>Fret 2-5 Root</td>
            <td>Fret 5-8 Root</td>
            <td>Fret 7-10 Root</td>
            <td>Fret 9-13 Root</td>
        </tr>"""

    html_content += f"""
    </table>
    
    <h2>Detailed Breakdown by Key</h2>
"""

    for key in keys:
        html_content += f"""
        <h3>Key of {key}</h3>
        <p><b>Core Scale Formula:</b> Root (1) - Major 2nd (2) - Major 3rd (3) - Perfect 4th (4) - Perfect 5th (5) - Major 6th (6) - Major 7th (7).</p>
        <p><b>Practice Routine:</b> Cycle sequentially through C Shape &rarr; A Shape &rarr; G Shape &rarr; E Shape &rarr; D Shape up the fretboard. Combine chord voicings with matching scale intervals for fluid fretboard navigation.</p>
        <hr/>
"""

    html_content += """
</body>
</html>
"""

    # Package into a standard EPUB container structure
    epub_filename = "Complete_Guitar_CAGED_Reference.epub"
    
    # Create simple container files in memory/temp zip
    with zipfile.ZipFile(epub_filename, 'w') as epub:
        # mimetype must be first and uncompressed
        epub.writestr("mimetype", "application/epub+zip", compress_type=zipfile.ZIP_STORED)
        
        # META-INF/container.xml
        container_xml = """<?xml version="1.0"?>
