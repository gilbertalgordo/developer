import os
import zipfile

def create_distribution_zip():
    zip_name = "ducati-active-ai-v1.0.zip"
    exclude_dirs = {'installer', '__pycache__', '.git', 'logs'}
    
    print(f"[*] Packaging project into {zip_name}...")
    with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for root, dirs, files in os.walk('.'):
            dirs[:] = [d for d in dirs if d not in exclude_dirs]
            for file in files:
                if file.endswith('.zip') or file.endswith('.pyc'):
                    continue
                file_path = os.path.join(root, file)
                zipf.write(file_path, arcname=os.path.relpath(file_path, '.'))
                
    print(f"[+] Successfully created package: {zip_name}")

if __name__ == "__main__":
    create_distribution_zip()




