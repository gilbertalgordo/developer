import time
from core.telemetry import DucatiTelemetry
from core.ai_engine import ActiveAIEngine
from hud.overlay import HUDOverlay

def main():
    print("Initializing Ducati Diavel V4 1260S Active AI System...")
    telemetry = DucatiTelemetry()
    ai = ActiveAIEngine()
    
    try:
        while True:
            data = telemetry.fetch_data()
            insight = ai.analyze_ride(data)
            HUDOverlay.render(data, insight)
            time.sleep(1.0)
    except KeyboardInterrupt:
        print("\nShutting down Ducati Active AI System safely.")

if __name__ == "__main__":
    main()



