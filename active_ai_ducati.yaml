import asyncio
from core.can_bus import DucatiCANBus
from core.neural_ai import AdvancedNeuralAI
from hud.renderer import AdvancedHUDRenderer

async def main():
    can = DucatiCANBus()
    ai = AdvancedNeuralAI()
    
