import os

def install_icons():
    print("[*] Deploying icon system configuration to local application directory...")
    os.makedirs("dist/icons", exist_ok=True)
    
    asset_dir = "assets"
    if os.path.exists(asset_dir):
        for file in os.listdir(asset_dir):
            if file.endswith(".svg"):
                src = os.path.join(asset_dir, file)
                dst = os.path.join("dist/icons", file)
                with open(src, "r") as f_src, open(dst, "w") as f_dst:
                    f_dst.write(f_src.read())
                print(f"[+] Installed icon -> {dst}")
    print("[+] Icon installation completed successfully.")

if __name__ == "__main__":
    install_icons()




import os
import zipfile

def package_zip():
    zip_name = "ducati-ai-icons-bundle.zip"
    excluded = {'installer', '__pycache__', '.git', 'dist'}
    
    print(f"[*] Packaging assets and codebase into {zip_name}...")
    with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for root, dirs, files in os.walk('.'):
            dirs[:] = [d for d in dirs if d not in excluded]
            for file in files:
                if file.endswith('.zip') or file.endswith('.pyc'):
                    continue
                full_path = os.path.join(root, file)
                zipf.write(full_path, arcname=os.path.relpath(full_path, '.'))
                
    print(f"[+] Distribution package successfully compiled: {zip_name}")

if __name__ == "__main__":
    package_zip()



