<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turntable & Remix Sound Equalizer - by Gilbert Algordo</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --panel-bg: #161a2b;
            --accent-primary: #00f0ff;
            --accent-secondary: #ff007f;
            --accent-green: #00ff66;
            --text-color: #e0e6ed;
            --text-dim: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-primary);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        header a {
            color: var(--accent-secondary);
            text-decoration: none;
            font-weight: bold;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .main-container {
                grid-template-columns: 350px 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .panel h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Mode Selector */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: var(--accent-primary);
            color: var(--bg-color);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* Turntable Deck */
        .turntable-deck {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #101320;
            border-radius: 10px;
            padding: 15px;
            position: relative;
            margin-bottom: 20px;
        }

        .vinyl {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #111 0%, #000 70%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s linear;
            cursor: grab;
        }

        .vinyl.spinning {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .vinyl-label {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: bold;
            color: #fff;
            text-align: center;
            border: 2px dashed #fff;
        }

        .deck-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 10px;
            background: #222840;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background: #2a3252;
        }

        .btn.primary {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
        }

        .btn.primary:hover {
            background: #ff198c;
        }

        /* Controls & Modules */
        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        /* Ultra Mode Hidden Elements */
        .ultra-mode-only {
            display: none;
        }

        body.ultra-active .ultra-mode-only {
            display: block;
        }

        /* Drum Pads */
        .drum-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .drum-pad {
            background: #222942;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 15px 5px;
            text-align: center;
            color: var(--text-color);
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
        }

        .drum-pad:active, .drum-pad.triggered {
            background: var(--accent-primary);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        /* Synth Keys */
        .synth-keys {
            display: flex;
            gap: 4px;
            margin-bottom: 15px;
        }

        .key {
            flex: 1;
            height: 70px;
            background: #fff;
            border-radius: 0 0 4px 4px;
            border: 1px solid #ccc;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            color: #000;
            font-size: 0.7rem;
            font-weight: bold;
            transition: background 0.1s;
        }

        .key:active, .key.active {
            background: var(--accent-green);
        }

        /* Visualizer */
        canvas {
            width: 100%;
            height: 80px;
            background: #090b10;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
        }

        .flex-row > * {
            flex: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1>TURNTABLE & REMIX SOUND EQUALIZER</h1>
        <p>Created by <a href="https://g.dev/gilbert_algordo" target="_blank">Gilbert Algordo</a></p>
    </header>

    <div class="main-container">
        <!-- Left Column: Controls & Turntable -->
        <div class="panel">
            <h2>Deck & Playback</h2>
            
            <div class="mode-selector">
                <button class="mode-btn active" id="btnSimple" onclick="setMode('simple')">Simple Mode</button>
                <button class="mode-btn" id="btnUltra" onclick="setMode('ultra')">Ultra Music Mode</button>
            </div>

            <div class="turntable-deck">
                <div class="vinyl" id="vinylDisc">
                    <div class="vinyl-label">REMIX<br>DECK</div>
                </div>
                <div class="deck-controls">
                    <button class="btn primary" id="playBtn" onclick="togglePlay()">Play / Stop</button>
                    <button class="btn" onclick="triggerScratch()">Scratch</button>
                </div>
            </div>

            <div class="control-group">
                <label>Track Pitch / Speed (<span id="speedVal">1.0</span>x)</label>
                <input type="range" id="pitchSlider" min="0.5" max="2.0" step="0.05" value="1.0" oninput="updatePitch(this.value)">
            </div>

            <div class="control-group">
                <label>Crossfader (Deck A / B Balance)</label>
                <input type="range" min="0" max="100" value="50">
            </div>
        </div>

        <!-- Right Column: Equalizer, Synths, Drums & Refurbishing -->
        <div class="panel">
            <h2>Remix Studio & Equalizer</h2>
            
            <canvas id="visualizer"></canvas>

            <!-- Refurbishing & Padding Tools -->
            <div class="flex-row">
                <div class="control-group">
                    <label>Refurbish Mode</label>
                    <select id="refurbishTool" class="btn" style="width: 100%; text-align: left;" onchange="applyRefurbish(this.value)">
                        <option value="none">Normal (Clean)</option>
                        <option value="warm">Warm Vintage Vinyl</option>
                        <option value="club">Club Boost (Bass & Treble)</option>
                        <option value="vocal">Vocal Presence Enhancer</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Remix Padding / Reverb</label>
                    <input type="range" id="paddingSlider" min="0" max="1" step="0.05" value="0.2" oninput="updatePadding(this.value)">
                </div>
            </div>

            <!-- Standard Equalizer -->
            <div class="flex-row">
                <div class="control-group">
                    <label>Low (Bass)</label>
                    <input type="range" id="eqLow" min="-20" max="20" value="0" oninput="updateEQ('low', this.value)">
                </div>
                <div class="control-group">
                    <label>Mid</label>
                    <input type="range" id="eqMid" min="-20" max="20" value="0" oninput="updateEQ('mid', this.value)">
                </div>
                <div class="control-group">
                    <label>High (Treble)</label>
                    <input type="range" id="eqHigh" min="-20" max="20" value="0" oninput="updateEQ('high', this.value)">
                </div>
            </div>

            <!-- ULTRA MUSIC MODE MODULES -->
            <div class="ultra-mode-only">
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
                
                <h2>Live Electronic Drum Beat</h2>
                <div class="drum-grid">
                    <div class="drum-pad" onclick="playDrum('kick')">KICK</div>
                    <div class="drum-pad" onclick="playDrum('snare')">SNARE</div>
                    <div class="drum-pad" onclick="playDrum('hihat')">HI-HAT</div>
                    <div class="drum-pad" onclick="playDrum('clap')">CLAP</div>
                </div>

                <h2>Live Instrumental Synths</h2>
                <div class="synth-keys">
                    <div class="key" onclick="playSynth(261.63)">C4</div>
                    <div class="key" onclick="playSynth(293.66)">D4</div>
                    <div class="key" onclick="playSynth(329.63)">E4</div>
                    <div class="key" onclick="playSynth(349.23)">F4</div>
                    <div class="key" onclick="playSynth(392.00)">G4</div>
                    <div class="key" onclick="playSynth(440.00)">A4</div>
                    <div class="key" onclick="playSynth(493.88)">B4</div>
                    <div class="key" onclick="playSynth(523.25)">C5</div>
                </div>

                <h2>Voice Synth Options</h2>
                <div class="flex-row">
                    <div class="control-group" style="flex: 2;">
                        <input type="text" id="voiceText" class="btn" style="width: 100%; text-align: left; background:#090b10;" value="Drop the beat!">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <button class="btn primary" style="width: 100%;" onclick="speakVoice()">Trigger Vocal</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Web Audio API Setup
        let audioCtx = null;
        let isPlaying = false;
        let masterGain, lowFilter, midFilter, highFilter, convolver;
        let vinylDisc = document.getElementById('vinylDisc');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                masterGain = audioCtx.createGain();
                
                // Equalizer filters
                lowFilter = audioCtx.createBiquadFilter();
                lowFilter.type = 'lowshelf';
                lowFilter.frequency.setValueAtTime(250, audioCtx.currentTime);

                midFilter = audioCtx.createBiquadFilter();
                midFilter.type = 'peaking';
                midFilter.frequency.setValueAtTime(1500, audioCtx.currentTime);

                highFilter = audioCtx.createBiquadFilter();
                highFilter.type = 'highshelf';
                highFilter.frequency.setValueAtTime(4000, audioCtx.currentTime);

                // Connect chain: Source -> Low -> Mid -> High -> Master -> Destination
                lowFilter.connect(midFilter);
                midFilter.connect(highFilter);
                highFilter.connect(masterGain);
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Mode Switching
        function setMode(mode) {
            const body = document.body;
            document.getElementById('btnSimple').classList.remove('active');
            document.getElementById('btnUltra').classList.remove('active');

            if (mode === 'ultra') {
                body.classList.add('ultra-active');
                document.getElementById('btnUltra').classList.add('active');
            } else {
                body.classList.remove('ultra-active');
                document.getElementById('btnSimple').classList.add('active');
            }
        }

        // Turntable Playback Simulation
        function togglePlay() {
            initAudio();
            isPlaying = !isPlaying;
            if (isPlaying) {
                vinylDisc.classList.add('spinning');
                playBackgroundHum();
            } else {
                vinylDisc.classList.remove('spinning');
            }
        }

        let bgOsc = null;
        function playBackgroundHum() {
            if (bgOsc) {
                try { bgOsc.stop(); } catch(e){}
            }
            bgOsc = audioCtx.createOscillator();
            bgOsc.type = 'sawtooth';
            bgOsc.frequency.setValueAtTime(110, audioCtx.currentTime); // A2 root note
            
            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

            bgOsc.connect(oscGain);
            oscGain.connect(lowFilter);
            bgOsc.start();
        }

        function triggerScratch() {
            initAudio();
            if(!isPlaying) return;
            // Pitch bend / scratch noise simulation
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function updatePitch(val) {
            document.getElementById('speedVal').innerText = val;
            vinylDisc.style.animationDuration = (2 / val) + 's';
        }

        // Equalizer Control
        function updateEQ(band, value) {
            initAudio();
            if (band === 'low') lowFilter.gain.setValueAtTime(value, audioCtx.currentTime);
            if (band === 'mid') midFilter.gain.setValueAtTime(value, audioCtx.currentTime);
            if (band === 'high') highFilter.gain.setValueAtTime(value, audioCtx.currentTime);
        }

        // Track Refurbish Tools
        function applyRefurbish(mode) {
            initAudio();
            if (mode === 'warm') {
                lowFilter.gain.setValueAtTime(5, audioCtx.currentTime);
                highFilter.gain.setValueAtTime(-3, audioCtx.currentTime);
            } else if (mode === 'club') {
                lowFilter.gain.setValueAtTime(8, audioCtx.currentTime);
                highFilter.gain.setValueAtTime(6, audioCtx.currentTime);
            } else if (mode === 'vocal') {
                midFilter.gain.setValueAtTime(7, audioCtx.currentTime);
            } else {
                lowFilter.gain.setValueAtTime(0, audioCtx.currentTime);
                midFilter.gain.setValueAtTime(0, audioCtx.currentTime);
                highFilter.gain.setValueAtTime(0, audioCtx.currentTime);
            }
        }

        function updatePadding(val) {
            if(masterGain) {
                masterGain.gain.setValueAtTime(0.5 + parseFloat(val), audioCtx.currentTime);
            }
        }

        // Electronic Drum Machine
        function playDrum(type) {
            initAudio();
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(masterGain);

            if (type === 'kick') {
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.3);
                gain.gain.setValueAtTime(0.8, t);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
                osc.start(t);
                osc.stop(t + 0.3);
            } else if (type === 'snare') {
                // Noise buffer for snare
                playWhiteNoise(0.15, 0.4);
            } else if (type === 'hihat') {
                playWhiteNoise(0.05, 0.2);
            } else if (type === 'clap') {
                playWhiteNoise(0.1, 0.5);
            }
        }

        function playWhiteNoise(duration, volume) {
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1000;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            noise.start();
        }

        // Instrumental Synth Keyboard
        function playSynth(freq) {
            initAudio();
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, t);

            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);

            osc.connect(gain);
            gain.connect(masterGain);

            osc.start(t);
            osc.stop(t + 0.4);
        }

        // Voice Synth Options
        function speakVoice() {
            const text = document.getElementById('voiceText').value;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 1.2;
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Speech synthesis not supported in this browser.');
            }
        }

        // Visualizer Canvas Animation
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            ctx.fillStyle = '#090b10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / 32);
            let x = 0;

            for (let i = 0; i < 32; i++) {
                const barHeight = isPlaying ? Math.random() * canvas.height * 0.8 + 5 : 5;

                ctx.fillStyle = `rgb(0, ${Math.floor(barHeight + 100)}, 255)`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);

                x += barWidth;
            }
        }
        drawVisualizer();
    </script>
</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Turntable & Remix Equalizer HUD - by Gilbert Algordo</title>
    <style>
        :root {
            --bg-color: #070913;
            --panel-bg: rgba(13, 17, 30, 0.85);
            --border-color: rgba(0, 240, 255, 0.2);
            --accent-cyan: #00f0ff;
            --accent-pink: #ff007f;
            --accent-green: #00ff66;
            --accent-amber: #ffaa00;
            --text-main: #e2e8f0;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
