import os
import requests

def fetch_active_ai_food_delivery(api_key, latitude, longitude):
    """
    Queries Google Places API (New) for top nearby restaurants,
    extracts active food delivery metadata, phone numbers, and web links.
    """
    url = "https://places.googleapis.com/v1/places:searchNearby"
    
    headers = {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": api_key,
        "X-Goog-FieldMask": (
            "places.displayName,"
            "places.formattedAddress,"
            "places.nationalPhoneNumber,"
            "places.websiteUri,"
            "places.rating,"
            "places.businessStatus"
        )
    }
    
    payload = {
        "includedTypes": ["restaurant"],
        "maxResultCount": 5,
        "locationRestriction": {
            "circle": {
                "center": {
                    "latitude": latitude,
                    "longitude": longitude
                },
                "radius": 1500.0
            }
        }
    }
    
    response = requests.post(url, headers=headers, json=payload)
    
    if response.status_code != 200:
        raise Exception(f"API Error: {response.status_code} - {response.text}")
        
    data = response.json()
    places = data.get("places", [])
    
    print("==================================================")
    print("       GOOGLE FOOD DELIVERY: ACTIVE AI AGENT      ")
    print("==================================================")
    
    for idx, place in enumerate(places, 1):
        name = place.get("displayName", {}).get("text", "Unknown Restaurant")
        phone = place.get("nationalPhoneNumber", "N/A")
        link = place.get("websiteUri", "N/A")
        rating = place.get("rating", "N/A")
        address = place.get("formattedAddress", "N/A")
        
        print(f"\n[{idx}] {name}")
        print(f"    Rating       : {rating} ⭐")
        print(f"    Address      : {address}")
        print(f"    Phone Number : {phone}")
        print(f"    Delivery Link: {link}")
        print("    AI Status    : Active & Ready for Instant Dispatch")

if __name__ == "__main__":
    # Replace with your active Google Maps API Key
    API_KEY = os.environ.get("GOOGLE_MAPS_API_KEY", "YOUR_API_KEY")
    
    # Example coordinates (e.g., Downtown San Francisco / NYC)
    LATITUDE = 37.7937
    LONGITUDE = -122.3965
    
    fetch_active_ai_food_delivery(API_KEY, LATITUDE, LONGITUDE)



import os
import asyncio
import aiohttp
from typing import Dict, Any, List

class GoogleFoodDeliveryActiveAI:
    """
    Advanced Asynchronous Engine for Google Restaurant Food Delivery Active AI Agent.
    Interacts with Google Maps Places API (New) to query, structure, and dispatch 
    nearby restaurant telemetry, phone numbers, website links, and real-time operational status.
    """
    
    def __init__(self, api_key: str):
        self.api_key = api_key
        self.endpoint = "https://places.googleapis.com/v1/places:searchNearby"
        
    async def fetch_top_restaurants(self, latitude: float, longitude: float, radius: float = 2000.0) -> List[Dict[str, Any]]:
        headers = {
            "Content-Type": "application/json",
            "X-Goog-Api-Key": self.api_key,
            "X-Goog-FieldMask": (
                "places.displayName,"
                "places.formattedAddress,"
                "places.nationalPhoneNumber,"
                "places.websiteUri,"
                "places.rating,"
                "places.userRatingsTotal,"
                "places.businessStatus,"
                "places.regularOpeningHours"
            )
        }
        
        payload = {
            "includedTypes": ["restaurant"],
            "maxResultCount": 10,
            "rankPreference": "POPULARITY",
            "locationRestriction": {
                "circle": {
                    "center": {
                        "latitude": latitude,
                        "longitude": longitude
                    },
                    "radius": radius
                }
            }
        }
        
        async with aiohttp.ClientSession() as session:
            async with session.post(self.endpoint, headers=headers, json=payload) as response:
                if response.status != 200:
                    error_text = await response.text()
                    raise ConnectionError(f"Google Places API Error [{response.status}]: {error_text}")
                
                data = await response.json()
                return data.get("places", [])

    def process_ai_telemetry(self, raw_places: List[Dict[str, Any]]) -> List[Dict[str, str]]:
        structured_output = []
        
        for index, place in enumerate(raw_places, 1):
            name = place.get("displayName", {}).get("text", "Unknown Partner Venue")
            phone = place.get("nationalPhoneNumber", "Direct Line Unavailable")
            link = place.get("websiteUri", "No Web Link Provided")
            rating = place.get("rating", "N/A")
            reviews = place.get("userRatingsTotal", 0)
            address = place.get("formattedAddress", "Location Coordinates Only")
            status = place.get("businessStatus", "OPERATIONAL")
            
            node_data = {
                "node_id": f"NODE-{index:03d}",
                "restaurant_name": name,
                "operational_status": status,
                "rating": f"{rating} ⭐ ({reviews} reviews)",
                "address": address,
                "phone_number": phone,
                "delivery_link": link,
                "active_ai_dispatch": "Ready for Instant Autonomous Order Routing"
            }
            structured_output.append(node_data)
            
        return structured_output

async def main():
    # Secure environment variable retrieval for production environments
    API_KEY = os.environ.get("GOOGLE_MAPS_API_KEY", "YOUR_GOOGLE_MAPS_API_KEY")
    
    # Target Coordinates (Example: Central Urban Sector)
    LATITUDE = 14.3500
    LONGITUDE = 121.0500
    
    print("Initializing Google Food Delivery Active AI Agent...")
    agent = GoogleFoodDeliveryActiveAI(api_key=API_KEY)
    
    try:
        raw_data = await agent.fetch_top_restaurants(LATITUDE, LONGITUDE)
        processed_nodes = agent.process_ai_telemetry(raw_data)
        
        print("\n" + "="*80)
        print("          GOOGLE FOOD DELIVERY: ACTIVE AI - LIVE EXTRACTION TELEMETRY          ")
        print("="*80)
        
        for node in processed_nodes:
            print(f"\n[{node['node_id']}] {node['restaurant_name']}")
            print(f" ┣ Status       : {node['operational_status']}")
            print(f" ┣ Rating       : {node['rating']}")
            print(f" ┣ Address      : {node['address']}")
            print(f" ┣ Phone Number : {node['phone_number']}")
            print(f" ┣ Web Link     : {node['delivery_link']}")
            print(f" ┗ AI Protocol  : {node['active_ai_dispatch']}")
        print("\n" + "="*80)
        
    except Exception as e:
        print(f"Execution Exception Encountered: {e}")

if __name__ == "__main__":
    asyncio.run(main())



