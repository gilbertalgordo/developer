/**
 * Renders a dynamic restaurant icon.
 * @param {object} restaurant - The restaurant data object.
 */
const RestaurantIcon = ({ restaurant }) => {
  return (
    <div className="relative group w-64 rounded-2xl border border-gray-200 p-4 hover:shadow-lg transition-shadow bg-white">
      {/* AI Status Indicator - Top Right */}
      {restaurant.active_ai_status && (
        <div className="absolute -top-2 -right-2 bg-blue-600 text-white p-1.5 rounded-full shadow-md" title="AI-Powered Order Ready">
          <BotMessageSquare size={16} />
        </div>
      )}

      {/* Restaurant Header */}
      <div className="flex items-center gap-3 mb-4">
        <img
          src={restaurant.icon_image_url}
          alt={restaurant.name}
          className="w-12 h-12 rounded-lg object-cover border"
        />
        <div>
          <h3 className="font-semibold text-gray-900">{restaurant.name}</h3>
          <div className="flex items-center gap-1 text-sm text-gray-600">
            <GoogleGLogo size={16} />
            <span>{restaurant.rating} ⭐</span>
            <span className="text-gray-400">|</span>
            <span>{restaurant.delivery_eta_minutes} min</span>
          </div>
        </div>
      </div>

      {/* Action Buttons (Phone & Link) */}
      <div className="flex gap-2">
        <a
          href={restaurant.phone_uri}
          className="flex-1 flex items-center justify-center gap-2 bg-gray-100 text-gray-700 py-2.5 px-4 rounded-lg hover:bg-gray-200 transition-colors"
          aria-label={`Call ${restaurant.name}`}
        >
          <Phone size={18} />
          Call
        </a>
        <a
          href={restaurant.google_maps_link}
          target="_blank"
          rel="noopener noreferrer"
          className="flex-1 flex items-center justify-center gap-2 bg-blue-600 text-white py-2.5 px-4 rounded-lg hover:bg-blue-700 transition-colors"
          aria-label={`View ${restaurant.name} on Google Maps`}
        >
          <MapPin size={18} />
          Order
        </a>
      </div>
    </div>
  );
};

export default RestaurantIcon;



