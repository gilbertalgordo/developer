import * as fs from 'fs';
import * as path from 'path';

interface IconVariant {
  name: string;
  primaryColor: string;
  accentColor: string;
}

const variants: IconVariant[] = [
  { name: 'hud-default', primaryColor: '#3B82F6', accentColor: '#9333EA' },
  { name: 'hud-cyber', primaryColor: '#06B6D4', accentColor: '#3B82F6' },
  { name: 'hud-ferrari', primaryColor: '#EF4444', accentColor: '#F59E0B' }
];

const templatePath = path.join(process.cwd(), 'assets/icons/templates/icon-base.svg');
const outputDir = path.join(process.cwd(), 'assets/icons/dist');

function buildIcons() {
  if (!fs.existsSync(outputDir)) {
    fs.mkdirSync(outputDir, { recursive: true });
  }

  const baseSvg = fs.readFileSync(templatePath, 'utf8');

  variants.forEach((v) => {
    let customizedSvg = baseSvg
      .replace('#3B82F6', v.primaryColor)
      .replace('#9333EA', v.accentColor);

    const outputPath = path.join(outputDir, `icon-${v.name}.svg`);
    fs.writeFileSync(outputPath, customizedSvg, 'utf8');
    console.log(`[Generated]: Successfully created icon -> ${outputPath}`);
  });
}

buildIcons();



