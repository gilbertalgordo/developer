import { GoogleGenAI } from '@google/genai';
import dotenv from 'dotenv';

dotenv.config();

/**
 * Core AI Engine configured for precise scientific reasoning and multi-modal generation.
 */
export class GeminiEngine {
  private ai: GoogleGenAI;

  constructor() {
    // Automatically initializes using process.env.GEMINI_API_KEY
    this.ai = new GoogleGenAI({});
  }

  public async generateTextResponse(prompt: string, model: string = 'gemini-2.5-pro'): Promise<string> {
    try {
      const response = await this.ai.models.generateContent({
        model: model,
        contents: prompt,
        config: {
          temperature: 0.2, // Optimized for precision and accuracy
        }
      });
      return response.text || 'No response generated.';
    } catch (error) {
      console.error('Error generating content from Gemini API:', error);
      throw error;
    }
  }
}



