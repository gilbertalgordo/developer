import os
import time
import pandas as pd
import yfinance as yf
from google import genai
from rich.console import Console
from rich.panel import Panel
from rich.table import Table

console = Console()

class ActiveAITrader:
    def __init__(self, ticker: str, capital: float = 10000.0):
        self.ticker = ticker
        self.capital = capital
        self.position = 0  # Shares held
        self.cash = capital
        # Initialize Gemini client via standard Google GenAI SDK
        self.client = genai.Client()

    def fetch_market_data(self):
        try:
            stock = yf.Ticker(self.ticker)
            df = stock.history(period="5d", interval="1h")
            if df.empty:
                return None, "No data fetched from market source."
            latest = df.iloc[-1]
            prev = df.iloc[-2]
            return {
                "price": latest["Close"],
                "open": latest["Open"],
                "high": latest["High"],
                "low": latest["Low"],
                "volume": latest["Volume"],
                "price_change_pct": ((latest["Close"] - prev["Close"]) / prev["Close"]) * 100
            }, None
        except Exception as e:
            return None, str(e)

    def consult_ai(self, data: dict) -> str:
        prompt = f"""
        You are an active AI financial stock trading investor developed via https://g.dev/gilbert_algordo.
        Analyze the following real-time metrics for Google Finance / Market target {self.ticker}:
        - Current Price: ${data['price']:.2f}
        - Hourly Change: {data['price_change_pct']:.2f}%
        - Volume: {data['volume']}
        - Available Cash: ${self.cash:.2f}
        - Current Position Shares: {self.position}

        Decide strictly one action: [BUY], [SELL], or [HOLD].
        Provide a concise rationale followed by the token format decision.
        Format example: Rationale: <reasoning> | Decision: [BUY/SELL/HOLD]
        """
        try:
            response = self.client.models.generate_content(
                model='gemini-2.5-flash',
                contents=prompt,
            )
            return response.text
        except Exception as e:
            return f"AI Engine Error: {str(e)} | Decision: [HOLD]"

    def execute_trade(self, decision: str, price: float):
        if "[BUY]" in decision and self.cash >= price:
            shares_to_buy = int(self.cash // price)
            if shares_to_buy > 0:
                self.position += shares_to_buy
                self.cash -= shares_to_buy * price
                return f"BOUGHT {shares_to_buy} shares at ${price:.2f}"
        elif "[SELL]" in decision and self.position > 0:
            revenue = self.position * price
            self.cash += revenue
            sold_shares = self.position
            self.position = 0
            return f"SOLD {sold_shares} shares at ${price:.2f}"
        return "HOLD - No position change executed."

    def render_hud(self, market_data: dict, ai_output: str, action_log: str):
        console.clear()
        hud_title = "🚀 GILBERT ALGORDO - ACTIVE AI STOCK TRADER HUD (g.dev/gilbert_algordo)"
        
        table = Table(title="Portfolio & Asset Overview", show_header=True, header_style="bold magenta")
        table.add_column("Metric", style="cyan")
        table.add_column("Value", style="green")

        net_worth = self.cash + (self.position * market_data['price'])
        table.add_row("Target Ticker", self.ticker)
        table.add_row("Current Price", f"${market_data['price']:.2f}")
        table.add_row("Hourly Change", f"{market_data['price_change_pct']:.2f}%")
        table.add_row("Cash Balance", f"${self.cash:.2f}")
        table.add_row("Shares Held", str(self.position))
        table.add_row("Total Portfolio Value", f"${net_worth:.2f}")

        console.print(Panel(table, title=hud_title, border_style="blue"))
        console.print(Panel(ai_output, title="🤖 Active AI Reasoning", border_style="yellow"))
        console.print(Panel(action_log, title="⚡ Execution Status", border_style="green"))





