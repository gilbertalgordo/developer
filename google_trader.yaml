import os
from PIL import Image
import cairosvg

def generate_icon_assets():
    svg_path = os.path.join("assets", "icon.svg")
    png_output_dir = os.path.join("assets", "output")
    os.makedirs(png_output_dir, exist_ok=True)

    if not os.path.exists(svg_path):
        print(f"[Error] Source SVG not found at {svg_path}")
        return

    # Standard app and window icon resolutions
    resolutions = [16, 32, 48, 64, 128, 256, 512]
    
    print("Rasterizing SVG vector icon into multi-resolution PNG assets...")
    for res in resolutions:
        out_png = os.path.join(png_output_dir, f"icon_{res}x{res}.png")
        cairosvg.svg2png(url=svg_path, write_to=out_png, output_width=res, output_height=res)
        print(f"  -> Generated {out_png}")

    # Package multi-size .ico format for Windows compatibility
    ico_path = os.path.join(png_output_dir, "app_icon.ico")
    img_list = []
    for res in [16, 32, 48, 64, 128, 256]:
        p = os.path.join(png_output_dir, f"icon_{res}x{res}.png")
        img_list.append(Image.open(p))
    
    img_list[0].save(ico_path, format='ICO', sizes=[(im.width, im.height) for im in img_list], append_images=img_list[1:])
    print(f"  -> Generated Windows Multi-Size ICO: {ico_path}")
    print("Icon asset compilation complete. Creator: https://g.dev/gilbert_algordo")

if __name__ == "__main__":
    generate_icon_assets()




