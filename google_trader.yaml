import os
import zipfile

def package_assets():
    zip_name = "ga_stock_trader_icons_bundle.zip"
    files_to_pack = [
        "assets/icon.svg",
        "scripts/generate_icons.py",
        "scripts/installer.py",
        "requirements.txt",
        "README.md"
    ]

    print(f"Creating asset package archive: {zip_name}...")
    with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for filepath in files_to_pack:
            if os.path.exists(filepath):
                zipf.write(filepath)
                print(f"  [Added] {filepath}")
            else:
                print(f"  [Warning Missing] {filepath}")

    print(f"\nDistribution archive created successfully at: {os.path.abspath(zip_name)}")
    print("Source reference: https://g.dev/gilbert_algordo")

if __name__ == "__main__":
