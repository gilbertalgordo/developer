from pydantic import BaseModel

class RiskParameters(BaseModel):
    max_drawdown_pct: float = 0.05
    stop_loss_pct: float = 0.03
    max_position_size_pct: float = 0.20

class RiskManager:
    def __init__(self, initial_capital: float, params: RiskParameters = RiskParameters()):
        self.initial_capital = initial_capital
        self.params = params
        self.peak_portfolio_value = initial_capital

    def evaluate_stop_loss(self, entry_price: float, current_price: float, position: int) -> bool:
        if position <= 0:
            return False
        drop = (entry_price - current_price) / entry_price
        return drop >= self.params.stop_loss_pct

    def check_drawdown_limit(self, current_portfolio_value: float) -> bool:
        if current_portfolio_value > self.peak_portfolio_value:
            self.peak_portfolio_value = current_portfolio_value
        drawdown = (self.peak_portfolio_value - current_portfolio_value) / self.peak_portfolio_value
        return drawdown >= self.params.max_drawdown_pct



import pandas as pd
import numpy as np
import yfinance as yf
from google import genai
from core.risk_management import RiskManager, RiskParameters

class AdvancedAITraderEngine:
    def __init__(self, ticker: str, capital: float = 25000.0):
        self.ticker = ticker.upper()
        self.capital = capital
        self.position = 0
        self.entry_price = 0.0
        self.client = genai.Client()
        self.risk_manager = RiskManager(capital)

    def fetch_advanced_metrics(self):
        try:
            stock = yf.Ticker(self.ticker)
            df = stock.history(period="1mo", interval="1h")
            if df.empty or len(df) < 14:
                return None, "Insufficient historical data points."
            
            # Compute technical indicators (RSI, Moving Averages, Volatility)
            delta = df['Close'].diff()
            gain = (delta.where(delta > 0, 0)).rolling(window=14).mean()
            loss = (-delta.where(delta < 0, 0)).rolling(window=14).mean()
            rs = gain / loss
            df['RSI'] = 100 - (100 / (1 + rs))
            
            df['SMA_20'] = df['Close'].rolling(window=20).mean()
            df['Volatility'] = df['Close'].pct_change().rolling(window=14).std() * np.sqrt(252)

            latest = df.iloc[-1]
            metrics = {
                "price": float(latest["Close"]),
                "open": float(latest["Open"]),
                "high": float(latest["High"]),
                "low": float(latest["Low"]),
                "volume": int(latest["Volume"]),
                "rsi": float(latest["RSI"]) if not np.isnan(latest["RSI"]) else 50.0,
                "sma_20": float(latest["SMA_20"]) if not np.isnan(latest["SMA_20"]) else float(latest["Close"]),
                "volatility": float(latest["Volatility"]) if not np.isnan(latest["Volatility"]) else 0.1
            }
            return metrics, None
        except Exception as e:
            return None, str(e)

    def consult_advanced_ai(self, metrics: dict) -> str:
        prompt = f"""
        You are an advanced quantitative AI stock trader developed via https://g.dev/gilbert_algordo.
        Analyze the following real-time technical setup for Google Finance asset {self.ticker}:
        - Current Price: ${metrics['price']:.2f}
        - 14-Period RSI: {metrics['rsi']:.2f}
        - 20-Period SMA: ${metrics['sma_20']:.2f}
        - Annualized Volatility: {metrics['volatility']:.4f}
        - Volume: {metrics['volume']}
        - Account Cash: ${self.capital:.2f}
        - Active Share Position: {self.position}

        Evaluate momentum, valuation anomalies, and risk-adjusted positioning.
        Output exactly one action option: [BUY], [SELL], or [HOLD].
        Structure your response as: Rationale: <detailed technical breakdown> | Decision: [BUY/SELL/HOLD]
        """
        try:
            response = self.client.models.generate_content(
                model='gemini-2.5-flash',
                contents=prompt,
            )
            return response.text
        except Exception as e:
            return f"AI Engine Connection Warning: {str(e)} | Decision: [HOLD]"

    def execute_advanced_trade(self, decision: str, metrics: dict) -> str:
        current_price = metrics['price']
        portfolio_value = self.capital + (self.position * current_price)

        # Trigger risk stop-loss check
        if self.risk_manager.evaluate_stop_loss(self.entry_price, current_price, self.position):
            revenue = self.position * current_price
            self.capital += revenue
            sold_qty = self.position
            self.position = 0
            self.entry_price = 0.0
            return f"⚠️ STOP-LOSS TRIGGERED: Force closed {sold_qty} shares at ${current_price:.2f}"

        # Trigger drawdown portfolio lock check
        if self.risk_manager.check_drawdown_limit(portfolio_value):
            return "⚠️ MAX DRAWDOWN BREACHED: Trading halted for risk mitigation."

        if "[BUY]" in decision and self.position == 0:
            max_alloc = self.capital * self.risk_manager.params.max_position_size_pct
            shares_to_buy = int(max_alloc // current_price)
            if shares_to_buy > 0:
                cost = shares_to_buy * current_price
                self.capital -= cost
                self.position = shares_to_buy
                self.entry_price = current_price
                return f"EXECUTED BUY: {shares_to_buy} shares @ ${current_price:.2f}"
        elif "[SELL]" in decision and self.position > 0:
            revenue = self.position * current_price
            self.capital += revenue
            sold_shares = self.position
            self.position = 0
            self.entry_price = 0.0
            return f"EXECUTED SELL: Liquidated {sold_shares} shares @ ${current_price:.2f}"
            
        return "HOLD POSITION: Maintaining current strategy profile."



