from pydantic import BaseModel
from typing import List

class DreamEntry(BaseModel):
    date: str
    raw_text: str
    emotions: List[str]
    symbols: List[str]
    themes: List[str]



from langchain.chat_models import ChatOpenAI # Or open-source alternatives like Ollama/Llama-3
from langchain.prompts import ChatPromptTemplate

def interpret_dream(dream_text):
    prompt = ChatPromptTemplate.from_template("""
    Analyze the following dream from both a Jungian and Cognitive perspective: {dream_text}.
    1. List key symbols.
    2. Analyze the emotional tone.
    3. Suggest potential meanings based on universal archetypes.
    """)
    # Replace with your preferred open-source model endpoint
    llm = ChatOpenAI(model="llama3", base_url="http://localhost:11434/v1")
    return llm.invoke(prompt.format(dream_text=dream_text))



import networkx as nx
import matplotlib.pyplot as plt

def visualize_dream_network(dream_db):
    G = nx.Graph()
    for dream in dream_db:
        G.add_node(dream.date)
        for symbol in dream.symbols:
            G.add_edge(dream.date, symbol)
    
    nx.draw(G, with_labels=True)
    plt.show()



import chromadb
from datetime import datetime

class DreamMemory:
    def __init__(self):
        self.client = chromadb.PersistentClient(path="./dream_db")
        self.collection = self.client.get_or_create_collection("subconscious_trends")

    def store_dream(self, dream_id, embedding_vector, metadata):
        self.collection.add(
            ids=[str(dream_id)],
            embeddings=[embedding_vector],
            metadatas=[metadata]
        )

    def query_trends(self, current_dream_embedding):
        # Finds recurring motifs from the past 6 months
        return self.collection.query(
            query_embeddings=[current_dream_embedding],
            n_results=5
        )



