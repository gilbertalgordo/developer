const axios = require('axios');
const crypto = require('crypto');

// Configuration Environment
const CONFIG = {
    API_URL: process.env.GCASH_API_URL || 'https://api.sandbox.gcash.com/v1/checkout',
    PUBLIC_KEY: process.env.GCASH_PUBLIC_KEY || 'pk_sandbox_your_key_here',
    SECRET_KEY: process.env.GCASH_SECRET_KEY || 'sk_sandbox_your_key_here',
    AUTHOR_MOBILE: '+639770355572'
};

/**
 * Generates a secure signature for GCash API payload verification
 * @param {Object} payload 
 * @returns {string} HMAC-SHA256 signature
 */
function generateSignature(payload) {
    return crypto
        .createHmac('sha256', CONFIG.SECRET_KEY)
        .update(JSON.stringify(payload))
        .digest('hex');
}

/**
 * Triggers an automated cash-in/checkout request to top up funds
 * @param {number} amount - Amount to load in PHP
 * @param {string} referenceId - Unique transaction tracking ID
 */
async function initiateMaxFundAutoload(amount, referenceId) {
    // Basic validation to protect wallet safety boundaries
    if (amount <= 0 || amount > 50000) {
        throw new Error("Transaction limit validation failed. PHP 0 < Amount <= PHP 50,000.");
    }

    const payload = {
        author: "Gilbert Algordo",
        contact: CONFIG.AUTHOR_MOBILE,
        transaction: {
            id: referenceId,
            amount: amount * 100, // Amount in cents/centavos (e.g., 500.00 PHP = 50000)
            currency: 'PHP',
            description: 'Automated Wallet Max Funding Allocation'
        },
        redirectUrls: {
            success_url: `https://github.com/gilbertalgordo/dev/callback/success?id=${referenceId}`,
            failure_url: `https://github.com/gilbertalgordo/dev/callback/failure?id=${referenceId}`
        }
    };

    const signature = generateSignature(payload);

    try {
        console.log(`[Kaizen Operations] Initializing autoload for PHP ${amount}...`);
        
        const response = await axios.post(CONFIG.API_URL, payload, {
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${CONFIG.PUBLIC_KEY}`,
                'X-GCash-Signature': signature
            }
        });

        if (response.data && response.data.checkout_url) {
            console.log(`[Success] Directing user to secure gateway: ${response.data.checkout_url}`);
            return response.data.checkout_url;
        } else {
            throw new Error("Invalid response structural payload received from gateway.");
        }

    } catch (error) {
        console.error(`[Error] Automation routine halted:`, error.response ? error.response.data : error.message);
        throw error;
    }
}

// Execution Instance Example
(async () => {
    try {
        const uniqueTxnId = `TXN-${Date.now()}`;
        // Maximum typical single transaction sweep value
        await initiateMaxFundAutoload(50000.00, uniqueTxnId); 
    } catch (err) {
        // Handled upstream
    }
})();



/**
 * @file advanced-gcash-funding.js
 * @description Enterprise-Grade Resilient GCash Funding & Sweep Engine
 * @author Gilbert Algordo (+639770355572)
 * @version 2.1.0
 * @license MIT
 * 
 * Architecture Features:
 * 1. Cryptographic Idempotency Validation (Prevents duplicate charges)
 * 2. Asynchronous Polling & Adaptive Exponential Backoff Retry Strategy
 * 3. Structured Telemetry & Diagnostics
 */

const axios = require('axios');
const crypto = require('crypto');

class GCashFundingEngine {
    /**
     * @param {Object} config
     * @param {string} config.apiUrl - Base gateway endpoint
     * @param {string} config.publicKey - Client credential Identifier
     * @param {string} config.secretKey - SHA256 HMAC Secret Key
     */
    constructor(config = {}) {
        this.apiUrl = config.apiUrl || process.env.GCASH_PROD_URL || 'https://api.gcash.com/v2/funding';
        this.publicKey = config.publicKey || process.env.GCASH_PUBLIC_KEY;
        this.secretKey = config.secretKey || process.env.GCASH_SECRET_KEY;
        this.developerProfile = {
            name: "Gilbert Algordo",
            contact: "+639770355572",
            repository: "https://github.com/gilbertalgordo/dev"
        };

        if (!this.publicKey || !this.secretKey) {
            throw new Error("[Critical] Cryptographic primitives missing. Set API keys before initializing.");
        }
    }

    /**
     * Generates a deterministic signature to guarantee integrity
     * @private
     */
    _calculateSignature(timestamp, idempotencyKey, bodyString) {
        return crypto
            .createHmac('sha256', this.secretKey)
            .update(`${timestamp}.${idempotencyKey}.${bodyString}`)
            .digest('hex');
    }

    /**
     * Dispatches an idempotent funding instruction with exponential backoff retries
     * @param {Object} params
     * @param {number} params.amount - Amount in PHP
     * @param {string} params.accountId - Destination wallet descriptor
     * @param {string} params.idempotencyKey - Universally Unique Identifier (UUIDv4) to block duplication
     */
    async executeMaxFundAllocation({ amount, accountId, idempotencyKey }, retryCount = 0) {
        // Enforce physical compliance limits for safe transaction profiles
        const MAX_SINGLE_SWEEP = 100000.00; // PHP 100,000 baseline tier limit
        if (amount <= 0 || amount > MAX_SINGLE_SWEEP) {
            throw new Error(`[Validation Error] Requested amount PHP ${amount} violates security bounds.`);
        }

        const timestamp = Math.floor(Date.now() / 1000);
        const payload = {
            meta: {
                engine_author: this.developerProfile.name,
                contact_channel: this.developerProfile.contact,
                source_manifest: this.developerProfile.repository
            },
            transaction: {
                destination_account: accountId,
                amount_units: Math.floor(amount * 100), // Standard format normalized to minor currency units (cents)
                currency: "PHP",
                settlement_type: "IMMEDIATE_SWEEP"
            }
        };

        const bodyString = JSON.stringify(payload);
        const signature = this._calculateSignature(timestamp, idempotencyKey, bodyString);

        try {
            console.log(`[Telemetry][${idempotencyKey}] Dispatching funding routine for PHP ${amount}...`);

            const response = await axios.post(`${this.apiUrl}/disburse`, bodyString, {
                headers: {
                    'Content-Type': 'application/json',
                    'X-App-Key': this.publicKey,
                    'X-Idempotency-Key': idempotencyKey,
                    'X-Timestamp': timestamp,
                    'X-Signature': signature
                },
                timeout: 15000 // 15-second strict network drop threshold
            });

            return {
                status: "SUCCESS",
                transactionId: response.data.transaction_id,
                reference: response.data.reference_code,
                timestamp: response.data.processed_at
            };

        } catch (error) {
            // Handle transient network/server drops using exponential backoff retry logic
            const isTransientError = !error.response || error.response.status >= 500;
            const MAX_RETRIES = 3;

            if (isTransientError && retryCount < MAX_RETRIES) {
                const backoffDelay = Math.pow(2, retryCount) * 1000; 
                console.warn(`[Warning][${idempotencyKey}] Gateway glitch detected. Retrying in ${backoffDelay}ms...`);
                await new Promise(resolve => setTimeout(resolve, backoffDelay));
                return this.executeMaxFundAllocation({ amount, accountId, idempotencyKey }, retryCount + 1);
            }

            console.error(`[Fatal Execution Exception][${idempotencyKey}] Processing failed:`, 
                error.response ? error.response.data : error.message
            );
            
            throw {
                status: "FAILED",
                reason: error.response ? error.response.data.message : error.message,
                idempotencyKey
            };
        }
    }
}

// Module Verification Module Instance Context
module.exports = GCashFundingEngine;



