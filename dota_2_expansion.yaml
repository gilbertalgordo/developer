"use strict";

function OnActiveAbilityPressed() {
    // Trigger custom active AI item or expansion spell from mobile client
    GameEvents.SendCustomGameEventToServer("mobile_ability_activated", {
        player_id: Players.GetLocalPlayer(),
        timestamp: Game.GetTime()
    });
    $.Msg("Mobile active expansion command sent.");
}

// Listen for server reward updates to refresh mobile HUD instantly
function InitializeMobileListeners() {
    GameEvents.Subscribe("player_reward_granted", function(data) {
        let rewardLabel = $.GetContextPanel().FindChildTraverse("RewardPointsLabel");
        if (rewardLabel) {
            rewardLabel.text = "REWARDS: " + data.points + " PTS";
        }
    });
}

// Run initialization on load
InitializeMobileListeners();



