import { registerModifier, BaseModifier } from "./lib/dota_ts_adapter";

export class ExpansionAIController {
    public static InitializeAIUnit(unit: CDOTA_BaseNPC): void {
        unit.SetContextThink("AIThinkLoop", () => {
            if (!unit.IsAlive()) return nil;
            
            // Execute Active AI behavior: Scan for targets within 800 range
            const enemies = FindUnitsInRadius(
                unit.GetTeamNumber(),
                unit.GetAbsOrigin(),
                undefined,
                800,
                DOTA_UNIT_TARGET_TEAM.DOTA_UNIT_TARGET_TEAM_ENEMY,
                DOTA_UNIT_TARGET_TYPE.DOTA_UNIT_TARGET_HERO | DOTA_UNIT_TARGET_TYPE.DOTA_UNIT_TARGET_BASIC,
                DOTA_UNIT_TARGET_FLAGS.DOTA_UNIT_TARGET_FLAG_NONE,
                FindOrder.FIND_CLOSEST,
                false
            );

            if (enemies.length > 0) {
                // Engage target aggressively with tactical movement
                const target = enemies[0];
                ExecuteOrderFromTable({
                    UnitIndex: unit.GetEntityIndex(),
                    OrderType: dotaunitorder_t.DOTA_UNIT_ORDER_ATTACK_TARGET,
                    TargetIndex: target.GetEntityIndex()
                });
            }

            return 1.0; // Refresh think loop every 1 second
        }, 0.5);
    }
}




import { registerAbility, registerModifier, BaseAbility, BaseModifier } from "./lib/dota_ts_adapter";

@registerAbility("item_expansion_quantum_blade")
export class item_expansion_quantum_blade extends BaseAbility {
    OnSpellStart() {
        const caster = this.GetCaster();
        const duration = 5.0;

        // Apply visual upgrade particle effect
        const pfx = ParticleManager:CreateParticle(
            "particles/units/heroes/hero_juggernaut/jugg_crit_blur.vpcf",
            ParticleAttachment.PATTACH_ABSORIGIN_FOLLOW,
            caster
        );
        ParticleManager:SetParticleControl(pfx, 0, caster.GetAbsOrigin());

        // Apply stat buff modifier
        caster.AddNewModifier(caster, this, "modifier_quantum_blade_active", { duration: duration });
        EmitSoundOn("DOTA_Item.DiffusalBlade.Activate", caster);
    }
}

@registerModifier()
export class modifier_quantum_blade_active extends BaseModifier {
    DeclareFunctions() {
        return [
            modifierfunction.MODIFIER_PROPERTY_ATTACKSPEED_BONUS_CONSTANT,
            modifierfunction.MODIFIER_PROPERTY_MOVESPEED_BONUS_PERCENTAGE
        ];
    }
    GetModifierAttackSpeedBonusConstant() { return 75; }
    GetModifierMoveSpeedBonusPercentage() { return 15; }
}



