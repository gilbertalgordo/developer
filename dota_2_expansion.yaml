// Addon Game Mode Initialization
import { Logger } from "./logger";

const log = new Logger("GameMode");

class GameMode {
    public static Init(): GameMode {
        const instance = new GameMode();
        instance.RegisterServerEvents();
        return instance;
    }

    private RegisterServerEvents(): void {
        // Hook game events for rewards and tracking
        ListenToGameEvent("entity_killed", (keys) => this.OnEntityKilled(keys), this);
        log.Info("Active AI Dota 2 Expansion GameMode Initialized.");
    }

    private OnEntityKilled(keys:reszt.EntityKilledEvent): void {
        const killedUnit = EntIndexToHScript(keys.entindex_killed) as CDOTA_BaseNPC;
        const killerUnit = EntIndexToHScript(keys.entindex_attacker) as CDOTA_BaseNPC;

        if (killerUnit && killerUnit.IsRealHero() && killedUnit.IsNeutralUnitType()) {
            // Trigger custom reward / currency loop
            this.GrantMatchReward(killerUnit, 50);
        }
    }

    private GrantMatchReward(hero: CDOTA_BaseNPC, amount: number): void {
        const playerID = hero.GetPlayerID();
        // Send custom event to Panorama HUD to display reward points
        CustomGameEventManager.Send_ServerToPlayer(
            PlayerResource.GetPlayer(playerID),
            "player_reward_granted",
            { points: amount }
        );
    }
}

// Start Game
GameMode.Init();




