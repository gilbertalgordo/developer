function OnPlasmaCoreActivated(keys)
    local caster = keys.caster
    local duration = 6.0

    -- Apply active particle upgrade visual effect
    local particleName = "particles/items2_fx/orchid_pop.vpcf"
    local pfx = ParticleManager:CreateParticle(particleName, PATTACH_ABSORIGIN_FOLLOW, caster)
    ParticleManager:SetParticleControl(pfx, 0, caster:GetAbsOrigin())
    
    -- Grant temporary attack damage & movement speed boost (Kaizen loop optimization metric)
    caster:AddNewModifier(caster, keys.ability, "modifier_plasma_core_active", {duration = duration})
    
    EmitSoundOn("DOTA_Item.BKB.Activate", caster)
end




