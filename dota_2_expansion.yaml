export class MobileRewardsManager {
    private static playerPoints: Map<number, number> = new Map();

    public static Initialize(): void {
        CustomGameEventManager.RegisterListener("mobile_ability_activated", (userId, event) => {
            const playerID = event.player_id;
            MobileRewardsManager.AddPoints(playerID, 10);
        });
    }

    private static AddPoints(playerID: PlayerID, amount: number): void {
        let current = this.playerPoints.get(playerID) || 0;
        current += amount;
        this.playerPoints.set(playerID, current);

        // Push real-time update back to mobile client HUD
        CustomGameEventManager.Send_ServerToPlayer(
            PlayerResource.GetPlayer(playerID),
            "player_reward_granted",
            { points: current }
        );
    }
}
