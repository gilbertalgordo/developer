    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
    ctx.shadowBlur = 16;
    ctx.strokeStyle = rainbowGlow;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(242, 252, 316, 5, 2.5);
    ctx.stroke();
    ctx.restore();

    // 4. Lower Red PCB Motherboard Layer
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(260, 305, 280, 65, 10);
    ctx.fillStyle = '#8a0303';
    ctx.fill();
    ctx.strokeStyle = '#ff3b30';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Apple M5 Silicon Die
    ctx.fillStyle = '#08080a';
    ctx.fillRect(360, 318, 48, 42);
    ctx.strokeStyle = '#ffd700'; // Gold contact boundary
    ctx.lineWidth = 1.5;
    ctx.strokeRect(360, 318, 48, 42);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('M5', 376, 343);

    // BLE Mesh Microchip
    ctx.fillStyle = '#121218';
    ctx.fillRect(428, 328, 22, 14);
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 1;
    ctx.strokeRect(428, 328, 22, 14);

    // Hydrophobic Protective Coating (Transparent sheen overlay)
    ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
    ctx.fill();
    ctx.restore();

    // 5. Multicolor Glowing Apple Emblem (Top Plate)
    ctx.save();
    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
    ctx.shadowBlur = 14;
    ctx.fillStyle = rainbowGlow;

    ctx.beginPath();
    ctx.arc(400, 276, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 6. Rear Panel Extra I/O Indicators (HDMI & USB-C array)
    ctx.save();
    ctx.fillStyle = '#050505';
    for (let x = 270; x <= 330; x += 12) {
      ctx.fillRect(x, 372, 6, 4); // USB-C / Thunderbolt
    }
    ctx.fillRect(500, 370, 14, 6); // HDMI 1
    ctx.fillRect(520, 370, 14, 6); // HDMI 2
    ctx.restore();

    requestAnimationFrame(drawRender);
  }

  requestAnimationFrame(drawRender);
</script>
</body>
</html>
