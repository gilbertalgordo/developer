<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mac Mini M5 Concept Rendering</title>
  <style>
    body {
      margin: 0;
      background-color: #050508;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    canvas {
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(0,240,255,0.2);
    }
  </style>
</head>
<body>

<canvas id="renderCanvas" width="800" height="600"></canvas>

<script>
  const canvas = document.getElementById('renderCanvas');
  const ctx = canvas.getContext('2d');

  function drawScene(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background Gradient
    const bgGrad = ctx.createRadialGradient(400, 300, 50, 400, 300, 450);
    bgGrad.addColorStop(0, '#101018');
    bgGrad.addColorStop(1, '#020204');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 800, 600);

    // 1. Holographic Beam Projection (Top)
    ctx.save();
    const holoGrad = ctx.createLinearGradient(400, 260, 400, 50);
    holoGrad.addColorStop(0, 'rgba(0, 240, 255, 0.4)');
    holoGrad.addColorStop(1, 'rgba(160, 0, 255, 0.0)');
    
    ctx.beginPath();
    ctx.moveTo(310, 260);
    ctx.lineTo(490, 260);
    ctx.lineTo(580, 60);
    ctx.lineTo(220, 60);
    ctx.closePath();
    ctx.fillStyle = holoGrad;
    ctx.fill();

    // Scanlines on Hologram
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 1.5;
    for (let y = 80; y < 250; y += 20) {
      const offset = Math.sin(t * 0.005 + y) * 5;
      ctx.beginPath();
      ctx.ellipse(400 + offset, y, 80 + (260 - y) * 0.8, 12, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    // 2. Carbon Fiber Chassis Body
    ctx.save();
    ctx.fillStyle = '#121215';
    ctx.strokeStyle = '#2a2a35';
    ctx.lineWidth = 2;
    
    // Main Block
    ctx.beginPath();
    ctx.roundRect(250, 260, 300, 140, 24);
    ctx.fill();
    ctx.stroke();

    // Carbon Pattern Overlay
    ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
    for (let i = 250; i < 550; i += 8) {
      for (let j = 260; j < 400; j += 8) {
        if ((i + j) % 16 === 0) ctx.fillRect(i, j, 4, 4);
      }
    }

    // 3. Glowing LED Top Border Band (Rainbow Cycling)
    const rainbow = ctx.createLinearGradient(250, 0, 550, 0);
    const hueShift = (t * 0.05) % 360;
    rainbow.addColorStop(0, `hsl(${hueShift}, 100%, 50%)`);
    rainbow.addColorStop(0.33, `hsl(${(hueShift + 120) % 360}, 100%, 50%)`);
    rainbow.addColorStop(0.66, `hsl(${(hueShift + 240) % 360}, 100%, 50%)`);
    rainbow.addColorStop(1, `hsl(${hueShift}, 100%, 50%)`);

    ctx.shadowColor = `hsl(${hueShift}, 100%, 50%)`;
    ctx.shadowBlur = 15;
    ctx.strokeStyle = rainbow;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(252, 262, 296, 6, 3);
    ctx.stroke();
    ctx.restore();

    // 4. Red Motherboard Window (Visible Lower Section)
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(270, 310, 260, 75, 12);
    ctx.fillStyle = '#8a0303'; // Red PCB
    ctx.fill();
    ctx.strokeStyle = '#ff3b30';
    ctx.lineWidth = 1;
    ctx.stroke();

    // M5 Apple Silicon Die
    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(360, 330, 45, 45);
    ctx.strokeStyle = '#ffe600'; // Gold Contacts
    ctx.strokeRect(360, 330, 45, 45);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('M5', 374, 357);

    // BLE Chip
    ctx.fillStyle = '#121216';
    ctx.fillRect(425, 340, 20, 14);
    ctx.strokeStyle = '#00f0ff';
    ctx.strokeRect(425, 340, 20, 14);

    // Invisible Waterproofing Sheen (Transparent Blue Coating)
    ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
    ctx.fill();
    ctx.restore();

    // 5. Glowing Rainbow Apple Logo (Top Center)
    ctx.save();
    ctx.shadowColor = `hsl(${hueShift}, 100%, 60%)`;
    ctx.shadowBlur = 12;
    ctx.fillStyle = rainbow;
    
    ctx.beginPath();
    ctx.arc(400, 285, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    requestAnimationFrame(drawScene);
  }

  requestAnimationFrame(drawScene);
</script>
</body>
</html>



