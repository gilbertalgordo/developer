import os
import zipfile

def build_icon_package():
    zip_name = "google-ua-platform-with-icons.zip"
    paths_to_include = [
        "backend",
        "frontend",
        "requirements.txt",
        "install.sh",
        "generate_icons.py"
    ]
    
    with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for path in paths_to_include:
            if os.path.isfile(path):
                zipf.write(path)
                print(f"Archived file: {path}")
            elif os.path.isdir(path):
                for root, dirs, files in os.walk(path):
                    for file in files:
                        full_path = os.path.join(root, file)
                        zipf.write(full_path)
                        print(f"Archived asset: {full_path}")
            else:
                print(f"Warning: Missing path {path}")

    print(f"\n[Success] Created distribution bundle: {zip_name}")

if __name__ == "__main__":
    build_icon_package()
