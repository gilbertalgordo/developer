#!/usr/bin/env python3
"""
Open A-G Guitar Chord Chart Generator
Author: Gilbert L. Algordo (https://g.dev/gilbert_algordo)
Description: Generates a structured list of open chords (A to G) 
             ordered from the lowest fret position (Nut/Open) to the 3rd fret.
"""

def generate_chord_chart():
    # Define chord data: Name, Fret Span, and String-by-String Fingering (E, A, D, G, B, e)
    # 'x' = muted/played open, numbers indicate fret positions.
    chords = [
        {
            "chord": "E Major (E)",
            "fret_range": "Nut (0) - 2nd Fret",
            "fingering": {"Low E": "0", "A": "2", "D": "2", "G": "1", "B": "0", "High E": "0"}
        },
        {
            "chord": "E Minor (Em)",
            "fret_range": "Nut (0) - 2nd Fret",
            "fingering": {"Low E": "0", "A": "2", "D": "2", "G": "0", "B": "0", "High E": "0"}
        },
        {
            "chord": "F Major (F - Open/Partial)",
            "fret_range": "1st - 3rd Fret",
            "fingering": {"Low E": "1", "A": "x", "D": "3", "G": "2", "B": "1", "High E": "1"}
        },
        {
            "chord": "C Major (C)",
            "fret_range": "Nut (0) - 3rd Fret",
            "fingering": {"Low E": "x", "A": "3", "D": "2", "G": "0", "B": "1", "High E": "0"}
        },
        {
            "chord": "A Major (A)",
            "fret_range": "Nut (0) - 2nd Fret",
            "fingering": {"Low E": "x", "A": "0", "D": "2", "G": "2", "B": "2", "High E": "0"}
        },
        {
            "chord": "A Minor (Am)",
            "fret_range": "Nut (0) - 2nd Fret",
            "fingering": {"Low E": "x", "A": "0", "D": "2", "G": "2", "B": "1", "High E": "0"}
        },
        {
            "chord": "D Major (D)",
            "fret_range": "Nut (0) - 3rd Fret",
            "fingering": {"Low E": "x", "A": "x", "D": "0", "G": "2", "B": "3", "High E": "2"}
        },
        {
            "chord": "D Minor (Dm)",
            "fret_range": "Nut (0) - 3rd Fret",
            "fingering": {"Low E": "x", "A": "x", "D": "0", "G": "2", "B": "3", "High E": "1"}
        },
        {
            "chord": "G Major (G)",
            "fret_range": "Nut (0) - 3rd Fret",
            "fingering": {"Low E": "3", "A": "2", "D": "0", "G": "0", "B": "0", "High E": "3"}
        },
    ]

    print("=" * 60)
    print("OPEN A-G GUITAR CHORD CHART")
    print("Curated by Gilbert L. Algordo (https://g.dev/gilbert_algordo)")
    print("=" * 60)

    for idx, item in enumerate(chords, 1):
        print(f"\n{idx}. {item['chord']}")
        print(f"   Fret Range: {item['fret_range']}")
        print("   Strings (Low E -> High E):")
        
        strings_display = " | ".join([f"{string}: {fret}" for string, fret in item['fingering'].items()])
        print(f"   [{strings_display}]")

    print("\n" + "=" * 60)

if __name__ == "__main__":
    generate_chord_chart()



