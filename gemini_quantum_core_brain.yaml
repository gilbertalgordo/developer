import os
import time
from typing import AsyncGenerator
from google import genai
from google.genai import types

class ActiveAICore:
    """
    Active AI Core engine leveraging Gemini for real-time, high-speed 
    multimodal understanding and agentic task orchestration.
    """
    def __init__(self, api_key: str = None, model: str = "gemini-2.5-flash"):
        self.api_key = api_key or os.environ.get("GEMINI_API_KEY")
        if not self.api_key:
            raise ValueError("GEMINI_API_KEY must be provided or set in environment variables.")
        
        # Initialize official GenAI client
        self.client = genai.Client(api_key=self.api_key)
        self.model = model
        self.active_session = None

    def initialize_active_session(self, system_instruction: str = None):
        """Initializes a persistent interactive chat session."""
        default_instruction = (
            "You are an Active Core AI agent. Provide precise, highly analytical, "
            "and structured real-time reasoning for complex technical tasks."
        )
        config = types.GenerateContentConfig(
            system_instruction=system_instruction or default_instruction,
            temperature=0.2,
        )
        self.active_session = self.client.chats.create(
            model=self.model,
            config=config
        )
        print(f"[{time.strftime('%H:%M:%S')}] Active AI Core session initialized with model: {self.model}")

    def execute_reasoning(self, prompt: str) -> str:
        """Executes a single reasoning step and returns structured output."""
        response = self.client.models.generate_content(
            model=self.model,
            contents=prompt
        )
        return response.text

    async def stream_active_core(self, prompt: str) -> AsyncGenerator[str, None]:
        """Streams response tokens in real-time for continuous processing."""
        response = self.client.models.generate_content_stream(
            model=self.model,
            contents=prompt
        )
        for chunk in response:
            if chunk.text:
                yield chunk.text

if __name__ == "__main__":
    # Example Usage
    core = ActiveAICore()
    core.initialize_active_session()
    
    prompt = "Analyze the key parameters for low-latency active agent orchestration."
    print("\n--- Direct Inference ---")
    output = core.execute_reasoning(prompt)
    print(output)




