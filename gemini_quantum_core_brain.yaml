from PIL import Image, ImageDraw, ImageFilter

def create_quantum_brain_icon(size: int = 512, output_path: str = "quantum_ai_core.png"):
    """
    Generates a high-definition, glowing Quantum Core AI Brain icon image.
    """
    # Base Image canvas with deep blue/black background
    img = Image.new("RGBA", (size, size), (2, 7, 18, 255))
    draw = ImageDraw.Draw(img)
    center = size // 2

    # Layer 1: Ambient Glow Effect
    glow_canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
    glow_draw = ImageDraw.Draw(glow_canvas)
    
    for r in range(160, 20, -10):
        alpha = int(255 * (1 - (r / 160)) * 0.25)
        glow_draw.ellipse(
            [center - r, center - r, center + r, center + r],
            fill=(0, 243, 255, alpha)
        )
    glow_canvas = glow_canvas.filter(ImageFilter.GaussianBlur(15))
    img.paste(glow_canvas, (0, 0), glow_canvas)

    # Layer 2: HUD Orbital Rings
    # Outer dashed HUD ring
    draw.arc([center - 200, center - 200, center + 200, center + 200], start=0, end=270, fill=(0, 243, 255, 180), width=3)
    draw.arc([center - 200, center - 200, center + 200, center + 200], start=285, end=340, fill=(176, 0, 255, 220), width=3)
    
    # Inner Tech ring
    draw.ellipse([center - 150, center - 150, center + 150, center + 150], outline=(0, 243, 255, 80), width=2)

    # Layer 3: Central Brain Circuit Schematic
    nodes = [
        (center, center - 90),
        (center - 85, center - 10),
        (center + 85, center - 10),
        (center - 55, center + 75),
        (center + 55, center + 75),
        (center, center + 110)
    ]

    # Draw Circuit Connectivity
    for i in range(len(nodes)):
        for j in range(i + 1, len(nodes)):
            draw.line([nodes[i], nodes[j]], fill=(0, 243, 255, 100), width=2)

    # Layer 4: Node Highlights & Core Nucleus
    for x, y in nodes:
        draw.ellipse([x - 7, y - 7, x + 7, y + 7], fill=(255, 255, 255, 255), outline=(0, 243, 255, 255), width=2)

    # Glowing Core Center
    draw.ellipse([center - 22, center - 22, center + 22, center + 22], fill=(255, 255, 255, 255))
    draw.ellipse([center - 32, center - 32, center + 32, center + 32], outline=(0, 243, 255, 255), width=3)

    # Save output
    img.save(output_path, "PNG")
    print(f"Quantum Core Icon generated successfully: {output_path}")

if __name__ == "__main__":
    create_quantum_brain_icon()
