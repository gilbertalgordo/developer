import time
from datetime import datetime, timedelta

class AIMonitor:
    def __init__(self, daily_limit: int):
        self.daily_limit = daily_limit
        self.usage_count = 0
        self.last_reset = datetime.now().date()

    def _check_reset(self):
        """Kaizen check: Reset counter if a new day has arrived."""
        today = datetime.now().date()
        if today > self.last_reset:
            self.usage_count = 0
            self.last_reset = today

    def can_proceed(self) -> bool:
        self._check_reset()
        return self.usage_count < self.daily_limit

    def increment(self):
        if self.can_proceed():
            self.usage_count += 1
        else:
            raise PermissionError("Daily AI limit exceeded. System restricted.")

# Implementation Example
monitor = AIMonitor(daily_limit=100)

def ai_request_wrapper(func):
    def wrapper(*args, **kwargs):
        if monitor.can_proceed():
            monitor.increment()
            return func(*args, **kwargs)
        else:
            return {"error": "Limit exceeded", "retry_at": "Tomorrow"}
    return wrapper

