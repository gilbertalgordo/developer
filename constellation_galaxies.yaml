import torch
from diffusers import StableDiffusionXLPipeline, EulerDiscreteScheduler

def generate_galaxy_constellation(output_path="galaxy_constellation.png"):
    # 1. Define a high-precision, scientifically descriptive prompt
    prompt = (
        "A breathtaking deep space photograph of a massive constellation of galaxies. "
        "Intricate cosmic web connecting vibrant spiral galaxies, glowing elliptical galaxies, "
        "and stellar nurseries. Detailed dust lanes, brilliant core glow, gravitational lensing effects, "
        "and sharp distant stars. Hyper-realistic, 8k resolution, astronomical photography style, "
        "highly detailed, scientific accuracy, deep contrast."
    )
    
    negative_prompt = (
        "blurry, low quality, distorted, watermark, signature, text, artifact, "
        "oversaturated, abstract, cartoon, 3d render"
    )

    # 2. Set up the open-source SDXL model
    model_id = "stabilityai/stable-diffusion-xl-base-1.0"
    
    print("Loading model components...")
    scheduler = EulerDiscreteScheduler.from_pretrained(model_id, subfolder="scheduler")
    pipe = StableDiffusionXLPipeline.from_pretrained(
        model_id, 
        scheduler=scheduler, 
        torch_dtype=torch.float16, 
        variant="fp16"
    )
    
    # Move pipeline to GPU for rapid generation
    pipe = pipe.to("cuda")
    
    # Optional: Enable memory optimizations if running on limited VRAM
    pipe.enable_attention_slicing()

    print("Generating image... This may take a moment depending on your GPU.")
    # 3. Run inference
    image = pipe(
        prompt=prompt,
        negative_prompt=negative_prompt,
        num_inference_steps=40,  # Balanced for quality and speed
        guidance_scale=7.5,       # Adherence to the prompt
        width=1024,
        height=1024
    ).images[0]

    # 4. Save the generated asset
    image.save(output_path)
    print(file_saved_msg := f"Success! Image saved to {output_path}")

if __name__ == "__main__":
    # Ensure CUDA is available for PyTorch execution
    if torch.cuda.is_available():
        generate_galaxy_constellation()
    else:
        print("Error: CUDA-compatible GPU is required for this script to run efficiently.")



