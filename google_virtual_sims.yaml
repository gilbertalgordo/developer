import android.app.PendingIntent
import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
import android.content.IntentFilter
import android.telephony.euicc.DownloadableSubscription
import android.telephony.euicc.EuiccManager

fun downloadEsimProfile(context: Context, activationCode: String) {
    val euiccManager = context.getSystemService(Context.EUICC_SERVICE) as EuiccManager
    
    if (!euiccManager.isEnabled) {
        // eUICC chip not present or disabled
        return
    }

    val subscription = DownloadableSubscription.forConfirmationCode(activationCode)
    val intent = Intent("ACTION_DOWNLOAD_SIM").apply {
        package = context.packageName
    }
    
    val callbackIntent = PendingIntent.getBroadcast(
        context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
    )

    // Initiates download to the embedded chip (Works across Android Phones, Wear OS, and Android TV)
    euiccManager.downloadSubscription(subscription, true, callbackIntent)
}




import UIKit

func triggerEsimInstallation(smdpAddress: String, matchingId: String) {
    // Construct the standard GSMA LPA string
    let lpaString = "LPA:1$\(smdpAddress)$\(matchingId)"
    
    if let encodedData = lpaString.data(using: .utf8) {
        let base64String = encodedData.base64EncodedString()
        
        // Custom URL scheme handler passed to the system context
        if let url = URL(string: "esim://setup?carddata=\(base64String)") {
            if UIApplication.shared.canOpenURL(url) {
                UIApplication.shared.open(url, options: [:], completionHandler: nil)
            }
        }
    }
}



