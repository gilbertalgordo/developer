import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

// GPU-Accelerated HUD Shader Program
const HUDVertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const HUDFragmentShader = `
  varying vec2 vUv;
  uniform float uTime;
  
  void main() {
    vec2 uv = vUv * 2.0 - 1.0;
    float dist = length(uv);
    
    // Procedural target vector rings
    float ring1 = smoothstep(0.68, 0.70, dist) - smoothstep(0.72, 0.74, dist);
    float ring2 = smoothstep(0.40, 0.41, dist) - smoothstep(0.42, 0.43, dist);
    
    // Sensor sweep animation logic
    float angle = atan(uv.y, uv.x);
    float sweep = smoothstep(0.0, 1.0, sin(angle - uTime * 4.0)) * 0.4;
    
    vec3 hudColor = vec3(0.0, 1.0, 0.8) * (ring1 + ring2 + sweep * (1.0 - smoothstep(0.75, 0.8, dist)));
    float alpha = ring1 + ring2 + (sweep * step(dist, 0.75));
    
    gl_FragColor = vec4(hudColor, alpha * 0.85);
  }
`;

class HoverVehicleSimulation {
  constructor() {
    this.container = document.createElement('div');
    this.container.style.width = '100vw';
    this.container.style.height = '100vh';
    document.body.appendChild(this.container);

    // Physics Engine State Variables
    this.physics = {
      altitude: 0.55,
      targetAltitude: 0.55,
      velocity: 0.0,
      kSpring: 12.0,  // Suspension Stiffness Constant
      cDamper: 3.2   // Shock Absorb Dampening Constant
    };

    this.clock = new THREE.Clock();
    this.initCorePipeline();
    this.assembleVehicleGraph();
    this.buildEnvironment();
    this.executeLoop();

    window.addEventListener('resize', () => this.handleResize());
  }

  initCorePipeline() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x040408);
    this.scene.fog = new THREE.FogExp2(0x040408, 0.06);

    this.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.camera.position.set(4, 2.5, 5);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.maxPolarAngle = Math.PI / 2 - 0.02; 
  }

  assembleVehicleGraph() {
    this.vehicleRoot = new THREE.Group();
    this.scene.add(this.vehicleRoot);

    // Physically-Based Rendering Material Presets
    const carbonHullMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.15, metalness: 0.95 });
    const kartFrameMat = new THREE.MeshStandardMaterial({ color: 0xff3b00, roughness: 0.25, metalness: 0.7 });
    const metallicEngineMat = new THREE.MeshStandardMaterial({ color: 0x2d3033, roughness: 0.35, metalness: 0.9 });
    const thrusterGlowMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

    // 1. Aerodynamic Jet-Ski Monocoque Hull Structure
    const hullGeometry = new THREE.ConeGeometry(0.5, 2.4, 4);
    hullGeometry.rotateX(Math.PI / 2);
    const hullMesh = new THREE.Mesh(hullGeometry, carbonHullMat);
    hullMesh.position.set(0, 0.3, -0.3);
    hullMesh.scale.set(1, 0.65, 1);
    hullMesh.castShadow = true;
    this.vehicleRoot.add(hullMesh);

    // 2. Wide-Stance Tubular Go-Kart Chassis Frame
    const perimeterChassisGeo = new THREE.BoxGeometry(1.6, 0.08, 2.2);
    const perimeterChassis = new THREE.Mesh(perimeterChassisGeo, kartFrameMat);
    perimeterChassis.position.set(0, 0.12, 0.3);
    perimeterChassis.castShadow = true;
    this.vehicleRoot.add(perimeterChassis);

    // Exposed roll cage overlay styling
    const structureCageGeo = new THREE.BoxGeometry(1.25, 0.95, 1.3);
    const structureCage = new THREE.Mesh(structureCageGeo, new THREE.MeshStandardMaterial({ color: 0xff3b00, wireframe: true }));
    structureCage.position.set(0, 0.6, 0.5);
    this.vehicleRoot.add(structureCage);

    // 3. Quad Suspension Corner Repulsor Modules
    const anchorOffsets = [
      [-0.9, 0.02, -0.6], [0.9, 0.02, -0.6], // Front Track Width
      [-0.9, 0.02, 1.0],  [0.9, 0.02, 1.0]   // Rear Track Width
    ];

    anchorOffsets.forEach(([x, y, z]) => {
      const moduleGroup = new THREE.Group();
      moduleGroup.position.set(x, y, z);

      const casingGeo = new THREE.CylinderGeometry(0.26, 0.2, 0.25, 16);
      const casingMesh = new THREE.Mesh(casingGeo, metallicEngineMat);
      casingMesh.castShadow = true;
      moduleGroup.add(casingMesh);

      const dischargeCoreGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.04, 16);
      const dischargeCore = new THREE.Mesh(dischargeCoreGeo, thrusterGlowMat);
      dischargeCore.position.y = -0.13;
      moduleGroup.add(dischargeCore);

      this.vehicleRoot.add(moduleGroup);
    });

    // 4. Rear In-Line Turbojet System
    const exhaustGeo = new THREE.CylinderGeometry(0.18, 0.28, 0.6, 16);
    exhaustGeo.rotateX(Math.PI / 2);
    const exhaustMesh = new THREE.Mesh(exhaustGeo, metallicEngineMat);
    exhaustMesh.position.set(0, 0.3, 1.4);
    exhaustMesh.castShadow = true;
    this.vehicleRoot.add(exhaustMesh);

    // 5. HUD Pipeline Integration
    this.hudUniforms = { uTime: { value: 0.0 } };
    const hudGeometry = new THREE.PlaneGeometry(1.2, 1.2);
    const hudMaterial = new THREE.ShaderMaterial({
      vertexShader: HUDVertexShader,
      fragmentShader: HUDFragmentShader,
      uniforms: this.hudUniforms,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    this.hudMesh = new THREE.Mesh(hudGeometry, hudMaterial);
    this.hudMesh.position.set(0, 1.25, -1.8);
    this.hudMesh.rotation.x = -0.06;
    this.vehicleRoot.add(this.hudMesh);
  }

  buildEnvironment() {
    const ambientLight = new THREE.AmbientLight(0x0b0c16, 0.6);
    this.scene.add(ambientLight);

    const solarLight = new THREE.DirectionalLight(0xffffff, 1.4);
    solarLight.position.set(12, 24, 12);
    solarLight.castShadow = true;
    solarLight.shadow.mapSize.width = 2048;
    solarLight.shadow.mapSize.height = 2048;
    this.scene.add(solarLight);

    const groundGrid = new THREE.GridHelper(50, 50, 0xff3b00, 0x1a1c2e);
    groundGrid.position.y = 0;
    this.scene.add(groundGrid);

    const shadowPlaneGeo = new THREE.PlaneGeometry(80, 80);
    const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.45 });
    const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.receiveShadow = true;
    this.scene.add(shadowPlane);
  }

  executeLoop() {
    requestAnimationFrame(() => this.executeLoop());

    const dt = Math.min(this.clock.getDelta(), 0.1);
    const time = this.clock.getElapsedTime();

    // Semi-Analytical Spring-Damper Suspension Differential Evaluation
    const undulatingTarget = this.physics.targetAltitude + Math.sin(time * 1.2) * 0.06;
    const currentError = this.physics.altitude - undulatingTarget;
    
    const restoringForce = -this.physics.kSpring * currentError;
    const dampingForce = -this.physics.cDamper * this.physics.velocity;
    const aggregateAcceleration = restoringForce + dampingForce;

    this.physics.velocity += aggregateAcceleration * dt;
    this.physics.altitude += this.physics.velocity * dt;

    // Flush spatial matrices
    this.vehicleRoot.position.y = this.physics.altitude;
    this.vehicleRoot.rotation.z = Math.sin(time * 2.0) * 0.02; // Kinematic roll/banking
    this.vehicleRoot.rotation.x = Math.cos(time * 1.2) * 0.01; // Pitch fluctuations

    // Synchronize shader uniform timelines
    this.hudUniforms.uTime.value = time;

    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  handleResize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  new HoverVehicleSimulation();
});
