import React, { useRef } from 'react';
import { Canvas, useFrame } from '@react-three/fiber';
import { OrbitControls, PerspectiveCamera, Text } from '@react-three/drei';
import * as THREE from 'three';

// HUD Component projected in front of the vehicle
function HeadsUpDisplay({ speed }) {
  const hudRef = useRef();

  useFrame((state) => {
    // Subtle float effect for the HUD itself
    hudRef.current.position.y = 1.2 + Math.sin(state.clock.getElapsedTime() * 2) * 0.05;
  });

  return (
    <group ref={hudRef} position={[0, 1.2, -2.5]} rotation={[-0.1, 0, 0]}>
      {/* Outer HUD Ring */}
      <mesh>
        <ringGeometry args={[0.8, 0.82, 64]} />
        <meshBasicMaterial color="#00ffcc" transparent opacity={0.4} side={THREE.DoubleSide} />
      </mesh>
      
      {/* Target Crosshair */}
      <mesh>
        <ringGeometry args={[0.02, 0.05, 4]} />
        <meshBasicMaterial color="#00ffcc" transparent opacity={0.7} />
      </mesh>

      {/* Speedometer Text */}
      <Text
        position={[0, -0.3, 0]}
        fontSize={0.15}
        color="#00ffcc"
        font="https://fonts.gstatic.com/s/orbitron/v9/y7VfC286uPFdBgNs_68f7A.woff"
      >
        {`98 T-KPH`}
      </Text>
      <Text
        position={[0, 0.4, 0]}
        fontSize={0.1}
        color="#ff3366"
        font="https://fonts.gstatic.com/s/orbitron/v9/y7VfC286uPFdBgNs_68f7A.woff"
      >
        SYS: ACTIVE
      </Text>
    </group>
  );
}

// Main Vehicle Geometry (Go-Kart x Jet-Ski Hybrid)
function VehicleBody() {
  const craftRef = useRef();

  // Levitation and hovering animation logic
  useFrame((state) => {
    const t = state.clock.getElapsedTime();
    // Idle levitation up and down
    craftRef.current.position.y = Math.sin(t * 1.5) * 0.15 + 0.5;
    // Subtle jet-ski banking/rolling effect
    craftRef.current.rotation.z = Math.sin(t * 2) * 0.05;
    craftRef.current.rotation.x = Math.cos(t * 1) * 0.03;
  });

  return (
    <group ref={craftRef}>
      {/* 1. Main Jet-Ski Sleek Nose & Hull */}
      <mesh position={[0, 0.3, -0.5]}>
        <coneGeometry args={[0.6, 2.5, 4]} />
        <meshStandardMaterial color="#111111" roughness={0.2} metalness={0.8} flatShading />
      </mesh>

      {/* 2. Go-Kart Low-slung Exposed Chassis Rails */}
      <mesh position={[0, 0.1, 0.5]} rotation={[Math.PI / 2, 0, 0]}>
        <boxGeometry args={[1.4, 2.2, 0.15]} />
        <meshStandardMaterial color="#ff3300" metalness={0.9} roughness={0.1} />
      </mesh>

      {/* 3. Jet-Ski Top Seat Straddle & Steering Column */}
      <mesh position={[0, 0.6, 0.3]}>
        <boxGeometry args={[0.4, 0.4, 1.2]} />
        <meshStandardMaterial color="#222222" roughness={0.7} />
      </mesh>
      
      {/* Handlebars / Steering yoke */}
      <mesh position={[0, 0.9, -0.4]} rotation={[0.4, 0, 0]}>
        <cylinderGeometry args={[0.04, 0.04, 0.9]} />
        <meshStandardMaterial color="#dddddd" metalness={1} />
      </mesh>

      {/* 4. Four Corner Levitation Pods (Replacing Go-Kart Wheels) */}
      {[
        [-0.8, 0, -0.8], // Front Left
        [0.8, 0, -0.8],  // Front Right
        [-0.8, 0, 0.8],  // Rear Left
        [0.8, 0, 0.8],   // Rear Right
      ].map((pos, index) => (
        <group position={pos} key={index}>
          {/* Thruster Housing */}
          <mesh rotation={[Math.PI / 2, 0, 0]}>
            <cylinderGeometry args={[0.3, 0.25, 0.4, 16]} />
            <meshStandardMaterial color="#333" metalness={0.8} />
          </mesh>
          {/* Cyan Plasma Glow Emission */}
          <mesh position={[0, -0.21, 0]}>
            <cylinderGeometry args={[0.2, 0.2, 0.05, 16]} />
            <meshBasicMaterial color="#00ffcc" />
          </mesh>
        </group>
      ))}

      {/* 5. Rear Jet-Ski Jet Engine Exhaust */}
      <mesh position={[0, 0.3, 1.6]} rotation={[Math.PI / 2, 0, 0]}>
        <cylinderGeometry args={[0.25, 0.35, 0.6, 16]} />
        <meshStandardMaterial color="#555" metalness={0.9} />
      </mesh>

      {/* HUD Attached to Vehicle Frame */}
      <HeadsUpDisplay />
    </group>
  );
}

// Scene Setup Environment
export default function HoverCraftApp() {
  return (
    <div style={{ width: '100vw', height: '100vh', backgroundColor: '#050508' }}>
      <Canvas>
        <PerspectiveCamera makeDefault position={[3, 3, 5]} fov={50} />
        <ambientLight intensity={0.3} />
        
        {/* Futuristic Grid Floor */}
        <gridHelper args={[30, 30, '#ff3300', '#222244']} position={[0, -0.5, 0]} />
        
        {/* Cinematic Lighting */}
        <pointLight position={[5, 10, 5]} intensity={1.5} color="#ffffff" />
        <directionalLight position={[-5, 5, -5]} intensity={1} color="#00ffcc" />

        {/* The Levitating Vehicle */}
        <VehicleBody />

        <OrbitControls enablePan={true} enableZoom={true} minDistance={2} maxDistance={10} />
      </Canvas>
    </div>
  );
}


import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

// Custom GLSL Shaders for the Advanced Vector HUD
const HUDVertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const HUDFragmentShader = `
  varying vec2 vUv;
  uniform float uTime;
  
  void main() {
    // Convert UVs to centered coordinates (-1.0 to 1.0)
    vec2 uv = vUv * 2.0 - 1.0;
    float dist = length(uv);
    
    // Create animated concentric target rings
    float ring1 = smoothstep(0.7, 0.72, dist) - smoothstep(0.74, 0.76, dist);
    float ring2 = smoothstep(0.4, 0.41, dist) - smoothstep(0.42, 0.43, dist);
    
    // Add pulsing sweeps simulating sensor sweeps
    float angle = atan(uv.y, uv.x);
    float sweep = smoothstep(0.0, 1.0, sin(angle - uTime * 3.0)) * 0.3;
    
    // Mask and colorize
    vec3 hudColor = vec3(0.0, 1.0, 0.8) * (ring1 + ring2 + sweep * (1.0 - smoothstep(0.75, 0.8, dist)));
    float alpha = ring1 + ring2 + (sweep * step(dist, 0.75));
    
    gl_FragColor = vec4(hudColor, alpha * 0.8);
  }
`;

class AdvancedHovercraftApp {
  constructor() {
    this.container = document.createElement('div');
    this.container.style.width = '100vw';
    this.container.style.height = '100vh';
    document.body.appendChild(this.container);

    // Physics state for hover mechanics
    this.physics = {
      altitude: 0.6,
      targetAltitude: 0.6,
      velocity: 0,
      kSpring: 9.0, // Stiffness
      cDamper: 2.5  // Damping
    };

    this.clock = new THREE.Clock();
    this.initScene();
    this.buildVehicle();
    this.initEnvironment();
    this.animate();

    window.addEventListener('resize', () => this.onWindowResize());
  }

  initScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x06060c);
    this.scene.fog = new THREE.FogExp2(0x06060c, 0.05);

    this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.camera.position.set(3.5, 2.5, 4.5);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.maxPolarAngle = Math.PI / 2 - 0.05; // Stay above ground
  }

  buildVehicle() {
    this.vehicleGroup = new THREE.Group();
    this.scene.add(this.vehicleGroup);

    // Shared Materials
    const carbonHullMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.1, metalness: 0.9 });
    const kartFrameMat = new THREE.MeshStandardMaterial({ color: 0xff4500, roughness: 0.2, metalness: 0.8 });
    const engineMat = new THREE.MeshStandardMaterial({ color: 0x3a3d40, roughness: 0.4, metalness: 1.0 });
    const plasmaGlowMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

    // 1. Sleek Jet-Ski Main Hull Point
    const hullGeo = new THREE.ConeGeometry(0.55, 2.6, 4);
    hullGeo.rotateX(Math.PI / 2);
    const hull = new THREE.Mesh(hullGeo, carbonHullMat);
    hull.position.set(0, 0.35, -0.4);
    hull.scale.set(1, 0.7, 1);
    hull.castShadow = true;
    this.vehicleGroup.add(hull);

    // 2. Low Go-Kart Perimeter Cage Frame
    const frameGeo = new THREE.BoxGeometry(1.5, 0.1, 2.4);
    const frame = new THREE.Mesh(frameGeo, kartFrameMat);
    frame.position.set(0, 0.15, 0.4);
    frame.castShadow = true;
    this.vehicleGroup.add(frame);

    // Upper roll cage geometry
    const rollCageGeo = new THREE.BoxGeometry(1.2, 1.1, 1.4);
    const rollCage = new THREE.Mesh(rollCageGeo, kartFrameMat);
    rollCage.position.set(0, 0.7, 0.6);
    // Render wireframe to represent structural tubings accurately
    rollCage.material = new THREE.MeshStandardMaterial({ color: 0xff4500, wireframe: true });
    this.vehicleGroup.add(rollCage);

    // 3. Quad Repulsor Hover Pods (Go-Kart stance layout)
    const podLocations = [
      [-0.85, 0.05, -0.7], [0.85, 0.05, -0.7], // Front
      [-0.85, 0.05, 1.1],  [0.85, 0.05, 1.1]   // Rear
    ];

    podLocations.forEach(pos => {
      const podGroup = new THREE.Group();
      podGroup.position.set(...pos);

      const housingGeo = new THREE.CylinderGeometry(0.28, 0.22, 0.3, 16);
      const housing = new THREE.Mesh(housingGeo, engineMat);
      housing.castShadow = true;
      podGroup.add(housing);

      const emitterGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.05, 16);
      const emitter = new THREE.Mesh(emitterGeo, plasmaGlowMat);
      emitter.position.y = -0.16;
      podGroup.add(emitter);

      this.vehicleGroup.add(podGroup);
    });

    // 4. Heavy Jet Exhaust
    const exhaustGeo = new THREE.CylinderGeometry(0.2, 0.32, 0.7, 16);
    exhaustGeo.rotateX(Math.PI / 2);
    const exhaust = new THREE.Mesh(exhaustGeo, engineMat);
    exhaust.position.set(0, 0.35, 1.6);
    exhaust.castShadow = true;
    this.vehicleGroup.add(exhaust);

    // 5. Advanced GPU Shader HUD Projector Setup
    this.hudUniforms = { uTime: { value: 0.0 } };
    const hudGeo = new THREE.PlaneGeometry(1.4, 1.4);
    const hudMat = new THREE.ShaderMaterial({
      vertexShader: HUDVertexShader,
      fragmentShader: HUDFragmentShader,
      uniforms: this.hudUniforms,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    
    this.hudMesh = new THREE.Mesh(hudGeo, hudMat);
    this.hudMesh.position.set(0, 1.3, -2.0);
    this.hudMesh.rotation.x = -0.08;
    this.vehicleGroup.add(this.hudMesh);
  }

  initEnvironment() {
    // Lighting
    const ambientLight = new THREE.AmbientLight(0x0a0a16);
    this.scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    this.scene.add(dirLight);

    const cyanNeonLight = new THREE.PointLight(0x00ffcc, 2.0, 8);
    cyanNeonLight.position.set(-3, 2, -2);
    this.scene.add(cyanNeonLight);

    // Structural Vector Grid Floor
    const gridHelper = new THREE.GridHelper(60, 60, 0xff4500, 0x1f1f3a);
    gridHelper.position.y = 0;
    this.scene.add(gridHelper);

    // Floor shadow receiver plate
    const shadowFloorGeo = new THREE.PlaneGeometry(100, 100);
    const shadowFloorMat = new THREE.ShadowMaterial({ opacity: 0.4 });
    const shadowFloor = new THREE.Mesh(shadowFloorGeo, shadowFloorMat);
    shadowFloor.rotation.x = -Math.PI / 2;
    shadowFloor.receiveShadow = true;
    this.scene.add(shadowFloor);
  }

  animate() {
    requestAnimationFrame(() => this.animate());

    const delta = Math.min(this.clock.getDelta(), 0.1); // Cap delta to protect physics steps
    const elapsed = this.clock.getElapsedTime();

    // 1. Run Analytical Spring-Damper Suspension Equation
    // Target altitude modified gently over time to simulate uneven topography
    const activeTarget = this.physics.targetAltitude + Math.sin(elapsed * 0.8) * 0.08;
    const displacement = this.physics.altitude - activeTarget;
    const springForce = -this.physics.kSpring * displacement;
    const damperForce = -this.physics.cDamper * this.physics.velocity;
    const netAcceleration = springForce + damperForce;

    this.physics.velocity += netAcceleration * delta;
    this.physics.altitude += this.physics.velocity * delta;

    // Apply calculated transformation matrices to the vehicle node
    this.vehicleGroup.position.y = this.physics.altitude;

    // 2. Mechanical Micro-vibrations & Roll/Pitch Moments
    this.vehicleGroup.rotation.z = Math.sin(elapsed * 2.5) * 0.025; // Bank
    this.vehicleGroup.rotation.x = Math.cos(elapsed * 1.5) * 0.015; // Pitch

    // 3. Update Custom Uniforms within WebGL context
    this.hudUniforms.uTime.value = elapsed;

    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }
}

// Execution Entrypoint
window.addEventListener('DOMContentLoaded', () => {
  new AdvancedHovercraftApp();
});



/**
 * @file AdvancedHovercraft.js
 * @description Advanced 3D levitating jet-ski / go-kart simulation.
 * @author Gilbert Algordo <https://github.com/gilbertalgordo>
