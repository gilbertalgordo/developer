import requests

# Configure requests to route through a local Tor proxy (e.g., Tor service running on 9050)
proxies = {
    'http': 'socks5h://127.0.0.1:9050',
    'https': 'socks5h://127.0.0.1:9050'
}

def check_onion_status(onion_url):
    """
    Checks if a target hidden service is active and retrieves header metadata.
    Used by threat intelligence platforms to monitor site uptime.
    """
    try:
        response = requests.get(onion_url, proxies=proxies, timeout=15)
        print(f"[*] Target: {onion_url}")
        print(f"[*] Status Code: {response.status_code}")
        print(f"[*] Server Info: {response.headers.get('Server', 'Unknown')}")
        
        # Threat intel tools would pass response.text to an NLP/LLM pipeline here for analysis
        return response.status_code == 200
    except requests.exceptions.RequestException as e:
        print(f"[-] Failed to reach service: {e}")
        return False

# Example: Checking Tor network connection check service
if __name__ == "__main__":
    test_url = "http://check.torproject.org"
    check_onion_status(test_url)




import time
import json
import logging
import requests
from sklearn.feature_extraction.text import TfidfVectorizer
from bs4 import BeautifulSoup

# Configure logging telemetry
logging.basicConfig(level=logging.INFO, format="[%(asctime)s] [%(levelname)s] %(message)s")

class ActiveDarkwebAIAgent:
    def __init__(self, tor_proxy_port=9050, soar_webhook_url=None):
        self.tor_proxy_port = tor_proxy_port
        self.soar_webhook_url = soar_webhook_url
        self.proxies = {
            'http': f'socks5h://127.0.0.1:{self.tor_proxy_port}',
            'https': f'socks5h://127.0.0.1:{self.tor_proxy_port}'
        }
        
        # High-risk threat vectors for AI vector analysis
        self.risk_keywords = [
            "zero-day exploit", "database leak", "ransomware payment",
            "c2 server", "botnet master", "stolen credentials", "ddos service"
        ]
        self.vectorizer = TfidfVectorizer().fit(self.risk_keywords)

    def verify_tor_connection(self):
        """Verifies that traffic is anonymized and routed through Tor."""
        try:
            res = requests.get("https://check.torproject.org/api/ip", proxies=self.proxies, timeout=10)
            data = res.json()
            if data.get("IsTor", False):
                logging.info(f"Tor Connection Established. IP: {data.get('IP')}")
                return True
            else:
                logging.warning("Traffic is not routed through Tor. Disconnecting.")
                return False
        except Exception as e:
            logging.error(f"Failed to connect to Tor proxy: {e}")
            return False

    def scrape_onion_target(self, onion_url):
        """Scrapes text content and metadata from an active .onion target."""
        logging.info(f"Analyzing target: {onion_url}")
        try:
            response = requests.get(onion_url, proxies=self.proxies, timeout=20)
            if response.status_code == 200:
                soup = BeautifulSoup(response.text, 'html.parser')
                # Extract visible body text
                text_content = ' '.join([p.text for p in soup.find_all(['p', 'h1', 'h2', 'h3', 'code'])])
                return {
                    "status": "ACTIVE",
                    "headers": dict(response.headers),
                    "content": text_content
                }
        except requests.exceptions.RequestException as e:
            logging.error(f"Target reachability error: {e}")
        return {"status": "UNREACHABLE", "headers": {}, "content": ""}

    def analyze_threat_level(self, text_content):
        """Uses NLP Vectorization to score the threat level of raw site content."""
        if not text_content:
            return 0.0
            
        # Transform extracted text using threat vector space
        matrix = self.vectorizer.transform([text_content])
        score = matrix.sum()
        normalized_score = min(float(score * 10), 1.0)
        return round(normalized_score, 2)

    def trigger_takedown_action(self, onion_url, threat_score, target_metadata):
        """Dispatches automated takedown playbooks and alert vectors to CERT/SOAR platforms."""
        payload = {
            "timestamp": time.time(),
            "target": onion_url,
            "threat_score": threat_score,
            "action": "TAKEDOWN_REQUEST_DISPATCHED",
            "metadata": target_metadata
        }
        
        logging.warning(f"HIGH THREAT DETECTED ({threat_score}). Dispatching Incident Mitigation Payload...")
        
        if self.soar_webhook_url:
            try:
                # Dispatch payload to automated incident response webhook (e.g., Shuffle, Palo Alto XSOAR)
                headers = {'Content-Type': 'application/json'}
                requests.post(self.soar_webhook_url, data=json.dumps(payload), headers=headers, timeout=5)
                logging.info("SOAR Mitigation Playbook Successfully Triggered.")
            except Exception as e:
                logging.error(f"Failed to dispatch SOAR payload: {e}")
        else:
            logging.info(f"Local Alert Payload Formatted:\n{json.dumps(payload, indent=2)}")

    def run_agent_cycle(self, target_onion_urls):
        """Executes full intelligence gathering and threat disruption loop."""
        if not self.verify_tor_connection():
            return

        for target in target_onion_urls:
            scraped_data = self.scrape_onion_target(target)
            if scraped_data["status"] == "ACTIVE":
                score = self.analyze_threat_level(scraped_data["content"])
                logging.info(f"Target: {target} | Calculated Risk Score: {score}")
                
                # Trigger automated response for high risk targets
                if score >= 0.35:
                    self.trigger_takedown_action(target, score, scraped_data["headers"])
            else:
                logging.info(f"Target {target} is offline or blocked.")


if __name__ == "__main__":
    # Target listing (Replace with actual target .onion addresses)
    target_onion_list = [
        "http://check.torproject.org",
        "http://expyuz4wqqyqhjnchbh2222.onion"  # Example invalid/inactive test onion
    ]
    
    agent = ActiveDarkwebAIAgent(tor_proxy_port=9050)
    agent.run_agent_cycle(target_onion_list)



