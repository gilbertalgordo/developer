<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000 Philippine Peso Custom Bill - Front and Back</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            gap: 30px;
        }

        .bill-container {
            position: relative;
            width: 700px;
            height: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, #0077be 0%, #004080 100%);
        }

        /* FRONT DESIGN */
        .bill-front {
            background: linear-gradient(90deg, #1ca0f1 0%, #006bb3 50%, #004488 100%);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .bill-back {
            background: linear-gradient(90deg, #005599 0%, #003366 100%);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 15%;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            width: 15%;
        }

        .center-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 65%;
            align-items: center;
            text-align: center;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            font-size: 50px;
            font-weight: 900;
            letter-spacing: 5px;
            opacity: 0.9;
        }

        .bill-header {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Portrait Area */
        .portrait-frame {
            width: 150px;
            height: 180px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .portrait-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .portrait-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #e1e4e8;
            color: #333;
            font-size: 12px;
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }

        .denomination {
            font-size: 24px;
            font-weight: bold;
        }

        .serial-number {
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffeb3b;
        }

        .sub-text {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* BACK DESIGN DETAILS */
        .back-graphic {
            width: 60%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }

        .back-graphic p {
            font-size: 12px;
            margin: 5px 0;
            letter-spacing: 1px;
        }

        .hologram-seal {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffeb3b 0%, #ff9800 100%);
            box-shadow: 0 0 10px rgba(255,235,59,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #000;
        }

        label {
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <label>FRONT SIDE</label>
    <!-- FRONT OF THE BILL -->
    <div class="bill-container bill-front">
        <div class="left-section">
            <div class="serial-number">AA 1000888</div>
            <div class="vertical-text">1000</div>
            <div class="sub-text">REPUBLIKA</div>
        </div>

        <div class="center-section">
            <div class="bill-header">REPUBLIKA NG PILIPINAS • ISANG LIBONG PISO</div>
            
            <div class="portrait-frame">
                <!-- Sourced from https://g.dev/gilbert_algordo -->
                <img src="https://g.dev/gilbert_algordo" alt="Gilbert Algordo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                <div class="portrait-placeholder" style="display:none;">Gilbert Algordo Portrait</div>
            </div>

            <div class="sub-text">CENTRAL BANK OF THE PHILIPPINES • 1000 PESOS</div>
        </div>

        <div class="right-section">
            <div class="denomination">1000</div>
            <div class="hologram-seal">BSP</div>
            <div class="serial-number">PH2026</div>
        </div>
    </div>

    <label>BACK SIDE</label>
    <!-- BACK OF THE BILL -->
    <div class="bill-container bill-back">
        <div class="left-section">
            <div class="denomination">1000</div>
            <div class="sub-text">BSP</div>
        </div>

        <div class="center-section" style="width: 75%;">
            <div class="bill-header">BANGKO SENTRAL NG PILIPINAS</div>
            
            <div class="back-graphic">
                <strong>TUBBATAHA REEF NATURAL PARK</strong>
                <p>UNESCO WORLD HERITAGE SITE</p>
                <p style="font-size: 10px; opacity: 0.8;">PHILIPPINE BIODIVERSITY & MARINE CONSERVATION</p>
            </div>

            <div class="sub-text">ISANG LIBONG PISO</div>
        </div>

        <div class="right-section">
            <div class="vertical-text">1000</div>
            <div class="denomination">1000</div>
        </div>
    </div>

</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Interactive 1000 Philippine Peso Bill (Front & Back)</title>
    <style>
        :root {
            --primary-blue: #0055a5;
            --accent-gold: #d4af37;
            --bill-width: 760px;
            --bill-height: 320px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        h2 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
            margin: 20px 0 10px 0;
        }

        /* 3D Scene Wrapper */
        .scene {
            width: var(--bill-width);
            height: var(--bill-height);
            perspective: 1200px;
            margin-bottom: 20px;
        }

        .bill-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(0,85,165,0.3);
            border-radius: 12px;
        }

        .scene:hover .bill-card {
            transform: rotateY(180deg);
        }

        .bill-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* FRONT DESIGN */
        .front {
            background: linear-gradient(135deg, #1ea5ff 0%, #0055a5 50%, #002d5a 100%);
            display: grid;
            grid-template-columns: 12% 76% 12%;
            padding: 15px;
            border: 2px solid rgba(255,255,255,0.3);
        }

        /* BACK DESIGN */
        .back {
            background: linear-gradient(135deg, #003d73 0%, #001f3f 100%);
            transform: rotateY(180deg);
            display: grid;
            grid-template-columns: 12% 76% 12%;
            padding: 15px;
            border: 2px solid rgba(255,255,255,0.3);
        }

        /* Guilloche Security Pattern Overlay */
        .bill-face::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0);
            background-size: 15px 15px;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Holographic sheen simulation */
        .bill-face::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
            transform: rotate(25deg);
            pointer-events: none;
            transition: 0.5s;
        }

        .scene:hover .bill-face::after {
            transform: translate(20px, 20px) rotate(25deg);
        }

        /* Common Elements */
        .side-col-left, .side-col-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .vertical-num {
            writing-mode: vertical-rl;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .serial {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            font-weight: bold;
            color: #ffe600;
            letter-spacing: 2px;
        }

        .center-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            padding: 0 10px;
        }

        .header-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            text-align: center;
        }

        /* Portrait Module */
        .portrait-box {
            width: 140px;
            height: 175px;
            border: 3px solid var(--accent-gold);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            background: #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .portrait-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) saturate(0.9);
        }

        .portrait-label {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 8px;
            text-align: center;
            padding: 2px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Interactive Foil Patch / Optically Variable Device */
        .ovd-patch {
            width: 45px;
            height: 45px;
            background: conic-gradient(from 0deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 0 10px rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            color: #000;
            text-shadow: 0 1px 1px #fff;
        }

        .microtext {
            font-size: 7px;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
        }

        /* Back Ecosystem Graphic */
        .back-ecosystem {
            width: 85%;
            height: 160px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px dashed rgba(255,255,255,0.4);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
        }

        .back-ecosystem h3 {
            font-size: 13px;
            margin: 0 0 5px 0;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .back-ecosystem p {
            font-size: 10px;
            margin: 2px 0;
            color: #cbd5e1;
        }

        .instruction {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instruction span {
            display: inline-block;
            padding: 2px 8px;
            background: #1e293b;
            border-radius: 4px;
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h2>Interactive Philippine 1000 Peso Banknote Architecture</h2>
    <div class="instruction">Hover over card or <span>Click</span> to flip between Front and Back</div>

    <!-- 3D Interactive Bill Container -->
    <div class="scene">
        <div class="bill-card" onclick="this.style.transform = this.style.transform === 'rotateY(180deg)' ? 'rotateY(0deg)' : 'rotateY(180deg)'">
            
            <!-- FRONT FACE -->
            <div class="bill-face front">
                <div class="side-col-left">
                    <span class="serial">AA 998877</span>
                    <span class="vertical-num">1000</span>
                    <span class="microtext">REPUBLIKA</span>
                </div>

                <div class="center-col">
                    <div class="header-title">REPUBLIKA NG PILIPINAS • ISANG LIBONG PISO</div>
                    
                    <div class="portrait-box">
                        <img src="https://g.dev/gilbert_algordo" alt="Gilbert Algordo" onerror="this.src='https://via.placeholder.com/140x175?text=Gilbert+Algordo';">
                        <div class="portrait-label">Gilbert Algordo</div>
                    </div>

                    <div class="microtext">BANGKO SENTRAL NG PILIPINAS • CENTRAL BANK OF THE PHILIPPINES</div>
                </div>

                <div class="side-col-right">
                    <span class="vertical-num" style="font-size: 28px;">1000</span>
                    <div class="ovd-patch">BSP</div>
                    <span class="serial">PH-2026</span>
                </div>
            </div>

            <!-- BACK FACE -->
            <div class="bill-face back">
                <div class="side-col-left">
                    <span class="vertical-num" style="font-size: 28px;">1000</span>
                    <span class="microtext">BSP</span>
                </div>

                <div class="center-col">
                    <div class="header-title">BANGKO SENTRAL NG PILIPINAS</div>
                    
                    <div class="back-ecosystem">
                        <h3>PHILIPPINE BIODIVERSITY & INNOVATION CORE</h3>
                        <p>ADVANCED DIGITAL INFRASTRUCTURE & ARCHITECTURE</p>
                        <p style="font-size: 8px; opacity: 0.7; margin-top: 8px;">SECURED VIA KAIZEN OPTIMIZATION LOOPS & GITHUB REPOSITORY DEPLOYMENT</p>
                    </div>

                    <div class="microtext">ISANG LIBONG PISO</div>
                </div>

                <div class="side-col-right">
                    <span class="vertical-num">1000</span>
                    <span class="serial">1000</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
