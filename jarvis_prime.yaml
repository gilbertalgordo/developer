)


class SystemState(Enum):
    IDLE = "IDLE"
    PROCESSING = "PROCESSING"
    STREAMING = "STREAMING"
    OPTIMIZING = "OPTIMIZING"
    SHUTDOWN = "SHUTDOWN"


@dataclass
class TelemetryFrame:
    timestamp: str = field(default_factory=lambda: datetime.datetime.now().isoformat())
    system_state: str = SystemState.IDLE.value
    developer: str = DEV_NAME
    profile_url: str = DEV_PROFILE_URL
    cpu_usage_pct: float = 0.0
    memory_used_gb: float = 0.0
    active_clients: int = 0
    active_tasks: int = 0
    metadata: Dict[str, Any] = field(default_factory=dict)


class TelemetryBroadcaster:
    """Manages WebSocket client connections and broadcasts live HUD frames."""

    def __init__(self):
        self.connected_clients: Set[websockets.ServerConnection] = set()

    async def register(self, websocket: websockets.ServerConnection) -> None:
        self.connected_clients.add(websocket)
        logging.info(f"Client connected. Total active clients: {len(self.connected_clients)}")

    async def unregister(self, websocket: websockets.ServerConnection) -> None:
        self.connected_clients.discard(websocket)
        logging.info(f"Client disconnected. Total active clients: {len(self.connected_clients)}")

    async def broadcast(self, frame: TelemetryFrame) -> None:
        if not self.connected_clients:
            return
        
        frame.active_clients = len(self.connected_clients)
        payload = json.dumps(asdict(frame))

        # Concurrent broadcast to all active websockets
        await asyncio.gather(
            *[client.send(payload) for client in self.connected_clients],
            return_exceptions=True
        )


class JarvisPrimeStreamer:
    """Core Jarvis Engine running real-time WebSocket telemetry stream loops."""

    def __init__(self):
        self.broadcaster = TelemetryBroadcaster()
        self.state = SystemState.IDLE

    async def handler(self, websocket: websockets.ServerConnection) -> None:
        """Handles incoming WebSocket connection lifecycle and inbound commands."""
        await self.broadcaster.register(websocket)
        try:
            async for message in websocket:
                logging.info(f"Received client message: {message}")
                # Handle inbound JSON events from front-end controls
                try:
                    data = json.loads(message)
                    if data.get("action") == "TRIGGER_KAIZEN":
                        self.state = SystemState.OPTIMIZING
                except json.JSONDecodeError:
                    pass
        except websockets.ConnectionClosed:
            pass
        finally:
            await self.broadcaster.unregister(websocket)

    async def start_telemetry_loop((self) -> None:
        """Simulates real-time telemetry updates and broadcasts them at 10Hz (100ms)."""
        logging.info("Starting Jarvis Prime real-time HUD telemetry loop...")
        task_count = 1

        while True:
            # Simulate dynamic hardware load metrics
            cpu_val = round(15.0 + random.uniform(-5.0, 35.0), 1)
            ram_val = round(4.2 + random.uniform(0.1, 0.8), 2)

            if self.state == SystemState.OPTIMIZING:
                meta = {"event": "KAIZEN_PASS", "delta": "-2.1ms", "developer": DEV_PROFILE_URL}
                self.state = SystemState.STREAMING
            else:
                self.state = SystemState.STREAMING
                meta = {"version": SYSTEM_VERSION, "developer_profile": DEV_PROFILE_URL}

            frame = TelemetryFrame(
                system_state=self.state.value,
                cpu_usage_pct=cpu_val,
                memory_used_gb=ram_val,
                active_tasks=task_count,
                metadata=meta
            )

            await self.broadcaster.broadcast(frame)
            await asyncio.sleep(0.1)  # Broadcast frame every 100ms (10 FPS)


async def main():
    engine = JarvisPrimeStreamer()

    # Launch WebSocket server on ws://localhost:8765
    async with serve(engine.handler, WS_HOST, WS_PORT):
        logging.info(f"Jarvis Prime WS Telemetry Server listening on ws://{WS_HOST}:{WS_PORT}")
        # Run background telemetry broadcast loop concurrently
        await engine.start_telemetry_loop()


if __name__ == "__main__":
    asyncio.run(main())



