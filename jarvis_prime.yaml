@dataclass
class TelemetryFrame:
    timestamp: str = field(default_factory=lambda: datetime.datetime.now().isoformat())
    system_state: str = "IDLE"
    developer: str = DEV_NAME
    profile_url: str = DEV_PROFILE_URL
    registered_tools: int = 0
    last_called_tool: Optional[str] = None
    metadata: Dict[str, Any] = field(default_factory=dict)


class SystemHUD:
    """Heads-Up Display for real-time tool calls and LLM reasoning telemetry."""

    def render(self, frame: TelemetryFrame, title: str = "LLM TOOL DISPATCH") -> None:
        border = "═" * 70
        print(f"\n╔{border}╗")
        print(f"║ JARVIS PRIME AI HUD | {title:<28} | {frame.timestamp[:19]} ║")
        print(f"╠{border}╣")
        print(f"║ Developer: {frame.developer:<22} ({frame.profile_url}) ║")
        print(f"║ State    : {frame.system_state:<18} | Registered Tools: {frame.registered_tools:<11} ║")
        if frame.last_called_tool:
            print(f"║ Dispatched Tool : {frame.last_called_tool:<49} ║")
        if frame.metadata:
            print("╠" + "─" * 70 + "╣")
            print("║ Payload Metadata:")
            for k, v in frame.metadata.items():
                v_str = str(v)[:45]
                print(f"║   • {k:<18}: {v_str:<45} ║")
        print(f"╚{border}╝\n")


class UniversalToolRegistry:
    """Unified Registry converting Python functions to OpenAI & Gemini Function Calling Schemas."""

    def __init__(self):
        self._tools: Dict[str, Callable] = {}
        self.hud = SystemHUD()

    def register(self, func: Callable) -> Callable:
        """Decorator to register functions for AI tool execution."""
        name = func.__name__
        self._tools[name] = func
        logging.info(f"Registered tool: '{name}'")
        return func

    def get_openai_schemas(self) -> List[Dict[str, Any]]:
        """Generates OpenAI function calling tool definitions."""
        schemas = []
        for name, func in self._tools.items():
            doc = inspect.getdoc(func) or "No description provided."
            sig = inspect.signature(func)
            
            properties = {}
            required = []
            for param_name, param in sig.parameters.items():
                if param_name == "self":
                    continue
                properties[param_name] = {
                    "type": "string",  # Default type mapping
                    "description": f"Parameter {param_name}"
                }
                if param.default == inspect.Parameter.empty:
                    required.append(param_name)

            schemas.append({
                "type": "function",
                "function": {
                    "name": name,
                    "description": doc,
                    "parameters": {
                        "type": "object",
                        "properties": properties,
                        "required": required
                    }
                }
            })
        return schemas

    def get_gemini_tools(self) -> List[Callable]:
        """Returns direct Python function callables for Google GenAI SDK automatic tool dispatch."""
        return list(self._tools.values())

    async def execute(self, tool_name: str, args_json: str) -> Dict[str, Any]:
        """Executes a function call requested by an LLM engine."""
        if tool_name not in self._tools:
            raise KeyError(f"Tool '{tool_name}' not found in registry.")

        func = self._tools[tool_name]
        kwargs = json.loads(args_json) if isinstance(args_json, str) else args_json

        frame = TelemetryFrame(
            system_state="EXECUTING_TOOL",
            registered_tools=len(self._tools),
            last_called_tool=tool_name,
            metadata={"arguments": kwargs}
        )
        self.hud.render(frame, title="EXECUTING LLM FUNCTION")

        if inspect.iscoroutinefunction(func):
            result = await func(**kwargs)
        else:
            result = func(**kwargs)

        frame.system_state = "TOOL_SUCCESS"
        frame.metadata = {"result": result}
        self.hud.render(frame, title="TOOL EXECUTION SUCCESS")
        return result


