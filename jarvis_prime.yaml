class JarvisLLMBridge:
    """Dispatches user prompts to OpenAI or Gemini APIs with automatic Tool Calling."""

    def __init__(self, registry: UniversalToolRegistry):
        self.registry = registry

    async def query_gemini(self, prompt: str, api_key: str) -> Optional[str]:
        """Queries Gemini using Google's google-genai SDK with automatic function calling."""
        if not genai:
            logging.error("google-genai SDK not installed. Run: pip install google-genai")
            return None

        client = genai.Client(api_key=api_key)
        tools = self.registry.get_gemini_tools()

        # Execute using Gemini 2.5 Flash with automatic tool resolution
        response = await client.aio.models.generate_content(
            model="gemini-2.5-flash",
            contents=prompt,
            config=genai_types.GenerateContentConfig(tools=tools)
        )
        return response.text

    async def query_openai(self, prompt: str, api_key: str) -> Optional[str]:
        """Queries OpenAI API with tool calling resolution loop."""
        if not openai:
            logging.error("OpenAI SDK not installed. Run: pip install openai")
            return None

        client = openai.AsyncOpenAI(api_key=api_key)
        schemas = self.registry.get_openai_schemas()

        # Initial turn
        response = await client.chat.completions.create(
            model="gpt-4o",
            messages=[{"role": "user", "content": prompt}],
            tools=schemas,
            tool_choice="auto"
        )

        message = response.choices[0].message

        # Handle tool calls if requested by the LLM
        if message.tool_calls:
            for tool_call in message.tool_calls:
                func_name = tool_call.function.name
                func_args = tool_call.function.arguments
                
                # Execute tool in Jarvis Prime registry
                tool_result = await self.registry.execute(func_name, func_args)
                return json.dumps(tool_result)

        return message.content


# --- Execution Pipeline Example ---
