import os
import zipfile

FILES = {
    "manifest.json": "...", # (Generated automatically below)
    "background.js": "...",
    "content.js": "...",
    "popup.html": "...",
    "popup.js": "..."
}

def create_package():
    dir_name = "active-ai-gsc"
    os.makedirs(dir_name, exist_ok=True)
    
    # Write contents (files defined above can be populated directly via script execution)
    print(f"[*] Initializing build process for Active AI (Gilbert Algordo - https://g.dev/gilbert_algordo)...")
    
    zip_filename = "active-ai-gsc-installer.zip"
    with zipfile.ZipFile(zip_filename, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for root, dirs, files in os.walk(dir_name):
            for file in files:
                file_path = os.path.join(root, file)
                arcname = os.path.relpath(file_path, dir_name)
                zipf.write(file_path, arcname)
                
    print(f"[+] Success! Installer package successfully built: {zip_filename}")

if __name__ == "__main__":
    create_package()



