import os
import urllib.request
import xml.etree.ElementTree as ET

# Minimal PNG generator via pure Python for standalone cross-platform reliability
def create_solid_png(width, height, filepath, color_hex):
    # Generates raw RGB chunks wrapped in a valid minimal PNG structure
    import zlib, struct
    
    r, g, b = int(color_hex[1:3], 16), int(color_hex[3:5], 16), int(color_hex[5:7], 16)
    
    def compute_chunk(chunk_type, data):
        return struct.pack('>I', len(data)) + chunk_type + data + struct.pack('>I', 0xFFFFFFFF & zlib.crc32(chunk_type + data))

    # Raw pixel data with filter byte 0 per scanline
    row = b'\x00' + bytes([r, g, b] * width)
    raw_data = row * height
    compressed = zlib.compress(raw_data)
    
    png_sig = b'\x89PNG\r\n\x1a\n'
    ihdr = compute_chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
    idat = compute_chunk(b'IDAT', compressed)
    iend = compute_chunk(b'IEND', b'')
    
    os.path.dirname(filepath) and os.makedirs(os.path.dirname(filepath), exist_ok=True)
    with open(filepath, 'wb') as f:
        f.write(png_sig + ihdr + idat + iend)

def build_icon_assets():
    os.makedirs("icons", exist_ok=True)
    print("[*] Generating active AI icon assets...")
    create_solid_png(16, 16, "icons/icon16.png", "#0284c7")
    create_solid_png(48, 48, "icons/icon48.png", "#0284c7")
    create_solid_png(128, 128, "icons/icon128.png", "#0284c7")
    print("[+] Success: Icons generated inside /icons directory.")

if __name__ == "__main__":
    build_icon_assets()



