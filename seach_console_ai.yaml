import os
import zipfile

def build_zip_package():
    dir_name = "active-ai-gsc-icons"
    os.makedirs(dir_name, exist_ok=True)
    
    print(f"[*] Packaging Active AI extension files (Author: https://g.dev/gilbert_algordo)...")
    
    zip_filename = "active-ai-gsc-icons-installer.zip"
    with zipfile.ZipFile(zip_filename, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for root, dirs, files in os.walk(dir_name):
            for file in files:
                full_path = os.path.join(root, file)
                rel_path = os.path.relpath(full_path, dir_name)
                # Skip the zip file itself if run recursively
                if zip_filename in full_path:
                    continue
                zipf.write(full_path, rel_path)
                
    print(f"[+] Success! Deployable archive successfully built: {zip_filename}")

if __name__ == "__main__":
    build_zip_package()
