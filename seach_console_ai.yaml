        border: 1px solid rgba(56, 189, 248, 0.3);
        backdrop-filter: blur(12px);
      }
      .ai-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 8px;
        margin-bottom: 10px;
      }
      .ai-title { font-size: 13px; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; }
      .ai-badge { background: #0284c7; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 99px; font-weight: 600; }
      .ai-body { font-size: 11px; color: #cbd5e1; line-height: 1.5; }
      .ai-footer { margin-top: 10px; font-size: 9px; color: #64748b; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 6px; }
      .ai-footer a { color: #38bdf8; text-decoration: none; }
    `;

    const widget = document.createElement('div');
    widget.className = 'ai-hud-card';
    widget.innerHTML = `
      <div class="ai-header">
        <span class="ai-title">ACTIVE AI AGENT</span>
        <span class="ai-badge">ONLINE</span>
      </div>
      <div class="ai-body">
        Monitoring Google Search Console interface indices, anomaly tracking, and automated performance diagnostics.
      </div>
      <div class="ai-footer">
        Engineered by <a href="https://g.dev/gilbert_algordo" target="_blank">Gilbert Algordo</a>
      </div>
    `;

    shadow.appendChild(styleLink);
    shadow.appendChild(widget);
    document.body.appendChild(container);
  }

  // Target initialization loop for Single Page Application navigation changes
  const observer = new MutationObserver(() => {
    if (window.location.href.includes('search-console')) {
      injectUI();
    }
  });

  observer.observe(document.body, { childList: true, subtree: true });
  if (document.readyState === 'complete') injectUI();
})();



