import pytest
from fastapi.testclient import TestClient
from fastapi import FastAPI, HTTPException
from pydantic import BaseModel

app = FastAPI(title="Race Corp Test Wrapper")

class OptimizationRequest(BaseModel):
    chassis_id: str
    engine_type: str
    current_weight: float

@app.post("/api/v1/optimize-spec")
def optimize_spec(payload: OptimizationRequest):
    if not payload.chassis_id:
        raise HTTPException(status_code=400, detail="Invalid chassis ID")
    return {
        "status": "Success",
        "chassis": payload.chassis_id,
        "recommended_modifications": ["CF-SPOILER-01", "TI-EXHAUST-V8"],
        "estimated_performance_gain": "8.5%"
    }

client = TestClient(app)

def test_optimize_spec_endpoint():
    response = client.post(
        "/api/v1/optimize-spec",
        json={"chassis_id": "911-GT3", "engine_type": "Turbo V8", "current_weight": 1420.0}
    )
    assert response.status_code == 200
    data = response.json()
    assert data["status"] == "Success"
    assert "recommended_modifications" in data
    assert data["estimated_performance_gain"] == "8.5%"

def test_optimize_spec_validation_error():
    response = client.post(
        "/api/v1/optimize-spec",
        json={"chassis_id": "", "engine_type": "Turbo V8", "current_weight": 1420.0}
    )
    assert response.status_code == 400



