<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="customBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Neon Emerald & Cyan Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background with Border -->
  <rect width="500" height="140" rx="18" fill="url(#customBg)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5" />

  <!-- Background Cyber Circuit Accents -->
  <path d="M 420 20 L 470 20 L 480 30" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1" />
  <circle cx="480" cy="30" r="2.5" fill="#06b6d4" opacity="0.6" />
  <circle cx="440" cy="115" r="2" fill="#10b981" opacity="0.5" />
  <line x1="380" y1="120" x2="450" y2="120" stroke="rgba(16, 185, 129, 0.15)" stroke-dasharray="3 3" />

  <!-- Avatar / Icon Emblem Container -->
  <g transform="translate(24, 24)">
    <rect width="92" height="92" rx="16" fill="#111827" stroke="url(#neonGrad)" stroke-width="2.5" filter="url(#neonGlow)" />
    <!-- Code Bracket Symbol -->
    <text x="46" y="58" fill="#10b981" font-family="monospace" font-size="36" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Developer Details -->
  <g transform="translate(136, 48)">
    <text x="0" y="0" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">Gilbert Algordo</text>
    <text x="0" y="24" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">g.dev/gilbert_algordo</text>
  </g>

  <!-- Telemetry / Architecture Pill -->
  <g transform="translate(370, 95)">
    <rect x="-15" y="-12" width="105" height="22" rx="11" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="-3" cy="-1" r="3.5" fill="#10b981" />
    <text x="12" y="4" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">HUD ACTIVE</text>
  </g>
</svg>



