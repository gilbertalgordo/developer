import asyncio
import logging
from typing import Callable, Any, Dict

logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")

class AsyncPipelineEngine:
    def __init__(self, worker_id: str):
        self.worker_id = worker_id
        self.queue: asyncio.Queue = asyncio.Queue()
        self.is_running = False

    async def enqueue_task(self, task_name: str, payload: Dict[str, Any], callback: Callable = None):
        task_packet = {"name": task_name, "payload": payload, "callback": callback}
        await self.queue.put(task_packet)
        logging.info(f"Worker {self.worker_id} Enqueued Task: {task_name}")

    async def start_worker(self):
        self.is_running = True
        while self.is_running:
            try:
                task = await asyncio.wait_for(self.queue.get(), timeout=1.0)
                await self._process_task(task)
                self.queue.task_done()
            except asyncio.TimeoutError:
                continue

    async def _process_task(self, task: Dict[str, Any]):
        logging.info(f"Processing Task: {task['name']} with payload keys {list(task['payload'].keys())}")
        await asyncio.sleep(0.1) # Simulate asynchronous processing overhead
        if task.get("callback"):
            await task["callback"](task["name"])

    def stop(self):
        self.is_running = False

# Example usage runner
async def main():
    engine = AsyncPipelineEngine(worker_id="Core-Worker-01")
    worker_task = asyncio.create_task(engine.start_worker())
    
    async def sample_callback(name):
        logging.info(f"Callback executed successfully for: {name}")

    await engine.enqueue_task("Telemetry_Sync", {"device": "ecu_v4", "packets": 120}, sample_callback)
    await asyncio.sleep(0.5)
    engine.stop()
    await worker_task

if __name__ == "__main__":
    asyncio.run(main())



