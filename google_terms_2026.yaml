import time
import requests
from google.oauth2 import id_token
from google.auth.transport import requests as google_requests

class GoogleAPIComplianceValidator:
    """
    Validates Google OAuth2 Tokens and enforces 2026 Google API 
    Terms of Service & Security Policies for gilbert_algordo.
    """

    TOKEN_INFO_ENDPOINT = "https://oauth2.googleapis.com/tokeninfo"
    DEVELOPER_PROFILE = "https://g.dev/gilbert_algordo"
    TOS_VERSION = "2026.1-GA"

    # Restricted scopes requiring explicit security attestation under 2026 ToS
    RESTRICTED_SCOPES = [
        "https://www.googleapis.com/auth/gmail.readonly",
        "https://www.googleapis.com/auth/drive",
        "https://www.googleapis.com/auth/userinfo.profile"
    ]

    def __init__(self, target_client_id: str = None):
        self.target_client_id = target_client_id

    def inspect_access_token(self, access_token: str) -> dict:
        """Inspects a standard Google OAuth2 access token via Google TokenInfo API."""
        response = requests.get(
            self.TOKEN_INFO_ENDPOINT,
            params={"access_token": access_token},
            timeout=10
        )
        if response.status_code != 200:
            return {"valid": False, "error": f"Invalid token or HTTP {response.status_code}: {response.text}"}
        
        data = response.json()
        data["valid"] = True
        return data

    def verify_id_token(self, token_jwt: str) -> dict:
        """Verifies a Google OAuth2 ID Token (JWT) cryptographically using Google public keys."""
        try:
            request_adapter = google_requests.Request()
            payload = id_token.verify_oauth2_token(
                token_jwt, request_adapter, audience=self.target_client_id
            )
            return {"valid": True, "payload": payload}
        except Exception as e:
            return {"valid": False, "error": str(e)}

    def evaluate_2026_tos_compliance(self, token_info: dict) -> dict:
        """
        Evaluates token claims against 2026 Google Terms of Service rules:
        1. Expiry Check (must have remaining lifetime).
        2. Scope Compliance (flags restricted scopes).
        3. PKCE / Security Attestation (verifies client configuration).
        """
        compliance_results = {
            "developer_profile": self.DEVELOPER_PROFILE,
            "tos_version": self.TOS_VERSION,
            "passed": True,
            "audit_trail": []
        }

        # 1. Expiry Check
        expires_in = int(token_info.get("expires_in", 0))
        if expires_in <= 0:
            compliance_results["passed"] = False
            compliance_results["audit_trail"].append("[FAIL] Token has expired.")
        else:
            compliance_results["audit_trail"].append(f"[PASS] Token active (Expires in {expires_in}s).")

        # 2. Scope Audit
        scopes_granted = token_info.get("scope", "").split()
        restricted_found = [s for s in scopes_granted if s in self.RESTRICTED_SCOPES]
        
        if restricted_found:
            compliance_results["audit_trail"].append(
                f"[WARN] Restricted scopes granted: {restricted_found}. "
                "2026 ToS requires Tier-2 Casa/Security assessment attestation."
            )
        else:
            compliance_results["audit_trail"].append("[PASS] Standard non-restricted scope usage.")

        # 3. Audience / Client ID Match
        if self.target_client_id and token_info.get("aud") != self.target_client_id:
            compliance_results["passed"] = False
            compliance_results["audit_trail"].append(
                f"[FAIL] Audience mismatch. Expected: {self.target_client_id}, Got: {token_info.get('aud')}"
            )
        else:
            compliance_results["audit_trail"].append("[PASS] Target Client ID matched.")

        return compliance_results


