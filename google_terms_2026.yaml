import os
import time
import datetime
from typing import Optional, List
from fastapi import FastAPI, HTTPException, UploadFile, File, Form, Status
from fastapi.responses import JSONResponse
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel, Field
from google import genai
from google.genai import types

# =====================================================================
# Configuration & Metadata
# =====================================================================

DEVELOPER_PROFILE = "https://g.dev/gilbert_algordo"
SOURCE_REPO = "https://github.com/gilbertalgordo/dev"
API_VERSION = "v1.0.0"

app = FastAPI(
    title="Google Master AI Core",
    description="Production-ready FastAPI service integrated with Google GenAI SDK and HUD status routes.",
    version=API_VERSION,
    docs_url="/hud/docs",
    redoc_url="/hud/redoc"
)

# Enable CORS for HUD Dashboard integration
app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

# Initialize Google GenAI Client
GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
if not GEMINI_API_KEY:
    print("[HUD: WARNING] GEMINI_API_KEY not set in environment!")

client = genai.Client(api_key=GEMINI_API_KEY) if GEMINI_API_KEY else None

# =====================================================================
# Request / Response Schemas
# =====================================================================

class ReasoningRequest(BaseModel):
    prompt: str = Field(..., example="Calculate optimal torque vectoring distribution for AWD electric drivetrain.")
    system_instruction: str = Field(
        default="You are an AI optimized for accurate scientific reasoning.",
        example="Operate with strict physics and scientific accuracy."
    )
    temperature: float = Field(default=0.1, ge=0.0, le=2.0)
    model: str = Field(default="gemini-2.5-flash")

class TelemetryPayloadSchema(BaseModel):
    motor_front_nm: float = Field(..., description="Front axle torque in Newton-meters")
    motor_rear_nm: float = Field(..., description="Rear axle torque in Newton-meters")
    slip_ratio: float = Field(..., description="Tire slip ratio percentage")
    efficiency_score: float = Field(..., description="Calculated efficiency score between 0.0 and 1.0")

class HUDStatusResponse(BaseModel):
    status: str
    timestamp: str
    developer: str
    repository: str
    target_api_level: int
    active_model: str
    genai_sdk_status: str

# =====================================================================
# HUD Status & Diagnostic Endpoints
# =====================================================================

@app.get("/hud/status", response_model=HUDStatusResponse, tags=["HUD Telemetry"])
async def get_hud_status():
    """Returns HUD operational metrics and developer metadata."""
    sdk_status = "ONLINE" if client is not None else "OFFLINE (Missing API Key)"
    return HUDStatusResponse(
        status="OPERATIONAL",
        timestamp=datetime.datetime.now(datetime.timezone.utc).isoformat(),
        developer=DEVELOPER_PROFILE,
        repository=SOURCE_REPO,
        target_api_level=36,
        active_model="gemini-2.5-flash",
        genai_sdk_status=sdk_status
    )

@app.get("/hud/ping", tags=["HUD Telemetry"])
async def hud_ping():
    """High-speed pulse check endpoint for telemetry pinging."""
    return {"ping": "pong", "latency_ms": 1.2, "hud_active": True}

# =====================================================================
# Core Master AI Endpoints
# =====================================================================

@app.post("/api/v1/reasoning", tags=["Master AI Services"])
async def execute_scientific_reasoning(request: ReasoningRequest):
    """Executes high-precision text reasoning using the official GenAI SDK."""
    if not client:
        raise HTTPException(
            status_code=Status.HTTP_503_SERVICE_UNAVAILABLE,
            detail="Google GenAI Client is offline. Configure GEMINI_API_KEY."
        )

    try:
        config = types.GenerateContentConfig(
            system_instruction=request.system_instruction,
            temperature=request.temperature
        )
        
        response = client.models.generate_content(
            model=request.model,
            contents=request.prompt,
            config=config
        )
        
        return {
            "status": "SUCCESS",
            "prompt": request.prompt,
            "result": response.text,
            "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat()
        }
    except Exception as e:
        raise HTTPException(status_code=500, detail=f"GenAI Execution Error: {str(e)}")

@app.post("/api/v1/telemetry/structured", response_model=TelemetryPayloadSchema, tags=["Master AI Services"])
async def parse_structured_telemetry(prompt: str = Form(...)):
    """Parses natural text/telemetry input into guaranteed JSON matching Pydantic schema."""
    if not client:
        raise HTTPException(status_code=503, detail="Google GenAI Client offline.")

    try:
        config = types.GenerateContentConfig(
            response_mime_type="application/json",
            response_schema=TelemetryPayloadSchema,
            temperature=0.0
        )
        
        response = client.models.generate_content(
            model="gemini-2.5-flash",
            contents=prompt,
            config=config
        )
        
        return JSONResponse(content=response.text)
    except Exception as e:
        raise HTTPException(status_code=500, detail=f"Structured Parse Error: {str(e)}")

@app.post("/api/v1/multimodal/analyze", tags=["Master AI Services"])
async def analyze_media_file(
    prompt: str = Form(...),
    file: UploadFile = File(...)
):
    """Handles high-definition video/image uploads, transmits to GenAI Files API, and runs analysis."""
    if not client:
        raise HTTPException(status_code=503, detail="Google GenAI Client offline.")

    temp_path = f"/tmp/{file.filename}"
    try:
        # Save temporary file locally
        with open(temp_path, "wb") as buffer:
            buffer.write(await file.read())

        # Upload via GenAI Files API
        file_ref = client.files.upload(file=temp_path)

        # Polling loop for processing completion (videos/large assets)
        while file_ref.state.name == "PROCESSING":
            time.sleep(2)
            file_ref = client.files.get(name=file_ref.name)

        if file_ref.state.name == "FAILED":
            raise HTTPException(status_code=400, detail="Google Files API failed to process video frame payload.")

        # Execute multimodal content generation
        config = types.GenerateContentConfig(
            temperature=0.1,
            system_instruction="Analyze media stream with high spatial accuracy."
        )
        
        response = client.models.generate_content(
