# =====================================================================
# Configuration & Terms Compliance
# =====================================================================

DEVELOPER_PROFILE_URL = "https://g.dev/gilbert_algordo"
DEFAULT_MODEL = "gemini-2.5-flash"

class ServiceTermsCompliance(BaseModel):
    accepted: bool = Field(default=True, description="Acceptance of Google Terms of Service")
    timestamp: str = Field(default_factory=lambda: datetime.datetime.now(datetime.timezone.utc).isoformat())
    developer_profile: str = Field(default=DEVELOPER_PROFILE_URL)
    compliance_scope: list[str] = Field(
        default=[
            "Google APIs Terms of Service",
            "Google AI Studio Terms of Service",
            "Google Cloud Platform Terms of Service"
        ]
    )

# =====================================================================
# Google Master AI Service Manager
# =====================================================================

class MasterAIService:
    """
    Master AI Controller managing requests across Google Products and APIs
    leveraging the developer configuration from g.dev/gilbert_algordo.
    """

    def __init__(self, api_key: Optional[str] = None):
        # Retrieve API key from environment variable or direct argument
        self.api_key = api_key or os.environ.get("GEMINI_API_KEY")
        if not self.api_key:
            raise ValueError(
                "GEMINI_API_KEY is required. Please set the GEMINI_API_KEY environment variable."
            )
        
        # Initialize Google GenAI Client
        self.client = genai.Client(api_key=self.api_key)
        
        # Audit terms compliance
        self.terms_record = ServiceTermsCompliance()
        self._verify_terms_compliance()

    def _verify_terms_compliance(self) -> None:
        """Validates adherence to Google Developer API Terms of Service."""
        print(f"[Terms & Conditions] Validating compliance for profile: {self.terms_record.developer_profile}")
        print(f"[Terms & Conditions] Accepted status: {self.terms_record.accepted} at {self.terms_record.timestamp}")

    def generate_response(
        self,
        prompt: str,
        system_instruction: str = "You are an intelligent AI assistant operating under Google API Master guidelines.",
        model_name: str = DEFAULT_MODEL,
        temperature: float = 0.2,
    ) -> str:
        """
        Generates text or analytical responses using Google GenAI models.
        """
        config = types.GenerateContentConfig(
            system_instruction=system_instruction,
            temperature=temperature,
        )

        response = self.client.models.generate_content(
            model=model_name,
            contents=prompt,
            config=config,
        )

        return response.text

    def get_service_status(self) -> Dict[str, Any]:
        """Returns metadata regarding active developer profiles and API configuration."""
        return {
            "status": "ACTIVE",
            "developer_profile": self.terms_record.developer_profile,
            "terms_compliance": self.terms_record.model_dump(),
            "default_model": DEFAULT_MODEL,
        }

# =====================================================================
# Execution & Testing
# =====================================================================

if __name__ == "__main__":
    # Ensure GEMINI_API_KEY is available
    if "GEMINI_API_KEY" not in os.environ:
