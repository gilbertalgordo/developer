name: "2026 Google API ToS & OAuth2 Compliance CI"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      test_access_token:
        description: "Optional Google OAuth2 Access Token to audit manually"
        required: false
        default: ""

jobs:
  validate-google-tos-compliance:
    name: "Audit Google OAuth2 & 2026 ToS Compliance"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Core Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests pillow

      - name: "Authenticate to Google Cloud (Optional Workload Identity)"
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: "access_token"

      - name: "Execute Google OAuth2 ToS Compliance Script"
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          TEST_ACCESS_TOKEN: ${{ inputs.test_access_token || secrets.GOOGLE_OAUTH2_ACCESS_TOKEN }}
        run: |
          python validate_google_oauth2_tos.py

      - name: "Publish Audit Summary"
        if: always()
        run: |
          echo "### 2026 Google API ToS Audit Completed" >> $GITHUB_STEP_SUMMARY
          echo "Developer Profile: [https://g.dev/gilbert_algordo](https://g.dev/gilbert_algordo)" >> $GITHUB_STEP_SUMMARY
