import os
import io
from PIL import Image

# Import CairoSVG for rasterization
try:
    import cairosvg
    CAIROSVG_AVAILABLE = True
except ImportError:
    CAIROSVG_AVAILABLE = False
    print("[HUD: NOTICE] CairoSVG not detected. Falling back to PyMuPDF renderer.")

# Import PyMuPDF (fitz) as secondary fallback
try:
    import fitz
    FITZ_AVAILABLE = True
except ImportError:
    FITZ_AVAILABLE = False


class PlayStoreIconExporter:
    """
    Renders SVG vector assets into 512x512 32-bit RGBA PNG files 
    compliant with Google Play Store asset requirements.
    """

    def __init__(self, target_size: int = 512):
        self.target_size = target_size

    def convert_cairosvg(self, svg_input: str, output_path: str) -> None:
        """
        Converts SVG string or SVG file path directly to PNG using CairoSVG.
        """
        kwargs = {
            "output_width": self.target_size,
            "output_height": self.target_size,
            "write_to": output_path
        }

        if svg_input.strip().startswith("<svg"):
            # Process inline SVG XML string
            cairosvg.svg2png(bytestring=svg_input.encode("utf-8"), **kwargs)
        else:
            # Process disk file path
            cairosvg.svg2png(url=svg_input, **kwargs)

        self.verify_and_postprocess(output_path)

    def convert_pymupdf(self, svg_input: str, output_path: str) -> None:
        """
        Fallback renderer converting SVG via PyMuPDF (fitz) and Pillow.
        """
        if not FITZ_AVAILABLE:
            raise RuntimeError("Neither CairoSVG nor PyMuPDF is available. Install 'cairosvg' or 'pymupdf'.")

        if svg_input.strip().startswith("<svg"):
            doc = fitz.open(stream=svg_input.encode("utf-8"), filetype="svg")
        else:
            doc = fitz.open(svg_input)

        page = doc[0]
        # Calculate matrix scaling for exact target size (e.g., 512x512)
        rect = page.rect
        zoom_x = self.target_size / rect.width
        zoom_y = self.target_size / rect.height
        mat = fitz.Matrix(zoom_x, zoom_y)

        pix = page.get_pixmap(matrix=mat, alpha=True)
        
        # Load pixmap data into Pillow
        img = Image.frombytes("RGBA", [pix.width, pix.height], pix.samples)
        img.save(output_path, "PNG")
        self.verify_and_postprocess(output_path)

    def verify_and_postprocess(self, png_path: str) -> None:
        """
        Validates PNG dimensions, color format (RGBA), and compliance.
        """
        with Image.open(png_path) as img:
            width, height = img.size
            mode = img.mode

            print(f"[HUD: VERIFY] File: {png_path}")
            print(f" -> Resolution: {width}x{height} (Required: 512x512)")
            print(f" -> Color Mode: {mode} (Required: RGBA or RGB)")

            if width != self.target_size or height != self.target_size:
                # Force exact resize via Pillow high-quality Lanczos filter
                print(f" -> Resizing frame to exact {self.target_size}x{self.target_size}...")
                img = img.resize((self.target_size, self.target_size), Image.Resampling.LANCZOS)
                img.save(png_path, "PNG")

            print(" -> Google Play Store Status: PASSED ✅\n")

    def export_batch(self, svg_files: dict, output_dir: str = "./png_output"):
        """
        Batch converts a dictionary mapping of filenames to SVG strings or file paths.
        """
        os.makedirs(output_dir, exist_ok=True)

        for filename, svg_data in svg_files.items():
            output_path = os.path.join(output_dir, filename)
            print(f"[HUD: CONVERTING] Processing {filename}...")

            if CAIROSVG_AVAILABLE:
                self.convert_cairosvg(svg_data, output_path)
            else:
                self.convert_pymupdf(svg_data, output_path)


