const { app, BrowserWindow, ipcMain } = require('electron');
const path = require('path');
const { spawn } = require('child_process');

let mainWindow;
let aiWorker;

function bootstrapApp() {
  mainWindow = new BrowserWindow({
    width: 1400,
    height: 850,
    backgroundColor: '#0a0e17',
    webPreferences: {
      nodeIntegration: true,
      contextIsolation: false
    }
  });

  mainWindow.loadFile(path.join(__dirname, 'interface', 'hud_dashboard.html'));

  // Initialize the local background Active AI process
  aiWorker = spawn('python', [path.join(__dirname, 'core', 'active_ai_core.py')]);

  aiWorker.stdout.on('data', (data) => {
    mainWindow.webContents.send('ai-telemetry-push', data.toString());
  });

  aiWorker.stderr.on('data', (err) => {
    console.error(`AI Engine Error: ${err}`);
  });
}

app.whenReady().then(bootstrapApp);

app.on('window-all-closed', () => {
  if (aiWorker) aiWorker.kill();
  if (process.platform !== 'darwin') app.quit();
});



import sys
import json
import time

def evaluate_runtime_telemetry(payload):
    """Processes frame data and executes active reasoning algorithms locally."""
    try:
        data = json.loads(payload)
        frame_rate = data.get("fps", 60)
        memory_usage = data.get("memory", "Normal")
        
        # Advanced Active Decision Logic
        optimization_status = "Optimal"
        if frame_rate < 30:
            optimization_status = "Boosted SWF Execution Threads"
            
        response = {
            "engine": "Active-AI-Offline",
            "timestamp": time.time(),
            "status": optimization_status,
            "metrics": {
                "active_fps": frame_rate,
                "heap_state": memory_usage,
                "ai_confidence": 0.984
            }
        }
        return json.dumps(response)
    except Exception as e:
        return json.dumps({"error": str(e)})

if __name__ == "__main__":
    for raw_input in sys.stdin:
        result = evaluate_runtime_telemetry(raw_input)
        print(result)
        sys.stdout.flush()



