<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%" style="background:#060a12; border-radius:10px; font-family:'Courier New', monospace;">
  <defs>
    <!-- High-intensity matrix neon glow -->
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Linear gradient accents for geometric lines -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Ground Grid Vectors (Decorative background lines) -->
  <path d="M 0 20 L 500 20 M 0 110 L 500 110" stroke="#0f172a" stroke-width="1"/>
  <path d="M 65 0 L 65 130 M 435 0 L 435 130" stroke="#0f172a" stroke-width="1"/>

  <!-- Outer Glassmorphic Framing Shell -->
  <rect x="8" y="8" width="484" height="114" rx="6" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="12" y="12" width="476" height="106" rx="4" fill="none" stroke="url(#cyber-grad)" stroke-width="1.5" stroke-dasharray="15 40 120 40 15 200"/>

  <!-- Advanced Crosshair Target Tracking Assembly -->
  <g transform="translate(42, 65)">
    <circle r="28" fill="none" stroke="#00ffcc" stroke-width="0.75" stroke-dasharray="2 6" opacity="0.4"/>
    <circle r="20" fill="none" stroke="#0055ff" stroke-width="1" opacity="0.6"/>
    <circle r="12" fill="none" stroke="#00ffcc" stroke-width="1.5" filter="url(#hud-glow)"/>
    <circle r="2.5" fill="#00ffcc" filter="url(#hud-glow)"/>
    <!-- Reticle ticks -->
    <path d="M -34 0 L -24 0 M 24 0 L 34 0 M 0 -34 L 0 -24 M 0 24 L 0 34" stroke="#00ffcc" stroke-width="1"/>
    <!-- Triangular target lock frames -->
    <path d="M -16 -16 L -16 -10 M -16 -16 L -10 -16" fill="none" stroke="#00ffcc" stroke-width="1"/>
    <path d="M 16 16 L 16 10 M 16 16 L 10 16" fill="none" stroke="#00ffcc" stroke-width="1"/>
  </g>

  <!-- Operational Telemetry Text -->
  <!-- Status line -->
  <g transform="translate(92, 40)">
    <text x="0" y="0" fill="#00ffcc" font-size="13" font-weight="900" letter-spacing="3" filter="url(#hud-glow)">GPS_SIGNAL_LOCK // SECURE</text>
    <rect x="235" y="-10" width="40" height="12" fill="rgba(0, 255, 204, 0.1)" stroke="#00ffcc" stroke-width="0.5"/>
    <text x="241" y="0" fill="#00ffcc" font-size="9" font-weight="bold">ONLINE</text>
  </g>

  <!-- Metric parameters fields -->
  <text x="92" y="66" fill="#ffffff" font-size="12" opacity="0.85">> SYS.REGION: CALABARZON, PH</text>
  <text x="92" y="86" fill="#ffffff" font-size="12" opacity="0.85">> COORD.DATA: 14.3516° N / 121.0507° E</text>
  <text x="92" y="104" fill="#0055ff" font-size="10" opacity="0.7">> SOURCE_NODE: OPEN_STREET_GRID_V2</text>

  <!-- Micro Binary Accents / Framing Brackets -->
  <text x="445" y="28" fill="#1e293b" font-size="8" font-weight="bold">01101</text>
  <text x="445" y="108" fill="#1e293b" font-size="8" font-weight="bold">76.4A</text>
  <path d="M 15 32 L 15 15 L 32 15" fill="none" stroke="#00ffcc" stroke-width="2.5"/>
  <path d="M 485 98 L 485 115 L 468 115" fill="none" stroke="#00ffcc" stroke-width="2.5"/>
</svg>



