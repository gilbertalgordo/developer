import time
from fastapi import FastAPI, Request, HTTPException
from starlette.responses import JSONResponse

app = FastAPI()

# Known ad-scraping and malicious crawler signatures
BLOCKED_USER_AGENTS = [
    "bytespider",
    "ccbot",
    "gptbot",
    "claude-web",
    "anthropic-ai",
    "perplexitybot",
    "Scrapy",
    "Python-urllib",
    "python-requests"
]

# Simple in-memory rate limiter store (Use Redis in production)
REQUEST_COUNTS = {}
RATE_LIMIT_WINDOW = 60  # seconds
MAX_REQUESTS_PER_WINDOW = 30

@app.middleware("http")
async def anti_crawler_shield(request: Request, call_next):
    client_ip = request.client.host
    user_agent = request.headers.get("user-agent", "").lower()
    
    # 1. Block by Malicious/Ad-Scraper User Agent Signatures
    if any(bot in user_agent for bot in BLOCKED_USER_AGENTS):
        return JSONResponse(
            status_code=403,
            content={"error": "Access Denied: Automated crawler or ad-scraper detected."}
        )
    
    # 2. Block Requests Missing Standard Headers (Headless Browser / Bot indicator)
    if not request.headers.get("accept-language") or not request.headers.get("accept"):
        return JSONResponse(
            status_code=403,
            content={"error": "Access Denied: Missing standard browser headers."}
        )

    # 3. Behavioral Rate Limiting (Mitigates brute-force scraping & ad fraud)
    current_time = time.time()
    if client_ip not in REQUEST_COUNTS:
        REQUEST_COUNTS[client_ip] = {"count": 1, "start_time": current_time}
    else:
        data = REQUEST_COUNTS[client_ip]
        if current_time - data["start_time"] < RATE_LIMIT_WINDOW:
            data["count"] += 1
            if data["count"] > MAX_REQUESTS_PER_WINDOW:
                return JSONResponse(
                    status_code=429,
                    content={"error": "Rate limit exceeded. Too many requests."}
                )
        else:
            REQUEST_COUNTS[client_ip] = {"count": 1, "start_time": current_time}

    response = await call_next(request)
    return response

@app.get("/")
async def home():
    return {"message": "Protected resource active."}



import { NextResponse } from 'next/server';
import type { NextRequest } from 'next/server';

export function middleware(request: NextRequest) {
  const userAgent = request.headers.get('user-agent')?.toLowerCase() || '';
  const acceptLanguage = request.headers.get('accept-language');

  // Define malicious scrapers or unwanted automated ad collectors
  const blockedSignatures = [
    'bytespider',
    'ccbot',
    'gptbot',
    'scrapy',
    'python-requests',
    'httrack'
  ];

  // Check user agent patterns
  const isBlockedUA = blockedSignatures.some(sig => userAgent.includes(sig));

  if (isBlockedUA || !acceptLanguage) {
    return new NextResponse(
      JSON.stringify({ error: 'Forbidden: Crawler/Scraper access restricted.' }),
      { status: 403, headers: { 'content-type': 'application/json' } }
    );
  }

  return NextResponse.next();
}

