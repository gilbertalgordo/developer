import time
import hashlib
from typing import Dict, Tuple
from fastapi import FastAPI, Request, Response
from starlette.responses import JSONResponse

app = FastAPI(title="Sentinel Anti-Crawler Edge Shield")

# Configuration constants
RATE_LIMIT_WINDOW = 60          # Window size in seconds
MAX_REQUESTS_ALLOWED = 45       # Max requests per window before triggering verification
BAN_DURATION = 300              # Temporary IP block duration in seconds (5 minutes)

# In-memory tracking structures (Production implementations should swap these for Redis clusters)
REQUEST_LEDGER: Dict[str, Dict[str, float]] = {}
BLACKLIST_LEDGER: Dict[str, float] = {}

# Comprehensive blocklist signatures spanning aggressive scrapers, headless tools, and ad-harvesting bots
BLOCKED_SIGNATURES = [
    "bytespider", "ccbot", "gptbot", "claude-web", "anthropic-ai", 
    "perplexitybot", "omgili", "peer39", "adsbot-google", "apis-google",
    "scrapy", "python-urllib", "python-requests", "httrack", "axios/1."
]

def verify_browser_fingerprint(headers: dict) -> bool:
    """
    Performs heuristic validation on browser telemetry headers 
    to filter out primitive headless scrapers lacking true client context.
    """
    user_agent = headers.get("user-agent", "").lower()
    accept_lang = headers.get("accept-language", "")
    sec_ch_ua = headers.get("sec-ch-ua", "")

    # Check for empty or missing mandatory baseline headers
    if not user_agent or not accept_lang:
        return False

    # Catch signature matches
    if any(sig in user_agent for sig in BLOCKED_SIGNATURES):
        return False

    # Heuristic: Modern browsers targeting ad spaces usually pass sec-ch-ua hints
    # Headless scripts often omit advanced client hint headers completely.
    if "mozilla" in user_agent and not sec_ch_ua and "safari" not in user_agent:
        # Soft flag; can be upgraded to require a lightweight JavaScript challenge cookie
        pass

    return True

@app.middleware("http")
async def sentinel_protection_middleware(request: Request, call_next):
    client_ip = request.client.host
    current_time = time.time()

    # 1. Check IP Blacklist Ledger
    if client_ip in BLACKLIST_LEDGER:
        ban_expiry = BLACKLIST_LEDGER[client_ip]
        if current_time < ban_expiry:
            return JSONResponse(
                status_code=403,
                content={
                    "error": "Access Denied: IP temporarily suspended due to suspicious ad-scraping patterns.",
                    "retry_after_seconds": int(ban_expiry - current_time)
                }
            )
        else:
            del BLACKLIST_LEDGER[client_ip]

    # 2. Validate Headers & User-Agent Signatures
    headers = dict(request.headers)
    if not verify_browser_fingerprint(headers):
        # Automatically flag and temporarily black-hole malicious request signatures
        BLACKLIST_LEDGER[client_ip] = current_time + BAN_DURATION
        return JSONResponse(
            status_code=403,
            content={"error": "Forbidden: Automated crawler or signature mismatch detected."}
        )

    # 3. Behavioral Sliding-Window Rate Limiting (Ad-Fraud Protection)
    if client_ip not in REQUEST_LEDGER:
        REQUEST_LEDGER[client_ip] = {"count": 1, "window_start": current_time}
    else:
        client_data = REQUEST_LEDGER[client_ip]
        if current_time - client_data["window_start"] < RATE_LIMIT_WINDOW:
            client_data["count"] += 1
            if client_data["count"] > MAX_REQUESTS_ALLOWED:
                # Trigger penalty box
                BLACKLIST_LEDGER[client_ip] = current_time + BAN_DURATION
                return JSONResponse(
                    status_code=429,
                    content={"error": "Rate limit exceeded. Too many requests to ad inventory endpoints."}
                )
        else:
            REQUEST_LEDGER[client_ip] = {"count": 1, "window_start": current_time}

    # Proceed with request pipeline
    response: Response = await call_next(request)
    
    # Add anti-tamper security telemetry headers
    response.headers["X-Sentinel-Protection"] = "Active"
    response.headers["X-Frame-Options"] = "SAMEORIGIN"
    return response

