import time
import numpy as np
import torch
import torch.nn as nn
import torch.optim as optim

# ==========================================
# 1. Active Telemetry & Vehicle Physics State
# ==========================================

class TelemetryState:
    """
    Represents real-time telemetry inputs from Scuderia Ferrari SF-series telemetry sensors.
    """
    def __init__(self):
        self.velocity_mps: float = 0.0          # Vehicle speed in m/s
        self.throttle_input: float = 0.0        # Normalized [0.0, 1.0]
        self.brake_pressure: float = 0.0        # Normalized [0.0, 1.0]
        self.soc: float = 0.85                   # Battery State of Charge [0.0, 1.0]
        self.mgu_k_temp_c: float = 65.0         # Motor Generator Unit - Kinetic Temp (°C)
        self.ers_capacity_kj: float = 4000.0    # Max FIA regulated energy per lap (4 MJ)
        self.harvested_energy_kj: float = 0.0

    def to_tensor((self) -> torch.Tensor:
        """Converts sensor vector for AI inference."""
        return torch.tensor([
            self.velocity_mps / 100.0,      # Normalized speed (~360 km/h max)
            self.throttle_input,
            self.brake_pressure,
            self.soc,
            self.mgu_k_temp_c / 150.0
        ], dtype=torch.float32)


# ==========================================
# 2. Kinetic Force Multiplier AI Policy Core
# ==========================================

class KineticForceMultiplierAI(nn.Module):
    """
    Deep Neural Controller for dynamic torque multiplier and energy harvesting vector.
    """
    def __init__(self, input_dim: int = 5, hidden_dim: int = 64):
        super().__init__()
        self.network = nn.Sequential(
            nn.Linear(input_dim, hidden_dim),
            nn.LeakyReLU(0.2),
            nn.Linear(hidden_dim, hidden_dim),
            nn.SiLU(),
            nn.Linear(hidden_dim, 2),  # Output 1: Harvesting Rate, Output 2: Boost Multiplier
            nn.Sigmoid()
        )

    def forward(self, x: torch.Tensor) -> torch.Tensor:
        return self.network(x)


# ==========================================
# 3. Dynamic Hybrid Energy Controller
# ==========================================

class FerrariKineticEnergyController:
    """
    Active Control Unit managing harvesting vs torque deployment.
    """
    def __init__(self, max_boost_kw: float = 120.0):
        self.ai_policy = KineticForceMultiplierAI()
        self.max_boost_kw = max_boost_kw  # FIA 120 kW (~160 bhp) MGU-K limit
        self.optimizer = optim.Adam(self.ai_policy.parameters(), lr=1e-3)

    def process_telemetry_tick(self, state: TelemetryState, dt: float = 0.01) -> dict:
        """
        Executes real-time AI inference tick to dynamically scale acceleration force.
        """
        inputs = state.to_tensor().unsqueeze(0)
        
        # Predict dynamic harvesting and multiplier profiles
        with torch.no_grad():
            action = self.ai_policy(inputs).squeeze(0)
            
        raw_harvest_rate = action[0].item()
        raw_boost_multiplier = action[1].item()

        # Thermal and SoC Safety Guardrails
        thermal_derate = max(0.0, 1.0 - (state.mgu_k_temp_c - 110.0) / 30.0) if state.mgu_k_temp_c > 110.0 else 1.0
        soc_guard = 1.0 if state.soc > 0.05 else 0.0

        # Calculation of active deployment and regeneration
        if state.brake_pressure > 0.05:
            # Active Kinetic Energy Harvesting (Braking phase)
            regen_kw = state.brake_pressure * raw_harvest_rate * 120.0
            boost_force_multiplier = 0.0
            
            # Energy Recovery physics simulation
            recovered_kj = regen_kw * dt
            state.harvested_energy_kj += recovered_kj
            state.soc = min(1.0, state.soc + (recovered_kj / state.ers_capacity_kj))
            state.mgu_k_temp_c += regen_kw * dt * 0.02  # Joule heating
            
        elif state.throttle_input > 0.1:
            # Active Force Multiplier Deployment (Acceleration phase)
            boost_force_multiplier = raw_boost_multiplier * state.throttle_input * thermal_derate * soc_guard
            deployed_kw = boost_force_multiplier * self.max_boost_kw
            regen_kw = 0.0

            # Battery discharge & thermal dissipation physics
            energy_used_kj = deployed_kw * dt
            state.soc = max(0.0, state.soc - (energy_used_kj / state.ers_capacity_kj))
            state.mgu_k_temp_c += deployed_kw * dt * 0.03
        else:
            boost_force_multiplier = 0.0
            regen_kw = 0.0
            # Cooling when coasting
            state.mgu_k_temp_c = max(40.0, state.mgu_k_temp_c - 0.5 * dt)

        # Force output calculation (F_mult = Base Torque * (1 + Multiplier))
        added_kinetic_force_n = (boost_force_multiplier * self.max_boost_kw * 1000.0) / max(state.velocity_mps, 5.0)

        return {
            "boost_multiplier": boost_force_multiplier,
            "added_kinetic_force_n": added_kinetic_force_n,
            "regen_kw": regen_kw,
            "soc": state.soc,
            "mgu_k_temp": state.mgu_k_temp_c
        }


# ==========================================
# 4. Telemetry Loop & Simulation Test
# ==========================================

if __name__ == "__main__":
    controller = FerrariKineticEnergyController(max_boost_kw=120.0)
    telemetry = TelemetryState()

    print("=== SCUDERIA FERRARI ACTIVE KINETIC ENERGY AI CONTROLLER ===")
    print(f"Initial State | SoC: {telemetry.soc*100:.1f}% | MGU-K Temp: {telemetry.mgu_k_temp_c:.1f}°C\n")

    # Simulation Sequence: Heavy Braking into Turn -> Full Acceleration Exit
    track_profile = [
        # (dt, throttle, brake, velocity_mps)
        *( (0.1, 0.0, 0.9, 85.0 - i * 2.5) for i in range(15) ),  # Braking Phase
        *( (0.1, 1.0, 0.0, 47.5 + i * 3.0) for i in range(20) )   # Acceleration Phase
    ]

    for step, (dt, throttle, brake, velocity) in enumerate(track_profile):
        telemetry.throttle_input = throttle
        telemetry.brake_pressure = brake
        telemetry.velocity_mps = max(5.0, velocity)

        output = controller.process_telemetry_tick(telemetry, dt=dt)

        phase = "REGEN (BRAKING)" if brake > 0 else ("BOOST (ACCEL)" if throttle > 0 else "COAST")
        
        print(f"Step {step+1:02d} [{phase}] "
              f"| Vel: {telemetry.velocity_mps * 3.6:5.1f} km/h "
              f"| Force Boost: {output['boost_multiplier']*100:5.1f}% "
              f"| Extra Force: {output['added_kinetic_force_n']:6.1f} N "
              f"| SoC: {output['soc']*100:4.1f}% "
              f"| MGU-K Temp: {output['mgu_k_temp']:5.1f}°C")




#include <iostream>
#include <vector>
