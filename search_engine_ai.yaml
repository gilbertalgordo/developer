# code_search_engine.py
import re
import os
import json
from collections import defaultdict

class CodeSearchEngine:
    def __init__(self):
        # Maps 3-char string -> set of absolute file paths
        self.trigram_index = defaultdict(set)
        # Fast memory map of absolute path -> raw text lines
        self.file_cache = {}

    def index_file(self, file_path: str, content: str):
        """Builds a deep inverted trigram index of the source code."""
        self.file_cache[file_path] = content.splitlines()
        
        # Strip structural spaces for dense index processing
        clean_text = content
        if len(clean_text) < 3:
            return

        # Extract all sliding 3-character sequences (trigrams)
        for i in range(len(clean_text) - 2):
            trigram = clean_text[i:i+3]
            self.trigram_index[trigram].add(file_path)

    def _extract_query_trigrams(self, regex_pattern: str) -> list:
        """Extracts literal text slices from a regex pattern to use for fast filtering."""
        # Strip standard regex metacharacters to find literal strings
        literals = re.split(r'[\.\*\+\?\{\}\[\]\(\)\|\^\$\\]', regex_pattern)
        trigrams = []
        for lit in literals:
            if len(lit) >= 3:
                for i in range(len(lit) - 2):
                    trigrams.append(lit[i:i+3])
        return trigrams

    def search(self, regex_query: str):
        """Performs optimized code search via accelerated structural pre-filtering."""
        try:
            compiled_regex = re.compile(regex_query, re.IGNORECASE)
        except re.error as e:
            return {"error": f"Invalid Regex Syntax: {str(e)}", "results": []}

        # Step 1: Extract filtering tokens from the regular expression
        query_trigrams = self._extract_query_trigrams(regex_query)
        
        # Step 2: Candidates narrowing using the Inverted Index
        candidate_files = set(self.file_cache.keys())
        
        if query_trigrams:
            # Intersect sets to drastically scale down text pointer scanning space
            for trigram in query_trigrams:
                if trigram in self.trigram_index:
                    candidate_files.intersection_update(self.trigram_index[trigram])
                else:
                    # Trigram specified in literals doesn't exist anywhere
                    candidate_files = set()
                    break

        # Step 3: Deep Pattern Match within Candidate Sample Spaces
        results = []
        for file_path in candidate_files:
            lines = self.file_cache[file_path]
            file_matches = []
            
            for line_num, line_content in enumerate(lines, 1):
                match = compiled_regex.search(line_content)
                if match:
                    file_matches.append({
                        "line": line_num,
                        "content": line_content.strip(),
                        "match_bounds": match.span()
                    })
            
            if file_matches:
                results.append({
                    "filepath": file_path,
                    "filename": os.path.basename(file_path),
                    "matches": file_matches
                })
                
        return {"error": None, "results": results}

