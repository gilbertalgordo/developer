            const container = document.getElementById('file-registry-view');
            container.innerHTML = systemFileSystem.map(node => `
                <div class="p-3 rounded-xl bg-slate-950/20 border border-white/5 flex items-center justify-between hover:border-white/10 transition-colors">
                    <span class="text-slate-300 truncate max-w-[240px]">${node.filepath}</span>
                    <span class="text-slate-500 text-[10px] bg-slate-950/60 px-1.5 py-0.5 rounded border border-white/5">${node.content.split('\n').length} lines</span>
                </div>
            `).join('');
        }

        function processPipelineSearch() {
            const startTime = performance.now();
            const patternStr = document.getElementById('regex-search-field').value;
            const viewport = document.getElementById('search-results-viewport');
            const counter = document.getElementById('hit-counter');
            const latencyTracker = document.getElementById('telemetry-latency');

            if (!patternStr.trim()) {
                viewport.innerHTML = '<div class="frosted-hud-panel rounded-2xl p-10 text-center text-slate-500 font-mono text-xs uppercase tracking-wider">Awaiting query pattern entry to initiate indexing pipeline...</div>';
                counter.innerText = "0 hits found";
                latencyTracker.innerText = "0.00ms";
                return;
            }

            try {
                const regex = new RegExp(patternStr, 'i');
                let totalMatches = 0;
                let bufferHTML = '';

                systemFileSystem.forEach(file => {
                    const lines = file.content.split('\n');
                    let matchesInFile = [];

                    lines.forEach((line, index) => {
                        if (regex.test(line)) {
                            totalMatches++;
                            const highlighted = line.replace(regex, match => `<span class="bg-cyan-500/30 border-b border-cyan-400 text-cyan-200 px-0.5 rounded font-bold">${match}</span>`);
                            matchesInFile.push({ lineNum: index + 1, content: highlighted });
                        }
                    });

                    if (matchesInFile.length > 0) {
                        bufferHTML += `
                            <div class="frosted-hud-panel rounded-2xl overflow-hidden">
                                <div class="bg-white/5 px-4 py-2.5 border-b border-white/5 flex items-center justify-between font-mono text-xs">
                                    <span class="text-cyan-300 font-bold truncate">${file.filepath}</span>
                                    <span class="text-[9px] text-slate-400 uppercase tracking-widest bg-slate-950 px-2 py-0.5 rounded border border-white/5 font-semibold">${matchesInFile.length} matching positions</span>
                                </div>
                                <div class="p-4 flex flex-col gap-2 font-mono text-xs bg-slate-950/20">
                        `;
                        
                        matchesInFile.forEach(match => {
                            bufferHTML += `
                                    <div class="flex items-start gap-4 hover:bg-white/5 p-1 rounded transition-colors">
                                        <span class="text-slate-600 text-right w-6 select-none pt-0.5 font-bold">${match.lineNum}</span>
                                        <pre class="text-slate-300 whitespace-pre-wrap overflow-x-auto flex-1 font-mono">${match.content}</pre>
                                    </div>
                            `;
                        });
                        
                        bufferHTML += `
                                </div>
                            </div>
                        `;
                    }
                });

                const duration = performance.now() - startTime;
                latencyTracker.innerText = `${duration.toFixed(2)}ms`;
                counter.innerText = `${totalMatches} hits found`;
                viewport.innerHTML = bufferHTML || '<div class="frosted-hud-panel rounded-2xl p-10 text-center text-slate-500 font-mono text-xs uppercase tracking-wider">0 documents resolved through pattern criteria matching.</div>';

            } catch (err) {
                counter.innerText = "SYNTAX ERROR";
                latencyTracker.innerText = "0.00ms";
                viewport.innerHTML = `
                    <div class="border border-rose-500/30 bg-rose-950/20 backdrop-blur-md rounded-2xl p-5 font-mono text-xs text-rose-300">
                        <div class="font-bold text-sm mb-1 uppercase tracking-widest text-rose-400">Regular Expression Compilation Fault</div>
                        <div>${err.message}</div>
                    </div>
                `;
            }
        }

        // Initialize Runtime Engine
        initializeRegistryView();
        processPipelineSearch();
    </script>
</body>
</html>
