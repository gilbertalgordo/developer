# engine.py
import re
import os
import json
import time
from collections import defaultdict
from typing import Dict, List, Set, Any

class AdvancedCodeSearchEngine:
    def __init__(self):
        # Maps 3-character slices -> Set of file identifiers
        self.trigram_index: Dict[str, Set[str]] = defaultdict(set)
        # In-memory document storage cache mapping FilePath -> Content Lines
        self.document_cache: Dict[str, List[str]] = {}
        
    def add_to_index(self, file_id: str, raw_content: str):
        """Indexes a document using deep sliding structural trigrams."""
        lines = raw_content.splitlines()
        self.document_cache[file_id] = lines
        
        # Extract trigrams over the raw data pool
        for i in range(len(raw_content) - 2):
            trigram = raw_content[i:i+3]
            self.trigram_index[trigram].add(file_id)

    def _parse_query_literals(self, regex_pattern: str) -> List[str]:
        """Extracts structural raw chunks from regex string for indexing matching."""
        # Strip out common regex meta characters to find raw search constants
        tokens = re.split(r'[\.\*\+\?\{\}\[\]\(\)\|\^\$\\]', regex_pattern)
        trigrams = []
        for token in tokens:
            if len(token) >= 3:
                for i in range(len(token) - 2):
                    trigrams.append(token[i:i+3])
        return trigrams

    def search(self, regex_pattern: str, timeout_ms: float = 100.0) -> Dict[str, Any]:
        """Executes hyper-optimized regex matching against the inverted index matrix."""
        start_time = time.perf_counter()
        
        try:
            compiled_regex = re.compile(regex_pattern, re.IGNORECASE)
        except re.error as e:
            return {"error": f"Invalid Regex Syntax: {str(e)}", "results": [], "telemetry": {}}

        # Step 1: Pre-filter files using trigram intersections
        literals = self._parse_query_literals(regex_pattern)
        candidate_files = set(self.document_cache.keys())
        
        if literals:
            for trigram in literals:
                if trigram in self.trigram_index:
                    candidate_files.intersection_update(self.trigram_index[trigram])
                else:
                    candidate_files = set() # Early exit if literal slice nowhere to be found
                    break

        # Step 2: Line-by-line pinpoint matching with execution guardrails
        match_payload = []
        total_hits = 0
        
        for file_path in candidate_files:
            file_hits = []
            for idx, line in enumerate(self.document_cache[file_path], 1):
                # ReDoS guardrail check
                if (time.perf_counter() - start_time) * 1000 > timeout_ms:
                    return {
                        "error": "Query execution timed out (ReDoS Guardrail limit hit)",
                        "results": match_payload,
                        "telemetry": {"execution_ms": timeout_ms, "file_scans": len(match_payload)}
                    }
                
                match = compiled_regex.search(line)
                if match:
                    total_hits += 1
                    file_hits.append({
                        "line_number": idx,
                        "line_content": line.strip(),
                        "bounds": match.span()
                    })
            
            if file_hits:
                match_payload.append({
                    "filepath": file_path,
                    "filename": os.path.basename(file_path),
                    "matches": file_hits
                })

        duration = (time.perf_counter() - start_time) * 1000
        return {
            "error": None,
            "results": match_payload,
            "telemetry": {
                "execution_ms": round(duration, 3),
                "total_matches": total_hits,
                "files_evaluated": len(candidate_files)
            }
        }

