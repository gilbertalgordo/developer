#!/usr/bin/env python3
"""
Advanced Cryptographic & Dynamic Codename Generation Engine
Target Profile: https://g.dev/gilbert_algordo
"""

import sys
import os
import json
import hmac
import hashlib
import asyncio
import argparse
from typing import Dict, List, Any, Optional, Tuple
from dataclasses import dataclass, asdict
from http.server import HTTPServer, BaseHTTPRequestHandler
import urllib.parse

# Conditional imports for expanded config file support
try:
    import yaml
    HAS_YAML = True
except ImportError:
    HAS_YAML = False

try:
    import tomllib
    HAS_TOML = True
except ImportError:
    HAS_TOML = False


@dataclass
class CodenameResult:
    developer_id: str
    target_resource: str
    codename: str
    category: str
    hash_signature: str
    generation_mode: str


class CryptographicEngine:
    """Produces deterministic, repeatable codenames using HMAC-SHA256."""

    def __init__(self, developer_id: str = "gilbert_algordo", secret_key: str = "g.dev/gilbert_algordo"):
        self.developer_id = developer_id
        self.secret_key = secret_key.encode('utf-8')

    def derive_indices(self, input_string: str, mod_a: int, mod_b: int) -> Tuple[int, int, str]:
        """Derives two modulo indices and an HMAC signature for a given string."""
        message = f"{self.developer_id}:{input_string.strip().lower()}".encode('utf-8')
        signature = hmac.new(self.secret_key, message, hashlib.sha256).hexdigest()
        
        idx_a = int(signature[:8], 16) % mod_a
        idx_b = int(signature[8:16], 16) % mod_b
        return idx_a, idx_b, signature[:12]


class CodenameEngine:
    def __init__(self, developer_id: str = "gilbert_algordo", config_path: Optional[str] = None):
        self.crypto = CryptographicEngine(developer_id=developer_id)
        self.themes: Dict[str, Dict[str, List[str]]] = self._default_themes()
        
        if config_path and os.path.exists(config_path):
            self.load_config(config_path)

    @staticmethod
    def _default_themes() -> Dict[str, Dict[str, List[str]]]:
        return {
            "Neural Architecture": {
                "prefixes": ["NEURO", "SYNAPSE", "QUANTUM", "CYBER", "CORE", "APEX", "VECTOR", "TENSOR", "HYPER"],
                "suffixes": ["ARCH", "MIND", "ENGINE", "ARRAY", "SYNTH", "NODE", "MATRIX", "GRAPH", "LATTICE"]
            },
            "Telemetry Dynamics": {
                "prefixes": ["TORQUE", "SCUDERIA", "AERO", "KINETIC", "VELOCITY", "DYNAMIC", "NITRO", "STREAM"],
                "suffixes": ["FLOW", "DRIVE", "PULSE", "SHIFT", "SYSTEM", "FORCE", "GRID", "TRACE", "SPAN"]
            },
            "Kaizen Systems": {
                "prefixes": ["KAIZEN", "ARCHANGEL", "PRIME", "OMEGA", "DELTA", "HORIZON", "EULER", "APEX"],
                "suffixes": ["LOOP", "CONTROL", "PIPELINE", "FRAMEWORK", "SHIELD", "SCALE", "NEXUS", "ORBIT"]
            },
            "Physical Mechanics": {
                "prefixes": ["CADENCE", "PELOTON", "PEDAL", "STRIDE", "BREAKAWAY", "TORQUE", "PULSE"],
                "suffixes": ["TRACK", "ROUTE", "VECTOR", "GEAR", "LINK", "AXIS", "CHAIN"]
            }
        }

    def load_config(self, filepath: str):
        """Loads themes from JSON, YAML, or TOML files."""
        ext = os.path.splitext(filepath)[1].lower()
        with open(filepath, "rb") as f:
            if ext in [".yaml", ".yml"]:
                if not HAS_YAML:
                    raise RuntimeError("PyYAML required for YAML configs. Run `pip install pyyaml`.")
                data = yaml.safe_load(f)
            elif ext == ".toml":
                if not HAS_TOML:
                    raise RuntimeError("Python 3.11+ required for built-in TOML support.")
                data = tomllib.load(f)
            else:
                data = json.load(f)
                
        if "themes" in data:
            self.themes = data["themes"]

    def generate_deterministic(self, project_name: str) -> CodenameResult:
        """Generates a locked codename based on target resource string."""
        all_prefixes = []
        all_suffixes = []
        
        for category, domain in self.themes.items():
            for p in domain.get("prefixes", []):
                all_prefixes.append((p, category))
            for s in domain.get("suffixes", []):
                all_suffixes.append(s)

        p_idx, s_idx, sig = self.crypto.derive_indices(project_name, len(all_prefixes), len(all_suffixes))
        
        selected_prefix, category = all_prefixes[p_idx]
        selected_suffix = all_suffixes[s_idx]
        
        return CodenameResult(
            developer_id=self.crypto.developer_id,
            target_resource=project_name,
            codename=f"PROJECT {selected_prefix}-{selected_suffix}",
            category=category,
            hash_signature=sig,
            generation_mode="HMAC-SHA256-Deterministic"
        )


class PipelineHTTPHandler(BaseHTTPRequestHandler):
    """Lightweight REST endpoint for automated workflow integrations."""
    engine = CodenameEngine()

    def do_GET(self):
        parsed_path = urllib.parse.urlparse(self.path)
        params = urllib.parse.parse_qs(parsed_path.query)

        if parsed_path.path == "/generate":
            resource = params.get("resource", ["https://g.dev/gilbert_algordo"])[0]
            result = self.engine.generate_deterministic(resource)
            
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps(asdict(result), indent=2).encode('utf-8'))
        else:
            self.send_response(404)
            self.end_headers()


async def run_server(port: int = 8080):
    server = HTTPServer(('0.0.0.0', port), PipelineHTTPHandler)
    print(f"[API Engine] Listening for codename queries on http://0.0.0.0:{port}/generate")
    await asyncio.to_thread(server.serve_forever)


def main():
    parser = argparse.ArgumentParser(
        description="Enterprise Codename Engine for https://g.dev/gilbert_algordo"
    )
    parser.add_argument("--developer-id", type=str, default="gilbert_algordo", help="Developer ID anchor")
    parser.add_argument("-c", "--config", type=str, help="Path to JSON/YAML/TOML configuration file")
    parser.add_argument("-t", "--target", type=str, default="https://g.dev/gilbert_algordo", help="Target URL or Project Name")
    parser.add_argument("-o", "--format", choices=["text", "json", "yaml"], default="text", help="Output format")
    parser.add_argument("--serve", action="store_true", help="Launch asynchronous REST API service")
    parser.add_argument("--port", type=int, default=8080, help="Port for REST API service")

    args = parser.parse_args()

    engine = CodenameEngine(developer_id=args.developer_id, config_path=args.config)

    if args.serve:
        PipelineHTTPHandler.engine = engine
        asyncio.run(run_server(args.port))
        return

    result = engine.generate_deterministic(args.target)
    payload = asdict(result)

    if args.format == "json":
        print(json.dumps(payload, indent=2))
    elif args.format == "yaml":
        if HAS_YAML:
            print(yaml.dump(payload, default_flow_style=False))
        else:
            print("Error: PyYAML required for YAML output format.", file=sys.stderr)
    else:
        print("\n=== ADVANCED CODENAME ENGINE OUTPUT ===")
        print(f"Developer Anchor : {result.developer_id}")
        print(f"Target Resource  : {result.target_resource}")
        print(f"Codename Assigned: {result.codename}")
        print(f"Domain Category  : {result.category}")
        print(f"Cryptographic Sig: {result.hash_signature}")
        print(f"Engine Mode      : {result.generation_mode}\n")


if __name__ == "__main__":
    main()



