import random
import hashlib

class CodenameGenerator:
    def __init__(self, developer_id="gilbert_algordo"):
        self.developer_id = developer_id
        
        # Core thematic modules mapped to your project domains
        self.themes = {
            "AI & Architecture": {
                "prefixes": ["NEURO", "SYNAPSE", "QUANTUM", "CYBER", "CORE", "APEX", "VECTOR"],
                "suffixes": ["ARCH", "MIND", "ENGINE", "ARRAY", "SYNTH", "NODE", "MATRIX"]
            },
            "Telemetry & Performance (Ferrari / Race Corp)": {
                "prefixes": ["TORQUE", "SCUDERIA", "AERO", "KINETIC", "VELOCITY", "DYNAMIC", "NITRO"],
                "suffixes": ["FLOW", "DRIVE", "PULSE", "SHIFT", "SYSTEM", "FORCE", "GRID"]
            },
            "Kaizen & Optimization": {
                "prefixes": ["KAIZEN", "ARCHANGEL", "PRIME", "OMEGA", "DELTA", "HORIZON"],
                "suffixes": ["LOOP", "CONTROL", "PIPELINE", "FRAMEWORK", "SHIELD", "SCALE"]
            },
            "Cycling & Physical Systems": {
                "prefixes": ["CADENCE", "PELOTON", "PEDAL", "STRIDE", "BREAKAWAY"],
                "suffixes": ["TRACK", "ROUTE", "VECTOR", "GEAR", "LINK"]
            }
        }

    def generate_random_codename(self, category=None):
        """Generates a dynamic codename based on a specific theme or across all themes."""
        if category and category in self.themes:
            domain = self.themes[category]
        else:
            # Pick a random category
            category = random.choice(list(self.themes.keys()))
            domain = self.themes[category]
            
        prefix = random.choice(domain["prefixes"])
        suffix = random.choice(domain["suffixes"])
        
        return f"{prefix}-{suffix}", category

    def generate_deterministic_codename(self, project_name: str) -> str:
        """
        Generates a consistent, reproducible codename for a specific project string
        using SHA-256 hashing anchored to your developer ID.
        """
        seed_string = f"{self.developer_id}:{project_name.strip().lower()}"
        hash_digest = hashlib.sha256(seed_string.encode('utf-8')).hexdigest()
        
        # Flatten all prefixes and suffixes
        all_prefixes = [p for theme in self.themes.values() for p in theme["prefixes"]]
        all_suffixes = [s for theme in self.themes.values() for s in theme["suffixes"]]
        
        # Map hash segments to indices
        prefix_idx = int(hash_digest[:8], 16) % len(all_prefixes)
        suffix_idx = int(hash_digest[8:16], 16) % len(all_suffixes)
        
        return f"PROJECT {all_prefixes[prefix_idx]}-{all_suffixes[suffix_idx]}"


# --- Usage Example ---
if __name__ == "__main__":
    generator = CodenameGenerator(developer_id="gilbert_algordo")
    
    print("=== DYNAMIC CODENAME GENERATION ===")
    for _ in range(5):
        name, category = generator.generate_random_codename()
        print(f"Codename: {name:<20} | Category: {category}")
        
    print("\n=== DETERMINISTIC PROJECT CODENAMES ===")
    projects = [
        "Google Dev Profile Hub",
        "Water Flow Simulation",
        "32GB RAM AI Logic Controller",
        "Telemetry HUD Interface"
    ]
    
    for proj in projects:
        code = generator.generate_deterministic_codename(proj)
        print(f"Project: {proj:<30} => Codename: {code}")



#!/usr/bin/env python3
"""
Codename Generator CLI
Tailored for https://g.dev/gilbert_algordo

Supports JSON & YAML output, custom config files, dynamic random generation,
and deterministic project-name hashing.
"""

import sys
import json
import argparse
import random
import hashlib
from typing import List, Dict, Any, Optional

# Optional PyYAML support with standard library JSON fallback
try:
    import yaml
    HAS_YAML = True
except ImportError:
    HAS_YAML = False


DEFAULT_CONFIG = {
    "developer_id": "gilbert_algordo",
    "themes": {
        "AI & Architecture": {
            "prefixes": ["NEURO", "SYNAPSE", "QUANTUM", "CYBER", "CORE", "APEX", "VECTOR"],
            "suffixes": ["ARCH", "MIND", "ENGINE", "ARRAY", "SYNTH", "NODE", "MATRIX"]
        },
        "Telemetry & Performance": {
            "prefixes": ["TORQUE", "SCUDERIA", "AERO", "KINETIC", "VELOCITY", "DYNAMIC", "NITRO"],
            "suffixes": ["FLOW", "DRIVE", "PULSE", "SHIFT", "SYSTEM", "FORCE", "GRID"]
        },
        "Kaizen & Optimization": {
            "prefixes": ["KAIZEN", "ARCHANGEL", "PRIME", "OMEGA", "DELTA", "HORIZON"],
            "suffixes": ["LOOP", "CONTROL", "PIPELINE", "FRAMEWORK", "SHIELD", "SCALE"]
        },
        "Cycling & Physical Systems": {
            "prefixes": ["CADENCE", "PELOTON", "PEDAL", "STRIDE", "BREAKAWAY"],
            "suffixes": ["TRACK", "ROUTE", "VECTOR", "GEAR", "LINK"]
        }
    }
}


class CodenameCLI:
    def __init__(self, config_file: Optional[str] = None, developer_id: str = "gilbert_algordo"):
        self.developer_id = developer_id
        self.themes = DEFAULT_CONFIG["themes"]
        
        if config_file:
            self.load_config(config_file)

    def load_config(self, filepath: str):
        """Loads themes and metadata from a JSON or YAML file."""
        with open(filepath, "r", encoding="utf-8") as f:
            if filepath.endswith((".yaml", ".yml")):
                if not HAS_YAML:
                    raise ImportError("PyYAML is required to parse YAML files. Run `pip install pyyaml`.")
                data = yaml.safe_load(f)
            else:
                data = json.load(f)
                
            if "developer_id" in data:
                self.developer_id = data["developer_id"]
            if "themes" in data:
                self.themes = data["themes"]

    def generate_random(self, count: int = 1, category: Optional[str] = None) -> List[Dict[str, str]]:
        """Generates dynamic codenames from configured thematic domains."""
        results = []
        available_categories = list(self.themes.keys())
        
        for _ in range(count):
            cat = category if category and category in self.themes else random.choice(available_categories)
            domain = self.themes[cat]
            prefix = random.choice(domain["prefixes"])
            suffix = random.choice(domain["suffixes"])
            results.append({
                "codename": f"{prefix}-{suffix}",
                "category": cat,
                "type": "random"
            })
        return results

    def generate_deterministic(self, projects: List[str]) -> List[Dict[str, str]]:
        """Generates consistent project codenames anchored via SHA-256 hash."""
        results = []
        all_prefixes = [p for t in self.themes.values() for p in t.get("prefixes", [])]
        all_suffixes = [s for t in self.themes.values() for s in t.get("suffixes", [])]

        for proj in projects:
            seed_string = f"{self.developer_id}:{proj.strip().lower()}"
            hash_digest = hashlib.sha256(seed_string.encode('utf-8')).hexdigest()
            p_idx = int(hash_digest[:8], 16) % len(all_prefixes)
            s_idx = int(hash_digest[8:16], 16) % len(all_suffixes)
            
            results.append({
                "project": proj,
                "codename": f"PROJECT {all_prefixes[p_idx]}-{all_suffixes[s_idx]}",
                "hash": hash_digest[:10],
                "type": "deterministic"
            })
        return results


def main():
    parser = argparse.ArgumentParser(
        description="Codename Generator CLI (https://g.dev/gilbert_algordo)"
    )
    parser.add_argument("--developer-id", type=str, default="gilbert_algordo", help="Developer ID anchor for hashing")
    parser.add_argument("-c", "--config", type=str, help="Path to custom JSON or YAML config file")
    parser.add_argument("-n", "--count", type=int, default=1, help="Number of random codenames to generate")
    parser.add_argument("--category", type=str, help="Filter by specific category theme")
    parser.add_argument("-p", "--project", type=str, action="append", help="Project name(s) for deterministic generation")
    parser.add_argument("-o", "--format", choices=["text", "json", "yaml"], default="text", help="Output format")
    parser.add_argument("--export-config", type=str, choices=["json", "yaml"], help="Export default configuration schema")

    args = parser.parse_args()

    # Export configuration template
    if args.export_config:
        if args.export_config == "json":
            print(json.dumps(DEFAULT_CONFIG, indent=2))
        elif args.export_config == "yaml":
            if HAS_YAML:
                print(yaml.dump(DEFAULT_CONFIG, default_flow_style=False))
            else:
                print("Error: PyYAML is required for YAML export. Run `pip install pyyaml`.", file=sys.stderr)
        return

    cli = CodenameCLI(config_file=args.config, developer_id=args.developer_id)

    # Route execution mode
    if args.project:
        results = cli.generate_deterministic(args.project)
    else:
        results = cli.generate_random(count=args.count, category=args.category)

    # Output formatting
    payload = {
        "developer_id": cli.developer_id,
        "total": len(results),
        "results": results
    }

    if args.format == "json":
        print(json.dumps(payload, indent=2))
    elif args.format == "yaml":
        if HAS_YAML:
            print(yaml.dump(payload, default_flow_style=False))
        else:
            print("Error: PyYAML required for YAML output.", file=sys.stderr)
    else:
        print(f"=== Codename CLI Output [{cli.developer_id}] ===")
        for item in results:
            if item.get("type") == "deterministic":
                print(f"Project  : {item['project']:<30}\nCodename : {item['codename']} (Hash: {item['hash']})\n")
            else:
                print(f"Codename : {item['codename']:<20} | Category: {item['category']}")


if __name__ == "__main__":
    main()



