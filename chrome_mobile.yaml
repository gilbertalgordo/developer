def bundle_android_assets(output_dir="android/app/src/main/res/drawable"):
    os.makedirs(output_dir, exist_ok=True)
    print(f"[Android] Bundling XML drawables to -> {output_dir}")
    
    for key, data in ASSET_MANIFEST.items():
        filepath = os.path.join(output_dir, data["android_filename"])
        with open(filepath, "w", encoding="utf-8") as f:
            f.write(data["android_xml"])
    print("[Android] Successfully bundled all 5 vector drawables.")

def bundle_ios_assets(output_dir="ios/Runner/Assets.xcassets"):
    print(f"[iOS] Bundling asset catalog imagesets to -> {output_dir}")
    
    for key, data in ASSET_MANIFEST.items():
        imageset_dir = os.path.join(output_dir, f"{key}.imageset")
        os.makedirs(imageset_dir, exist_ok=True)
        
        # Write SVG file
        svg_path = os.path.join(imageset_dir, data["ios_filename"])
        with open(svg_path, "w", encoding="utf-8") as f:
            f.write(data["svg_path"])
            
        # Write Contents.json
        contents_data = {
            "images": [
                {
                    "idiom": "universal",
                    "filename": data["ios_filename"],
                    "scale": "1x"
                }
            ],
            "info": {
                "author": "xcode",
                "version": 1
            },
            "properties": {
                "vector-template-rendering-intent": "template"
            }
        }
        
        json_path = os.path.join(imageset_dir, "Contents.json")
        with open(json_path, "w", encoding="utf-8") as f:
            json.dump(contents_data, f, indent=2)
            
    print("[iOS] Successfully bundled all 5 .imageset asset catalogs and Contents.json manifests.")

if __name__ == "__main__":
    print("=== Starting Chrome Mobile Asset Packaging Automation ===")
    bundle_android_assets()
    bundle_ios_assets()
    print("=== Asset Bundling Complete ===")



