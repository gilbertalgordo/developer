#!/bin/bash
set -e

FRAMEWORK_NAME="ChromeMobileCore"
BUILD_DIR="./build"
OUTPUT_DIR="./output/${FRAMEWORK_NAME}.framework"

echo "=== Starting iOS Native Cross-Compilation for ${FRAMEWORK_NAME} ==="

rm -rf $BUILD_DIR $OUTPUT_DIR
mkdir -p $BUILD_DIR

# 1. Build for iOS Devices (ARM64)
echo "Building for iOS Device (arm64)..."
xcodebuild archive \
    -project "${FRAMEWORK_NAME}.xcodeproj" \
    -scheme "${FRAMEWORK_NAME}" \
    -configuration Release \
    -destination "generic/platform=iOS" \
    -archivePath "$BUILD_DIR/ios_device.xcarchive" \
    SKIP_INSTALL=NO BUILD_LTO=YES

# 2. Build for iOS Simulator (Apple Silicon / x86_64)
echo "Building for iOS Simulator..."
xcodebuild archive \
    -project "${FRAMEWORK_NAME}.xcodeproj" \
    -scheme "${FRAMEWORK_NAME}" \
    -configuration Release \
    -destination "generic/platform=iOS Simulator" \
    -archivePath "$BUILD_DIR/ios_simulator.xcarchive" \
    SKIP_INSTALL=NO BUILD_LTO=YES

# 3. Create XCFramework container combining both architectures
echo "Creating XCFramework bundle..."
mkdir -p ./output
xcodebuild -create-xcframework \
    -archive "$BUILD_DIR/ios_device.xcarchive" -framework "${FRAMEWORK_NAME}.framework" \
    -archive "$BUILD_DIR/ios_simulator.xcarchive" -framework "${FRAMEWORK_NAME}.framework" \
    -output "./output/${FRAMEWORK_NAME}.xcframework"

echo "=== Build Complete: Output located at ./output/${FRAMEWORK_NAME}.xcframework ==="




