name: Chrome Mobile Asset Packaging

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  package-assets:
    name: Run Asset Bundling & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Asset Bundling Script
        run: |
          python3 bundle_assets.py

      - name: Verify Asset Generation State
        run: |
          git status
          if [[ -n $(git status --porcelain) ]]; then
            echo "::notice::Assets were successfully generated and structured by bundle_assets.py."
          else
            echo "::notice::All Android drawables and iOS asset catalogs are already up to date."
          fi



name: Chrome Mobile Asset Packaging & Sync

on:
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write

jobs:
  package-and-commit:
    name: Generate & Push Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Asset Bundling Script
        run: |
          python3 bundle_assets.py

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Generated Assets
        run: |
          git add android/app/src/main/res/drawable/ ios/Runner/Assets.xcassets/
          if git diff --staged --quiet; then
            echo "No asset changes detected. Skipping commit."
          else
            git commit -m "chore(assets): auto-generated mobile assets and Contents.json manifests [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi




name: Chrome Mobile Asset Packaging & PR Notifier

on:
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  package-and-notify:
    name: Generate Assets & Notify PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Asset Bundling Script
        run: |
          python3 bundle_assets.py

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for Asset Modifications
        id: git-check
        run: |
          git add android/app/src/main/res/drawable/ ios/Runner/Assets.xcassets/
          if git diff --staged --quiet; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Generated Assets
        if: steps.git-check.outputs.changes_detected == 'true'
        run: |
          git commit -m "chore(assets): auto-generated mobile assets and Contents.json manifests [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Post or Update PR Comment Status
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const changesDetected = "${{ steps.git-check.outputs.changes_detected }}" === "true";
            
            const commentBody = `### 🎨 Chrome Mobile Asset Pipeline Status
            
            | Pipeline Check | Status | Details |
            | :--- | :---: | :--- |
            | **Android XML Drawables** | ✅ **Success** | Generated in \`android/app/src/main/res/drawable/\` |
            | **iOS Asset Catalogs** | ✅ **Success** | Structured in \`ios/Runner/Assets.xcassets/\` |
            | **Repository Sync** | ${changesDetected ? "🔄 **Updated**" : "✨ **Up-to-Date**"} | ${changesDetected ? "Automated commit pushed with fresh asset binaries." : "No asset deltas detected; everything matches the manifest."} |
            
            *Automated execution report generated by GitHub Actions.*`;

            // Search for existing bot comments to update or create a new one
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });
            
            const existingComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Chrome Mobile Asset Pipeline Status')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: commentBody,
              });
            }
