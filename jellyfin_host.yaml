mkdir -p ~/jellyfin/config ~/jellyfin/cache ~/jellyfin/media
cd ~/jellyfin


sudo chown -R 1000:1000 ~/jellyfin
sudo chmod -R u+rwX ~/jellyfin


version: "3.8"

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Manila
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/data
    devices:
      # Exposes Intel QuickSync / GPU hardware for hardware-accelerated transcoding
      - /dev/dri:/dev/dri
    restart: unless-stopped


    docker compose up -d


    docker compose logs -f jellyfin


    http://<YOUR_SERVER_IP>:8096


  cd ~/jellyfin
docker compose pull
docker compose up -d --force-recreate  
