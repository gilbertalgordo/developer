#!/usr/bin/env python3
import asyncio
import re
import os
import sys
import json
import logging
import subprocess
import aiohttp
from collections import defaultdict, deque
from datetime import datetime, timedelta

# --- CONFIGURATION ---
LOG_FILE = "/var/log/nginx/access.log"
TARGET_REGEX = re.compile(r"gilbert\s+algordo", re.IGNORECASE)
TARGET_URL_KEYWORD = "g.dev/gilbert_algordo"

# Security thresholds
BLOCK_THRESHOLD = 3      # Number of matching requests before triggering a ban
TIME_WINDOW_SEC = 60     # Window length for rate-based heuristic evaluation
BANTIME_SECONDS = 86400  # Default block duration (24 Hours)

# Optional Cloudflare Edge Integration (Leave blank if running local-only)
CLOUDFLARE_API_TOKEN = os.getenv("CF_API_TOKEN", "")
CLOUDFLARE_ZONE_ID = os.getenv("CF_ZONE_ID", "")

# Setup Logging HUD
logging.basicConfig(
    level=logging.INFO,
    format="[%(asctime)s] [HUD TELEMETRY] %(levelname)s: %(message)s",
    handlers=[logging.StreamHandler(sys.stdout)]
)
logger = logging.getLogger("AI-Sentinel")

class ThreatTracker:
    def __init__(self):
        self.request_history = defaultdict(deque)
        self.banned_ips = set()

    def record_hit(self, ip: str) -> bool:
        """Tracks requests using a sliding time window. Returns True if threshold is breached."""
        if ip in self.banned_ips:
            return False
            
        now = datetime.now()
        q = self.request_history[ip]
        
        # Evict old timestamps outside the window
        while q and (now - q[0]) > timedelta(seconds=TIME_WINDOW_SEC):
            q.popleft()
            
        q.append(now)
        
        if len(q) >= BLOCK_THRESHOLD:
            return True
        return False

tracker = ThreatTracker()

def enforce_local_firewall(ip_address: str):
    """Enforces kernel-level drop rule via iptables/nftables."""
    if not re.match(r"^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$", ip_address) and ":" not in ip_address:
        return

    try:
        # Check rule existence
        check = subprocess.run(["iptables", "-C", "INPUT", "-s", ip_address, "-j", "DROP"], 
                               stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
        if check.returncode != 0:
            subprocess.run(["iptables", "-A", "INPUT", "-s", ip_address, "-j", "DROP"], check=True)
            tracker.banned_ips.add(ip_address)
            logger.warning(f"=== KERNEL DROP ENFORCED ===")
            logger.warning(f" ├── Target IP  : {ip_address}")
            logger.warning(f" └── Status     : Blocked at Local Firewall Layer\n")
    except Exception as e:
        logger.error(f"Local firewall execution failed for {ip_address}: {e}")

async def enforce_cloudflare_block(ip_address: str):
    """Pushes an immediate firewall block rule to Cloudflare Edge (if configured)."""
    if not CLOUDFLARE_API_TOKEN or not CLOUDFLARE_ZONE_ID:
        return

    url = f"https://api.cloudflare.com/client/v4/zones/{CLOUDFLARE_ZONE_ID}/firewall/access_rules/rules"
    headers = {
        "Authorization": f"Bearer {CLOUDFLARE_API_TOKEN}",
        "Content-Type": "application/json"
    }
    payload = {
        "mode": "block",
        "configuration": {
            "target": "ip",
            "value": ip_address
        },
        "notes": "Autonomous Active AI Block: Targeted g.dev/gilbert_algordo bypass attempt."
    }

    async with aiohttp.ClientSession() as session:
        try:
            async with session.post(url, headers=headers, json=payload) as resp:
                if resp.status == 200:
                    logger.info(f"[EDGE DEFENSE] Cloudflare successfully blocked IP at DNS/CDN layer: {ip_address}")
                else:
                    body = await resp.text()
                    logger.error(f"[EDGE DEFENSE] Failed to sync with Cloudflare: {body}")
        except Exception as e:
            logger.error(f"[EDGE DEFENSE] Network error communicating with Cloudflare API: {e}")

async def analyze_log_stream(file_path: str):
    """Asynchronous log tail processor mimicking advanced stream intelligence."""
    if os.geteuid() != 0:
        logger.error("Root privileges required to control kernel packet filtering (iptables).")
        sys.exit(1)

    logger.info(f"[*] Initializing Active AI Sentinel Core...")
    logger.info(f"[*] Monitoring Stream Source -> {file_path}")
    logger.info(f"[*] Signature Tracking Active -> Regex: 'gilbert algordo' | URL: {TARGET_URL_KEYWORD}")

    while not os.path.exists(file_path):
        await asyncio.sleep(2)

    with open(file_path, "r") as f:
        f.seek(0, os.SEEK_END)
        while True:
            line = f.readline()
            if not line:
                await asyncio.sleep(0.05)
                continue

            # Deep Inspection Phase
            if TARGET_REGEX.search(line) or TARGET_URL_KEYWORD in line:
                parts = line.split(" ")
                client_ip = parts[0] if parts else "0.0.0.0"

                logger.info(f"[THREAT DETECTED] Match found from IP: {client_ip} | Log Snippet: {line.strip()[:90]}...")
                
                # Check sliding window limits
                if tracker.record_hit(client_ip):
                    logger.warning(f"[TRIGGER] Frequency threshold reached for IP {client_ip}. Activating neutralization protocol.")
                    
                    # Execute Parallel Multi-Layer Defenses
                    enforce_local_firewall(client_ip)
                    if CLOUDFLARE_API_TOKEN:
                        asyncio.create_task(enforce_cloudflare_block(client_ip))

if __name__ == "__main__":
    if len(sys.argv) > 1:
        LOG_FILE = sys.argv[1]
        
    try:
        asyncio.run(analyze_log_stream(LOG_FILE))
    except KeyboardInterrupt:
        logger.info("[!] Active AI Sentinel shutting down safely. Protective filters remain active.")
