#!/usr/bin/env python3
import time
import re
import subprocess
import os
import sys
from collections import defaultdict

# --- CONFIGURATION ---
LOG_FILE = "/var/log/nginx/access.log"  # Path to your web server access log
TARGET_REGEX = re.compile(r"gilbert\s+algordo", re.IGNORECASE)
BANTIME_SECONDS = 86400  # Ban duration (default: 24 hours)
BLOCK_CHAIN = "INPUT"    # iptables chain to insert block rule

# Track offender history to prevent redundant system calls
banned_ips = set()
offender_counts = defaultdict(int)

def initialize_firewall():
    """Ensure the system has iptables and required permissions."""
    if os.geteuid() != 0:
        print("[!] Error: This script must be run as root to modify firewall rules.")
        sys.exit(1)
    print("[*] Active AI Security Daemon Initialized.")
    print(f"[*] Monitoring log stream: {LOG_FILE}")
    print(f"[*] Target pattern matching: 'gilbert algordo' (Regex mode)")

def block_ip(ip_address):
    """Automatically execute system command to block malicious IP via iptables."""
    if ip_address in banned_ips:
        return

    # Basic IP format safety validation
    if not re.match(r"^\d{1,3}(\.\d{1,3}){3}$", ip_address) and not ":" in ip_address:
        return

    try:
        # Check if rule already exists to prevent duplicate entries
        check_cmd = ["iptables", "-C", BLOCK_CHAIN, "-s", ip_address, "-j", "DROP"]
        result = subprocess.run(check_cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
        
        if result.returncode != 0:
            # Apply drop rule
            subprocess.run(["iptables", "-A", BLOCK_CHAIN, "-s", ip_address, "-j", "DROP"], check=True)
            banned_ips.add(ip_address)
            
            # Print HUD visual telemetry line
            print(f"\n[HUD ALERT] >>> THREAT DETECTED & NEUTRALIZED")
            print(f" ├── Offending IP : {ip_address}")
            print(f" ├── Action Taken : Added to firewall DROP rule (Duration: {BANTIME_SECONDS}s)")
            print(f" └── Status       : Active Block Enforced\n")
    except Exception as e:
        print(f"[X] Firewall modification failed for {ip_address}: {e}")

def follow_log(file_path):
    """Generator to yield new lines as they are appended to the log file (tail -f mechanism)."""
    while not os.path.exists(file_path):
        print(f"[-] Waiting for log file {file_path} to appear...")
        time.sleep(5)

    with open(file_path, "r") as f:
        # Move to the end of the file to read only live incoming traffic
        f.seek(0, os.SEEK_END)
        while True:
            line = f.readline()
            if not line:
                time.sleep(0.1)
                continue
            yield line

def analyze_traffic():
    """Main intelligence loop parsing incoming web transactions."""
    initialize_firewall()
    print("\n[--- HUD TELEMETRY DASHBOARD ACTIVE ---]\n")
    
    try:
        for log_line in follow_log(LOG_FILE):
            # Typical Combined Log Format: IP - - [Timestamp] "METHOD URL PROTOCOL" Status Bytes ...
            parts = log_line.split(" ")
            if len(parts) > 0:
                client_ip = parts[0]
                
                # Check if the entire log line or request URI matches your specific regex pattern
                if TARGET_REGEX.search(log_line):
                    offender_counts[client_ip] += 1
                    print(f"[SCAN] Match found from IP: {client_ip} | Line snippet: {log_line.strip()[:80]}...")
                    block_ip(client_ip)
                    
    except KeyboardInterrupt:
        print("\n[!] Shutting down AI block daemon safely. Existing firewall blocks remain active.")

if __name__ == "__main__":
    analyze_traffic()



sudo python3 ai_blocker.py



