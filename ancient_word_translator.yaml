import numpy as np

class AncientLexiconStore:
    """Simulates a localized vector/lexicon database for strict linguistic anchoring."""
    def __init__(self):
        # Sample rooted dictionary entries for grounding
        self.lexicons = {
            "BERESHIT": {
                "strong_code": "H7225",
                "original": "בְּרֵאשִׁית",
                "transliteration": "bərêshîyth",
                "definition": "From re'shiyth; the first, in place, time, order or rank (beginning, chief, choice, first fruit).",
                "morphology": "Noun - feminine singular construct preposition 'bə'."
            },
            "LOGOS": {
                "strong_code": "G3056",
                "original": "λόγος",
                "transliteration": "logos",
                "definition": "From lego; something said (including the thought); by implication, a topic (subject of discourse), also the Divine Expression (i.e. Christ).",
                "morphology": "Noun - masculine accusative/nominative singular."
            },
            "AGAPE": {
                "strong_code": "G26",
                "original": "ἀγάπη",
                "transliteration": "agapē",
                "definition": "From agapao; love, i.e., affection or benevolence; specifically (plural) a love-feast.",
                "morphology": "Noun - feminine nominative singular."
            }
        }

    def search_lexicon(self, query_term: str):
        query_upper = query_term.upper().strip()
        for key, data in self.lexicons.items():
            if key in query_upper or data["original"] in query_term:
                return data
        return None



import os
import json
from fastapi import FastAPI, HTTPException
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel
import google.generativeai as genai
from dotenv import load_dotenv
from lexicon_store import AncientLexiconStore

load_dotenv()
genai.configure(api_key=os.getenv("GEMINI_API_KEY"))

app = FastAPI(title="Advanced Ancient Scripture Translator AI API")

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

lexicon_db = AncientLexiconStore()

class AdvancedTranslationRequest(BaseModel):
    text: str
    source_language: str  # e.g., "Biblical Hebrew", "Koine Greek"
    target_language: str  # e.g., "English"
    include_textual_variants: bool = True

class AdvancedTranslationResponse(BaseModel):
    original_text: str
    transliteration: str
    grounded_lexicon_match: dict | None
    literal_gloss: str
    contextual_translation: str
    morphological_breakdown: list[dict]
    textual_variants: list[str]
    historical_theological_context: str

ADVANCED_SYSTEM_PROMPT = """
You are a world-class epigrapher, textual critic, and ancient languages professor. 
Analyze the given ancient scripture or word with extreme scholarly rigor.

You must output a strictly valid JSON object matching this schema:
{
  "transliteration": "Detailed phonetic reading with diacritics",
  "literal_gloss": "Rigorous word-for-word translation",
  "contextual_translation": "Fluid literary translation honoring the epoch's voice",
  "morphological_breakdown": [
    {"token": "word part", "part_of_speech": "noun/verb/etc", "parsing": "tense/voice/mood/gender/number"}
  ],
  "textual_variants": ["Variant manuscript note 1 (e.g. Codex Sinaiticus vs Textus Receptus)", "Variant note 2 if applicable"],
  "historical_theological_context": "Deep contextual insight into authorial intent, cultural backdrop, and semantic evolution"
}
"""

@app.post("/api/advanced-translate", response_model=AdvancedTranslationResponse)
async def advanced_translate(request: AdvancedTranslationRequest):
    try:
        # Check local vector/lexicon grounding store first
        grounded_data = lexicon_db.search_lexicon(request.text)

        model = genai.GenerativeModel(
            model_name="gemini-2.5-flash",
            system_instruction=ADVANCED_SYSTEM_PROMPT
        )

        prompt = f"""
        Source Language: {request.source_language}
        Target Language: {request.target_language}
        Target Text/Verse: {request.text}
        Include Textual Variants Analysis: {request.include_textual_variants}
        Pre-indexed Lexicon Context (if available): {json.dumps(grounded_data) if grounded_data else "None"}
        """

        response = model.generate_content(
            prompt,
            generation_config=genai.types.GenerationConfig(
                response_mime_type="application/json"
            )
        )

        result = json.loads(response.text)

        return AdvancedTranslationResponse(
            original_text=request.text,
            transliteration=result.get("transliteration", ""),
            grounded_lexicon_match=grounded_data,
            literal_gloss=result.get("literal_gloss", ""),
            contextual_translation=result.get("contextual_translation", ""),
            morphological_breakdown=result.get("morphological_breakdown", []),
            textual_variants=result.get("textual_variants", []),
            historical_theological_context=result.get("historical_theological_context", "")
        )

    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))

if __name__ == "__main__":
    import uvicorn
    uvicorn.run("main:app", host="127.0.0.1", port=8000, reload=True)



