                currentTransliterationText = data.transliteration;
                document.getElementById('resTransliteration').innerText = data.transliteration;
                document.getElementById('resLiteral').innerText = data.literal_gloss;
                document.getElementById('resContextual').innerText = data.contextual_translation;
                document.getElementById('resContext').innerText = data.historical_theological_context;

                // Grounded Lexicon View
                const groundedSec = document.getElementById('groundedSection');
                if (data.grounded_lexicon_match) {
                    document.getElementById('gCode').innerText = data.grounded_lexicon_match.strong_code;
                    document.getElementById('gOriginal').innerText = data.grounded_lexicon_match.original;
                    document.getElementById('gDef').innerText = data.grounded_lexicon_match.definition;
                    groundedSec.classList.remove('hidden');
                } else {
                    groundedSec.classList.add('hidden');
                }

                // Morphology Table Population
                const morphTable = document.getElementById('morphologyTableBody');
                morphTable.innerHTML = '';
                if (data.morphological_breakdown && data.morphological_breakdown.length > 0) {
                    data.morphological_breakdown.forEach(item => {
                        const row = document.createElement('tr');
                        row.innerHTML = `<td class="p-2 font-bold text-amber-300">${item.token}</td>
                                         <td class="p-2 text-slate-400">${item.part_of_speech}</td>
                                         <td class="p-2 text-slate-300">${item.parsing}</td>`;
                        morphTable.appendChild(row);
                    });
                } else {
                    morphTable.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-slate-500">No morphological sub-tokens parsed.</td></tr>`;
                }

                // Variants Population
                const variantsList = document.getElementById('resVariants');
                variantsList.innerHTML = '';
                if (data.textual_variants && data.textual_variants.length > 0) {
                    data.textual_variants.forEach(v => {
                        const li = document.createElement('li');
                        li.innerText = v;
                        variantsList.appendChild(li);
                    });
                    document.getElementById('variantsContainer').classList.remove('hidden');
                } else {
                    document.getElementById('variantsContainer').classList.add('hidden');
                }

                results.classList.remove('hidden');
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                loader.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }

        function speakTransliteration() {
            if (!currentTransliterationText) return;
            const utterance = new SpeechSynthesisUtterance(currentTransliterationText);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>



