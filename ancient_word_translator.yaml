import os
from fastapi import FastAPI, HTTPException
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel
import google.generativeai as genai
from dotenv import load_dotenv

load_dotenv()

# Configure Gemini API
genai.configure(api_key=os.getenv("GEMINI_API_KEY"))

app = FastAPI(title="Ancient Word & Scripture Translator AI")

# Enable CORS for frontend communication
app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

class TranslationRequest(BaseModel):
    text: str
    source_language: str  # e.g., "Hebrew", "Koine Greek", "Latin", "Sanskrit", "Hieroglyphs"
    target_language: str  # e.g., "English", "Spanish"

class TranslationResponse(BaseModel):
    original_text: str
    transliteration: str
    literal_translation: str
    contextual_translation: str
    etymology_and_morphology: str
    historical_cultural_context: str

SYSTEM_PROMPT = """
You are an expert ancient linguist, epigrapher, and scriptural scholar fluent in Biblical Hebrew, Koine Greek, Classical Latin, Sanskrit, Akkadian, Old Church Slavonic, and Ancient Egyptian hieroglyphs. 

When a user provides a word, verse, or scripture passage along with its source and target language, you must respond strictly in a structured JSON format containing:
1. "transliteration": The phonetic pronunciation or transliteration into the target alphabet.
2. "literal_translation": A word-for-word gloss/translation.
3. "contextual_translation": A fluid, accurate translation matching the cultural and theological context of the era.
4. "etymology_and_morphology": Root words, grammatical forms, tense, voice, mood, and semantic shifts over time.
5. "historical_cultural_context": Background on who wrote it, the historical epoch, and the cultural or theological implications of the phrasing.

Return ONLY valid JSON with these exact keys. No markdown blocks outside of the JSON if possible, or standard clean JSON.
"""

@app.post("/api/translate", response_model=TranslationResponse)
async def translate_ancient_text(request: TranslationRequest):
    try:
        # Use gemini-2.5-flash for fast, structured linguistic analysis
        model = genai.GenerativeModel(
            model_name="gemini-2.5-flash",
            system_instruction=SYSTEM_PROMPT
        )
        
        prompt = f"""
        Translate and analyze the following ancient text:
        Source Language: {request.source_language}
        Text: {request.text}
        Target Language: {request.target_language}
        """

        response = model.generate_content(
            prompt,
            generation_config=genai.types.GenerationConfig(
                response_mime_type="application/json"
            )
        )
        
        import json
        result_data = json.loads(response.text)
        
        return TranslationResponse(
            original_text=request.text,
            transliteration=result_data.get("transliteration", "N/A"),
            literal_translation=result_data.get("literal_translation", "N/A"),
            contextual_translation=result_data.get("contextual_translation", "N/A"),
            etymology_and_morphology=result_data.get("etymology_and_morphology", "N/A"),
            historical_cultural_context=result_data.get("historical_cultural_context", "N/A")
        )

    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))

if __name__ == "__main__":
    import uvicorn
    uvicorn.run("main:app", host="127.0.0.1", port=8000, reload=True)



