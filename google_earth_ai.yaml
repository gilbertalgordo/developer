        });

        viewer._cesiumWidget._creditContainer.style.display = "none";
        viewer.scene.globe.enableLighting = true;

        // Real-time coordinate updates
        const canvas = viewer.scene.canvas;
        const handler = new Cesium.ScreenSpaceEventHandler(canvas);
        handler.setInputAction(function(movement) {
            const ray = viewer.camera.getPickRay(movement.endPosition);
            const cartographic = viewer.scene.globe.pick(ray, viewer.scene);
            if (cartographic) {
                const cartoCoord = Cesium.Cartographic.fromCartesian(cartographic);
                const lat = Cesium.Math.toDegrees(cartoCoord.latitude).toFixed(4);
                const lon = Cesium.Math.toDegrees(cartoCoord.longitude).toFixed(4);
                const alt = (viewer.camera.positionCartographic.height / 1000).toFixed(1);
                document.getElementById('latlon').innerText = `${lat}°, ${lon}°`;
                document.getElementById('altitude').innerText = `${alt} km`;
            }
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        // Fetch Live Weather Updates
        async function fetchLiveWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=14.35&longitude=121.05&current_weather=true');
