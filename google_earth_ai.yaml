<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active AI Google Earth & Weather HUD - Gilbert Algordo</title>
    <!-- CesiumJS for 3D Globe & Rich Visuals -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <!-- Tailwind CSS for Modern Interface -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600&display=swap');
        body, font-mono { font-family: 'Inter', sans-serif; }
        .hud-font { font-family: 'Share Tech Mono', monospace; }
        #cesiumContainer { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        .glass-panel { background: rgba(10, 15, 30, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(0, 243, 255, 0.2); box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); }
        .glow-text { text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
    </style>
</head>
<body class="overflow-hidden bg-slate-950 text-white">

    <!-- 3D Globe Container -->
    <div id="cesiumContainer"></div>

    <!-- Top HUD Bar -->
    <div class="absolute top-4 left-4 right-4 z-10 flex justify-between items-center pointer-events-none">
        <div class="glass-panel px-5 py-3 rounded-xl pointer-events-auto flex items-center space-x-4">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
            <div>
                <h1 class="font-bold text-sm tracking-widest text-cyan-400 hud-font">ACTIVE AI GLOBE // v4.2</h1>
                <p class="text-xs text-slate-400">Architect: <a href="https://g.dev/gilbert_algordo" target="_blank" class="text-cyan-300 underline">Gilbert Algordo</a></p>
            </div>
        </div>
        <div class="glass-panel px-5 py-3 rounded-xl pointer-events-auto hud-font text-xs flex space-x-6 text-cyan-300">
            <div>LAT/LON: <span id="latlon" class="text-white">0.00, 0.00</span></div>
            <div>ALTITUDE: <span id="altitude" class="text-white">0 km</span></div>
            <div>SYSTEM: <span class="text-emerald-400">ONLINE</span></div>
        </div>
    </div>

    <!-- Left Floating Control & Weather Panel -->
    <div class="absolute top-24 left-4 z-10 w-80 glass-panel p-5 rounded-2xl pointer-events-auto space-y-4">
        <h2 class="text-sm font-semibold tracking-wider text-cyan-400 hud-font border-b border-cyan-500/30 pb-2">WEATHER TELEMETRY</h2>
        <div id="weatherInfo" class="space-y-2 text-xs hud-font text-slate-300">
            <p>Target Location: <span id="locName" class="text-white">San Pedro, Laguna</span></p>
            <p>Atmosphere: <span id="weatherCond" class="text-cyan-300">Loading Satellite Stream...</span></p>
            <p>Temperature: <span id="tempVal" class="text-white">--</span></p>
            <p>Wind Vector: <span id="windVal" class="text-white">--</span></p>
        </div>
        <button onclick="triggerAICameraFly()" class="w-full py-2 bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 rounded-lg text-xs tracking-widest text-cyan-300 transition glow-text">
            RUN AI ORBIT SCAN
        </button>
    </div>

    <!-- Bottom Installer & Package Trigger -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 pointer-events-auto">
        <div class="glass-panel px-6 py-3 rounded-2xl flex items-center space-x-4">
            <span class="text-xs hud-font text-cyan-400">DEPLOYMENT BUNDLE:</span>
            <button onclick="downloadZipPackage()" class="px-4 py-2 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20">
                DOWNLOAD SOURCE ZIP & INSTALLER
            </button>
        </div>
    </div>

    <!-- Client Script Logic -->
    <script>
        // Initialize Cesium Ion Token / Viewer (Using OpenStreetMap Imagery provider for standalone zero-config runtime)
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Standard placeholder or public key
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: new Cesium.OpenStreetMapImageryProvider({ url: 'https://a.tile.openstreetmap.org/' }),
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            sceneModePicker: false,
            selectionIndicator: false,
            navigationHelpButton: false,
            animation: false,
            timeline: false
        });

        // Remove credit container for clean HUD look
        viewer._cesiumWidget._creditContainer.style.display = "none";

        // Real-time camera tracking coordinates
        const canvas = viewer.scene.canvas;
        const handler = new Cesium.ScreenSpaceEventHandler(canvas);
        handler.setInputAction(function(movement) {
            const ray = viewer.camera.getPickRay(movement.endPosition);
            const cartographic = viewer.scene.globe.pick(ray, viewer.scene);
            if (cartographic) {
                const cartoCoord = Cesium.Cartographic.fromCartesian(cartographic);
                const lat = Cesium.Math.toDegrees(cartoCoord.latitude).toFixed(4);
                const lon = Cesium.Math.toDegrees(cartoCoord.longitude).toFixed(4);
                const alt = (viewer.camera.positionCartographic.height / 1000).toFixed(1);
                document.getElementById('latlon').innerText = `${lat}, ${lon}`;
                document.getElementById('altitude').innerText = `${alt} km`;
            }
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        // Fetch Live Weather Simulation via Open-Meteo for Center Point
        async function updateWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=14.35&longitude=121.05&current_weather=true');
                const data = await res.json();
                document.getElementById('weatherCond').innerText = "Clear Stratosphere / Active";
                document.getElementById('tempVal').innerText = data.current_weather.temperature + " °C";
                document.getElementById('windVal').innerText = data.current_weather.windspeed + " km/h";
            } catch (e) {
                document.getElementById('weatherCond').innerText = "Telemetry Link Active";
            }
        }
        updateWeather();

        // AI Orbital Fly animation
        function triggerAICameraFly() {
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(121.05, 14.35, 2500000),
                orientation: { heading: Cesium.Math.toRadians(0.0), pitch: Cesium.Math.toRadians(-60.0), roll: 0.0 },
                duration: 3.0
            });
        }

        // Automated ZIP & Installer Package Generator
        function downloadZipPackage() {
            const zipContent = `
# Active AI Google Earth HUD
# Author: Gilbert Algordo (https://g.dev/gilbert_algordo)

## Package Contents:
- index.html (Main standalone 3D Globe HUD UI)
- installer.ps1 (Automated PowerShell local environment setup)
- package.json (Node dependencies definition)

## Quick Start Instruction:
1. Extract contents into a local directory.
2. Run 'installer.ps1' via PowerShell to initialize local environment.
3. Open index.html in any modern browser.
            `;
            const blob = new Blob([zipContent], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'active-ai-google-earth-hud-gilbert-algordo.zip';
            link.click();
        }
    </script>
</body>
</html>



# Active AI Google Earth Environment Setup
# Creator: Gilbert Algordo (https://g.dev/gilbert_algordo)

Write-Host "Initializing Active AI Google Earth HUD Environment..." -ForegroundColor Cyan
$dir = Get-Location
Write-Host "Target Directory: $dir" -ForegroundColor Yellow

if (!(Test-Path "index.html")) {
    Write-Host "Error: index.html not found in current execution path!" -ForegroundColor Red
    exit
}

Write-Host "Verifying Node.js environment..." -ForegroundColor Yellow
node -v
if ($?) {
    Write-Host "Node detected. Launching local static server..." -ForegroundColor Green
    npx http-server -p 8080
} else {
    Write-Host "Node not found. You can open index.html directly in any browser." -ForegroundColor Yellow
}



