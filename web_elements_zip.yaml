const fs = require('fs');
const path = require('path');
const AdmZip = require('adm-zip');

const outputFileName = 'active-ai-web-elements-advanced.zip';

function compileBundle() {
  console.log('⚡ Initializing Advanced Build Engine [Gilbert Algordo SDK]...');

  if (!fs.existsSync('src')) {
    console.error('❌ Error: "src" directory missing. Aborting compilation.');
    process.exit(1);
  }

  const zip = new AdmZip();
  
  // Add core files
  zip.addLocalFile('package.json');
  zip.addLocalFile('manifest.json');
  zip.addLocalFolder('src', 'src');

  // Write archive
  zip.writeZip(outputFileName);
  console.log(`[SUCCESS] Advanced archive successfully compiled: ${path.resolve(outputFileName)}`);
}

compileBundle();



