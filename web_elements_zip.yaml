/**
 * Active AI Web Elements - Scanner Core
 * Author: Gilbert Algordo (https://g.dev/gilbert_algordo)
 */
class AIScanner {
  constructor() {
    this.activeNodes = [];
    this.isScanning = false;
  }

  scanPage(strictness = 'normal') {
    this.clearScan();
    const selector = strictness === 'high' 
      ? 'button, input, select, textarea, [role="button"], article, section, ai-element' 
      : 'button, input, select, textarea, ai-element';
    
    const elements = document.querySelectorAll(selector);
    elements.forEach((el, index) => {
      el.classList.add('ai-scanned-target');
      this.activeNodes.push(el);
    });

    console.info(`[AIScanner] Successfully indexed ${this.activeNodes.length} active nodes on page.`);
    return this.activeNodes.length;
  }

  clearScan() {
    this.activeNodes.forEach(el => el.classList.remove('ai-scanned-target'));
    this.activeNodes = [];
  }
}

window.aiScannerInstance = new AIScanner();



