#include <WiFiManager.h> // https://github.com/tzapu/WiFiManager

void setup() {
    Serial.begin(115200);
    WiFiManager wm;

    // Advanced: Add custom styling to the portal to match your branding
    wm.setCustomHeadElement("<style>body{background-color:#000; color:#0f0;} input{background:#333; color:#fff;}</style>");
    
    // Advanced: Force the portal to start even if credentials exist (e.g., on a button press)
    // wm.resetSettings(); 

    // Auto-connect with timeout: Portal closes after 3 minutes if no input
    wm.setConfigPortalTimeout(180);

    if (!wm.autoConnect("RaceCorp_Config", "password123")) {
        Serial.println("Failed to connect, restarting...");
        ESP.restart();
    }
    
    Serial.println("Connected to local network!");
}



val suggestion = WifiNetworkSuggestion.Builder()
    .setSsid("Target_Network_SSID")
    .setWpa2Passphrase("password")
    .setIsAppInteractionRequired(false) // Allows for smoother automation
    .build()

val wifiManager = context.getSystemService(Context.WIFI_SERVICE) as WifiManager
val status = wifiManager.addNetworkSuggestions(listOf(suggestion))

if (status == WifiManager.STATUS_NETWORK_SUGGESTIONS_SUCCESS) {
    // System will now attempt to connect when in range
}




