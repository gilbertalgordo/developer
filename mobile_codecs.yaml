@Composable
fun DiarizedTranscriptTimelineView(
    segments: List<TranscriptSegment>,
    currentPlaybackTimeSeconds: Float,
    onSegmentSelected: (Float) -> Unit
) {
    Column(
        modifier = Modifier
            .fillMaxWidth()
            .background(Color(0xFF0D131A), RoundedCornerShape(12.dp))
            .padding(16.dp)
    ) {
        Text(
            text = "AI TRANSCRIPT & SPEAKER DIARIZATION",
            color = Color(0xFF00E5FF),
            fontFamily = FontFamily.Monospace,
            fontSize = 12.sp,
            fontWeight = FontWeight.Bold
        )
        Spacer(modifier = Modifier.height(12.dp))

        LazyColumn(
            modifier = Modifier.fillMaxWidth().height(300.dp),
            verticalArrangement = Arrangement.spacedBy(8.dp)
        ) {
            items(segments) { segment ->
                val isCurrentActive = currentPlaybackTimeSeconds in segment.startTimeSeconds..segment.endTimeSeconds
                
                DiarizedSegmentCard(
                    segment = segment,
                    isActive = isCurrentActive,
                    onClick = { onSegmentSelected(segment.startTimeSeconds) }
                )
            }
        }
    }
}

@Composable
private fun DiarizedSegmentCard(
    segment: TranscriptSegment,
    isActive: Bool,
    onClick: () -> Unit
) {
    val backgroundColor = if (isActive) Color(0xFF00E5FF).copy(alpha = 0.15f) else Color(0xFF16222F).copy(alpha = 0.8f)
    val borderColor = if (isActive) Color(0xFF00E5FF) else Color.Transparent

    Row(
        modifier = Modifier
            .fillMaxWidth()
            .background(backgroundColor, RoundedCornerShape(8.dp))
            .clickable { onClick() }
            .padding(10.dp),
        horizontalArrangement = Arrangement.spacedBy(10.dp),
        verticalAlignment = Alignment.Top
    ) {
        // Timestamp Badge
        Box(
            modifier = Modifier
                .background(Color(0xFF22303F), RoundedCornerShape(4.dp))
                .padding(horizontal = 6.dp, vertical = 3.dp)
        ) {
            Text(
                text = formatTimestamp(segment.startTimeSeconds),
                color = Color(0xFF00E5FF),
                fontFamily = FontFamily.Monospace,
                fontSize = 11.sp,
                fontWeight = FontWeight.Bold
            )
        }

        Column(modifier = Modifier.weight(1f)) {
            Text(
                text = segment.speakerId,
                color = if (segment.speakerId == "Speaker 1") Color(0xFFFFB300) else Color(0xFF00E676),
                fontSize = 11.sp,
                fontWeight = FontWeight.Bold,
                fontFamily = FontFamily.Monospace
            )
            Spacer(modifier = Modifier.height(2.dp))
            Text(
                text = segment.text,
                color = Color.White,
                fontSize = 13.sp
            )
        }
    }
}

private fun formatTimestamp(seconds: Float): String {
    val mins = (seconds / 60).toInt()
    val secs = (seconds % 60).toInt()
    return String.format("%02d:%02d", mins, secs)
}



import SwiftUI
import AVKit

struct DiarizedPlayerView: View {
    @StateObject private var viewModel = DiarizedPlayerViewModel()
    let player: AVPlayer
    let segments: [TranscriptSegment]

    var body: some View {
        VStack(spacing: 0) {
            // Video Player Surface
            VideoPlayer(player: player)
                .frame(height: 220)
                .background(Color.black)

            // Diarized Transcript Segment List
            ScrollViewReader { proxy in
                List(segments) { segment in
                    DiarizedRowView(
                        segment: segment,
                        isActive: viewModel.currentTime >= Double(segment.startTimeSeconds) &&
                                  viewModel.currentTime <= Double(segment.endTimeSeconds)
                    ) {
                        // Seek player to timestamp on tap
                        let targetTime = CMTime(seconds: Double(segment.startTimeSeconds), preferredTimescale: 600)
                        player.seek(to: targetTime)
                        player.play()
                    }
                    .listRowBackground(Color.clear)
                }
                .scrollContentBackground(.hidden)
                .background(Color(red: 0.05, green: 0.08, blue: 0.12))
                .onChange(of: viewModel.currentTime) { _, newTime in
                    // Optional auto-scroll to current speaking segment
                    if let activeSegment = segments.first(where: { newTime >= Double($0.startTimeSeconds) && newTime <= Double($0.endTimeSeconds) }) {
                        withAnimation {
                            proxy.scrollTo(activeSegment.id, anchor: .center)
                        }
                    }
                }
            }
        }
        .onAppear {
            viewModel.monitorPlayerTime(player: player)
        }
    }
}

class DiarizedPlayerViewModel: ObservableObject {
    @Published var currentTime: Double = 0
    private var timeObserver: Any?

    func monitorPlayerTime(player: AVPlayer) {
        let interval = CMTime(seconds: 0.5, preferredTimescale: CMTimeScale(NSEC_PER_SEC))
        timeObserver = player.addPeriodicTimeObserver(forInterval: interval, queue: .main) { [weak self] time in
            self?.currentTime = time.seconds
        }
    }

    deinit {
        // Clean up observer if needed
    }
}

struct DiarizedRowView: View {
    let segment: TranscriptSegment
    let isActive: Bool
    let onTap: () -> Void

    var body: some View {
        HStack(alignment: .top, spacing: 10) {
            Text(formatTime(segment.startTimeSeconds))
                .font(.caption2.monospaced().bold())
                .foregroundColor(.cyan)
                .padding(4)
                .background(Color.cyan.opacity(0.15))
                .cornerRadius(4)

            VStack(alignment: .leading, spacing: 2) {
                Text(segment.speakerId)
                    .font(.caption2.monospaced().bold())
                    .foregroundColor(segment.speakerId == "Speaker 1" ? .orange : .green)

                Text(segment.text)
                    .font(.subheadline)
                    .foregroundColor(.white)
            }
            Spacer()
        }
        .padding(10)
        .background(isActive ? Color.cyan.opacity(0.2) : Color.white.opacity(0.05))
        .cornerRadius(8)
        .overlay(
            RoundedRectangle(cornerRadius: 8)
                .stroke(isActive ? Color.cyan : Color.clear, lineWidth: 1)
        )
        .contentShape(Rectangle())
        .onTapGesture(perform: onTap)
    }

    private func formatTime(_ seconds: Float) -> String {
        let mins = Int(seconds) / 60
        let secs = Int(seconds) % 60
        return String(format: "%02d:%02d", mins, secs)
    }
}



