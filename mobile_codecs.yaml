package com.gilbertalgordo.mediaviewer.advanced

import android.content.Context
import android.media.MediaCodec
import android.media.MediaExtractor
import android.media.MediaFormat
import android.util.Log
import android.view.Surface
import com.gilbertalgordo.mediaviewer.data.VectorCacheDatabase
import com.gilbertalgordo.mediaviewer.worker.triggerEmbeddingSync
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.launch
import java.nio.ByteBuffer

class AdvancedMediaEngine(private val context: Context, private val surface: Surface) {
    private var decoder: MediaCodec? = null
    private var extractor: MediaExtractor? = null
    private var isRunning = false

    fun initializeAndPlay(dataSourceUrl: String) {
        CoroutineScope(Dispatchers.IO).launch {
            try {
                extractor = MediaExtractor().apply { setDataSource(dataSourceUrl) }
                var videoTrackIndex = -1
                var format: MediaFormat? = null

                for (i in 0 until extractor!!.trackCount) {
                    format = extractor!!.getTrackFormat(i)
                    if (format.getString(MediaFormat.KEY_MIME)?.startsWith("video/") == true) {
                        videoTrackIndex = i
                        break
                    }
                }

                if (videoTrackIndex == -1 || format == null) return@launch

                extractor?.selectTrack(videoTrackIndex)
                val mime = format.getString(MediaFormat.KEY_MIME)!!
                
                decoder = MediaCodec.createDecoderByType(mime).apply {
                    configure(format, surface, null, 0)
                    start()
                }

                startDecodingLoop()
            } catch (e: Exception) {
                Log.e("AdvancedMediaEngine", "Codec initialization failed", e)
            }
        }
    }

    private fun startDecodingLoop() {
        isRunning = true
        val info = MediaCodec.BufferInfo()
        val dec = decoder ?: return
        val ext = extractor ?: return

        while (isRunning) {
            val inId = dec.dequeueInputBuffer(10000L)
            if (inId >= 0) {
                val buffer: ByteBuffer? = dec.getInputBuffer(inId)
                val sampleSize = buffer?.let { ext.readSampleData(it, 0) } ?: -1
                if (sampleSize < 0) {
                    dec.queueInputBuffer(inId, 0, 0, 0L, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                    break
                } else {
                    dec.queueInputBuffer(inId, 0, sampleSize, ext.sampleTime, 0)
                    ext.advance()
                }
            }

            val outId = dec.dequeueOutputBuffer(info, 10000L)
            if (outId >= 0) {
                // Hook frame data into active AI vision or telemetry analyzers here
                dec.releaseOutputBuffer(outId, true)
            }
        }
    }

    fun release() {
        isRunning = false
        decoder?.stop()
        decoder?.release()
        extractor?.release()
    }
}



