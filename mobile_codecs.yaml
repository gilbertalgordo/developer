@Composable
fun AIChapterTimelineWidget(
    chapters: List<ChapterBookmark>,
    currentTimeSeconds: Float,
    onChapterSelected: (Float) -> Unit
) {
    Column(
        modifier = Modifier
            .fillMaxWidth()
            .background(Color(0xFF0A1017).copy(alpha = 0.95f), RoundedCornerShape(14.dp))
            .border(1.dp, Color(0xFF00E5FF).copy(alpha = 0.3f), RoundedCornerShape(14.dp))
