data class SemanticSearchResult(
    val file: FileCacheEntity,
    val similarityScore: Float
)

@OptIn(ExperimentalMaterial3Api::class)
@Composable
fun SemanticSearchWidget(
    database: VectorCacheDatabase,
    embeddingEngine: TFLiteEmbeddingEngine,
    onFileSelected: (FileCacheEntity) -> Unit
) {
    var query by remember { mutableStateOf("") }
    var expanded by remember { mutableStateOf(false) }
    var isSearching by remember { mutableStateOf(false) }
    var results by remember { mutableStateOf<List<SemanticSearchResult>>(emptyList()) }

    // Debounced on-device semantic inference
    LaunchedEffect(query) {
        if (query.isBlank()) {
            results = emptyList()
            return@LaunchedEffect
        }
        isSearching = true
        delay(250L) // Debounce keystrokes before running TFLite inference

        val rankedMatches = withContext(Dispatchers.Default) {
            val queryVector = embeddingEngine.generateEmbedding(query)
            val cachedFiles = database.fileCacheDao().getAllCachedFiles()

            cachedFiles.mapNotNull { entity ->
                val storedVector = entity.embeddingJson
                    .split(",")
                    .mapNotNull { it.toFloatOrNull() }
                    .toFloatArray()

                if (storedVector.size == queryVector.size) {
                    val score = VectorSearchEngine.cosineSimilarity(queryVector, storedVector)
                    if (score >= 0.45f) SemanticSearchResult(entity, score) else null
                } else null
            }.sortedByDescending { it.similarityScore }
        }

        results = rankedMatches
        isSearching = false
    }

    Column(
        modifier = Modifier
            .fillMaxWidth()
            .padding(16.dp)
    ) {
        SearchBar(
            modifier = Modifier.fillMaxWidth(),
            inputField = {
                SearchBarDefaults.InputField(
                    query = query,
                    onQueryChange = { query = it },
                    onSearch = { expanded = false },
                    expanded = expanded,
                    onExpandedChange = { expanded = it },
                    placeholder = {
                        Text(
                            "Query local media & docs semantically...",
                            fontFamily = FontFamily.Monospace,
                            fontSize = 13.sp
                        )
                    },
                    leadingIcon = { Icon(Icons.Default.Search, contentDescription = "Semantic Search") },
                    trailingIcon = {
                        if (query.isNotEmpty()) {
                            IconButton(onClick = { query = "" }) {
                                Icon(Icons.Default.Close, contentDescription = "Clear Query")
                            }
                        }
                    }
                )
            },
            expanded = expanded,
            onExpandedChange = { expanded = it },
            shape = RoundedCornerShape(14.dp),
            colors = SearchBarDefaults.colors(
                containerColor = Color(0xFF101820).copy(alpha = 0.92f)
            )
        ) {
            if (isSearching) {
                LinearProgressIndicator(
                    modifier = Modifier.fillMaxWidth(),
                    color = Color(0xFF00E5FF)
                )
            }

            LazyColumn(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(12.dp),
                verticalArrangement = Arrangement.spacedBy(8.dp)
            ) {
                items(results, key = { it.file.fileId }) { match ->
                    SemanticResultHudCard(
                        match = match,
                        onClick = {
                            expanded = false
                            onFileSelected(match.file)
                        }
                    )
                }
            }
        }
    }
}

@Composable
private fun SemanticResultHudCard(
    match: SemanticSearchResult,
    onClick: () -> Unit
) {
    val confidencePercent = (match.similarityScore * 100).toInt()
    val badgeColor = when {
        confidencePercent >= 80 -> Color(0xFF00E676)
        confidencePercent >= 60 -> Color(0xFF00E5FF)
        else -> Color(0xFFFFB300)
    }

    Row(
        modifier = Modifier
            .fillMaxWidth()
            .background(Color(0xFF182430).copy(alpha = 0.75f), RoundedCornerShape(10.dp))
            .border(1.dp, badgeColor.copy(alpha = 0.4f), RoundedCornerShape(10.dp))
            .clickable { onClick() }
            .padding(12.dp),
        verticalAlignment = Alignment.CenterVertically,
        horizontalArrangement = Arrangement.SpaceBetween
    ) {
        Column(modifier = Modifier.weight(1f).padding(end = 8.dp)) {
            Text(
                text = match.file.title,
                color = Color.White,
                fontWeight = FontWeight.SemiBold,
                fontSize = 15.sp
            )
            Spacer(modifier = Modifier.height(4.dp))
            Text(
                text = match.file.transcriptContent.take(90) + "...",
                color = Color(0xFFB0BEC5),
                fontSize = 12.sp,
                maxLines = 2
            )
        }

        // HUD Telemetry Match Badge
        Box(
            modifier = Modifier
                .background(badgeColor.copy(alpha = 0.15f), RoundedCornerShape(6.dp))
                .border(1.dp, badgeColor, RoundedCornerShape(6.dp))
                .padding(horizontal = 8.dp, vertical = 4.dp)
        ) {
            Text(
                text = "$confidencePercent% MATCH",
                color = badgeColor,
                fontFamily = FontFamily.Monospace,
                fontWeight = FontWeight.Bold,
                fontSize = 11.sp
            )
        }
    }
}



import SwiftUI
import SQLite3

struct SemanticFileMatch: Identifiable {
    let id: String
    let title: String
    let snippet: String
    let similarity: Float
}

@MainActor
class SemanticSearchViewModel: ObservableObject {
    @Published var query: String = ""
    @Published var matches: [SemanticFileMatch] = []
    @Published var isComputing: Bool = false

    private let coreMLEngine = CoreMLEmbeddingEngine()
    private var searchTask: Task<Void, Never>?

    func onQueryUpdated(_ newQuery: String) {
        searchTask?.cancel()
        
        guard !newQuery.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
            matches = []
            isComputing = false
            return
        }

        isComputing = true
        searchTask = Task {
            // 250ms debounce window
            try? await Task.sleep(nanoseconds: 250_000_000)
            guard !Task.isCancelled else { return }

            let computedResults = await performOfflineVectorSearch(for: newQuery)
            guard !Task.isCancelled else { return }

            self.matches = computedResults
            self.isComputing = false
        }
    }

    private func performOfflineVectorSearch(for text: String) async -> [SemanticFileMatch] {
        return await Task.detached(priority: .userInitiated) { [coreMLEngine] in
            guard let queryVector = coreMLEngine.generateEmbedding(for: text) else {
                return []
            }

            let cachedRecords = VectorCacheManager.shared.fetchAllRecordsWithVectors()
            var ranked: [SemanticFileMatch] = []

            for record in cachedRecords {
                let score = VectorCacheManager.shared.computeCosineSimilarity(queryVector, record.embedding)
                if score >= 0.45 {
                    ranked.append(
                        SemanticFileMatch(
                            id: record.fileId,
                            title: record.title,
                            snippet: String(record.content.prefix(100)),
                            similarity: score
                        )
                    )
                }
            }

            return ranked.sorted { $0.similarity > $1.similarity }
        }.value
    }
}

struct SemanticSearchView: View {
    @StateObject private var viewModel = SemanticSearchViewModel()
    var onSelectFile: (String) -> Void

    var body: some View {
        NavigationStack {
            ZStack {
                Color(red: 0.06, green: 0.09, blue: 0.12)
                    .ignoresSafeArea()

                VStack(spacing: 12) {
                    if viewModel.isComputing {
                        ProgressView("Running Neural Engine Vector Search...")
                            .tint(.cyan)
                            .foregroundColor(.cyan)
                            .font(.caption.monospaced())
                            .padding(.top, 8)
                    }

                    if viewModel.matches.isEmpty && !viewModel.query.isEmpty && !viewModel.isComputing {
                        ContentUnavailableView(
                            "No Semantic Matches",
                            systemImage: "waveform.path.ecg",
                            description: Text("No local media or transcripts exceeded the similarity threshold.")
                        )
                        .foregroundStyle(.gray)
                    } else {
                        ScrollView {
                            LazyVStack(spacing: 10) {
                                ForEach(viewModel.matches) { match in
                                    SemanticMatchCard(match: match)
                                        .onTapGesture {
                                            onSelectFile(match.id)
                                        }
                                }
                            }
                            .padding(.horizontal)
                        }
                    }
                }
            }
            .navigationTitle("AI Media Index")
            .searchable(text: $viewModel.query, prompt: "Search concepts, scenes, or transcripts...")
            .onChange(of: viewModel.query) { _, newValue in
                viewModel.onQueryUpdated(newValue)
            }
        }
    }
}

struct SemanticMatchCard: View {
    let match: SemanticFileMatch

    private var matchPercentage: Int {
        Int(match.similarity * 100)
    }

    private var accentColor: Color {
        switch matchPercentage {
        case 80...100: return .green
        case 60..<80: return .cyan
        default: return .orange
        }
    }

    var body: some View {
        HStack(alignment: .center, spacing: 12) {
            VStack(alignment: .leading, spacing: 4) {
                Text(match.title)
                    .font(.headline)
                    .foregroundColor(.white)

                Text(match.snippet)
                    .font(.caption)
                    .foregroundColor(.gray)
                    .lineLimit(2)
            }

            Spacer()

            Text("\(matchPercentage)%")
                .font(.caption2.monospaced().bold())
                .foregroundColor(accentColor)
                .padding(.horizontal, 8)
                .padding(.vertical, 5)
                .background(accentColor.opacity(0.15))
                .overlay(
                    RoundedRectangle(cornerRadius: 6)
                        .stroke(accentColor, lineWidth: 1)
                )
                .cornerRadius(6)
        }
        .padding(12)
        .background(.ultraThinMaterial)
        .cornerRadius(12)
        .overlay(
            RoundedRectangle(cornerRadius: 12)
                .stroke(accentColor.opacity(0.35), lineWidth: 1)
        )
    }
}



extension VectorCacheManager {
    func fetchAllRecordsWithVectors() -> [(fileId: String, title: String, content: String, embedding: [Float])] {
        var results: [(String, String, String, [Float])] = []
        let query = "SELECT fileId, title, content, embedding FROM FileCache;"
        var stmt: OpaquePointer?

        if sqlite3_prepare_v2(db, query, -1, &stmt, nil) == SQLITE_OK {
            while sqlite3_step(stmt) == SQLITE_ROW {
                let fileId = String(cString: sqlite3_column_text(stmt, 0))
                let title = String(cString: sqlite3_column_text(stmt, 1))
                let content = String(cString: sqlite3_column_text(stmt, 2))

                if let blobPointer = sqlite3_column_blob(stmt, 3) {
                    let blobBytes = Int(sqlite3_column_bytes(stmt, 3))
                    let floatCount = blobBytes / MemoryLayout<Float>.size
                    let buffer = blobPointer.bindMemory(to: Float.self, capacity: floatCount)
                    let vector = Array(UnsafeBufferPointer(start: buffer, count: floatCount))
                    results.append((fileId, title, content, vector))
                }
            }
        }
        sqlite3_finalize(stmt)
        return results
    }
}



package com.gilbertalgordo.mediaviewer.worker

import android.content.Context
import androidx.work.Constraints
import androidx.work.Data
import androidx.work.OneTimeWorkRequestBuilder
import androidx.work.WorkManager
import androidx.work.Worker
import androidx.work.WorkerParameters
import java.io.File

class MediaTranscriptionWorker(appContext: Context, workerParams: WorkerParameters) :
    Worker(appContext, workerParams) {

    override fun doWork(): Result {
        val filePath = inputData.getString("FILE_PATH") ?: return Result.failure()
        val fileId = inputData.getString("FILE_ID") ?: java.util.UUID.randomUUID().toString()
        val title = inputData.getString("FILE_TITLE") ?: "Imported Media"

        try {
            // 1. Extract audio stream / convert media audio to 16kHz PCM mono required by local speech engines
            val extractedText = transcribeAudioLocally(filePath)

            // 2. Chain directly into the Embedding Sync Worker to compute vectors & cache in Room DB
            triggerEmbeddingSyncPipeline(applicationContext, fileId, title, extractedText)

            return Result.success()
        } catch (e: Exception) {
            e.printStackTrace()
            return Result.failure()
        }
    }

    private fun transcribeAudioLocally(path: String): String {
        // Placeholder for Whisper.cpp JNI invocation or Android Speech API offline processing
        // Returns the raw transcribed text string from the audio/video file stream
        return "Transcribed audio content from media file at $path: discussed modular architecture, vector indexing, and low-latency codec pipelines."
    }

    private fun triggerEmbeddingSyncPipeline(context: Context, fileId: String, title: String, content: String) {
        val inputData = Data.Builder()
            .putString("FILE_ID", fileId)
            .putString("FILE_TITLE", title)
            .putString("FILE_CONTENT", content)
            .build()

        val syncRequest = OneTimeWorkRequestBuilder<EmbeddingSyncWorker>()
            .setInputData(inputData)
            .build()

        WorkManager.getInstance(context).enqueue(syncRequest)
    }
}



import Foundation
import Speech
import AVFoundation

class MediaTranscriptionManager: NSObject {
    static let shared = MediaTranscriptionManager()

    private override init() {
        super.init()
    }

    /// Requests speech recognition permission and transcribes local audio/video file URLs
    func transcribeMediaFile(at fileURL: URL, fileId: String, title: String) {
        SFSpeechRecognizer.requestAuthorization { authStatus in
            guard authStatus == .authorized else {
                print("Speech recognition authorization denied.")
                return
            }

            let recognizer = SFSpeechRecognizer(locale: Locale(identifier: "en-US"))
            guard let recognizer = recognizer, recognizer.isAvailable else {
                print("SFSpeechRecognizer is not available.")
                return
            }

            let request = SFSpeechURLRecognitionRequest(url: fileURL)
            request.shouldReportPartialResults = false

            recognizer.recognitionTask(with: request) { result, error in
                if let error = error {
                    print("Transcription failed: \(error.localizedDescription)")
                    return
                }

                if let transcription = result?.bestTranscription.formattedString, result?.isFinal == true {
                    print("Successfully transcribed media: \(transcription)")

                    // Auto-index into vector embeddings and cache via background manager
                    MediaEmbeddingSyncManager.shared.scheduleEmbeddingGeneration(
                        fileId: fileId,
                        title: title,
                        content: transcription
                    )
                }
            }
        }
    }
}



