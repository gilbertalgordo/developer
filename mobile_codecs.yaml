final class AdvancedMediaViewerController: UIViewController {
    private var player: AVPlayer?
    private var playerLayer: AVPlayerLayer?
    private var assetReader: AVAssetReader?
    private let coreMLEngine = CoreMLEmbeddingEngine()

    override func viewDidLoad() {
        super.viewDidLoad()
        setupPlayer(with: URL(string: "https://www.w3schools.com/html/mov_bbb.mp4")!)
    }

    private func setupPlayer(with url: URL) {
        let asset = AVAsset(url: url)
        let playerItem = AVPlayerItem(asset: asset)
        player = AVPlayer(playerItem: playerItem)
        
        playerLayer = AVPlayerLayer(player: player)
        playerLayer?.frame = view.bounds
        playerLayer?.videoGravity = .resizeAspectFill
        if let layer = playerLayer {
            view.layer.addSublayer(layer)
        }

        // Initialize background hardware decoder pipeline
        prepareHardwareAssetReader(for: asset)
        player?.play()
    }

    private func prepareHardwareAssetReader(for asset: AVAsset) {
        Task {
            do {
                let reader = try AVAssetReader(asset: asset)
                guard let track = try await asset.loadTracks(withMediaType: .video).first else { return }
                
                let outputSettings: [String: Any] = [
                    kCVPixelBufferPixelFormatTypeKey as String: Int(kCVPixelFormatType_32BGRA)
                ]
                let trackOutput = AVAssetReaderTrackOutput(track: track, outputSettings: outputSettings)
                reader.add(trackOutput)
                
                if reader.startReading() {
                    self.assetReader = reader
                    processDecodedFrames(output: trackOutput)
                }
            } catch {
                print("Asset reader setup error: \(error.localizedDescription)")
            }
        }
    }

    private func processDecodedFrames(output: AVAssetReaderTrackOutput) {
        // Advanced frame analysis hook for active AI visual intelligence
    }

    override func viewDidLayoutSubviews() {
        super.viewDidLayoutSubviews()
        playerLayer?.frame = view.bounds
    }
}



