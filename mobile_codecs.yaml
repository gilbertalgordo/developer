        Spacer(modifier = Modifier.height(10.dp))

        LazyRow(
            horizontalArrangement = Arrangement.spacedBy(10.dp),
            modifier = Modifier.fillMaxWidth()
        ) {
            items(chapters) { chapter ->
                val isCurrentChapter = currentTimeSeconds in chapter.startTimeSeconds..chapter.endTimeSeconds
                ChapterCard(
                    chapter = chapter,
                    isActive = isCurrentChapter,
                    onClick = { onChapterSelected(chapter.startTimeSeconds) }
                )
            }
        }
    }
}

@Composable
private fun ChapterCard(
    chapter: ChapterBookmark,
    isActive: Boolean,
    onClick: () -> Unit
) {
    val cardBg = if (isActive) Color(0xFF00E5FF).copy(alpha = 0.2f) else Color(0xFF14202B)
    val borderColor = if (isActive) Color(0xFF00E5FF) else Color(0xFF26384A)

    Column(
        modifier = Modifier
            .width(220.dp)
            .background(cardBg, RoundedCornerShape(10.dp))
            .border(1.dp, borderColor, RoundedCornerShape(10.dp))
            .clickable { onClick() }
            .padding(12.dp)
    ) {
        Row(
            modifier = Modifier.fillMaxWidth(),
            horizontalArrangement = Arrangement.SpaceBetween,
            verticalAlignment = Alignment.CenterVertically
        ) {
            Text(
                text = formatTimestamp(chapter.startTimeSeconds),
                color = Color(0xFF00E5FF),
                fontFamily = FontFamily.Monospace,
                fontSize = 10.sp,
                fontWeight = FontWeight.Bold
            )
            Box(
                modifier = Modifier
                    .background(Color(0xFF1E3042), RoundedCornerShape(4.dp))
                    .padding(horizontal = 5.dp, vertical = 2.dp)
            ) {
                Text(
                    text = "${(chapter.endTimeSeconds - chapter.startTimeSeconds).toInt()}s",
                    color = Color(0xFFB0BEC5),
                    fontFamily = FontFamily.Monospace,
                    fontSize = 9.sp
                )
            }
        }

        Spacer(modifier = Modifier.height(6.dp))
        Text(
            text = chapter.title,
            color = Color.White,
            fontWeight = FontWeight.Bold,
            fontSize = 13.sp,
            maxLines = 1
        )
        Spacer(modifier = Modifier.height(3.dp))
        Text(
            text = chapter.summary,
            color = Color(0xFF90A4AE),
            fontSize = 11.sp,
            maxLines = 2
        )
    }
}

private fun formatTimestamp(seconds: Float): String {
    val mins = (seconds / 60).toInt()
    val secs = (seconds % 60).toInt()
    return String.format("%02d:%02d", mins, secs)
}



