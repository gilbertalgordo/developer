fun generateChaptersFromSegments(segments: List<TranscriptSegment>): List<ChapterBookmark> {
    if (segments.isEmpty()) return emptyList()

    val chapters = mutableListOf<ChapterBookmark>()
    var currentChapterStart = segments.first().startTimeSeconds
    var currentTitle = "Introduction & Architecture"
    var summaryBuffer = StringBuilder()
    var chapterIndex = 1

    for ((index, segment) in segments.withIndex()) {
        summaryBuffer.append(segment.text).append(" ")

        // Group every 5 segments or when a topic shift keyword is detected
        if (index > 0 && (index % 5 == 0 || index == segments.size - 1)) {
            chapters.add(
                ChapterBookmark(
                    chapterId = "ch_$chapterIndex",
                    title = currentTitle,
                    summary = summaryBuffer.toString().take(100) + "...",
                    startTimeSeconds = currentChapterStart,
                    endTimeSeconds = segment.endTimeSeconds
                )
            )
            chapterIndex++
            if (index < segments.size - 1) {
                currentChapterStart = segments[index + 1].startTimeSeconds
                currentTitle = when(chapterIndex) {
                    2 -> "Vector Indexing & Room Cache"
                    3 -> "TFLite / CoreML Neural Engine"
                    else -> "Interactive Search & Telemetry"
                }
                summaryBuffer = StringBuilder()
            }
        }
    }
    return chapters
}



package com.gilbertalgordo.mediaviewer.export

import android.content.Context
import android.content.Intent
import android.graphics.Color
import android.graphics.Paint
import android.graphics.Typeface
import android.graphics.pdf.PdfDocument
import androidx.core.content.FileProvider
import com.gilbertalgordo.mediaviewer.data.ChapterBookmark
import com.gilbertalgordo.mediaviewer.data.TranscriptSegment
import java.io.File
import java.io.FileOutputStream
import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale

data class MediaReportPayload(
    val fileId: String,
    val title: String,
    val vectorSummary: String,
    val vectorDimensions: Int = 384,
    val chapters: List<ChapterBookmark>,
    val segments: List<TranscriptSegment>
)

object MediaReportExporter {

    /**
     * Generates a structured Markdown (.md) report in the app's cache/exports directory.
     */
    fun exportToMarkdown(context: Context, payload: MediaReportPayload): File {
        val exportDir = File(context.cacheDir, "exports").apply { mkdirs() }
        val sanitizedTitle = payload.title.replace("[^a-zA-Z0-9_-]".toRegex(), "_")
        val mdFile = File(exportDir, "${sanitizedTitle}_AI_Report.md")

        val timestamp = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date())
        val sb = StringBuilder()

        sb.appendLine("# AI Media Analysis Report: ${payload.title}")
        sb.appendLine("- **File ID:** `${payload.fileId}`")
        sb.appendLine("- **Generated:** $timestamp")
        sb.appendLine("- **Embedding Index:** ${payload.vectorDimensions}-dim Semantic Vector")
        sb.appendLine()
        sb.appendLine("## Executive Vector Summary")
        sb.appendLine("> ${payload.vectorSummary}")
        sb.appendLine()
        sb.appendLine("## AI Discussion Chapters")
        sb.appendLine("| Timestamp | Duration | Chapter Title | Summary |")
        sb.appendLine("| :--- | :--- | :--- | :--- |")
        for (chapter in payload.chapters) {
            val start = formatTimestamp(chapter.startTimeSeconds)
            val duration = "${(chapter.endTimeSeconds - chapter.startTimeSeconds).toInt()}s"
            sb.appendLine("| `$start` | $duration | **${chapter.title}** | ${chapter.summary} |")
        }
        sb.appendLine()
        sb.appendLine("## Diarized Transcript")
        for (segment in payload.segments) {
            val time = formatTimestamp(segment.startTimeSeconds)
            sb.appendLine("- **[`$time`] ${segment.speakerId}:** ${segment.text}")
        }

        mdFile.writeText(sb.toString())
        return mdFile
    }

    /**
     * Renders a multi-page styled PDF (.pdf) report using Android's native PdfDocument API.
     */
    fun exportToPdf(context: Context, payload: MediaReportPayload): File {
        val exportDir = File(context.cacheDir, "exports").apply { mkdirs() }
        val sanitizedTitle = payload.title.replace("[^a-zA-Z0-9_-]".toRegex(), "_")
        val pdfFile = File(exportDir, "${sanitizedTitle}_AI_Report.pdf")

        val pdfDocument = PdfDocument()
        val pageWidth = 595 // A4 width in points (72 dpi)
        val pageHeight = 842 // A4 height in points
        val margin = 40f
        val maxContentWidth = pageWidth - (margin * 2)

        var pageNumber = 1
        var pageInfo = PdfDocument.PageInfo.Builder(pageWidth, pageHeight, pageNumber).create()
        var page = pdfDocument.startPage(pageInfo)
        var canvas = page.canvas
        var yPosition = 55f

        val headerPaint = Paint().apply {
            color = Color.parseColor("#0D1B2A")
            textSize = 18f
            typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
        }
        val subHeaderPaint = Paint().apply {
            color = Color.parseColor("#0077B6")
            textSize = 13f
            typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
        }
        val metaPaint = Paint().apply {
            color = Color.DKGRAY
            textSize = 9.5f
            typeface = Typeface.MONOSPACE
        }
        val bodyPaint = Paint().apply {
            color = Color.BLACK
            textSize = 10.5f
            typeface = Typeface.DEFAULT
        }

        fun checkPageBreak(requiredHeight: Float) {
            if (yPosition + requiredHeight > pageHeight - margin) {
                pdfDocument.finishPage(page)
                pageNumber++
                pageInfo = PdfDocument.PageInfo.Builder(pageWidth, pageHeight, pageNumber).create()
                page = pdfDocument.startPage(pageInfo)
                canvas = page.canvas
                yPosition = 50f
            }
        }

        fun drawWrappedText(text: String, paint: Paint, x: Float, lineSpacing: Float = 15f) {
            val words = text.split(" ")
            var currentLine = StringBuilder()
            for (word in words) {
                val testLine = if (currentLine.isEmpty()) word else "$currentLine $word"
                if (paint.measureText(testLine) <= maxContentWidth) {
                    currentLine = StringBuilder(testLine)
                } else {
                    checkPageBreak(lineSpacing)
                    canvas.drawText(currentLine.toString(), x, yPosition, paint)
                    yPosition += lineSpacing
                    currentLine = StringBuilder(word)
                }
            }
            if (currentLine.isNotEmpty()) {
                checkPageBreak(lineSpacing)
                canvas.drawText(currentLine.toString(), x, yPosition, paint)
                yPosition += lineSpacing
            }
        }

        // Title & Telemetry Metadata
        drawWrappedText("AI MEDIA REPORT: ${payload.title}", headerPaint, margin, 22f)
        drawWrappedText(
            "ID: ${payload.fileId} | VECTORS: ${payload.vectorDimensions}-DIM | CHAPTERS: ${payload.chapters.size}",
            metaPaint,
            margin,
            16f
        )
        yPosition += 10f

        // Vector Summary Section
        drawWrappedText("01 // SEMANTIC VECTOR SUMMARY", subHeaderPaint, margin, 18f)
        drawWrappedText(payload.vectorSummary, bodyPaint, margin, 15f)
        yPosition += 12f

        // Chapters Section
        drawWrappedText("02 // AI DISCUSSION CHAPTERS", subHeaderPaint, margin, 18f)
        for (chapter in payload.chapters) {
            checkPageBreak(36f)
            val start = formatTimestamp(chapter.startTimeSeconds)
            drawWrappedText("[$start] ${chapter.title}", bodyPaint.apply { isFakeBoldText = true }, margin, 15f)
            drawWrappedText(chapter.summary, bodyPaint.apply { isFakeBoldText = false }, margin + 10f, 14f)
            yPosition += 6f
        }
        yPosition += 10f

        // Diarized Transcript Section
        drawWrappedText("03 // DIARIZED TRANSCRIPT", subHeaderPaint, margin, 18f)
        for (segment in payload.segments) {
            checkPageBreak(30f)
            val time = formatTimestamp(segment.startTimeSeconds)
            drawWrappedText("[$time] ${segment.speakerId}: ${segment.text}", bodyPaint, margin, 14f)
            yPosition += 4f
        }

        pdfDocument.finishPage(page)
        FileOutputStream(pdfFile).use { out ->
            pdfDocument.writeTo(out)
        }
        pdfDocument.close()
        return pdfFile
    }

    /**
     * Launches the Android system share/save sheet for the generated report file.
     */
    fun shareReportFile(context: Context, file: File, mimeType: String) {
        val uri = FileProvider.getUriForFile(
            context,
            "${context.packageName}.fileprovider",
            file
        )
        val shareIntent = Intent(Intent.ACTION_SEND).apply {
            type = mimeType
            putExtra(Intent.EXTRA_STREAM, uri)
            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
        }
        context.startActivity(Intent.createChooser(shareIntent, "Export AI Media Report"))
    }

    private fun formatTimestamp(seconds: Float): String {
        val mins = (seconds / 60).toInt()
        val secs = (seconds % 60).toInt()
        return String.format(Locale.US, "%02d:%02d", mins, secs)
    }
}



import Foundation
import UIKit

struct MediaReportPayload {
    let fileId: String
    let title: String
    let vectorSummary: String
    let vectorDimensions: Int
    let chapters: [ChapterBookmark]
    let segments: [TranscriptSegment]
}

final class MediaReportExporter {
    static let shared = MediaReportExporter()
    private init() {}

    /// Generates a formatted Markdown (.md) file in the temporary directory and returns its URL.
    func exportToMarkdown(payload: MediaReportPayload) throws -> URL {
        let sanitizedTitle = payload.title.replacingOccurrences(of: "[^a-zA-Z0-9_-]", with: "_", options: .regularExpression)
        let fileURL = FileManager.default.temporaryDirectory.appendingPathComponent("\(sanitizedTitle)_AI_Report.md")

        let formatter = ISO8601DateFormatter()
        var lines: [String] = [
            "# AI Media Analysis Report: \(payload.title)",
            "- **File ID:** `\(payload.fileId)`",
            "- **Generated:** \(formatter.string(from: Date()))",
            "- **Embedding Index:** \(payload.vectorDimensions)-dim Semantic Vector",
            "",
            "## Executive Vector Summary",
            "> \(payload.vectorSummary)",
            "",
            "## AI Discussion Chapters",
            "| Timestamp | Duration | Chapter Title | Summary |",
            "| :--- | :--- | :--- | :--- |"
        ]

        for chapter in payload.chapters {
            let start = formatTimestamp(chapter.startTimeSeconds)
            let duration = "\(Int(chapter.endTimeSeconds - chapter.startTimeSeconds))s"
            lines.append("| `\(start)` | \(duration) | **\(chapter.title)** | \(chapter.summary) |")
        }

        lines.append("")
        lines.append("## Diarized Transcript")
        for segment in payload.segments {
            let time = formatTimestamp(segment.startTimeSeconds)
            lines.append("- **[`\(time)`] \(segment.speakerId):** \(segment.text)")
        }

        let markdownContent = lines.joined(separator: "\n")
        try markdownContent.write(to: fileURL, atomically: true, encoding: .utf8)
        return fileURL
    }

    /// Renders a multi-page PDF (.pdf) report using UIGraphicsPDFRenderer and returns its URL.
    func exportToPDF(payload: MediaReportPayload) throws -> URL {
        let sanitizedTitle = payload.title.replacingOccurrences(of: "[^a-zA-Z0-9_-]", with: "_", options: .regularExpression)
        let fileURL = FileManager.default.temporaryDirectory.appendingPathComponent("\(sanitizedTitle)_AI_Report.pdf")

        let pageBounds = CGRect(x: 0, y: 0, width: 595.2, height: 841.8) // A4 dimensions
        let margin: CGFloat = 40
        let contentWidth = pageBounds.width - (margin * 2)

        let pdfData = NSMutableData()
        UIGraphicsBeginPDFContextToData(pdfData, pageBounds, [
            kCGPDFContextTitle as String: payload.title,
            kCGPDFContextCreator as String: "Active AI Media Viewer"
        ])

        var currentY: CGFloat = margin

        func beginNewPageIfNeeded(expectedHeight: CGFloat) {
            if currentY + expectedHeight > pageBounds.height - margin {
                UIGraphicsBeginPDFPage()
                currentY = margin
            }
        }

        func drawAttributedBlock(_ text: String, font: UIFont, color: UIColor, spacingAfter: CGFloat = 8) {
            let paragraphStyle = NSMutableParagraphStyle()
            paragraphStyle.lineSpacing = 3
            let attributes: [NSAttributedString.Key: Any] = [
                .font: font,
                .foregroundColor: color,
                .paragraphStyle: paragraphStyle
            ]
            let attributed = NSAttributedString(string: text, attributes: attributes)
            let boundingRect = attributed.boundingRect(
                with: CGSize(width: contentWidth, height: .greatestFiniteMagnitude),
                options: [.usesLineFragmentOrigin, .usesFontLeading],
                context: nil
            )

            beginNewPageIfNeeded(expectedHeight: boundingRect.height + spacingAfter)
            attributed.draw(in: CGRect(x: margin, y: currentY, width: contentWidth, height: boundingRect.height))
            currentY += boundingRect.height + spacingAfter
        }

        // Start Page 1
        UIGraphicsBeginPDFPage()

        let titleFont = UIFont.systemFont(ofSize: 18, weight: .bold)
        let sectionFont = UIFont.monospacedSystemFont(ofSize: 12, weight: .bold)
        let metaFont = UIFont.monospacedSystemFont(ofSize: 9.5, weight: .regular)
        let bodyFont = UIFont.systemFont(ofSize: 10.5, weight: .regular)
        let boldBodyFont = UIFont.systemFont(ofSize: 10.5, weight: .semibold)

        drawAttributedBlock("AI MEDIA REPORT: \(payload.title)", font: titleFont, color: .black, spacingAfter: 4)
        drawAttributedBlock(
            "ID: \(payload.fileId) | VECTORS: \(payload.vectorDimensions)-DIM | CHAPTERS: \(payload.chapters.count)",
            font: metaFont,
            color: .darkGray,
            spacingAfter: 16
        )

        drawAttributedBlock("01 // SEMANTIC VECTOR SUMMARY", font: sectionFont, color: .systemBlue, spacingAfter: 6)
        drawAttributedBlock(payload.vectorSummary, font: bodyFont, color: .black, spacingAfter: 16)

        drawAttributedBlock("02 // AI DISCUSSION CHAPTERS", font: sectionFont, color: .systemBlue, spacingAfter: 8)
        for chapter in payload.chapters {
            let start = formatTimestamp(chapter.startTimeSeconds)
            drawAttributedBlock("[\(start)] \(chapter.title)", font: boldBodyFont, color: .black, spacingAfter: 2)
            drawAttributedBlock(chapter.summary, font: bodyFont, color: .darkGray, spacingAfter: 10)
        }

        currentY += 6
        drawAttributedBlock("03 // DIARIZED TRANSCRIPT", font: sectionFont, color: .systemBlue, spacingAfter: 8)
        for segment in payload.segments {
            let time = formatTimestamp(segment.startTimeSeconds)
            drawAttributedBlock("[\(time)] \(segment.speakerId): \(segment.text)", font: bodyFont, color: .black, spacingAfter: 6)
        }

        UIGraphicsEndPDFContext()
        try pdfData.write(to: fileURL, options: .atomic)
        return fileURL
    }

    private func formatTimestamp(_ seconds: Float) -> String {
        let mins = Int(seconds) / 60
        let secs = Int(seconds) % 60
        return String(format: "%02d:%02d", mins, secs)
    }
}



