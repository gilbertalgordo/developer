            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .leaflet-popup-tip {
            background: white;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row-reverse h-screen">

    <!-- Map Container -->
    <div id="map" class="flex-grow z-0"></div>

    <!-- Sidebar: Contact Details & Legend -->
    <aside class="w-full md:w-80 bg-white p-5 shadow-2xl z-10 flex flex-col border-b-4 border-red-600 md:border-l-4 md:border-b-0">
        <div class="flex items-center mb-4">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Seal_of_San_Pedro%2C_Laguna.png/120px-Seal_of_San_Pedro%2C_Laguna.png" 
                 alt="San Pedro Logo" class="h-12 w-12 mr-3">
            <div>
                <h1 class="text-lg font-bold text-gray-900">Response Units</h1>
                <p class="text-xs text-gray-600">San Pedro City, Laguna</p>
            </div>
        </div>

        <div class="border-t pt-3 mb-3">
            <h2 class="text-sm font-semibold text-gray-700 mb-2">Live Directory</h2>
            <div class="space-y-3 max-h-[70vh] overflow-y-auto pr-2" id="directory-list">
                <!-- Dynamic Content injected here -->
            </div>
        </div>

        <div class="mt-auto border-t pt-3 text-center">
             <button onclick="resetMapView()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 px-4 rounded transition">
                Reset Map View
            </button>
        </div>
    </aside>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. Embedded SVG Icon Definitions ---
        // These match the SVGs provided in the prompt text explanation.
        const svgIcons = {
            drrm: `
                <svg viewBox="0 0 64 64" class="icon-shadow" style="width:40px; height:40px;">
                    <circle cx="32" cy="32" r="30" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
                    <path fill="#ffffff" d="M45.31,26.4l-5.56-2.45L32,9.3l-7.75,14.66-5.56,2.45L14.79,32l4.1,8.14,2.21,6.03,10.9-2.9,10.9,2.9,2.21-6.03,4.1-8.14-3.9-5.6ZM36,37.92l-2.08,5.68L32,42.8l-1.92,1.1-2.08-5.68-5-10.56,3.72-1.64L32,17.9l6.28,2.91,3.72,1.64-5,10.56Z"/>
                </svg>`,
            police: `
                <svg viewBox="0 0 64 64" class="icon-shadow" style="width:40px; height:40px;">
                    <circle cx="32" cy="32" r="30" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
                    <path fill="#ffffff" d="M32,11.67l9.43,4.28v8.57c0,9.43-5.89,17.36-9.43,19.99-3.54-2.63-9.43-10.56-9.43-19.99v-8.57Zm0,4.48L24.71,19.5v7.03c0,7.45,4.33,13.9,7.29,16.34,2.96-2.44,7.29-8.89,7.29-16.34v-7.03Z"/>
                    <circle fill="#ffffff" cx="32" cy="29.14" r="4.29"/>
                </svg>`,
            fire: `
