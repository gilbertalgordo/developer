import numpy as np
from sklearn.datasets import make_classification
from sklearn.ensemble import RandomForestClassifier
from scipy.stats import entropy

class ActivePredictionAI:
    def __init__(self, estimator, initial_train_size=10):
        self.model = estimator
        self.initial_train_size = initial_train_size
        
    def compute_entropy(self, X_pool):
        """Calculate prediction entropy for the unlabeled pool."""
        # Get probability distributions for each class
        probs = self.model.predict_proba(X_pool)
        # Compute Shannon Entropy along the class axis
        return entropy(probs.T)

    def active_learning_loop(self, X, y, n_queries=5, batch_size=2):
        """Simulates the active prediction/learning pipeline."""
        num_samples = X.shape[0]
        
        # 1. Initialize labeled and unlabeled pools
        indices = np.arange(num_samples)
        np.random.shuffle(indices)
        
        labeled_idx = list(indices[:self.initial_train_size])
        pool_idx = list(indices[self.initial_train_size:])
        
        print(f"Initial training pool size: {len(labeled_idx)}")
        print(f"Unlabeled candidate pool size: {len(pool_idx)}\n")

        for q in range(n_queries):
            # 2. Train model on currently labeled data
            self.model.fit(X[labeled_idx], y[labeled_idx])
            
            # 3. Predict and evaluate uncertainty on the unlabeled pool
            X_pool = X[pool_idx]
            uncertainties = self.compute_entropy(X_pool)
            
            # 4. Select the instances with the highest entropy (most uncertain)
            query_indices_inside_pool = np.argsort(uncertainties)[-batch_size:]
            
            # Map back to global indices
            global_query_indices = [pool_idx[i] for i in query_indices_inside_pool]
            
            print(f"[Query {q + 1}] AI is highly uncertain about indices: {global_query_indices}")
            print(f"-> Selected sample entropies: {uncertainties[query_indices_inside_pool]}")
            
            # 5. "Active Oracle" provides the labels (simulated here by pulling from 'y')
            # In production, this triggers an API call, webhook, or UI prompt for a human reviewer.
            for idx in global_query_indices:
                labeled_idx.append(idx)
                pool_idx.remove(idx)
                
            print(f"-> Updated training set size: {len(labeled_idx)}\n")
            
        # Final model fit
        self.model.fit(X[labeled_idx], y[labeled_idx])
        print("Active training loop complete.")
        return self.model

# --- Demonstration Execution ---
if __name__ == "__main__":
    # Generate a dummy classification dataset
    X_data, y_data = make_classification(
        n_samples=200, n_features=5, n_informative=3, n_classes=2, random_state=42
    )
    
    # Use a Random Forest base model capable of predicting probabilities
    base_estimator = RandomForestClassifier(n_estimators=50, random_state=42)
    
    # Instantiate and run the Active AI
    active_ai = ActivePredictionAI(estimator=base_estimator, initial_train_size=15)
    trained_model = active_ai.active_learning_loop(X_data, y_data, n_queries=4, batch_size=3)




import numpy as np
import torch
import torch.nn as nn
import torch.optim as optim
from collections import deque
from typing import List, Tuple, Dict, Any

class PredictionNetwork(nn.Module):
    """Deep feature extractor and classification head."""
    def __init__(self, input_dim: int, hidden_dim: int, num_classes: int):
        super().__init__()
        self.feature_extractor = nn.Sequential(
            nn.Linear(input_dim, hidden_dim),
            nn.LayerNorm(hidden_dim),
            nn.SiLU(),
            nn.Dropout(p=0.1),
            nn.Linear(hidden_dim, hidden_dim // 2),
            nn.SiLU()
        )
        self.classifier = nn.Linear(hidden_dim // 2, num_classes)
        
    def forward(self, x: torch.Tensor) -> torch.Tensor:
        features = self.feature_extractor(x)
        return self.classifier(features)

class AdvancedActivePredictionAI:
    """
    Advanced Streaming Active Prediction AI utilizing Query-by-Committee (QbC)
    via KL-Divergence Consensus and real-time buffer replay.
    """
    def __init__(
        self, 
        input_dim: int, 
        num_classes: int, 
        committee_size: int = 3, 
        hidden_dim: int = 64,
        divergence_threshold: float = 0.35,
        buffer_max_size: int = 1000
    ):
        self.input_dim = input_dim
        self.num_classes = num_classes
        self.threshold = divergence_threshold
        
        # Initialize the Committee of diverse neural models
        self.committee: List[nn.Module] = []
        self.optimizers: List[optim.Optimizer] = []
        
        for i in range(committee_size):
            # Vary initializations to ensure committee diversity
            model = PredictionNetwork(input_dim, hidden_dim, num_classes)
            # Inject slight weight divergence manually if needed, or rely on distinct random seeds
            torch.nn.init.orthogonal_(model.classifier.weight, gain=0.1 * (i + 1))
            
            optimizer = optim.AdamW(model.parameters(), lr=0.002, weight_decay=1e-4)
            self.committee.append(model)
            self.optimizers.append(optimizer)
            
        # Real-time replay buffer for labeled stream stabilization
        self.replay_buffer = deque(maxlen=buffer_max_size)
        self.criterion = nn.CrossEntropyLoss()

    def _compute_ensemble_consensus(self, probabilities: torch.Tensor) -> Tuple[torch.Tensor, torch.Tensor]:
        """
        Computes consensus via Mean KL-Divergence.
        probabilities shape: [committee_size, batch_size, num_classes]
        """
        # Average probability distribution across the committee
        mean_probs = torch.mean(probabilities, dim=0) # Shape: [batch_size, num_classes]
        
        # Calculate KL Divergence for each member relative to the consensus average
        kl_divergences = []
        for member_prob in probabilities:
            # Avoid log(0) with clamping
            eps = 1e-9
            kl = member_prob * (torch.log(member_prob + eps) - torch.log(mean_probs + eps))
            kl_divergences.append(torch.sum(kl, dim=-1)) # Sum across classes
            
        # Mean disagreement profile per sample
        mean_kl = torch.mean(torch.stack(kl_divergences), dim=0)
        return mean_probs, mean_kl

    def process_stream_sample(self, x_raw: np.ndarray) -> Dict[str, Any]:
        """
        Evaluates a live streaming sample. Measures disagreement to decide
        if an active prediction intervention (Oracle query) is required.
        """
        x_tensor = torch.tensor(x_raw, dtype=torch.float32).unsqueeze(0)
        
        all_probs = []
        self.committee_eval_mode()
        
        with torch.no_grad():
            for model in self.committee:
                logits = model(x_tensor)
                probs = torch.softmax(logits, dim=-1)
                all_probs.append(probs)
                
        # Stack shape: [committee_size, 1, num_classes]
        stacked_probs = torch.cat(all_probs, dim=0)
        consensus_prob, disagreement_score = self._compute_ensemble_consensus(stacked_probs)
        
        prediction = torch.argmax(consensus_prob, dim=-1).item()
        confidence = consensus_prob[0, prediction].item()
        disagreement = disagreement_score[0].item()
        
        # Decision boundary logic for Active Alerting
        requires_oracle = disagreement > self.threshold
        
        return {
            "prediction": prediction,
            "confidence": confidence,
            "disagreement_score": disagreement,
            "requires_oracle_label": requires_oracle
        }

    def train_step(self, x_raw: np.ndarray, y_raw: int, updates: int = 3):
        """
        Performs an online, real-time update using the latest labeled sample 
        and historic experience replay to prevent catastrophic forgetting.
        """
        self.replay_buffer.append((x_raw, y_raw))
        if len(self.replay_buffer) < 4:
            return # Wait until minimal warm start sample size is achieved
            
        self.committee_train_mode()
        
        for _ in range(updates):
            # Sample a mini-batch from experience memory
            batch_size = min(16, len(self.replay_buffer))
            indices = np.random.choice(len(self.replay_buffer), batch_size, replace=False)
            
            x_batch = torch.tensor(np.array([self.replay_buffer[i][0] for i in indices]), dtype=torch.float32)
            y_batch = torch.tensor([self.replay_buffer[i][1] for i in indices], dtype=torch.long)
            
            # Update every member of the committee independently on the batch
            for model, optimizer in zip(self.committee, self.optimizers):
                optimizer.zero_grad()
                logits = model(x_batch)
                loss = self.criterion(logits, y_batch)
                loss.backward()
                optimizer.step()

    def committee_eval_mode(self):
        for model in self.committee: model.eval()
        
    def committee_train_mode(self):
        for model in self.committee: model.train()

# --- Simulation of Streaming Execution Pipeline ---
if __name__ == "__main__":
    np.random.seed(42)
    torch.manual_seed(42)
    
    # Configuration parameters
    FEATURES = 8
    CLASSES = 3
    ai_system = AdvancedActivePredictionAI(input_dim=FEATURES, num_classes=CLASSES, committee_size=3)
    
    print("⚡ AI Prediction Stream Initialized. Processing telemetry inputs...\n")
    
    # Simulating a dynamic telemetry/data stream
    for stream_tick in range(1, 11):
        simulated_features = np.random.randn(FEATURES)
        
        # Process live inference
        metrics = ai_system.process_stream_sample(simulated_features)
        
        print(f"[Tick {stream_tick:02d}] Pred: {metrics['prediction']} | Conf: {metrics['confidence']:.2f} | Disagreement: {metrics['disagreement_score']:.4f}")
        
        if metrics["requires_oracle_label"]:
            print(f"  ⚠️  [ACTIVE INTERVENTION] High committee variance detected. Routing to Oracle.")
            # Simulate Oracle resolving the issue by providing ground truth label
            simulated_ground_truth = np.random.randint(0, CLASSES)
            ai_system.train_step(simulated_features, simulated_ground_truth)
            print(f"  ✓  System synchronized. Buffer size: {len(ai_system.replay_buffer)}\n")
        else:
            # High certainty: we optionally skip labeling overhead or store for low-priority background updates
            if stream_tick % 3 == 0: 
                # Periodic verification paths
                simulated_ground_truth = metrics["prediction"]
                ai_system.train_step(simulated_features, simulated_ground_truth)
            print("  ↳  Prediction stable. Proceeding natively.\n")



