/**
 * Active AI Notification and Conversion Manager
 */
class ActiveNotificationPipeline {
    constructor() {
        // Audio Context setup for synth notification hums and alerts
        this.audioCtx = null;
        
        // Element caching
        this.alertCard = document.getElementById('alertCard');
        this.alertStatus = document.getElementById('alertStatus');
        this.alertContent = document.getElementById('alertContent');
        this.alertImageWrapper = document.getElementById('alertImageWrapper');
        this.alertImage = document.getElementById('alertImage');
        this.metaConf = document.getElementById('metaConf');
        this.metaDis = document.getElementById('metaDis');
        this.conversionWidget = document.getElementById('conversionWidget');
        
        // Internal tracking variable
        this.activeEventPayload = null;
    }

    initAudio() {
        if (!this.audioCtx) {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    /**
     * Synthesizes a high-alert synth sound natively via the Web Audio API
     */
    playAudibleAlert(frequency = 587.33, duration = 0.3) {
        this.initAudio();
        if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
        }

        const osc = this.audioCtx.createOscillator();
        const gainNode = this.audioCtx.createGain();

        // High-tech sawtooth warning tone shape
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(frequency, this.audioCtx.currentTime);
        // Quick futuristic pitch-drop sweep
        osc.frequency.exponentialRampToValueAtTime(220, this.audioCtx.currentTime + duration);

        gainNode.gain.setValueAtTime(0.15, this.audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);

        osc.connect(gainNode);
        gainNode.connect(this.audioCtx.destination);

        osc.start();
        osc.stop(this.audioCtx.currentTime + duration);
    }

    /**
     * Dispatches active alert visual transformations to the interface
     */
    raiseActiveAnomalyAlert(payload) {
        this.activeEventPayload = payload;
        
        // Trigger sound notification
        this.playAudibleAlert(659.25, 0.4);

        // Transform Alert panel to highly critical visual state
        this.alertCard.classList.remove('opacity-60', 'border-cyan-500/20');
        this.alertCard.classList.add('opacity-100', 'border-red-500/60', 'shadow-red-500/10');
        
        this.alertStatus.innerText = "CRITICAL: MODEL UNCERTAINTY DEVIATION";
        this.alertStatus.className = "text-xs text-red-400 font-bold tracking-widest animate-pulse";

        // Update textual payload context
        this.alertContent.innerHTML = `
            <div class="text-sm space-y-1">
                <p class="text-red-400 font-bold">⚠️ SYSTEM INTERVENTION PROMPT</p>
                <p class="text-slate-300">Live feature array triggered high disagreement across ensemble networks. Target node predictions diverged beyond tolerance limits.</p>
                <div class="bg-slate-950 p-2 rounded border border-slate-800 text-xs text-slate-400 mt-2">
                    <span class="text-cyan-400">Stream Feature Payload:</span> ${JSON.stringify(payload.features)}
                </div>
            </div>
        `;

        // Inject and show Image telemetry component
        this.alertImage.src = payload.telemetryImage;
        this.alertImageWrapper.classList.remove('hidden');

        // Update analytics readouts
        this.metaConf.innerText = `${(payload.confidence * 100).toFixed(1)}%`;
        this.metaDis.innerText = payload.disagreement.toFixed(4);

        // UNLOCK Conversion Widget for operator labeling ingestion
        this.conversionWidget.classList.remove('pointer-events-none', 'opacity-40', 'border-slate-700');
        this.conversionWidget.classList.add('opacity-100', 'border-amber-500/50');
    }

    /**
     * Resets dashboard state back to default tracing mode
     */
    resetDashboardState() {
        this.alertCard.className = "md:col-span-2 glass-hud rounded-lg p-5 flex flex-col justify-between min-h-[350px] transition-all duration-300 opacity-60";
        this.alertStatus.innerText = "IDLE";
        this.alertStatus.className = "text-xs text-slate-500 font-bold tracking-widest";
        this.alertContent.innerHTML = `<p class="text-slate-400 text-sm">System operating within standard parameters. Awaiting uncertainty deviation prompts...</p>`;
        this.alertImageWrapper.classList.add('hidden');
        this.metaConf.innerText = "--";
        this.metaDis.innerText = "--";
        
        this.conversionWidget.className = "glass-hud rounded-lg p-5 border-dashed border-slate-700 bg-slate-900/10 flex flex-col justify-between transition-all duration-300 pointer-events-none opacity-40";
        this.activeEventPayload = null;
    }
}

/**
 * Simulator Mock Orchestrator to simulate runtime streams
 */
class StreamSimulationEngine {
    constructor(pipeline) {
        this.pipeline = pipeline;
    }

    triggerMockAnomaly() {
        // Construct simulated unclassified data payload with high variance
        const mockPayload = {
            streamId: "STRM_" + Math.floor(Math.random() * 90000 + 10000),
            features: Array.from({length: 5}, () => parseFloat((Math.random() * 4 - 2).toFixed(3))),
            confidence: 0.421, 
            disagreement: 0.4892, // Divergence score greater than threshold 0.35
            // Placeholder fallback data URL representing an live anomaly tracking event image
            telemetryImage: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80"
        };

        this.pipeline.raiseActiveAnomalyAlert(mockPayload);
    }

    submitOracleConversion() {
        const selectedLabel = document.getElementById('oracleLabelSelect').value;
        const completeDataPayload = {
            sourceStream: this.pipeline.activeEventPayload,
            assignedGroundTruthLabel: parseInt(selectedLabel),
            operatorTimestamp: new Date().toISOString()
        };

        // Output conversion object context safely directly to developer consoles
        console.log("🚀 [ACTIVE LEARNING CONVERSION SUBMITTED] Route payload to backend APIs:", completeDataPayload);
        
        // Audible success confirmation ping
        this.pipeline.playAudibleAlert(880.00, 0.15);
        
        alert(`Sample Successfully Saved! Dispatched with Label Class: ${selectedLabel}`);
        this.pipeline.resetDashboardState();
    }
}

// Global Activation
const pipelineHUD = new ActiveNotificationPipeline();
const simulationEngine = new StreamSimulationEngine(pipelineHUD);
