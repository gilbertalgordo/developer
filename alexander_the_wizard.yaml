class TextFX:
    @staticmethod
    def print_stream(text, delay=0.01):
        for char in text:
            sys.stdout.write(char)
            sys.stdout.flush()
            time.sleep(delay)
        print()

class Item:
    def __init__(self, name, cost, hp_bonus, mp_bonus, atk_bonus, passive_effect, desc):
        self.name = name
        self.cost = cost
        self.hp_bonus = hp_bonus
        self.mp_bonus = mp_bonus
        self.atk_bonus = atk_bonus
        self.passive_effect = passive_effect  # "QUANTUM_FLOW", "LIFESTEAL", "IMMUNITY"
        self.desc = desc

class Combatant:
    def __init__(self, name, faction, hp, mana, base_atk):
        self.name = name
        self.faction = faction
        self.max_hp = hp
        self.hp = hp
        self.max_mana = mana
        self.mana = mana
        self.base_atk = base_atk
        self.gold = 150
        self.inventory = []
        self.ability_cooldown = 0
        self.status = "NORMAL"

    @property
    def attack_power(self):
        bonus = sum(item.atk_bonus for item in self.inventory)
        return self.base_atk + bonus

    def apply_item_stats(self, item):
        self.max_hp += item.hp_bonus
        self.hp += item.hp_bonus
        self.max_mana += item.mp_bonus
        self.mana += item.mp_bonus
        self.inventory.append(item)

    def is_alive(self):
        return self.hp > 0

class AdvancedExpansionEngine:
