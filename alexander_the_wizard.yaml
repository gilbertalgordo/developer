            return
            
        lane_choice = input("Select Lane to deploy (Left, Center, Right): ").strip().capitalize()
        if lane_choice not in self.lanes:
            print("❌ Non-existent lane layout. Summon collapsed.")
            return
            
        if self.lanes[lane_choice]["player"] is not None:
            print("❌ That lane is already holding a friendly spell-formation!")
            return
            
        # Deduct cost and spawn unit
        self.player.mana -= blueprint["cost"]
        status = "SHIELD" if blueprint["name"] == "Phalanx Runeguard" else "NORMAL"
        
        self.lanes[lane_choice]["player"] = Unit(
            blueprint["name"], blueprint["hp"], blueprint["atk"], blueprint["cost"], status
        )
        TextEffect.log(f"✨ Summoned {blueprint['name']} to the {lane_choice} Lane!")

    def enemy_phase(self):
        self.enemy.mana = min(self.enemy.max_mana, self.enemy.mana + 40)
        
        # Check if enemy can cast ultimate spell
        if self.enemy.mana >= 60 and random.random() > 0.5:
            self.enemy.mana -= 60
            self.player.hp -= 65
            TextEffect.log(f"🔥 Darius casts 'Desert Pyroclasm'! Fire storms wash over Alexander for 65 damage!")
            return
            
        # Choose a lane to spawn an enemy unit if empty
        empty_lanes = [l for l in self.lanes if self.lanes[l]["enemy"] is None]
        if empty_lanes and self.enemy.mana >= 30:
            chosen_lane = random.choice(empty_lanes)
            blueprint = random.choice(self.enemy_roster)
            self.enemy.mana -= blueprint["cost"]
            
            # Chance to spawn with BURN status applied to weapons (tactical design flag)
            status = "BURN" if random.random() > 0.7 else "NORMAL"
            
            self.lanes[chosen_lane]["enemy"] = Unit(
                blueprint["name"], blueprint["hp"], blueprint["atk"], blueprint["cost"], status
            )
            TextEffect.log(f"👹 Darius summons an {blueprint['name']} into the {chosen_lane} Lane!")

    def resolution_phase(self):
        print("\n" + "-" * 40)
        print("⚔️ RESOLVING LANES CLASH ⚔️")
        print("-" * 40)
        time.sleep(1)
        
        for lane, slots in self.lanes.items():
            p = slots["player"]
            e = slots["enemy"]
            
            # Apply upkeep status effects
            if p:
                burn_msg = p.apply_status_damage()
                if burn_msg: print(burn_msg)
            if e:
                burn_msg = e.apply_status_damage()
                if burn_msg: print(burn_msg)

            # Combat Resolution logic
            if p and e:
                TextEffect.log(f"💥 {p.name} clashes with {e.name} in the {lane} Lane!")
                
                # Player attacks Enemy
                if p.status != "STUN":
                    e.hp -= p.atk
                    print(f" -> {p.name} deals {p.atk} damage to {e.name}")
                    if p.name == "Thessalian Spell-Bow" and random.random() > 0.5:
                        e.status = "STUN"
                        print(f" -> 🎯 Critical hit! {e.name} is STUNNED!")
                else:
                    print(f" -> {p.name} is stunned and cannot attack!")
                    p.status = "NORMAL"
                
                # Enemy attacks Player
                if e.status != "STUN":
                    actual_dmg = e.atk
                    if p.status == "SHIELD":
                        actual_dmg = int(actual_dmg * 0.5)
                        p.status = "NORMAL"
                        print(f" -> 🛡️ Runeguard Shield absorbed half the impact!")
                    p.hp -= actual_dmg
                    print(f" -> {e.name} deals {actual_dmg} damage to {p.name}")
                else:
                    print(f" -> {e.name} is stunned and cannot attack!")
                    e.status = "NORMAL"
                    
            elif p and not e:
                # Direct hit to enemy commander
                damage = p.atk
                self.enemy.hp -= damage
                TextEffect.log(f"🏰 {p.name} storms the lane unimpeded! Hits Darius directly for {damage} damage!")
                
            elif e and not p:
                # Direct hit to player commander
                damage = e.atk
                self.player.hp -= damage
                TextEffect.log(f"💥 {e.name} breaks through the line! Blasts Alexander directly for {damage} damage!")

            # Cleanup dead units
            if p and not p.is_alive():
                print(f"💀 {p.name} has dissolved back into ley-line ether.")
                slots["player"] = None
            if e and not e.is_alive():
                print(f"💀 {e.name} was turned into residual ash.")
                slots["enemy"] = None

    def execute_game_loop(self):
        print("=" * 80)
        print("         GAUGAMELA EXPANSION: THE AGE OF THE CODESMITH MAGI")
        print("                 DESIGN ARCHITECTURE BY GILBERT ALGORDO")
        print("=" * 80)
        TextEffect.log("Initializing mana matrix... Syncing runic phalanx commands...", 0.04)
        
        while self.player.is_alive() and self.enemy.is_alive():
            self.player_phase()
            if not self.enemy.is_alive():
                break
                
            self.enemy_phase()
            self.resolution_phase()
            
            self.turn += 1
            input("\nPress Enter to proceed to the next turn layout...")

        print("\n" + "=" * 80)
        if self.player.is_alive():
            print("🏆 VICTORY TO THE MACEDONIAN ARCH-MAGE!")
            print("Alexander chains the elemental currents, unifying Asia under an absolute Sorcery Empire.")
        else:
            print("💀 DEFEAT.")
            print("Alexander's lifeforce dissipates into cosmic residue. The Persian Elementals claim absolute dominion.")
        print("=" * 80)

if __name__ == "__main__":
    game = AdvancedBattleEngine()
    game.execute_game_loop()
