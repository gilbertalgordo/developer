# --- TEXT ENGINE UI LAYER ---
class BattleInterface:
    @staticmethod
    def render_hud(player: CombatEntity, enemy: CombatEntity, turn: int):
        print(f"\n╔{'═' * 78}╗")
        print(f"║ INTERACTIVE BATTLEFIELD HUD  {' ' * 38} ROUND: {turn:02d} ║")
        print(f"╠{'═' * 78}╣")
        
        # Player Data
        p_hp_pct = int((player.hp / player.max_hp) * 20)
        p_hp_bar = "█" * p_hp_pct + "░" * (20 - p_hp_pct)
        p_mp_pct = int((player.mana / player.max_mana) * 15)
        p_mp_bar = "█" * p_mp_pct + "░" * (15 - p_mp_pct)
        
        # Enemy Data
        e_hp_pct = int((enemy.hp / enemy.max_hp) * 20)
        e_hp_bar = "█" * e_hp_pct + "░" * (20 - e_hp_pct)
        e_mp_pct = int((enemy.mana / enemy.max_mana) * 15)
        e_mp_bar = "█" * e_mp_pct + "░" * (15 - e_mp_pct)

        print(f"║  %-28s │  %-28s ║" % (player.name.upper(), enemy.name.upper()))
        print(f"║  Faction: %-21s │  Faction: %-21s ║" % (player.faction, enemy.faction))
        print(f"║  HP: [{p_hp_bar}] {player.hp:3d}/{player.max_hp:3d}  │  HP: [{e_hp_bar}] {enemy.hp:3d}/{enemy.max_hp:3d}  ║")
        print(f"║  MP: [{p_mp_bar}] {player.mana:3d}/{player.max_mana:3d}  │  MP: [{e_mp_bar}] {enemy.mana:3d}/{enemy.max_mana:3d}  ║")
        
        # Active Status Displays
        p_status = ", ".join([s.name for s in player.statuses]) if player.statuses else "None"
        e_status = ", ".join([s.name for s in enemy.statuses]) if enemy.statuses else "None"
        print(f"║  Active: %-25s │  Active: %-25s ║" % (p_status[:25], e_status[:25]))
        print(f"╚{'═' * 78}╝")

# --- ENGINE ENGINE SIMULATION ---
class StrategicBattleEngine:
    def __init__(self):
        self.player = AlexanderTheGreat()
        self.enemy = DariusIII()
        self.turn = 1

    def run_battle(self):
        print("\n" + "⚔️" * 40)
        print("          GAUGAMELA MATRIX: CRUSADE OF THE ARCANE EMPIRES")
        print("⚔️" * 40)
        time.sleep(1)

        while self.player.is_alive() and self.enemy.is_alive():
            # 1. Processing Upkeep Phases
            p_upkeep = self.player.process_turn_upkeep()
            e_upkeep = self.enemy.process_turn_upkeep()
            
            BattleInterface.render_hud(self.player, self.enemy, self.turn)
            
            if p_upkeep or e_upkeep:
                print("⏳ [PHASE UPKEEP EFFECTS]")
                if p_upkeep: print(p_upkeep)
                if e_upkeep: print(e_upkeep)
                print("─" * 80)

            if not self.player.is_alive() or not self.enemy.is_alive():
                break

            # 2. Player Spell-Weaving Choice Phase
            chosen_spell = self.prompt_player_action()
            self.execute_spell(chosen_spell, self.player, self.enemy)
            
            if not self.enemy.is_alive():
                break

            # 3. Dynamic AI Response Generation Phase
            self.execute_ai_turn()
            
            self.turn += 1
            time.sleep(1.5)

        self.evaluate_victory()

    def prompt_player_action(self) -> Spell:
        print("\n🔮 SELECT STRATEGIC MATRIX COMMAND:")
        for idx, spell in self.player.spellbook.items():
            cost_str = f"{abs(spell.cost)} MP" if spell.cost > 0 else f"Gain {abs(spell.cost)} MP"
            print(f"  [{idx}] {spell.name:<22} ({cost_str:<9}) -> {spell.desc}")
        
        while True:
            try:
                choice = int(input("\nEnter operational index (1-4): "))
                if choice in self.player.spellbook:
                    selection = self.player.spellbook[choice]
                    if selection.cost > 0 and self.player.mana < selection.cost:
                        print("❌ Operational Alert: Matrix energy insufficient! Recharge via choice [4].")
                        continue
                    return selection
                print("❌ Array configuration out of bounds. Select 1-4.")
            except ValueError:
                print("❌ Critical Input Fault. Enter standard numerical format.")

    def execute_spell(self, spell: Spell, caster: CombatEntity, target: CombatEntity):
        print(f"\n💫 {caster.name} manifests arcane sequence: [{spell.name.upper()}]")
        caster.mana -= spell.cost

        if spell.cost < 0:
            # Recharging Matrix Mechanoid
            caster.hp = max(0, caster.hp - 25)
            print(f"🩸 {caster.name} overclocks life matrix! Siphons -25 HP to hyper-inject +{abs(spell.cost)} Mana.")
            return

        if spell.dmg_range == (0, 0) and spell.effect:
            # Defensive / Buff Spell Array
            caster.apply_status(spell.effect)
            print(f"🛡️ [{spell.effect.name}] operational grid mapped onto {caster.name}.")
        else:
            # Attack Spell Matrix Layer
            base_dmg = random.randint(*spell.dmg_range)
            defense_modifier = target.get_incoming_modifier()
            final_dmg = int(base_dmg * defense_modifier)
            
            target.hp = max(0, target.hp - final_dmg)
            print(f"💥 Discharge Vector hits {target.name} for {final_dmg} force damage! "
                  f"(Mitigated {int((1 - defense_modifier)*100)}% output energy via shielding structure)")
            
            if spell.effect and target.is_alive():
                target.apply_status(spell.effect)
                print(f"⚠️ Corrosive tracking alert: {target.name} infected with status [{spell.effect.name}].")

    def execute_ai_turn(self):
        print(f"\n🤖 {self.enemy.name} tracking systems active...")
        time.sleep(1)

        # AI Heuristic Algorithm Logic
        # Priority 1: Use shields if low health and shield is available
        if self.enemy.hp < 80 and self.enemy.mana >= self.enemy.spellbook[3].cost and not any(s.name == "Sun-Shield" for s in self.enemy.statuses):
            ai_spell = self.enemy.spellbook[3]
        # Priority 2: Heavy damage singularity if pool permits
        elif self.enemy.mana >= self.enemy.spellbook[2].cost:
            ai_spell = self.enemy.spellbook[2]
        # Priority 3: Fallback attack
        elif self.enemy.mana >= self.enemy.spellbook[1].cost:
            ai_spell = self.enemy.spellbook[1]
        # Priority 4: Ambient manual mana gather cycle
        else:
            print(f"🔮 {self.enemy.name} is dry on mana! Forces an atmospheric draw phase, reclaiming 30 MP.")
            self.enemy.mana = min(self.enemy.max_mana, self.enemy.mana + 30)
            return

        self.execute_spell(ai_spell, self.enemy, self.player)

    def evaluate_victory(self):
        print("\n" + "═" * 80)
        if self.player.is_alive() and not self.enemy.is_alive():
            print("🥇 THE ARCH-MAGE TRIUMPHS!")
            print("Alexander the Great locks down Asia Minor. The Persian elemental fonts belong to Macedon.")
        elif not self.player.is_alive() and self.enemy.is_alive():
            print("💀 MATRIX LOSS ENCOUNTERED.")
            print("Alexander's lifeforce collapses into cosmic ashes. Darius preserves the Eternal Sun Dynasty.")
        else:
            print("💥 ANNIHILATION SPELL COLLISION.")
            print("Both sorcerers vaporized one another in the epicenter. The battleground collapses into a dead zone.")
        print("═" * 80 + "\n")

if __name__ == "__main__":
    game = StrategicBattleEngine()
    game.run_battle()
