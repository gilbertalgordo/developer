class TextEffect:
    @staticmethod
    def log(msg, delay=0.02):
        for char in msg:
            sys.stdout.write(char)
            sys.stdout.flush()
            time.sleep(delay)
        print()

class Unit:
    def __init__(self, name, hp, atk, mana_cost, status="NORMAL"):
        self.name = name
        self.max_hp = hp
        self.hp = hp
        self.atk = atk
        self.mana_cost = mana_cost
        self.status = status  # NORMAL, BURN, STUN, SHIELD

    def is_alive(self):
        return self.hp > 0

    def apply_status_damage(self):
        if self.status == "BURN":
            damage = 15
            self.hp -= damage
            return f"🔥 {self.name} takes {damage} Burn damage!"
        return None

class Commander:
    def __init__(self, name, faction, hp, mana):
        self.name = name
        self.faction = faction
        self.max_hp = hp
        self.hp = hp
        self.max_mana = mana
        self.mana = mana

    def is_alive(self):
        return self.hp > 0

