            print(f"[{k}] {v['name']} (Cost: {v['cost']} MP) - ATK: {v['atk']} | HP: {v['hp']} | {v['desc']}")
            
        unit_choice = input("\nSelect unit to summon (1-3): ").strip()
        if unit_choice not in self.player_roster:
            print("❌ Invalid invocation. Summon canceled.")
