        self.spellbook = {
            1: Spell("Immortal Pyroclasm", 30, (35, 50), 
                     StatusEffect("Melt Armor", 2, 10, "dot"), 
                     "Unleashes streams of alchemical fire that burn targets over time."),
            2: Spell("Chimeric Singularity", 60, (70, 95), None, 
                     "Folds space into an unstable gravity well that collapses on the enemy lines."),
