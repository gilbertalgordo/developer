def create_installer_zip(output_zip="ai-master-suite.zip"):
    required_files = [
        "manifest.json",
        "background.js",
        "content.js",
        "popup.html",
        "popup.js"
    ]

    print(f"[*] Packaging AI Master Extension into {output_zip}...")
    
    with zipfile.ZipFile(output_zip, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for file in required_files:
            if os.path.exists(file):
                zipf.write(file)
                print(f" [+] Added {file}")
            else:
                print(f" [-] Warning: File {file} missing!")

    print(f"\n[✓] Successfully created '{output_zip}'. Ready for distribution.")

if __name__ == "__main__":
    create_installer_zip()




