def generate_banner_and_pack(output_zip="ai-master-suite-full.zip"):
    os.makedirs("icons", exist_ok=True)
    
    # 1. Generate Icon SVGs
    for path, content in bundle_files.items():
        with open(path, "w", encoding="utf-8") as f:
            f.write(content)
        print(f"[+] Generated: {path}")

    # 2. Package into Zip Archive
    with zipfile.ZipFile(output_zip, "w", zipfile.ZIP_DEFLATED) as zipf:
        for path in bundle_files.keys():
            zipf.write(path)
            print(f"  [->] Bundled: {path}")
            
        if os.path.exists("banner.html"):
            zipf.write("banner.html")
            print(f"  [->] Bundled: banner.html")

    print(f"\n[✓] Complete! Installer suite zip created at '{output_zip}'")

if __name__ == "__main__":
    generate_banner_and_pack()
