def create_icons_and_zip(output_zip="ai-master-icons.zip"):
    os.makedirs("icons", exist_ok=True)
    
    # Write files locally
    for path, content in icons_data.items():
        with open(path, "w", encoding="utf-8") as f:
            f.write(content)
        print(f"[+] Generated: {path}")

    # Build ZIP archive
    with zipfile.ZipFile(output_zip, "w", zipfile.ZIP_DEFLATED) as zipf:
        for path in icons_data.keys():
            zipf.write(path)
            print(f"  [->] Bundled into ZIP: {path}")

    print(f"\n[✓] Complete! Zip archive created at '{output_zip}'")

if __name__ == "__main__":
    create_icons_and_zip()



