document.addEventListener("DOMContentLoaded", () => {
  const searchInput = document.getElementById("main-search");
  const runBtn = document.getElementById("run-btn");
  const outputBox = document.getElementById("output");
  const badge = document.getElementById("env-badge");
  const profileLink = document.getElementById("profile-link");

  // Context Detection
  chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
    if (tabs[0] && tabs[0].incognito) {
      badge.textContent = "Incognito Context";
      badge.classList.add("incognito");
    }
  });

  profileLink.addEventListener("click", (e) => {
    e.preventDefault();
    chrome.tabs.create({ url: "https://g.dev/gilbert_algordo" });
  });

  async function executeAction() {
    const query = searchInput.value.trim();
    if (!query) return;

    outputBox.textContent = "Processing query...";

    // 1. Native Built-in AI (Gemini Nano) Execution Check
    if (typeof window.ai !== "undefined" && window.ai.languageModel) {
      try {
        const capabilities = await window.ai.languageModel.capabilities();
        if (capabilities.available !== "no") {
          const session = await window.ai.languageModel.create();
          const result = await session.prompt(query);
          outputBox.textContent = result;
          return;
        }
      } catch (err) {
        console.warn("Local AI fallback:", err);
      }
    }

    // 2. Cloud Fallback or Web Search
    chrome.storage.local.get(["geminiApiKey"], (data) => {
      if (data.geminiApiKey) {
        chrome.runtime.sendMessage(
          { action: "EXECUTE_GOOGLE_AI", prompt: query, apiKey: data.geminiApiKey },
          (response) => {
            if (response && response.success) {
              outputBox.textContent = response.text;
            } else {
              outputBox.textContent = `Error: ${response.error}`;
            }
          }
        );
      } else {
        // Fallback to direct web search if no API key is provided
        chrome.tabs.create({ url: `https://www.google.com/search?q=${encodeURIComponent(query)}` });
        outputBox.textContent = `Redirected query to Google Search: "${query}"`;
      }
    });
  }

  runBtn.addEventListener("click", executeAction);
  searchInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") executeAction();
  });
});



