// Omnibox Keyword Search Handling (@aimaster <query>)
chrome.omnibox.onInputEntered.addListener(async (text) => {
  const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(text)}`;
  chrome.tabs.create({ url: searchUrl });
});

// Listener for cross-context messaging
chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
  if (request.action === "EXECUTE_GEMINI_API") {
    fetchGeminiResponse(request.prompt, request.apiKey)
      .then((data) => sendResponse({ success: true, data }))
      .catch((err) => sendResponse({ success: false, error: err.message }));
    return true; // Keep channel open for async response
  }
});

async function fetchGeminiResponse(prompt, apiKey) {
  if (!apiKey) throw new Error("Google AI API Key missing. Configure in settings.");

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    }
  );

  const json = await response.json();
  if (!response.ok) throw new Error(json.error?.message || "API Request Failed");
  return json.candidates[0].content.parts[0].text;
}



