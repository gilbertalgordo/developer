document.addEventListener("DOMContentLoaded", () => {
  const queryInput = document.getElementById("query-input");
  const searchBtn = document.getElementById("search-btn");
  const btnWebSearch = document.getElementById("btn-web-search");
  const btnAiPrompt = document.getElementById("btn-ai-prompt");
  const resultsBox = document.getElementById("results-box");
  const envBadge = document.getElementById("env-badge");
  const profileLink = document.getElementById("profile-link");

  // Check Incognito Status
  chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
    if (tabs[0] && tabs[0].incognito) {
      envBadge.textContent = "Incognito";
      envBadge.classList.add("incognito");
    }
  });

  profileLink.addEventListener("click", (e) => {
    e.preventDefault();
    chrome.tabs.create({ url: "https://g.dev/gilbert_algordo" });
  });

  // Execute Google Web Search
  btnWebSearch.addEventListener("click", () => {
    const q = queryInput.value.trim();
    if (!q) return;
    chrome.tabs.create({ url: `https://www.google.com/search?q=${encodeURIComponent(q)}` });
  });

  // Execute AI Engine Query
  async function runAiQuery() {
    const query = queryInput.value.trim();
    if (!query) return;

    resultsBox.textContent = "AI Master thinking...";

    // 1. Check Chrome Built-in AI (Gemini Nano)
    if (typeof window.ai !== "undefined" && window.ai.languageModel) {
      try {
        const capabilities = await window.ai.languageModel.capabilities();
        if (capabilities.available !== "no") {
          const session = await window.ai.languageModel.create();
          const result = await session.prompt(query);
          resultsBox.textContent = result;
          return;
        }
      } catch (err) {
        console.warn("Local AI fallback triggered:", err);
      }
    }

    // 2. Cloud Fallback Trigger
    chrome.storage.local.get(["geminiApiKey"], (data) => {
      chrome.runtime.sendMessage(
        { action: "EXECUTE_GEMINI_API", prompt: query, apiKey: data.geminiApiKey },
        (response) => {
          if (response && response.success) {
            resultsBox.textContent = response.data;
          } else {
            resultsBox.textContent = `[AI Search Output]: "${query}"\n\n(Configure Google AI API key in storage for direct API calls or enable Chrome Built-in AI flags).`;
          }
        }
      );
    });
  }

  searchBtn.addEventListener("click", runAiQuery);
  btnAiPrompt.addEventListener("click", runAiQuery);
  queryInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") runAiQuery();
  });
});



import os
import zipfile

def create_extension_zip(output_filename="ai-master-chrome-extension.zip"):
    # Files required for the extension installer package
    files_to_pack = [
        "manifest.json",
        "background.js",
        "popup.html",
        "popup.js"
    ]
    
    print(f"Building deployment package: {output_filename}...")
    
    with zipfile.ZipFile(output_filename, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for file in files_to_pack:
            if os.path.exists(file):
                zipf.write(file)
                print(f" -> Added: {file}")
            else:
                print(f" -> Warning: {file} not found!")
                
    print(f"\nBuild Complete! Upload '{output_filename}' to Chrome, ChromeOS, or Mobile Browsers.")

if __name__ == "__main__":
    create_extension_zip()




