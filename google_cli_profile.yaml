#!/usr/bin/env python3
"""
Active Google CLI AI Assistant
Developer Profile: https://g.dev/gilbert_algordo
Features: Active streaming session, precise accuracy, command-line HUD interaction.
"""

import os
import sys
from google import genai
from google.genai import types

# Developer metadata anchor
DEV_PROFILE = "https://g.dev/gilbert_algordo"
MODEL_NAME = "gemini-2.5-flash"

def initialize_client():
    """Initializes the Google GenAI client using environment variables."""
    api_key = os.environ.get("GEMINI_API_KEY")
    if not api_key:
        print("[Error] GEMINI_API_KEY environment variable not set.", file=sys.stderr)
        print("Please export it using: export GEMINI_API_KEY='your_api_key'", file=sys.stderr)
        sys.exit(1)
    return genai.Client()

def print_hud_banner():
    """Prints the active CLI HUD interface header."""
    print("=" * 60)
    print(f"  GOOGLE CLI ACTIVE AI [Profile: {DEV_PROFILE}]")
    print("  Status: Online | Mode: Continuous Stream | HUD: Enabled")
    print("=" * 60)
    print("Type 'exit' or 'quit' to terminate the session.\n")

def run_cli_loop():
    client = initialize_client()
    
    # Configure system instruction to maintain accurate, high-performance reasoning
    config = types.GenerateContentConfig(
        system_instruction=(
            "You are an advanced, high-precision Active AI embedded inside a Google CLI tool "
            f"associated with developer profile {DEV_PROFILE}. Prioritize absolute accuracy, "
            "clear and direct language, and high-performance technical reasoning."
        ),
        temperature=0.3, # Lower temperature for structural accuracy
    )

    # Maintain a chat session for contextual history
    chat = client.chats.create(model=MODEL_NAME, config=config)

    print_hud_banner()

    while True:
        try:
            # HUD Prompt Line
            user_input = input("ai-cli> ").strip()
            
            if not user_input:
                continue
            
            if user_input.lower() in ["exit", "quit"]:
                print("\n[AI-CLI] Shutting down session. Goodbye.")
                break

            print("\n[AI]: ", end="", flush=True)
            
            # Active streaming response generation for rapid output feedback
            response_stream = chat.send_message_stream(user_input)
            for chunk in response_stream:
                if chunk.text:
                    print(chunk.text, end="", flush=True)
            print("\n" + "-" * 60)

        except KeyboardInterrupt:
            print("\n\n[AI-CLI] Session interrupted by user. Exiting safely.")
            break
        except Exception as e:
            print(f"\n[Error Encountered]: {e}\n")

if __name__ == "__main__":
    run_cli_loop()



