#!/usr/bin/env python3
"""
Advanced Active AI Google CLI Engine
Developer Profile: https://g.dev/gilbert_algordo
Architecture: HUD Integrated, Multi-Turn Stream Context, Local Tool Dispatcher.
"""

import os
import sys
import time
import subprocess
from google import genai
from google.genai import types

# System Configurations & Profile Constants
DEV_PROFILE = "https://g.dev/gilbert_algordo"
MODEL_NAME = "gemini-2.5-flash"

class TerminalHUD:
    """Manages the real-time Heads-Up Display (HUD) in the CLI."""
    @staticmethod
    def render_header(session_id):
        os.system('cls' if os.name == 'nt' else 'clear')
        print("╔" + "═" * 78 + "╗")
        print(f"║ {'GOOGLE CLI ACTIVE AI - COMMAND HUD':<76} ║")
        print(f"║ Profile: {DEV_PROFILE:<66} ║")
        print(f"║ Session ID: {session_id:<63} ║")
        print("╚" + "═" * 78 + "╝")
        print(" [Status]: ONLINE  |  [Stream]: ACTIVE  |  [Mode]: PRECISION REASONING\n")

    @staticmethod
    def render_footer(latency_ms):
        print("\n" + "─" * 80)
        print(f" [HUD Telemetry] Response Latency: {latency_ms:.2f}ms | Model: {MODEL_NAME}")
        print("─" * 80 + "\n")

# Local tool definitions that the Active AI can invoke autonomously
def execute_system_diagnostics() -> str:
    """Runs a quick system status check on host environment resources."""
    try:
        uname = subprocess.check_output(["uname", "-a"]).decode("utf-8").strip()
        disk = subprocess.check_output(["df", "-h", "/"]).decode("utf-8").splitlines()[1]
        return f"System Info: {uname} | Root Disk Usage: {disk}"
    except Exception as e:
        return f"Diagnostics execution failed: {str(e)}"

def initialize_cli_engine():
    api_key = os.environ.get("GEMINI_API_KEY")
    if not api_key:
        print("[CRITICAL ERROR] GEMINI_API_KEY environment variable not detected.", file=sys.stderr)
        print("Configure via: export GEMINI_API_KEY='your_api_key'", file=sys.stderr)
        sys.exit(1)
    return genai.Client()

def main_loop():
    client = initialize_cli_engine()
    session_id = f"GCLI-{int(time.time())}"
    
    # Advanced System Prompt with rigorous reasoning boundaries
    system_instruction = (
        f"You are the Core Active AI Assistant embedded within the Google CLI environment "
        f"for developer Gilbert Algordo ({DEV_PROFILE}). "
        "Your responses must exhibit high-precision scientific reasoning, absolute structural accuracy, "
        "and direct clarity. Avoid unnecessary fluff. You are authorized to manage local CLI workflows, "
        "analyze code structures, and execute diagnostic actions when requested."
    )

    config = types.GenerateContentConfig(
        system_instruction=system_instruction,
        temperature=0.2, # Highly deterministic and accurate
        tools=[execute_system_diagnostics]
    )

    chat = client.chats.create(model=MODEL_NAME, config=config)
    TerminalHUD.render_header(session_id)

    while True:
        try:
            user_input = input("gilbert-ai@cli> ").strip()
            
            if not user_input:
                continue
            
            if user_input.lower() in ["exit", "quit", "shutdown"]:
                print("\n[AI Engine]: Terminating session safely. Farewell, Commander.")
                break

            if user_input.lower() == "clear":
                TerminalHUD.render_header(session_id)
                continue

            start_time = time.time()
            print("\n[AI Output]: ", end="", flush=True)

            # Stream response chunks live to the terminal UI
            response_stream = chat.send_message_stream(user_input)
            
            full_response_text = ""
            for chunk in response_stream:
                if chunk.text:
                    print(chunk.text, end="", flush=True)
                    full_response_text += chunk.text
                    
                # Handle automatic tool call execution if requested by model reasoning
                if chunk.function_calls:
                    for call in chunk.function_calls:
                        print(f"\n\n[HUD Action]: Executing tool '{call.name}'...")
                        if call.name == "execute_system_diagnostics":
                            tool_result = execute_system_diagnostics()
                            print(f"[Tool Result]: {tool_result}")

            elapsed_ms = (time.time() - start_time) * 1000
            TerminalHUD.render_footer(elapsed_ms)

        except KeyboardInterrupt:
            print("\n\n[Interrupted]: Session terminated by user keyboard signal.")
            break
        except Exception as err:
            print(f"\n[Execution Error]: {str(err)}\n")

if __name__ == "__main__":
    main_loop()



