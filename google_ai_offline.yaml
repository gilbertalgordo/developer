import os
import time
from mediapipe.tasks.python import text
from mediapipe.tasks.python.core import base_options

class LocalActiveAIAgent:
    """
    Advanced offline execution engine utilizing Google AI Edge (MediaPipe Tasks GenAI).
    Ensures 100% local, private processing without cloud calls.
    """
    def __init__(self, model_path: str, max_tokens: int = 1024, temperature: float = 0.7):
        self.model_path = model_path
        self.max_tokens = max_tokens
        self.temperature = temperature
        self.interpreter = None
        self._initialize_engine()

    def _initialize_engine(self):
        """Sets up the offline LLM inference runner with hardware acceleration."""
        if not os.path.exists(self.model_path):
            raise FileNotFoundError(f"Model task bundle not found at: {self.model_path}")
            
        print(f"[-] Initializing Google AI Edge offline engine using: {self.model_path}")
        
        # Configure MediaPipe GenAI Options
        options = text.LlmInferenceOptions(
            base_options=base_options.BaseOptions(model_asset_path=self.model_path),
            max_tokens=self.max_tokens,
            temperature=self.temperature,
            top_k=40,
            random_seed=101
        )
        
        # Initialize local inference task
        self.interpreter = text.LlmInference(options=options)
        print("[+] Offline engine active and ready.")

    def execute_active_task(self, prompt: str, system_context: str = "") -> str:
        """Processes prompts entirely on-device with optional system injection."""
        full_prompt = f"System: {system_context}\nUser: {prompt}\nAgent:" if system_context else prompt
        
        start_time = time.time()
        response = self.interpreter.generate_response(full_prompt)
        elapsed = time.time() - start_time
        
        print(f"[Metrics] Inference completed locally in {elapsed:.2f} seconds.")
        return response

    def stream_active_task(self, prompt: str):
        """Streams responses token-by-token for responsive local UI integration."""
        # Note: Implementation depends on async result listeners mapped in MediaPipe Tasks GenAI
        print("[Stream] Initializing real-time token stream...")
        response = self.interpreter.generate_response(prompt)
        for word in response.split(" "):
            yield word + " "
            time.sleep(0.02) # Simulate smooth local rendering pace

# --- Execution Example ---
if __name__ == "__main__":
    # Point to your local downloaded .task bundle (e.g., Gemma model optimized for MediaPipe)
    LOCAL_MODEL_BUNDLE = "./models/gemma_local_inference.task"
    
    if os.path.exists(LOCAL_MODEL_BUNDLE):
        agent = LocalActiveAIAgent(model_path=LOCAL_MODEL_BUNDLE)
        
        context = "You are an autonomous offline assistant running on local hardware via Google AI Edge."
        query = "Analyze system telemetry parameters and optimize local background loops."
        
        result = agent.execute_active_task(prompt=query, system_context=context)
        print(f"\nAI Response:\n{result}")
    else:
        print(f"[Notice] Place your compiled LiteRT/MediaPipe `.task` model file at '{LOCAL_MODEL_BUNDLE}' to execute.")




