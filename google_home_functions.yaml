import os
import json
import logging
from google.oauth2 import service_account
from googleapiclient.discovery import build

logging.basicConfig(level=logging.INFO)

class ActiveHomeAI:
    def __init__(self, service_account_file, project_id):
        self.project_id = project_id
        self.creds = service_account.Credentials.from_service_account_file(
            service_account_file,
            scopes=['https://www.googleapis.com/auth/homegraph']
        )
        self.homegraph = build('homegraph', 'v1', credentials=self.creds)

    def evaluate_environment(self, telemetry_data):
        """
        Evaluates real-time sensor payloads for security breaches 
        or housekeeping schedule optimization.
        """
        logging.info("Running Active AI environmental scan...")
        
        # Security Trigger Detection
        if telemetry_data.get("motion_detected_unauthorized") and telemetry_data.get("system_armed"):
            self.trigger_security_protocol()

        # Housekeeping Automation Trigger
        elif telemetry_data.get("home_empty") and not telemetry_data.get("cleaning_in_progress"):
            self.trigger_housekeeping_protocol()

    def trigger_security_protocol(self):
        logging.warning("SECURITY ALERT: Unauthorized movement captured. Locking down grid.")
        # Execute Google Home API device commands to lock doors and flash lights
        command_payload = {
            "command": "action.devices.commands.LockUnlock",
            "params": {"lock": True}
        }
        self.dispatch_command("security_lock_front", command_payload)

    def trigger_housekeeping_protocol(self):
        logging.info("HOUSEKEEPING: Environment clear. Dispatching automated sanitation routines.")
        command_payload = {
            "command": "action.devices.commands.StartStop",
            "params": {"start": True}
        }
        self.dispatch_command("autonomous_vacuum_1", command_payload)

    def dispatch_command(self, device_id, payload):
        # Dispatches intent through Home Graph API
        try:
            body = {
                "requestId": "req-ai-agent-001",
                "agentUserId": "user_active_ai_core",
                "payload": {
                    "commands": [{
                        "devices": [{"id": device_id}],
                        "execution": [payload]
                    }]
                }
            }
            # Reference execution structure for Google Home Graph
            logging.info(f"Dispatched command to device {device_id}: {json.dumps(payload)}")
        except Exception as e:
            logging.error(f"Failed to dispatch command: {e}")

# Example Usage
if __name__ == "__main__":
    ai_engine = ActiveHomeAI("service_account.json", "your-google-home-project-id")
    
    sample_telemetry = {
        "motion_detected_unauthorized": True,
        "system_armed": True,
        "home_empty": False,
        "cleaning_in_progress": False
    }
    
    ai_engine.evaluate_environment(sample_telemetry)



<!DOCTYPE html>
<html>
<head>
    <title>Active AI Home HUD & Map</title>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; background: #0a0a0a; color: #00ffcc; font-family: monospace; }
        #map { height: 90vh; width: 100%; }
        #hud-header { height: 10vh; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #00ffcc; }
    </style>
</head>
<body>
    <div id="hud-header">
        <h2>ACTIVE AI HUD // SYSTEM: SECURE</h2>
        <div id="status">Status: Autonomous Monitoring Active</div>
    </div>
    <div id="map"></div>

    <script>
        function initMap() {
            // Center map on target location
            const homeCoords = { lat: 14.3500, lng: 121.0500 }; // Example baseline coordinate
            
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 19,
                center: homeCoords,
                mapTypeId: "satellite",
                disableDefaultUI: true,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#212121" }] },
                    { elementType: "labels.icon", stylers: [{ visibility: "off" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#757575" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#212121" }] },
                    {
                        featureType: "administrative",
                        elementType: "geometry",
                        stylers: [{ color: "#757575" }]
                    },
                    {
                        featureType: "poi",
                        elementType: "labels.text.fill",
                        stylers: [{ color: "#d59563" }]
                    },
                    {
                        featureType: "water",
                        elementType: "geometry",
                        stylers: [{ color: "#000000" }]
                    }
                ]
            });

            // Security Node Marker
            const securityMarker = new google.maps.Marker({
                position: { lat: 14.3501, lng: 121.0501 },
                map: map,
                title: "Security Grid Point Alpha",
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 8,
                    fillColor: "#ff0033",
                    fillOpacity: 1,
                    strokeWeight: 2,
                    strokeColor: "#ffffff"
                }
            });

            // Housekeeping Autonomous Unit Marker
            const vacuumMarker = new google.maps.Marker({
                position: { lat: 14.3499, lng: 121.0499 },
                map: map,
                title: "Autonomous Sanitization Node",
                icon: {
                    path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                    scale: 6,
                    fillColor: "#00ffcc",
                    fillOpacity: 1,
                    strokeWeight: 1,
                    strokeColor: "#ffffff"
                }
            });
        }
    </script>
    <!-- Replace YOUR_API_KEY with your Google Cloud Console Maps JavaScript API key -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>
</body>
</html>



