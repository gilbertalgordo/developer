from PIL import Image, ImageDraw

def create_workspace_icon(filename="workspace_icon_512.png"):
    # Create a 512x512 transparent canvas
    size = (512, 512)
    image = Image.new("RGBA", size, (0, 0, 0, 0))
    draw = ImageDraw.Draw(image)

    # Rounded background container
    padding = 32
    draw.rounded_rectangle(
        [padding, padding, size[0] - padding, size[1] - padding],
        radius=96,
        fill=(255, 255, 255, 240),
        outline=(26, 115, 232, 255),
        width=8
    )

    # Draw Quad-Pane Workspace Grid inside
    # Red Pane
    draw.rectangle([96, 96, 236, 236], fill="#EA4335")
    # Yellow Pane
    draw.rectangle([276, 96, 416, 236], fill="#FBBC05")
    # Blue Pane
    draw.rectangle([96, 276, 236, 416], fill="#4285F4")
    # Green Pane
    draw.rectangle([276, 276, 416, 416], fill="#34A853")

    image.save(filename, "PNG")
    print(f"Successfully generated high-res icon: {filename}")

if __name__ == "__main__":
    create_workspace_icon()
