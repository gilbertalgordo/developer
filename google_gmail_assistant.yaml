/**
 * Triggers contextually when an email thread opens in Gmail.
 */
function getContextualAddOnCard(event) {
  var accessToken = event.gmail.accessToken;
  GmailApp.setCurrentMessageAccessToken(accessToken);
  
  var messageId = event.gmail.messageId;
  var message = GmailApp.getMessageById(messageId);
  
  var threadMetadata = {
    subject: message.getSubject(),
    sender: message.getFrom(),
    date: message.getDate(),
    snippet: message.getSnippet()
  };

  return [buildExecutiveCard(threadMetadata)];
}

/**
 * Builds a non-contextual standard Homepage card view.
 */
function onHomepageTrigger() {
  var card = CardService.newCardBuilder();
  var header = CardService.newCardHeader()
    .setTitle("Workspace Control Panel")
    .setSubtitle("Active Sync Online");
  
  var section = CardService.newCardSection()
    .addWidget(CardService.newTextParagraph().setText("Select an incoming Gmail message to initialize real-time workspace auditing and data extraction."))
    .addWidget(
      CardService.newTextButton()
        .setText("Run System Health Check")
        .setOnClickAction(CardService.newAction().setFunctionName("triggerHealthCheck"))
        .setTextButtonStyle(CardService.TextButtonStyle.FILLED)
    );

  card.setHeader(header);
  card.addSection(section);
  return card.build();
}

/**
 * Constructs an advanced data card containing parsed email attributes.
 */
function buildExecutiveCard(meta) {
  var card = CardService.newCardBuilder();
  
  var header = CardService.newCardHeader()
    .setTitle("Thread Intelligence")
    .setSubtitle(meta.sender);
  card.setHeader(header);

  var section = CardService.newCardSection()
    .setHeader("Email Properties")
    .addWidget(
      CardService.newDecoratedText()
        .setTopLabel("Subject Line")
        .setText(meta.subject)
        .setWrapText(true)
    )
    .addWidget(
      CardService.newDecoratedText()
        .setTopLabel("Timestamp")
        .setText(meta.date.toISOString())
    );

  // Input Field Widget for custom tagging
  var tagInput = CardService.newTextInput()
    .setFieldName("audit_tag")
    .setTitle("Assign Audit Category")
    .setHint("e.g., Priority, Infrastructure, Review");
    
  section.addWidget(tagInput);

  // Action button container with bound parameters
  var action = CardService.newAction()
    .setFunctionName("commitEmailRecordToWorkspace")
    .setParameters({
      "subject": meta.subject,
      "sender": meta.sender
    });

  var submitBtn = CardService.newTextButton()
    .setText("Commit to Sheets")
    .setOnClickAction(action)
    .setTextButtonStyle(CardService.TextButtonStyle.FILLED);

  var buttonSet = CardService.newButtonSet().addButton(submitBtn);
  section.addWidget(buttonSet);

  card.addSection(section);
  return card.build();
}

/**
 * Callback action handler executing data transmission.
 */
function commitEmailRecordToWorkspace(event) {
  var tag = event.formInput.audit_tag || "General";
  var subject = event.parameters.subject;
  var sender = event.parameters.sender;

  // Extension hook to external data layers or Google Sheets
