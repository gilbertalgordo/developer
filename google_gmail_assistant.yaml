package com.example.workspace

import android.appwidget.AppWidgetManager
import android.appwidget.AppWidgetProvider
import android.content.Context
import android.widget.RemoteViews
import com.google.assistant.appactions.widgets.AppActionsWidgetExtension

class GreetingsWidgetProvider : AppWidgetProvider() {

    override fun onUpdate(
        context: Context,
        appWidgetManager: AppWidgetManager,
        appWidgetIds: IntArray
    ) {
        for (appWidgetId in appWidgetIds) {
            updateAppWidget(context, appWidgetManager, appWidgetId)
        }
    }

    companion object {
        fun updateAppWidget(
            context: Context,
            appWidgetManager: AppWidgetManager,
            appWidgetId: Int
        ) {
            val views = RemoteViews(context.packageName, R.layout.widget_greetings)

            // Extract parameters passed dynamically from Google Assistant App Actions
            val optionsBundle = appWidgetManager.getAppWidgetOptions(appWidgetId)
            val bii = optionsBundle.getString(AppActionsWidgetExtension.EXTRA_APP_ACTIONS_BII)
            
            if (!bii.isNullOrBlank()) {
                val params = optionsBundle.getBundle(AppActionsWidgetExtension.EXTRA_APP_ACTIONS_PARAMS)
                val recipient = params?.getString("recipientName") ?: Workspace
                views.setTextViewText(R.id.widget_title, "Hello, $recipient")
                views.setTextViewText(R.id.widget_subtitle, "Updated via Assistant BII: $bii")
            } else {
                views.setTextViewText(R.id.widget_title, "Workspace Dashboard")
                views.setTextViewText(R.id.widget_subtitle, "Tap to check latest emails")
            }

            appWidgetManager.updateAppWidget(appWidgetId, views)
        }
    }
}



