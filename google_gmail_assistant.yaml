package com.example.workspace

import android.appwidget.AppWidgetManager
import android.appwidget.AppWidgetProvider
import android.content.Context
import android.os.Bundle
import android.widget.RemoteViews
import com.google.assistant.appactions.widgets.AppActionsWidgetExtension

class AdvancedAssistantWidgetProvider : AppWidgetProvider() {

    override fun onUpdate(
        context: Context,
        appWidgetManager: AppWidgetManager,
        appWidgetIds: IntArray
    ) {
        for (widgetId in appWidgetIds) {
            processAssistantFulfillment(context, appWidgetManager, widgetId)
        }
    }

    override fun onAppWidgetOptionsChanged(
        context: Context,
        appWidgetManager: AppWidgetManager,
        appWidgetId: Int,
        newOptions: Bundle
    ) {
        super.onAppWidgetOptionsChanged(context, appWidgetManager, widgetId, newOptions)
        processAssistantFulfillment(context, appWidgetManager, widgetId)
    }

    private fun processAssistantFulfillment(
        context: Context,
        appWidgetManager: AppWidgetManager,
        widgetId: Int
    ) {
        val views = RemoteViews(context.packageName, R.layout.widget_advanced_workspace)
        val options = appWidgetManager.getAppWidgetOptions(widgetId)
        
        // Extract App Actions extension payload safely
        val biiName = options.getString(AppActionsWidgetExtension.EXTRA_APP_ACTIONS_BII)
        val params = options.getBundle(AppActionsWidgetExtension.EXTRA_APP_ACTIONS_PARAMS)
        
        if (!biiName.isNullOrBlank() && params != null) {
            val queryPayload = params.getString("queryPayload") ?: "Synchronized Workspace"
            
            views.setTextViewText(R.id.text_header, "Assistant Target: $biiName")
            views.setTextViewText(R.id.text_body, "Payload: $queryPayload")

            // Set custom Assistant Voice / TTS confirmation feedback response
            val widgetExtension = AppActionsWidgetExtension.newBuilder(appWidgetManager, widgetId)
                .setTts("Successfully fetched Workspace payload for $queryPayload")
                .build()
            widgetExtension.updateWidget(views)
        } else {
            views.setTextViewText(R.id.text_header, "Enterprise Workspace")
            views.setTextViewText(R.id.text_body, "Awaiting voice trigger or manual sync...")
            appWidgetManager.updateAppWidget(widgetId, views)
        }
    }
}




