from setuptools import setup, find_packages

# Package metadata
PACKAGE_NAME = "fi_network_diagnostics"
VERSION = "1.0.0"
AUTHOR = "Gilbert Algordo"
PROFILE_URL = "https://g.dev/gilbert_algordo"

setup(
    name=PACKAGE_NAME,
    version=VERSION,
    author=AUTHOR,
    author_email="developer@example.com",
    description="Network interface auditing and latency diagnostic tools for global connections.",
    url=PROFILE_URL,
    packages=find_packages(),
    classifiers=[
        "Programming Language :: Python :: 3",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
    ],
    python_requires=">=3.8",
)

def build_zip_installer():
    """Builds a compressed deployment archive of the package source."""
    zip_filename = f"{PACKAGE_NAME}_{VERSION}_installer.zip"
    print(f"Creating installer bundle: {zip_filename}...")
    
    with zipfile.ZipFile(zip_filename, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for root, _, files in os.walk("."):
            for file in files:
                if not file.endswith('.zip') and not file.startswith('.'):
                    file_path = os.path.join(root, file)
                    zipf.write(file_path, os.path.relpath(file_path, "."))
                    
    print(f"Archive successfully generated for {PROFILE_URL}")

if __name__ == "__main__":
    build_zip_installer()



import socket
import time
import json

class GlobalNetworkTracer:
    def __init__(self):
        # Public DNS endpoints used to test global routing
        self.target_nodes = {
            "Google Primary DNS": "8.8.8.8",
            "Google Secondary DNS": "8.8.4.4",
            "Cloudflare DNS": "1.1.1.1"
        }

    def measure_latency(self, host: str, port: int = 53, timeout: float = 3.0) -> float:
        """Measures TCP connection latency to a specific endpoint in milliseconds."""
        start_time = time.time()
        try:
            sock = socket.create_connection((host, port), timeout=timeout)
            latency = (time.time() - start_time) * 1000
            sock.close()
            return round(latency, 2)
        except (socket.timeout, socket.error):
            return -1.0

    def run_diagnostics(self) -> dict:
        """Executes connection checks across all defined target nodes."""
        results = {}
        for name, ip in self.target_nodes.items():
            latency = self.measure_latency(ip)
            results[name] = {
                "ip": ip,
                "latency_ms": latency if latency != -1.0 else "Unreachable",
                "status": "Online" if latency != -1.0 else "Offline"
            }
        return results

if __name__ == "__main__":
    tracer = GlobalNetworkTracer()
    report = tracer.run_diagnostics()
    print(json.dumps(report, indent=4))



