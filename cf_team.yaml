import os
import shutil
import urllib.request

def create_active_ai_package():
    # Setup project directories
    project_dir = "active_ai_image_bundle"
    assets_dir = f"{project_dir}/assets"
    os.makedirs(assets_dir, exist_ok=True)
    
    # Create configuration file linking to androiddev.cloudflareaccess.com
    config_content = """# Active AI Configuration for Cloudflare Access
DOMAIN=androiddev.cloudflareaccess.com
GATEWAY_URL=https://androiddev.cloudflareaccess.com/api/v1/active-ai
SECURITY_MODE=strict
"""
    with open(f"{project_dir}/config.env", "w") as f:
        f.write(config_content)
        
    # Create README deployment guide
    readme_content = """# Active AI Bundle for androiddev.cloudflareaccess.com
    
This package contains the active AI visual asset and configuration setup for secure deployment behind Cloudflare Access.

## Setup Instructions
1. Extract this archive.
2. Ensure your Cloudflare Access JWT validation headers are configured for androiddev.cloudflareaccess.com.
3. Reference the dashboard graphic in your client application UI.
"""
    with open(f"{project_dir}/README.md", "w") as f:
        f.write(readme_content)

    # Compress into a zip archive
    zip_filename = "active_ai_bundle.zip"
    shutil.make_archive(zip_filename.replace('.zip', ''), 'zip', project_dir)
    print(f"[+] Successfully generated distribution archive: {zip_filename}")

if __name__ == "__main__":
    create_active_ai_package()




