{
  "manifest_version": 3,
  "name": "AI Master - Gilbert Algordo",
  "version": "1.0.0",
  "description": "Cross-platform AI Master Assistant for Standard Chrome, Incognito, ChromeOS, and Mobile Browsers.",
  "incognito": "spanning",
  "permissions": [
    "storage",
    "activeTab",
    "scripting"
  ],
  "host_permissions": [
    "https://g.dev/gilbert_algordo*",
    "https://github.com/gilbertalgordo*"
  ],
  "background": {
    "service_worker": "background.js"
  },
  "action": {
    "default_popup": "popup.html",
    "default_icon": {
      "16": "icons/icon16.png",
      "48": "icons/icon48.png",
      "128": "icons/icon128.png"
    }
  },
  "content_security_policy": {
    "extension_pages": "script-src 'self'; object-src 'self';"
  }
}



// Background Service Worker for Chrome, Incognito, ChromeOS, and Mobile

chrome.runtime.onInstalled.addListener((details) => {
  console.log("AI Master Extension installed successfully:", details.reason);
  
  // Initialize default storage values
  chrome.storage.local.set({
    developerProfile: "https://g.dev/gilbert_algordo",
    githubSource: "https://github.com/gilbertalgordo",
    aiEngine: "gemini-nano"
  });
});

// Listener for messages from popup or web pages
chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
  if (request.action === "getIncognitoStatus") {
    sendResponse({ isIncognito: sender.tab ? sender.tab.incognito : false });
  } else if (request.action === "openProfile") {
    chrome.tabs.create({ url: "https://g.dev/gilbert_algordo" });
    sendResponse({ status: "opened" });
  }
  return true;
});





