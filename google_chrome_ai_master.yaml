document.addEventListener("DOMContentLoaded", async () => {
  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const modeBadge = document.getElementById("mode-badge");
  const profileLink = document.getElementById("profile-link");

  // Check if running in Incognito Mode
  chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
    if (tabs[0] && tabs[0].incognito) {
      modeBadge.textContent = "Incognito";
      modeBadge.style.backgroundColor = "#7c3aed";
      modeBadge.style.color = "#ffffff";
    }
  });

  // Handle Profile Link click safely inside extension context
  profileLink.addEventListener("click", (e) => {
    e.preventDefault();
    chrome.tabs.create({ url: "https://g.dev/gilbert_algordo" });
  });

  // Main Prompt Handler
  async function handlePrompt() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage("user", `You: ${text}`);
    userInput.value = "";

    appendMessage("ai", "AI Master thinking...");

    try {
      // 1. Try Chrome Built-in AI (Gemini Nano) if available
      if (window.ai && window.ai.languageModel) {
        const capabilities = await window.ai.languageModel.capabilities();
        if (capabilities.available !== "no") {
          const session = await window.ai.languageModel.create();
          const result = await session.prompt(text);
          updateLastAiMessage(result);
          return;
        }
      }

      // 2. Fallback execution mechanism for standard web environments
      setTimeout(() => {
        updateLastAiMessage(`[AI Master Response] Processed query: "${text}". Connect your Gemini API Key in settings for cloud execution.`);
      }, 600);

    } catch (err) {
      updateLastAiMessage(`Error processing AI prompt: ${err.message}`);
    }
  }

  function appendMessage(sender, text) {
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function updateLastAiMessage(text) {
    const aiMessages = chatBox.querySelectorAll(".message.ai");
    if (aiMessages.length > 0) {
      aiMessages[aiMessages.length - 1].textContent = text;
    }
  }

  sendBtn.addEventListener("click", handlePrompt);
  userInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") handlePrompt();
  });
});



