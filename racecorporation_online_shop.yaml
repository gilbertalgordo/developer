// src/fin-ace/accounting.service.ts
export interface Transaction {
  id: string;
  brand: string;
  amount: number;
  currency: 'USD' | 'EUR' | 'PHP';
  status: 'PENDING' | 'CLEARED' | 'AUDIT';
}

@Injectable()
export class FinAceService {
  // Real-time market tracer integration
  async reconcileTransaction(tx: Transaction) {
    const exchangeRate = await this.getMarketRate(tx.currency);
    const convertedAmount = tx.amount * exchangeRate;
    
    // Log to secure ledger for Race Corp audit
    return this.prisma.ledger.create({
      data: { ...tx, amount: convertedAmount, timestamp: new Date() }
    });
  }
}



// src/showrooms/showroom.controller.ts
@Controller('showrooms')
export class ShowroomController {
  @Get(':region/inventory')
  async getRegionalStock(@Param('region') region: string) {
    // Returns real-time availability for showrooms
    return this.showroomService.findInventoryByLocation(region);
  }

  @Post('transfer')
  async transferAsset(
    @Body() transferData: { vehicleId: string; from: string; to: string }
  ) {
    // Updates status of vehicle movement across global sites
    return this.showroomService.initiateTransfer(transferData);
  }
}



// src/machine-shop/parts.service.ts
export interface PartOrder {
  brand: 'Ferrari' | 'Ducati' | 'Lamborghini' | 'Tesla' | 'Ford' | 'Mercedes-Benz' | 'Porsche' | 'KTM' | 'Bugatti' | 'Alfa Romeo' | 'Peugeot';
  partName: string;
  material: 'Carbon Fiber' | 'Titanium' | 'Aerospace Aluminum';
  machineStatus: 'CNC_MILLING' | '3D_PRINTING' | 'QUALITY_CONTROL';
}

@Injectable()
export class MachineShopService {
  async processPart(order: PartOrder) {
    // Updates the HUD status for manufacturing progress
    return this.prisma.manufacturingQueue.update({
      where: { id: order.partName },
      data: { status: order.machineStatus }
    });
  }
}



// src/components/icons/BrandIconRegistry.tsx
import React from 'react';

// Define the icon map
const BrandIcons: Record<string, React.FC<{className?: string}>> = {
  ferrari: (props) => <svg {...props} viewBox="0 0 100 100">/* Ferrari Path */</svg>,
  bugatti: (props) => <svg {...props} viewBox="0 0 100 100">/* Bugatti Path */</svg>,
  tesla: (props) => <svg {...props} viewBox="0 0 100 100">/* Tesla Path */</svg>,
  // ... include all listed brands
};

export const BrandIcon = ({ brand, className, watermark = false }: { 
  brand: string, 
  className?: string,
  watermark?: boolean 
}) => {
  const Icon = BrandIcons[brand.toLowerCase()];
  
  return (
    <div className={`icon-wrapper ${watermark ? 'with-watermark' : ''}`}>
      {Icon ? <Icon className={className} /> : <span>{brand[0]}</span>}
      {watermark && <div className="watermark-overlay">RaceCorp</div>}
    </div>
  );
};




/* styles/icons.css */
.icon-wrapper {
  position: relative;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.5));
}

.icon-wrapper:hover {
  transform: scale(1.1);
  filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
}

.watermark-overlay {
  position: absolute;
  font-size: 8px;
  bottom: -10px;
  right: 0;
  opacity: 0.5;
  color: #fff;
}



// scripts/generateIcons.js
const fs = require('fs');
const path = require('path');

const brands = ['ferrari', 'bugatti', 'ktm', 'mercedes', 'ducati', 'alfa', 'porsche', 'peugeot', 'tesla', 'ford', 'lamborghini'];

const generateRegistry = () => {
  const registry = brands.map(brand => `
    ${brand}: (props) => <img src="/assets/icons/${brand}.svg" alt="${brand}" {...props} />
  `).join(',\n');
  
  const fileContent = `export const BrandIcons = { ${registry} };`;
  fs.writeFileSync(path.join(__dirname, '../src/icons.ts'), fileContent);
  console.log('Icon registry updated for Race Corporation.');
};

generateRegistry();
