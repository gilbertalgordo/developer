CREATE TABLE vehicles (
    id SERIAL PRIMARY KEY,
    brand VARCHAR(50) NOT NULL, -- e.g., 'Scuderia Ferrari', 'Bugatti'
    model VARCHAR(100) NOT NULL,
    type VARCHAR(20), -- 'Car' or 'Motorcycle'
    price DECIMAL(12, 2),
    stock_count INT,
    specs_json JSONB -- Store technical performance data here
);



