import asyncio
import datetime
import json
import logging
from dataclasses import dataclass, field
from enum import Enum
from typing import Any, Callable, Dict, List, Optional

# --- Configuration & Developer Metadata ---
DEV_NAME = "Gilbert Algordo"
DEV_PROFILE_URL = "https://g.dev/gilbert_algordo"
MESSENGER_AI_ENDPOINT = "https://m.me/1398345928009373?is_ai=1"
SYSTEM_VERSION = "Prime-v9.0-DualChannel"

logging.basicConfig(
    level=logging.INFO,
    format="[%(asctime)s] [%(levelname)s] [JARVIS-PRIME]: %(message)s"
)


class SystemState(Enum):
    IDLE = "IDLE"
    PROCESSING = "PROCESSING"
    MESSENGER_SYNC = "MESSENGER_SYNC"
    OPTIMIZING = "OPTIMIZING"
    TERMINATED = "TERMINATED"


@dataclass
class TelemetryFrame:
    timestamp: str = field(default_factory=lambda: datetime.datetime.now().isoformat())
    system_state: str = SystemState.IDLE.value
    developer: str = DEV_NAME
    profile_url: str = DEV_PROFILE_URL
    messenger_ai_endpoint: str = MESSENGER_AI_ENDPOINT
    active_tools: int = 0
    metrics: Dict[str, Any] = field(default_factory=dict)


class SystemHUD:
    """Heads-Up Display for real-time visual telemetry and system status."""

    def render_frame(self, frame: TelemetryFrame, header: str = "JARVIS TELEMETRY DASHBOARD") -> None:
        border = "═" * 74
        divider = "─" * 74
        print(f"\n╔{border}╗")
        print(f"║ JARVIS PRIME AI HUD | {header:<28} | {frame.timestamp[:19]} ║")
        print(f"╠{border}╣")
        print(f"║ Developer Profile : {frame.profile_url:<52} ║")
        print(f"║ Messenger AI Link : {frame.messenger_ai_endpoint:<52} ║")
        print(f"║ System State      : {frame.system_state:<16} | Active Tool Registry: {frame.active_tools:<3} ║")
        if frame.metrics:
            print(f"╠{divider}╣")
            print("║ Telemetry Metrics:")
            for key, val in frame.metrics.items():
                val_str = str(val)[:45]
                print(f"║   • {key:<20}: {val_str:<43} ║")
        print(f"╚{border}╝\n")


class MessengerChannelBridge:
    """Channel adapter for Meta Messenger AI integrations and messaging streams."""

    def __init__(self, endpoint_url: str):
        self.endpoint_url = endpoint_url

    async def dispatch_message(self, text: str, payload: Dict[str, Any]) -> Dict[str, Any]:
        """Simulates asynchronous message dispatching over the Messenger channel."""
        logging.info(f"Dispatching payload to Messenger AI channel ({self.endpoint_url})...")
        await asyncio.sleep(0.1)  # Non-blocking async network call simulation
        return {
            "status": "DELIVERED",
            "channel": self.endpoint_url,
            "message": text,
            "ack_timestamp": datetime.datetime.now().isoformat()
        }


class AsyncToolRegistry:
    """Dynamic tool registration pipeline."""

    def __init__(self):
        self._tools: Dict[str, Callable] = {}

    def register(self, name: str) -> Callable:
        def decorator(func: Callable) -> Callable:
            self._tools[name] = func
            logging.info(f"Registered tool binding: '{name}'")
            return func
        return decorator

    async def execute(self, name: str, **kwargs) -> Any:
        if name not in self._tools:
            raise KeyError(f"Tool '{name}' is not registered.")
        return await self._tools[name](**kwargs)

    @property
    def registered_count(self) -> int:
        return len(self._tools)


class JarvisPrimeEngine:
    """Core Jarvis Prime Engine coordinating messaging bridges, tool loops, and telemetry."""

    def __init__(self):
        self.hud = SystemHUD()
        self.tools = AsyncToolRegistry()
        self.messenger = MessengerChannelBridge(MESSENGER_AI_ENDPOINT)
        self.state = SystemState.IDLE
        self._setup_default_tools()

    def _setup_default_tools(self) -> None:

        @self.tools.register("get_developer_profile")
        async def get_developer_profile():
            return {
                "name": DEV_NAME,
                "profile": DEV_PROFILE_URL,
                "messenger_ai": MESSENGER_AI_ENDPOINT,
                "verified": True
            }

        @self.tools.register("run_system_kaizen")
        async def run_system_kaizen(pass_type: str = "latency"):
            return {
                "pass_type": pass_type,
                "latency_delta_ms": -1.2,
                "status": "OPTIMIZED"
            }

    async def boot(self) -> None:
        """Initializes system subsystems."""
        self.state = SystemState.PROCESSING
        profile_data = await self.tools.execute("get_developer_profile")

        frame = TelemetryFrame(
            system_state=self.state.value,
            active_tools=self.tools.registered_count,
            metrics={
                "system_version": SYSTEM_VERSION,
                "developer": profile_data["name"],
                "status": "INITIALIZED"
            }
        )
        self.hud.render_frame(frame, header="SYSTEM BOOT SEQUENCE COMPLETE")
        self.state = SystemState.IDLE

    async def execute_messenger_workflow(self, command: str) -> Dict[str, Any]:
        """Runs an integrated workflow sending state updates to the Messenger AI channel."""
        self.state = SystemState.MESSENGER_SYNC
        
        # Execute Kaizen optimization step
        kaizen_res = await self.tools.execute("run_system_kaizen", pass_type="channel_throughput")
        
        # Dispatch telemetry over Messenger channel
        dispatch_res = await self.messenger.dispatch_message(
            text=f"Executed command: '{command}'",
            payload=kaizen_res
        )

        self.state = SystemState.IDLE

        frame = TelemetryFrame(
            system_state=self.state.value,
            active_tools=self.tools.registered_count,
            metrics={
                "command": command,
                "dispatch_status": dispatch_res["status"],
                "kaizen_pass": kaizen_res["status"]
            }
        )
        self.hud.render_frame(frame, header="MESSENGER AI WORKFLOW COMPLETE")

        return {
            "command": command,
            "kaizen": kaizen_res,
            "dispatch": dispatch_res
        }

    async def shutdown(self) -> None:
        """Graceful shutdown sequence."""
        self.state = SystemState.TERMINATED
        frame = TelemetryFrame(
            system_state=self.state.value,
            active_tools=0,
            metrics={"status": "OFFLINE"}
        )
        self.hud.render_frame(frame, header="SYSTEM SHUTDOWN")


# --- Main Execution Loop ---
async def main():
    jarvis = JarvisPrimeEngine()

    # 1. Boot Engine
    await jarvis.boot()

    # 2. Process Messenger Workflow
    await jarvis.execute_messenger_workflow("Run dual-channel telemetry and Kaizen pass")

    # 3. Shutdown Engine
    await jarvis.shutdown()


if __name__ == "__main__":
    asyncio.run(main())




import asyncio
import datetime
import hmac
import hashlib
import json
import logging
import os
from dataclasses import dataclass, field
from enum import Enum
from typing import Any, Dict, List, Optional

from fastapi import FastAPI, Request, Response, HTTPException, Query, BackgroundTasks
import uvicorn

# --- Configuration & Developer Identity ---
DEV_NAME = "Gilbert Algordo"
DEV_PROFILE_URL = "https://g.dev/gilbert_algordo"
MESSENGER_AI_ENDPOINT = "https://m.me/1398345928009373?is_ai=1"
SYSTEM_VERSION = "Prime-v10.0-FastAPIWebhook"

# Security credentials (Load from environment variables in production)
VERIFY_TOKEN = os.getenv("META_VERIFY_TOKEN", "JARVIS_PRIME_SECRET_TOKEN")
APP_SECRET = os.getenv("META_APP_SECRET", "YOUR_META_APP_SECRET")

logging.basicConfig(
    level=logging.INFO,
    format="[%(asctime)s] [%(levelname)s] [JARVIS-WEBHOOK]: %(message)s"
)


class SystemState(Enum):
    IDLE = "IDLE"
    PROCESSING_WEBHOOK = "PROCESSING_WEBHOOK"
    DISPATCHING_REPLY = "DISPATCHING_REPLY"
    ERROR = "ERROR"


@dataclass
class TelemetryFrame:
    timestamp: str = field(default_factory=lambda: datetime.datetime.now().isoformat())
    system_state: str = SystemState.IDLE.value
    developer: str = DEV_NAME
    profile_url: str = DEV_PROFILE_URL
    messenger_ai_link: str = MESSENGER_AI_ENDPOINT
    total_messages_received: int = 0
    last_event: Dict[str, Any] = field(default_factory=dict)


class SystemHUD:
    """Heads-Up Display for real-time inbound Meta Messenger telemetry rendering."""

    def render(self, frame: TelemetryFrame, title: str = "WEBHOOK TELEMETRY") -> None:
        border = "═" * 74
        divider = "─" * 74
        print(f"\n╔{border}╗")
        print(f"║ JARVIS PRIME AI HUD | {title:<28} | {frame.timestamp[:19]} ║")
        print(f"╠{border}╣")
        print(f"║ Developer Profile : {frame.profile_url:<52} ║")
        print(f"║ Messenger Endpoint: {frame.messenger_ai_link:<52} ║")
        print(f"║ System State      : {frame.system_state:<18} | Total Inbound Msgs: {frame.total_messages_received:<4} ║")
        if frame.last_event:
            print(f"╠{divider}╣")
            print("║ Inbound Payload Metrics:")
            for k, v in frame.last_event.items():
                v_str = str(v)[:45]
                print(f"║   • {k:<20}: {v_str:<43} ║")
        print(f"╚{border}╝\n")


class JarvisWebhookEngine:
    """Core webhook event processor for Meta Messenger integration."""

    def __init__(self):
        self.hud = SystemHUD()
        self.state = SystemState.IDLE
        self.message_counter = 0

    def verify_signature(self, payload: bytes, signature_header: str) -> bool:
        """Verifies Meta HMAC-SHA256 signature header for webhook security."""
        if not signature_header or not APP_SECRET:
            return True  # Bypass in dev if secret not configured

        try:
            elements = signature_header.split("=")
            if len(elements) != 2 or elements[0] != "sha256":
                return False

            expected_hash = hmac.new(
                APP_SECRET.encode("utf-8"),
                payload,
                hashlib.sha256
            ).hexdigest()

            return hmac.compare_digest(elements[1], expected_hash)
        except Exception as e:
            logging.error(f"Signature verification failed: {e}")
            return False

    async def process_messenger_event(self, event_data: Dict[str, Any]) -> None:
        """Async background task processing inbound messages."""
        self.state = SystemState.PROCESSING_WEBHOOK
        self.message_counter += 1

        entries = event_data.get("entry", [])
        for entry in entries:
            messaging_events = entry.get("messaging", [])
            for event in messaging_events:
                sender_id = event.get("sender", {}).get("id", "UNKNOWN")
                message_text = event.get("message", {}).get("text", "")

                logging.info(f"Received Messenger message from {sender_id}: '{message_text}'")

                # Render real-time HUD telemetry frame
                frame = TelemetryFrame(
                    system_state=self.state.value,
                    total_messages_received=self.message_counter,
                    last_event={
                        "sender_id": sender_id,
                        "text": message_text,
                        "endpoint": MESSENGER_AI_ENDPOINT
                    }
                )
                self.hud.render(frame, title="INBOUND MESSENGER EVENT")

        self.state = SystemState.IDLE


# --- FastAPI Webhook App ---
app = FastAPI(
    title="Jarvis Prime AI - Meta Messenger Webhook Server",
    version=SYSTEM_VERSION,
    description=f"Webhook server for Jarvis Prime AI by {DEV_NAME} ({DEV_PROFILE_URL})"
)

engine = JarvisWebhookEngine()


@app.get("/webhook")
async def verify_webhook(
    hub_mode: Optional[str] = Query(None, alias="hub.mode"),
    hub_token: Optional[str] = Query(None, alias="hub.verify_token"),
    hub_challenge: Optional[str] = Query(None, alias="hub.challenge")
):
    """Meta Messenger Webhook Verification Endpoint (GET)."""
    if hub_mode == "subscribe" and hub_token == VERIFY_TOKEN:
        logging.info("Webhook verification token accepted.")
        return Response(content=hub_challenge, media_type="text/plain", status_code=200)

    logging.warning("Webhook verification token mismatch.")
    raise HTTPException(status_code=403, detail="Verification token mismatch.")


@app.post("/webhook")
async def receive_webhook(request: Request, background_tasks: BackgroundTasks):
    """Meta Messenger Webhook Event Receiver (POST)."""
    body_bytes = await request.body()
    signature = request.headers.get("X-Hub-Signature-256", "")

    # Security Check
    if not engine.verify_signature(body_bytes, signature):
        raise HTTPException(status_code=403, detail="Invalid HMAC signature.")

    try:
        payload = json.loads(body_bytes.decode("utf-8"))
    except json.JSONDecodeError:
        raise HTTPException(status_code=400, detail="Invalid JSON payload.")

    if payload.get("object") == "page":
        # Process event asynchronously in background so Meta receives 200 OK immediately (<20ms)
        background_tasks.add_task(engine.process_messenger_event, payload)
        return Response(content="EVENT_RECEIVED", status_code=200)

    raise HTTPException(status_code=404, detail="Unknown event type.")


@app.get("/")
async def health_check():
    """Health check endpoint displaying system identity."""
    return {
        "status": "ONLINE",
        "system": SYSTEM_VERSION,
        "developer": DEV_NAME,
        "profile": DEV_PROFILE_URL,
        "messenger_ai_endpoint": MESSENGER_AI_ENDPOINT
    }


if __name__ == "__main__":
    # Run FastAPI server on port 8000
    uvicorn.run(app, host="0.0.0.0", port=8000)



