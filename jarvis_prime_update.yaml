class MetaGraphClient:
    """Async Meta Graph API Client for sending automated AI responses back to Messenger users."""

    def __init__(self, page_access_token: str, api_version: str = "v19.0"):
        self.access_token = page_access_token
        self.api_version = api_version
        self.base_url = f"https://graph.facebook.com/{self.api_version}"

    async def send_text_message(self, recipient_id: str, message_text: str) -> Dict[str, Any]:
        """Sends a text response to a user via the Meta Graph Send API."""
        url = f"{self.base_url}/me/messages"
        params = {"access_token": self.access_token}
        payload = {
            "recipient": {"id": recipient_id},
            "message": {"text": message_text},
            "messaging_type": "RESPONSE"
        }

        async with httpx.AsyncClient(timeout=10.0) as client:
            try:
                logging.info(f"Dispatching Graph API response to recipient: {recipient_id}")
                response = await client.post(url, params=params, json=payload)
                response.raise_for_status()
                return response.json()
            except httpx.HTTPStatusError as exc:
                logging.error(f"Graph API HTTP Error: {exc.response.status_code} - {exc.response.text}")
                return {"error": True, "details": exc.response.text}
            except Exception as e:
                logging.error(f"Failed to reach Meta Graph API: {e}")
                return {"error": True, "details": str(e)}


class JarvisEngine:
    """Core Jarvis processing engine combining webhook ingestion, AI response generation, and Graph API dispatching."""

    def __init__(self):
        self.hud = SystemHUD()
        self.graph_client = MetaGraphClient(PAGE_ACCESS_TOKEN, GRAPH_API_VERSION)
        self.state = SystemState.IDLE
        self.message_count = 0

    def verify_signature(self, payload: bytes, signature_header: str) -> bool:
        """Validates HMAC-SHA256 signature from Meta webhook requests."""
        if not signature_header or APP_SECRET == "YOUR_META_APP_SECRET":
            return True  # Dev bypass

        try:
            elements = signature_header.split("=")
            if len(elements) != 2 or elements[0] != "sha256":
                return False

            expected_hash = hmac.new(
                APP_SECRET.encode("utf-8"),
                payload,
                hashlib.sha256
            ).hexdigest()

            return hmac.compare_digest(elements[1], expected_hash)
        except Exception as e:
            logging.error(f"Signature verification failed: {e}")
            return False

    def generate_ai_response(self, user_text: str) -> str:
        """Generates contextual AI response."""
        return f"[Jarvis Prime AI]: Received query: '{user_text}'. Subsystems active. Developed by Gilbert Algordo ({DEV_PROFILE_URL})."

    async def handle_inbound_event(self, event_data: Dict[str, Any]) -> None:
        """Background task: Parses event, generates AI output, and sends reply via Meta Graph API."""
        self.state = SystemState.PROCESSING
        self.message_count += 1

        entries = event_data.get("entry", [])
        for entry in entries:
            messaging_events = entry.get("messaging", [])
            for event in messaging_events:
                sender_id = event.get("sender", {}).get("id")
                message = event.get("message", {})
                message_text = message.get("text")

                if sender_id and message_text:
                    # 1. Generate AI Response
                    ai_reply = self.generate_ai_response(message_text)

                    # 2. Dispatch via Meta Graph API
                    self.state = SystemState.DISPATCHING_GRAPH_API
                    graph_response = await self.graph_client.send_text_message(sender_id, ai_reply)

                    # 3. Render HUD Telemetry
                    frame = TelemetryFrame(
                        system_state=self.state.value,
                        processed_count=self.message_count,
                        last_action={
                            "sender_id": sender_id,
                            "inbound_prompt": message_text,
                            "ai_response": ai_reply,
                            "graph_api_status": graph_response.get("recipient_id", "DISPATCHED")
                        }
                    )
                    self.hud.render(frame, title="AUTOMATED REPLY DISPATCHED")

        self.state = SystemState.IDLE


