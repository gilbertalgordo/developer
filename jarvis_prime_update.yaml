<canvas id="hudCanvas" width="1000" height="562"></canvas>

<script>
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');
    let rotation = 0;

    function drawHUD() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background grid
        ctx.strokeStyle = "rgba(0, 240, 255, 0.05)";
        ctx.lineWidth = 1;
        for(let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for(let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Center Rotating Core
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.strokeStyle = "#00f0ff";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI * 1.5); ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-rotation * 1.5);
        ctx.strokeStyle = "rgba(0, 240, 255, 0.5)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, 85, 0, Math.PI * 1.8); ctx.stroke();
        ctx.restore();

        // Pulsing Core Center
        ctx.fillStyle = "#00f0ff";
        ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill();

        // HUD Overlay Text
        ctx.fillStyle = "#00f0ff";
        ctx.font = "14px monospace";
        ctx.fillText("JARVIS PRIME AI CORE", 30, 40);
        ctx.fillStyle = "rgba(0, 240, 255, 0.7)";
        ctx.fillText("DEV: Gilbert Algordo | g.dev/gilbert_algordo", 30, 65);
        ctx.fillText("CHANNEL: m.me/1398345928009373?is_ai=1", 30, 85);

        rotation += 0.01;
        requestAnimationFrame(drawHUD);
    }

    drawHUD();
</script>
</body>
