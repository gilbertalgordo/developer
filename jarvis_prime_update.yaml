import os
from PIL import Image, ImageDraw, ImageFont

def generate_jarvis_icon(size=512):
    # Colors
    bg_color = (2, 8, 16)
    cyan_glow = (0, 240, 255)
    cyan_dim = (0, 120, 160)
    white = (240, 255, 255)

    img = Image.new("RGBA", (size, size), bg_color)
    draw = ImageDraw.Draw(img)

    center = size // 2
    r_outer = int(size * 0.42)
    r_mid = int(size * 0.28)
    r_core = int(size * 0.08)

    # Outer HUD Ring
    draw.ellipse(
        [center - r_outer, center - r_outer, center + r_outer, center + r_outer],
        outline=cyan_glow,
        width=max(2, size // 128)
    )

    # Middle Segmented Ring
    draw.ellipse(
        [center - r_mid, center - r_mid, center + r_mid, center + r_mid],
        outline=cyan_dim,
        width=max(1, size // 256)
    )

    # Center Glowing Core
    draw.ellipse(
        [center - r_core, center - r_core, center + r_core, center + r_core],
        fill=cyan_glow
    )

    # Corner Crosshair Ticks
    tick_len = int(size * 0.06)
    draw.line([(center, 15), (center, 15 + tick_len)], fill=cyan_glow, width=2)
    draw.line([(center, size - 15), (center, size - 15 - tick_len)], fill=cyan_glow, width=2)
    draw.line([(15, center), (15 + tick_len, center)], fill=cyan_glow, width=2)
    draw.line([(size - 15, center), (size - 15 - tick_len, center)], fill=cyan_glow, width=2)

    return img

