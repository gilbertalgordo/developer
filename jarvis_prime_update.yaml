                print(f"║   • {k:<20}: {v_str:<43} ║")
        print(f"╚{border}╝\n")


class AsyncToolRegistry:
    """Dynamic tool pipeline for agentic execution."""

    def __init__(self):
        self._tools: Dict[str, Callable] = {}

    def register(self, name: str) -> Callable:
        def decorator(func: Callable) -> Callable:
            self._tools[name] = func
            logging.info(f"Registered tool: '{name}'")
            return func
        return decorator

    async def execute(self, name: str, **kwargs) -> Any:
        if name not in self._tools:
            raise KeyError(f"Tool '{name}' is not registered.")
        return await self._tools[name](**kwargs)

    @property
    def count(self) -> int:
        return len(self._tools)


class MetaGraphClient:
    """Asynchronous Meta Graph API Client for Meta Messenger Send API."""

    def __init__(self, page_access_token: str, api_version: str = "v19.0"):
        self.access_token = page_access_token
        self.api_version = api_version
        self.base_url = f"https://graph.facebook.com/{self.api_version}"

    async def send_text_message(self, recipient_id: str, message_text: str) -> Dict[str, Any]:
        """Dispatches an asynchronous text response to a Messenger user."""
        url = f"{self.base_url}/me/messages"
        params = {"access_token": self.access_token}
        payload = {
            "recipient": {"id": recipient_id},
            "message": {"text": message_text},
            "messaging_type": "RESPONSE"
        }

        async with httpx.AsyncClient(timeout=10.0) as client:
            try:
                logging.info(f"Dispatching Graph API response to recipient: {recipient_id}")
                response = await client.post(url, params=params, json=payload)
                response.raise_for_status()
                return response.json()
            except httpx.HTTPStatusError as exc:
                logging.error(f"Graph API HTTP Error {exc.response.status_code}: {exc.response.text}")
                return {"error": True, "status_code": exc.response.status_code}
            except Exception as e:
                logging.error(f"Meta Graph API Exception: {e}")
                return {"error": True, "details": str(e)}


class JarvisPrimeCore:
    """Core Orchestrator coordinating tools, Webhook processing, and HUD telemetry."""

    def __init__(self):
        self.hud = SystemHUD()
        self.tools = AsyncToolRegistry()
        self.graph_client = MetaGraphClient(PAGE_ACCESS_TOKEN, GRAPH_API_VERSION)
        self.state = SystemState.IDLE
        self.processed_counter = 0
        self._bind_default_tools()

    def _bind_default_tools(self) -> None:

        @self.tools.register("get_developer_info")
        async def get_developer_info():
            return {
                "name": DEV_NAME,
                "profile": DEV_PROFILE_URL,
                "messenger": MESSENGER_AI_ENDPOINT
            }

        @self.tools.register("run_kaizen_pass")
        async def run_kaizen_pass(scope: str = "latency_optimization"):
            return {
                "scope": scope,
                "latency_delta": "-1.8ms",
                "status": "PASS_COMPLETE"
            }

    def verify_signature(self, payload: bytes, signature_header: str) -> bool:
        """Verifies HMAC-SHA256 signature for incoming Meta webhooks."""
        if not signature_header or APP_SECRET == "YOUR_META_APP_SECRET":
            return True  # Dev mode fallback

        try:
            elements = signature_header.split("=")
            if len(elements) != 2 or elements[0] != "sha256":
                return False

            expected_hash = hmac.new(
                APP_SECRET.encode("utf-8"),
                payload,
                hashlib.sha256
            ).hexdigest()

            return hmac.compare_digest(elements[1], expected_hash)
        except Exception as e:
            logging.error(f"HMAC Verification error: {e}")
            return False

    async def handle_messenger_payload(self, payload: Dict[str, Any]) -> None:
        """Asynchronous worker for parsing webhook events and dispatching AI responses."""
        self.state = SystemState.PROCESSING
        self.processed_counter += 1

        entries = payload.get("entry", [])
        for entry in entries:
            for event in entry.get("messaging", []):
                sender_id = event.get("sender", {}).get("id")
                message = event.get("message", {})
                message_text = message.get("text", "")

                if sender_id and message_text:
                    # Execute tool call
                    kaizen = await self.tools.execute("run_kaizen_pass", scope="inbound_routing")
                    
                    # Formulate reply
                    reply = (
                        f"[Jarvis Prime AI]: Received query '{message_text}'. "
                        f"Subsystems online. Profile: {DEV_PROFILE_URL}"
                    )

                    # Dispatch via Meta Graph API
                    self.state = SystemState.DISPATCHING_REPLY
                    res = await self.graph_client.send_text_message(sender_id, reply)

                    # Update HUD
                    frame = TelemetryFrame(
                        system_state=self.state.value,
                        total_processed=self.processed_counter,
                        active_tools_count=self.tools.count,
                        metrics={
                            "sender_id": sender_id,
                            "inbound_prompt": message_text,
                            "kaizen_status": kaizen["status"],
                            "dispatch_result": res.get("recipient_id", "DELIVERED")
                        }
                    )
                    self.hud.render(frame, title="INBOUND MESSAGE PROCESSED")

        self.state = SystemState.IDLE


