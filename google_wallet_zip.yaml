 * "Add to Google Wallet" vector action badge for Issuer Android Banking Apps.
 */
@Composable
fun AddToGoogleWalletButton(
    onClick: () -> Unit,
    modifier: Modifier = Modifier,
    enabled: Boolean = true
) {
    // Official specifications dictate minimum 48dp height and 8dp clear space padding
    Surface(
        modifier = modifier
            .fillMaxWidth()
            .HeightIn(min = 48.dp)
            .padding(8.dp)
            .clickable(
                enabled = enabled,
                interactionSource = remember { MutableInteractionSource() },
                indication = null,
                onClick = onClick
            ),
        color = Color.Transparent
    ) {
        Image(
            // Use the SVG asset downloaded from Google Wallet Brand Guidelines
            painter = painterResource(id = R.drawable.add_to_google_wallet_button),
            contentDescription = "Add to Google Wallet",
            contentScale = ContentScale.Fit,
            modifier = Modifier.fillMaxWidth()
        )
    }
}





