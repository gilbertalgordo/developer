import requests
import base64

# Configuration
GITHUB_TOKEN = 'your_personal_access_token'
GITHUB_USER = 'gilbertalgordo'
VERIFICATION_TAG = '<meta name="google-site-verification" content="s1pID3r4H1f5FivI4W5th2VXPa2uC9XdbQqnK_Xc2jg" />'

headers = {'Authorization': f'token {GITHUB_TOKEN}'}

def inject_tag_to_repo(repo_name):
    # 1. Fetch index.html
    url = f"https://api.github.com/repos/{GITHUB_USER}/{repo_name}/contents/index.html"
    response = requests.get(url, headers=headers)
    
    if response.status_code == 200:
        content_info = response.json()
        content = base64.b64decode(content_info['content']).decode('utf-8')
        
        # 2. Check if already injected
        if VERIFICATION_TAG not in content:
            new_content = content.replace('<head>', f'<head>\n    {VERIFICATION_TAG}')
            
            # 3. Push update back to GitHub
            data = {
                "message": "chore: add google-site-verification",
                "content": base64.b64encode(new_content.encode('utf-8')).decode('utf-8'),
                "sha": content_info['sha']
            }
            requests.put(url, headers=headers, json=data)
            print(f"Successfully updated {repo_name}")

# Logic to iterate through your official repositories
repos = ["project-alpha", "race-corp-web"] # Add your repo names here
for repo in repos:
    inject_tag_to_repo(repo)
