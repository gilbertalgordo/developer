dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0          # To pick any file from device storage
  open_filex: ^4.4.0         # To safely open PDFs, Docs, etc. using native apps
  flutter_pdfview: ^1.3.2    # Optional: For inline PDF viewing


import 'dart:io';
import 'package:flutter/material.dart';
import 'package:file_picker/file_picker.dart';
import 'package:open_filex/open_filex.dart';

void main() {
  runApp(const FileViewerApp());
}

class FileViewerApp extends StatelessWidget {
  const FileViewerApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Universal File Viewer',
      theme: ThemeData(
        colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple),
        useMaterial3: true,
      ),
      home: const FileViewerHomePage(),
    );
  }
}

class FileViewerHomePage extends StatefulWidget {
  const FileViewerHomePage({super.key});

  @override
  State<FileViewerHomePage> createState() => _FileViewerHomePageState();
}

class _FileViewerHomePageState extends State<FileViewerHomePage> {
  File? _selectedFile;
  String? _fileExtension;
  String? _fileContent; // Used if it's a text file
  bool _isLoading = false;

  // Function to pick any file from Android/iOS storage
  Future<void> _pickFile() async {
    try {
      FilePickerResult? result = await FilePicker.platform.pickFiles(
        type: FileType.any, // Allows selecting any file format
      );

      if (result != null && result.files.single.path != null) {
        String filePath = result.files.single.path!;
        String extension = result.files.single.extension?.toLowerCase() ?? '';

        setState(() {
          _selectedFile = File(filePath);
          _fileExtension = extension;
          _fileContent = null;
          _isLoading = true;
        });

        // If it's a text-based file, read its content directly in-app
        if (['txt', 'json', 'md', 'csv', 'xml', 'html'].contains(extension)) {
          _fileContent = await _selectedFile!.readAsString();
        }

        setState(() {
          _isLoading = false;
        });
      }
    } catch (e) {
      setState(() {
        _isLoading = false;
      });
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('Error picking file: $e')),
      );
    }
  }

  // Function to handle opening files externally (PDFs, Word docs, etc.)
  Future<void> _openExternally() async {
    if (_selectedFile != null) {
      await OpenFilex.open(_selectedFile!.path);
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('Android & iOS File Viewer'),
        backgroundColor: Theme.of(context).colorScheme.inversePrimary,
      ),
      body: Center(
        child: Padding(
          padding: const EdgeInsets.all(16.0),
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              if (_isLoading)
                const CircularProgressIndicator()
              else if (_selectedFile == null)
                const Column(
                  children: [
                    Icon(Icons.folder_open, size: 80, color: Colors.grey),
                    SizedBox(height: 16),
                    Text(
                      'No file selected.\nTap the button below to browse files.',
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 16, color: Colors.grey),
                    ),
                  ],
                )
              else
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        'Selected: ${_selectedFile!.path.split('/').last}',
                        style: const TextStyle(
                            fontWeight: FontWeight.bold, fontSize: 16),
                      ),
                      const SizedBox(height: 12),
                      Expanded(
                        child: Container(
                          width: double.infinity,
                          decoration: BoxDecoration(
                            border: Border.all(color: Colors.grey.shade400),
                            borderRadius: BorderRadius.circular(8),
                          ),
                          child: _buildViewerContent(),
                        ),
                      ),
                    ],
                  ),
                ),
              const SizedBox(height: 20),
              ElevatedButton.icon(
                onPressed: _pickFile,
                icon: const Icon(Icons.add),
                label: const Text('Browse File'),
                style: ElevatedButton.styleFrom(
                  minimumSize: const Size.fromHeight(50),
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }

  // Renders appropriate UI based on file type
  Widget _buildViewerContent() {
    if (_fileExtension == null) return const Center(Text('Unknown file type'));

    // 1. Image Viewer
    if (['jpg', 'jpeg', 'png', 'gif', 'webp'].contains(_fileExtension)) {
      return Image.file(_selectedFile!, fit: BoxFit.contain);
    }

    // 2. Text / Code Viewer
    if (['txt', 'json', 'md', 'csv', 'xml', 'html'].contains(_fileExtension)) {
      return SingleChildScrollView(
        padding: const EdgeInsets.all(8.0),
        child: Text(_fileContent ?? 'Empty file'),
      );
    }

    // 3. Fallback for PDFs, Word Docs, Spreadsheets, etc.
    return Center(
      child: Column(
        mainAxisAlignment: MainAxisAlignment.center,
        children: [
          const Icon(Icons.insert_drive_file, size: 64, color: Colors.blue),
          const SizedBox(height: 12),
          Text('Format: .${_fileExtension!.toUpperCase()}'),
          const SizedBox(height: 12),
          ElevatedButton(
            onPressed: _openExternally,
            child: const Text('Open with External App'),
          ),
        ],
      ),
    );
  }
}



dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  open_filex: ^4.4.0
  crypto: ^3.0.5             # For calculating MD5 & SHA-256 file hashes
  path_provider: ^2.1.2      # For secure local caching


  import 'dart:io';
import 'dart:convert';
import 'package:flutter/foundation.dart';
import 'package:flutter/material.dart';
import 'package:file_picker/file_picker.dart';
import 'package:open_filex/open_filex.dart';
import 'package:crypto/crypto.dart';

void main() {
  runApp(const AdvancedFileViewerApp());
}

class AdvancedFileViewerApp extends StatelessWidget {
  const AdvancedFileViewerApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Advanced Universal File Viewer',
      theme: ThemeData(
        brightness: Brightness.dark,
        colorScheme: ColorScheme.fromSeed(
          seedColor: Colors.cyanAccent,
          brightness: Brightness.dark,
        ),
        useMaterial3: true,
      ),
      home: const ViewerDashboard(),
    );
  }
}

class FileMetadata {
  final String name;
  final String path;
  final int sizeBytes;
  final String extension;
  final String sha256Hash;
  final String previewContent;
  final List<String> hexChunks;

  FileMetadata({
    required this.name,
    required this.path,
    required this.sizeBytes,
    required this.extension,
    required this.sha256Hash,
    required this.previewContent,
    required this.hexChunks,
  });
}

class ViewerDashboard extends StatefulWidget {
  const ViewerDashboard({super.key});

  @override
  State<ViewerDashboard> createState() => _ViewerDashboardState();
}

class _ViewerDashboardState extends State<ViewerDashboard> {
  bool _isLoading = false;
  FileMetadata? _metadata;
  File? _activeFile;
  int _selectedTab = 0; // 0: Preview, 1: Metadata & Hashes, 2: Hex Inspector

  // Background computation payload isolate
  static Future<FileMetadata> _processFileInBackground(String filePath) async {
    final file = File(filePath);
    final bytes = await file.readAsBytes();
    final name = file.path.split('/').last;
    final extension = name.contains('.') ? name.split('.').last.toLowerCase() : '';
    
    // Compute cryptographic checksum
    final digest = sha256.convert(bytes);
    
    // Parse text or handle text view if applicable
    String content = '';
    if (['txt', 'json', 'md', 'csv', 'xml', 'html', 'log', 'dart', 'js', 'py'].contains(extension)) {
      try {
        content = utf8.decode(bytes);
      } catch (_) {
        content = 'Unable to decode text payload using UTF-8.';
      }
    }

    // Build Hex chunks (First 512 bytes for performance)
    List<String> hexChunks = [];
    final limit = bytes.length > 512 ? 512 : bytes.length;
    for (int i = 0; i < limit; i += 16) {
      final chunk = bytes.sublist(i, i + 16 > limit ? limit : i + 16);
      final hexString = chunk.map((b) => b.toRadixString(16).padLeft(2, '0')).join(' ');
      final asciiString = chunk.map((b) => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join();
      hexChunks.printIfDebug; // helper
      hexChunks.add('${i.toRadixString(16).padLeft(4, '0')}:  ${hexString.padRight(48)}  [$asciiString]');
    }

    return FileMetadata(
      name: name,
      path: filePath,
      sizeBytes: bytes.length,
      extension: extension,
      sha256Hash: digest.toString(),
      previewContent: content,
      hexChunks: hexChunks,
    );
  }

  Future<void> _pickAndAnalyzeFile() async {
    try {
      FilePickerResult? result = await FilePicker.platform.pickFiles(type: FileType.any);
      if (result != null && result.files.single.path != null) {
        setState(() {
          _isLoading = true;
          _activeFile = File(result.files.single.path!);
        });

        // Run intensive parsing isolate
        final metadata = await compute(_processFileInBackground, _activeFile!.path);

        setState(() {
          _metadata = metadata;
          _isLoading = false;
        });
      }
    } catch (e) {
      setState(() => _isLoading = false);
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('Parsing Exception: $e')),
      );
    }
  }

  String _formatBytes(int bytes) {
    if (bytes < 1024) return '$bytes B';
    if (bytes < 1048576) return '${(bytes / 1024).toStringAsFixed(2)} KB';
    return '${(bytes / 1048576).toStringAsFixed(2)} MB';
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('Advanced HUD File Inspector'),
        actions: [
          if (_activeFile != null)
            IconButton(
              icon: const Icon(Icons.open_in_new),
              tooltip: 'Open Externally',
              onPressed: () => OpenFilex.open(_activeFile!.path),
            ),
        ],
      ),
      body: Column(
        children: [
          Expanded(
            child: _isLoading
                ? const Center(child: CircularProgressIndicator(color: Colors.cyanAccent))
                : _metadata == null
                    ? _buildEmptyState()
                    : _buildInspectorView(),
          ),
          if (_metadata != null)
            BottomNavigationBar(
              currentIndex: _selectedTab,
              onTap: (idx) => setState(() => _selectedTab = idx),
              selectedItemColor: Colors.cyanAccent,
              items: const [
                BottomNavigationBarItem(icon: Icon(Icons.visibility), label: 'Preview'),
                BottomNavigationBarItem(icon: Icon(Icons.analytics), label: 'Metadata & Hash'),
                BottomNavigationBarItem(icon: Icon(Icons.code), label: 'Hex Inspector'),
              ],
            ),
        ],
      ),
      floatingActionButton: FloatingActionButton.extended(
        onPressed: _pickAndAnalyzeFile,
        icon: const Icon(Icons.folder_open),
        label: const Text('Select File'),
      ),
    );
  }

  Widget _buildEmptyState() {
    return const Center(
      child: Column(
        mainAxisAlignment: MainAxisAlignment.center,
        children: [
          Icon(Icons.security, size: 64, color: Colors.cyan),
          SizedBox(height: 16),
          Text('No file loaded. Tap "Select File" to begin inspection.',
              style: TextStyle(color: Colors.white54)),
        ],
      ),
    );
  }

  Widget _buildInspectorView() {
    switch (_selectedTab) {
      case 0:
        return _renderVisualPreview();
      case 1:
        return _renderMetadataTab();
      case 2:
        return _renderHexTab();
      default:
        return Container();
    }
  }

  Widget _renderVisualPreview() {
    if (['jpg', 'jpeg', 'png', 'gif', 'webp'].contains(_metadata!.extension)) {
      return InteractiveViewer(
        child: Center(child: Image.file(_activeFile!)),
      );
    }
    if (_metadata!.previewContent.isNotEmpty) {
      return Container(
        padding: const EdgeInsets.all(12),
        width: double.infinity,
        child: SingleChildScrollView(
          child: SelectableText(
            _metadata!.previewContent,
            style: const TextStyle(fontFamily: 'monospace', fontSize: 13),
          ),
        ),
      );
    }
    return Center(
      child: Column(
        mainAxisAlignment: MainAxisAlignment.center,
        children: [
          const Icon(Icons.insert_drive_file, size: 64, color: Colors.cyanAccent),
          const SizedBox(height: 12),
          Text('Binary File Format: .${_metadata!.extension.toUpperCase()}'),
          const SizedBox(height: 8),
          const Text('Switch to Hex Inspector or open with external application.',
              style: TextStyle(color: Colors.white60)),
        ],
      ),
    );
  }

  Widget _renderMetadataTab() {
    return ListView(
      padding: const EdgeInsets.all(16),
      children: [
        ListTile(
          title: const Text('File Name'),
          subtitle: Text(_metadata!.name, style: const TextStyle(color: Colors.cyanAccent)),
        ),
        ListTile(
          title: const Text('File Size'),
          subtitle: Text(_formatBytes(_metadata!.sizeBytes)),
        ),
        ListTile(
          title: const Text('Extension Type'),
          subtitle: Text(_metadata!.extension.toUpperCase()),
        ),
        ListTile(
          title: const Text('SHA-256 Checksum'),
          subtitle: SelectableText(_metadata!.sha256Hash,
              style: const TextStyle(fontFamily: 'monospace', fontSize: 11)),
        ),
        ListTile(
          title: const Text('Absolute Storage Path'),
          subtitle: SelectableText(_metadata!.path,
              style: const TextStyle(fontFamily: 'monospace', fontSize: 11)),
        ),
      ],
    );
  }

  Widget _renderHexTab() {
    return Padding(
      padding: const EdgeInsets.all(8.0),
      child: ListView.builder(
        itemCount: _metadata!.hexChunks.length,
        itemBuilder: (context, index) {
          return Text(
            _metadata!.hexChunks[index],
            style: const TextStyle(fontFamily: 'monospace', fontSize: 12, color: Colors.greenAccent),
          );
        },
      ),
    );
  }
}

extension on List<String> {
  void get printIfDebug => null;
}
