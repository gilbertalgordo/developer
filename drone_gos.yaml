#!/usr/bin/env python3
"""
Project: AI Drone GPS Icon Generator
Author: https://g.dev/gilbert_algordo
Description: Programmatically generates high-res tactical PNG app/HUD icons.
"""

from PIL import Image, ImageDraw, ImageFont
import math

def generate_drone_icon(size=512, output_filename="drone_ai_gps_icon.png"):
    # Create blank image with dark tactical green background
    image = Image.new("RGBA", (size, size), (11, 19, 14, 255))
    draw = ImageDraw.Draw(image)

    cx, cy = size // 2, size // 2

    # Outer radar ring
    draw.ellipse([cx - 180, cy - 180, cx + 180, cy + 180], outline=(0, 255, 100, 100), width=3)
    draw.ellipse([cx - 130, cy - 130, cx + 130, cy + 130], outline=(255, 255, 0, 150), width=2)

    # GPS Crosshair ticks
    draw.line([(cx, 90), (cx, 140)], fill=(255, 255, 0, 255), width=4)
    draw.line([(cx, 372), (cx, 422)], fill=(255, 255, 0, 255), width=4)
    draw.line([(90, cy), (140, cy)], fill=(255, 255, 0, 255), width=4)
    draw.line([(372, cy), (422, cy)], fill=(255, 255, 0, 255), width=4)

    # AI Neural nodes & connections
    nodes = [(170, 170), (342, 170), (170, 342), (342, 342)]
    for node in nodes:
        draw.line([node, (cx, cy)], fill=(0, 255, 200, 180), width=2)
        draw.ellipse([node[0]-10, node[1]-10, node[0]+10, node[1]+10], fill=(0, 255, 200, 255))

    # Quadcopter Arms
    draw.line([(cx-55, cy-55), (cx+55, cy+55)], fill=(0, 255, 100, 255), width=6)
    draw.line([(cx-55, cy+55), (cx+55, cy-55)], fill=(0, 255, 100, 255), width=6)

    # Rotor circles
    for rx, ry in [(cx-55, cy-55), (cx+55, cy-55), (cx-55, cy+55), (cx+55, cy+55)]:
        draw.ellipse([rx-16, ry-16, rx+16, ry+16], outline=(0, 255, 200, 255), width=3)

    # Central Core
    draw.rectangle([cx-16, cy-16, cx+16, cy+16], fill=(0, 255, 100, 255))
    draw.ellipse([cx-6, cy-6, cx+6, cy+6], fill=(11, 19, 14, 255))

    # Save output
    image.save(output_filename, "PNG")
    print(f"[SUCCESS] Icon successfully generated and saved as '{output_filename}'.")

if __name__ == "__main__":
    generate_drone_icon()
