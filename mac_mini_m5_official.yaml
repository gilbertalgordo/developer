<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac Mini M5 - Carbon Black Edition Architecture & Source Code</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030305;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 25px;
    }
    h1 {
      font-size: 1.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #86868b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .author-tag {
      font-size: 0.85rem;
      color: #ff3b30;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .author-tag a {
      color: #00f0ff;
      text-decoration: none;
    }
    .download-bar {
      margin-top: 10px;
    }
    .btn-download {
      background: linear-gradient(135deg, #ff0055 0%, #7a00ff 50%, #00f0ff 100%);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(0, 240, 255, 0.6);
    }
    #viewport-container {
      width: 100%;
      max-width: 900px;
      height: 500px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <header>
    <h1>Mac Mini M5 System Architecture</h1>
    <div class="author-tag">
      Designed by <a href="https://g.dev/gilbert_algordo" target="_blank" rel="noopener">gilbert_algordo</a>
    </div>
    <div class="download-bar">
      <button class="btn-download" id="downloadZipBtn">📦 Download Complete Package (.ZIP)</button>
    </div>
  </header>

  <div id="viewport-container"></div>

  <script>
    // --- 1. Three.js Scene Setup ---
    const container = document.getElementById('viewport-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030305, 0.12);

    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(3.0, 2.0, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- 2. Procedural Textures & Shaders ---
    function createCarbonTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a0a0c';
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = '#1a1a20';
      for (let i = 0; i < 128; i += 16) {
        for (let j = 0; j < 128; j += 16) {
          if ((i / 16 + j / 16) % 2 === 0) {
            ctx.fillRect(i, j, 8, 8);
            ctx.fillRect(i + 8, j + 8, 8, 8);
          }
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    const carbonTexture = createCarbonTexture();
    carbonTexture.wrapS = THREE.RepeatWrapping;
    carbonTexture.wrapT = THREE.RepeatWrapping;
    carbonTexture.repeat.set(6, 6);

    const rainbowShaderMaterial = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec3 vWorldPosition;
        vec3 rainbow(float t) {
          return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67)));
        }
        void main() {
          float grad = vWorldPosition.x * 0.8 + vWorldPosition.z * 0.8 + uTime * 0.6;
          gl_FragColor = vec4(rainbow(grad) * 2.2, 1.0);
        }
      `
    });

    const holoShaderMaterial = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          vUv = uv;
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          float scanline = sin(vPos.y * 60.0 - uTime * 8.0) * 0.5 + 0.5;
          float alpha = (1.0 - vUv.y) * (scanline * 0.4 + 0.3);
          gl_FragColor = vec4(vec3(0.0, 0.8, 1.0) * 1.8, alpha * 0.7);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });

    // --- 3. Hardware Assembly Construction ---
    const macMini = new THREE.Group();
    scene.add(macMini);

    // Slim Chassis
    const bodyGeom = new THREE.BoxGeometry(2.0, 0.28, 2.0);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0e, map: carbonTexture, roughness: 0.3, metalness: 0.85 });
    const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
    macMini.add(bodyMesh);

    // LED Top Border Strip
    const borderGeom = new THREE.BoxGeometry(2.02, 0.012, 2.02);
    const borderMesh = new THREE.Mesh(borderGeom, rainbowShaderMaterial);
    borderMesh.position.y = 0.136;
    macMini.add(borderMesh);

    // Apple Logo
    const logoShape = new THREE.Shape();
    logoShape.absarc(0, 0, 0.16, 0, Math.PI * 2);
    const logoMesh = new THREE.Mesh(new THREE.ShapeGeometry(logoShape), rainbowShaderMaterial);
    logoMesh.rotation.x = -Math.PI / 2;
    logoMesh.position.set(0, 0.142, 0);
    macMini.add(logoMesh);

    // Red PCB & M5 Die
    const pcbGroup = new THREE.Group();
    pcbGroup.position.y = -0.08;
    const pcbMesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.02, 1.8), new THREE.MeshStandardMaterial({ color: 0x8a0303, roughness: 0.3 }));
    pcbGroup.add(pcbMesh);

    const m5Chip = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.5), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.9 }));
    m5Chip.position.set(0, 0.02, 0);
    pcbGroup.add(m5Chip);

    const bleChip = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.025, 0.12), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 }));
    bleChip.position.set(0.5, 0.02, -0.4);
    pcbGroup.add(bleChip);
    macMini.add(pcbGroup);

    // Holographic Cone
    const holoCone = new THREE.Mesh(new THREE.ConeGeometry(1.0, 1.6, 32, 1, true), holoShaderMaterial);
    holoCone.position.set(0, 0.95, 0);
    macMini.add(holoCone);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(4, 6, 4);
    scene.add(dirLight);

    const redGlow = new THREE.PointLight(0xff0033, 2.0, 3.0);
    redGlow.position.set(0, -0.4, 0);
    scene.add(redGlow);

    // Render Loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      rainbowShaderMaterial.uniforms.uTime.value = time;
      holoShaderMaterial.uniforms.uTime.value = time;
      macMini.rotation.y = Math.sin(time * 0.25) * 0.2;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- 4. Dynamic ZIP File Generator ---
    document.getElementById('downloadZipBtn').addEventListener('click', () => {
      const zip = new JSZip();

      // README file
      zip.file("README.md", `# Mac Mini M5 Concept Source Package
Created by: gilbert_algordo (https://g.dev/gilbert_algordo)

## Included Files
- \`index.html\`: Complete WebGL/3D viewer application.
- \`hardware_spec.json\`: Hardware architecture configuration.
`);

      // Hardware Configuration JSON
      zip.file("hardware_spec.json", JSON.stringify({
        device: "Mac Mini M5 Pro",
        chassis: "Carbon Black Anodized Composite",
        motherboard: "Multi-layer Red PCB Architecture",
        silicon: "Apple M5 Ultra Neural Engine",
        wireless: "BLE Mesh Low-Latency Microchip",
        waterproofing: "Invisible IP68 Nano-Hydrosield",
        io_ports: {
          thunderbolt_5: 6,
          hdmi_2_1: 2
        },
        display_system: "Top-Border RGB LED + Holographic Array"
      }, null, 2));

      // Clone HTML source into index.html
      zip.file("index.html", `<!DOCTYPE html>\n${document.documentElement.outerHTML}`);

      // Generate & Trigger Download
      zip.generateAsync({ type: "blob" }).then((content) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "Mac_Mini_M5_Carbon_Package.zip";
        a.click();
        URL.revokeObjectURL(a.href);
      });
    });
  </script>
</body>
</html>


