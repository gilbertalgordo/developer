<body>

  <header>
    <h1>Mac Mini M5 - Advanced Architecture Viewer</h1>
    <div class="author-tag">
      Designed & Programmed by <a href="https://g.dev/gilbert_algordo" target="_blank" rel="noopener">gilbert_algordo</a>
    </div>
    <div class="download-bar">
      <button class="btn-download" id="downloadZipBtn">📦 Download Complete Package (.ZIP)</button>
