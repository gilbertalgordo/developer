<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac Mini M5 - Image Icon System & Vector Asset Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030305;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      text-align: center;
      max-width: 900px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #86868b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .author-tag {
      font-size: 0.9rem;
      color: #ff3b30;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }
    .author-tag a {
      color: #00f0ff;
      text-decoration: none;
    }
    .download-bar {
      margin-top: 10px;
      margin-bottom: 25px;
    }
    .btn-download {
      background: linear-gradient(135deg, #ff0055 0%, #7a00ff 50%, #00f0ff 100%);
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(0, 240, 255, 0.6);
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 960px;
    }
    .icon-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.3s ease;
    }
    .icon-card:hover {
      border-color: rgba(0, 240, 255, 0.5);
    }
    .icon-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #d1d1d6;
    }
    .svg-wrapper {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08080c;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px;
    }
    .svg-wrapper svg {
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <header>
    <h1>Mac Mini M5 System Icon Engine</h1>
    <div class="author-tag">
      Designed & Vectorized by <a href="https://g.dev/gilbert_algordo" target="_blank" rel="noopener">gilbert_algordo</a>
    </div>
    <div class="download-bar">
      <button class="btn-download" id="downloadZipBtn">📦 Download Icon Suite (.ZIP)</button>
    </div>
  </header>

  <div class="grid-container">

    <!-- Icon 1: Hardware Chassis Architecture -->
    <div class="icon-card">
      <div class="icon-title">Carbon Chassis & Rainbow LED</div>
      <div class="svg-wrapper" id="icon-chassis">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff0055" />
              <stop offset="33%" stop-color="#7a00ff" />
              <stop offset="66%" stop-color="#00f0ff" />
              <stop offset="100%" stop-color="#00ff66" />
            </linearGradient>
            <linearGradient id="carbonBody" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1c1c22" />
              <stop offset="100%" stop-color="#08080a" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>
          <rect x="20" y="50" width="160" height="100" rx="16" fill="url(#carbonBody)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
          <rect x="18" y="48" width="164" height="104" rx="18" fill="none" stroke="url(#rainbowBorder)" stroke-width="3" filter="url(#glow)"/>
          <!-- Top Border LED Line -->
          <line x1="25" y1="56" x2="175" y2="56" stroke="url(#rainbowBorder)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
          <!-- Glowing Apple Emblem -->
          <path d="M100 85 c-4 -5 -10 -5 -14 0 c-5 6 -3 15 2 20 c4 4 10 4 14 -1 c4 5 10 5 14 1 c5 -5 7 -14 2 -20 c-4 -5 -10 -5 -14 0 Z M102 82 c2 -3 1 -6 -1 -8 c-3 0 -6 2 -7 5 c-1 3 0 6 2 8 c3 0 5 -2 6 -5 Z" fill="url(#rainbowBorder)" filter="url(#glow)"/>
        </svg>
      </div>
    </div>

    <!-- Icon 2: Matte Red PCB & M5 Silicon -->
    <div class="icon-card">
      <div class="icon-title">Red PCB & Apple M5 Processor</div>
      <div class="svg-wrapper" id="icon-motherboard">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="redPcb" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#b30000" />
              <stop offset="100%" stop-color="#660000" />
            </linearGradient>
            <linearGradient id="goldTrace" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffd700" />
              <stop offset="100%" stop-color="#ff8c00" />
            </linearGradient>
          </defs>
          <rect x="25" y="25" width="150" height="150" rx="12" fill="url(#redPcb)" stroke="#ff3333" stroke-width="1.5"/>
          <!-- PCB Circuit Traces -->
          <path d="M 40 40 L 70 40 L 85 55 L 85 85 M 160 40 L 130 40 L 115 55 L 115 85 M 40 160 L 70 160 L 85 145 L 85 115 M 160 160 L 130 160 L 115 145 L 115 115" fill="none" stroke="url(#goldTrace)" stroke-width="2" stroke-linecap="round"/>
          <!-- M5 Chip -->
          <rect x="75" y="75" width="50" height="50" rx="6" fill="#0a0a0c" stroke="#333" stroke-width="2"/>
          <text x="100" y="105" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">M5</text>
          <!-- BLE Microchip -->
          <rect x="135" y="125" width="22" height="16" rx="2" fill="#111" stroke="#00f0ff" stroke-width="1"/>
          <text x="146" y="136" font-family="monospace" font-size="7" fill="#00f0ff" text-anchor="middle">BLE</text>
        </svg>
      </div>
    </div>

    <!-- Icon 3: Expanded I/O Ports & Invisible Waterproofing -->
    <div class="icon-card">
      <div class="icon-title">Extra USB/HDMI & IP68 Hydro-Seal</div>
      <div class="svg-wrapper" id="icon-ports">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="waterShield" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#0066ff" stop-opacity="0.05"/>
            </linearGradient>
          </defs>
          <rect x="20" y="70" width="160" height="60" rx="10" fill="#121216" stroke="#222" stroke-width="2"/>
          <!-- USB-C Ports -->
          <rect x="35" y="92" width="18" height="16" rx="8" fill="#000" stroke="#00f0ff" stroke-width="1.5"/>
          <rect x="60" y="92" width="18" height="16" rx="8" fill="#000" stroke="#00f0ff" stroke-width="1.5"/>
          <rect x="85" y="92" width="18" height="16" rx="8" fill="#000" stroke="#00f0ff" stroke-width="1.5"/>
          <!-- HDMI Ports -->
          <rect x="115" y="90" width="22" height="20" rx="3" fill="#000" stroke="#ff0055" stroke-width="1.5"/>
          <rect x="145" y="90" width="22" height="20" rx="3" fill="#000" stroke="#ff0055" stroke-width="1.5"/>
          <!-- Waterproof Shield Overlay -->
          <path d="M 100 35 L 155 55 L 155 115 C 155 145 100 165 100 165 C 100 165 45 145 45 115 L 45 55 Z" fill="url(#waterShield)" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 2"/>
        </svg>
      </div>
    </div>

    <!-- Icon 4: Holographic Matrix Field -->
    <div class="icon-card">
      <div class="icon-title">3D Holographic Emitter</div>
      <div class="svg-wrapper" id="icon-holo">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="holoBeam" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <ellipse cx="100" cy="155" rx="55" ry="14" fill="#101015" stroke="#00f0ff" stroke-width="2"/>
          <!-- Cone Projection -->
          <polygon points="45,155 155,155 125,45 75,45" fill="url(#holoBeam)"/>
          <!-- Holographic Rings -->
          <ellipse cx="100" cy="115" rx="35" ry="8" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3 3"/>
          <ellipse cx="100" cy="80" rx="22" ry="5" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 2"/>
          <!-- Holographic Floating Cube Wireframe -->
          <polygon points="100,30 115,38 100,46 85,38" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
          <polygon points="100,46 115,38 115,54 100,62" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
          <polygon points="100,46 85,38 85,54 100,62" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
        </svg>
      </div>
    </div>

  </div>

  <script>
    document.getElementById('downloadZipBtn').addEventListener('click', () => {
      const zip = new JSZip();

      // README file
      zip.file("README.md", `# Mac Mini M5 Vector Icon Suite
Created by: gilbert_algordo (https://g.dev/gilbert_algordo)

## Icon Manifest
- \`icon-chassis.svg\`: Carbon black chassis featuring top border LED and glowing Apple logo.
- \`icon-motherboard.svg\`: Matte red motherboard with Apple M5 silicon die and BLE chip.
- \`icon-ports.svg\`: Extended USB-C, USB-A, HDMI port array with IP68 waterproof shield overlay.
- \`icon-holo.svg\`: 3D holographic projection field emitter.
- \`hardware_spec.json\`: Hardware architecture configuration.
`);

      // Extract SVGs from page DOM
      const chassisSvg = document.getElementById('icon-chassis').innerHTML.trim();
      const motherboardSvg = document.getElementById('icon-motherboard').innerHTML.trim();
      const portsSvg = document.getElementById('icon-ports').innerHTML.trim();
      const holoSvg = document.getElementById('icon-holo').innerHTML.trim();

      zip.file("icon-chassis.svg", chassisSvg);
      zip.file("icon-motherboard.svg", motherboardSvg);
      zip.file("icon-ports.svg", portsSvg);
      zip.file("icon-holo.svg", holoSvg);

      // Hardware Configuration Metadata
      zip.file("hardware_spec.json", JSON.stringify({
        architecture: "Mac Mini M5 System Icon Package",
        designer: "gilbert_algordo",
        profile: "https://g.dev/gilbert_algordo",
        vector_specs: {
          chassis: "Carbon Fiber Composite + RGB Perimeter LED",
          silicon: "Apple M5 Core Die + Integrated BLE Mesh Microchip",
          motherboard: "Multi-Layer Matte Red PCB",
          io_array: "Extra High-Speed USB & HDMI Ports",
          protection: "Invisible IP68 Hydro-Shield Nano-Coating",
          display: "360-Degree Holographic Field Projection"
        }
      }, null, 2));

      // Generate & Download ZIP
      zip.generateAsync({ type: "blob" }).then((content) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "Mac_Mini_M5_Icon_Suite.zip";
        a.click();
        URL.revokeObjectURL(a.href);
      });
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac Mini M5 Concept Package Generator</title>
  <style>
    body {
      background: #08080a;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #121216;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    h2 {
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00f0ff, #ff0055);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #a1a1a6;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #ff0055 0%, #7a00ff 50%, #00f0ff 100%);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>Mac Mini M5 Package</h2>
    <p>Carbon Black Edition • Red Motherboard • M5 Processor • BLE Microchip • Waterproof IP68</p>
    <button id="dlBtn">📦 Download Package (.ZIP)</button>
  </div>

  <script>
    document.getElementById('dlBtn').addEventListener('click', () => {
      const zip = new JSZip();

      // Project Readme
      zip.file("README.md", `# Mac Mini M5 Architecture Spec\n\n- Chassis: Carbon Black Anodized Shell\n- PCB: Matte Red Thermal Motherboard\n- Silicon: Apple M5 + BLE Microchip\n- Sealing: IP68 Hydrophobic Coating\n- Display: RGB LED & Holographic Array\n\nDesigned by gilbert_algordo`);

      // Hardware Specs JSON
      zip.file("spec.json", JSON.stringify({
        model: "Mac Mini M5 Carbon",
        cpu: "Apple M5 Silicon",
        connectivity: "BLE Microchip + Ultra-Wideband",
        ports: { usb_c: 6, usb_a: 4, hdmi_2_1: 2 },
        waterproofing: "Invisible Nano-Hydrophobic Coating",
        lighting: "Top Border RGB LED + Holographic Array"
      }, null, 2));

      zip.generateAsync({ type: "blob" }).then(content => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "Mac_Mini_M5_Carbon_Edition.zip";
        a.click();
        URL.revokeObjectURL(a.href);
      });
    });
  </script>
</body>
</html>
