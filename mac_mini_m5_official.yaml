  <div id="viewport-container">
    <div class="hud-overlay">
      <div>SYS: MAC MINI M5 PRO</div>
      <div>SEAL: INVISIBLE IP68 HYDROSHEILD</div>
      <div>HOLO ARRAY: ACTIVE</div>
      <div>BLE MESH: ONLINE</div>
    </div>
  </div>

  <script>
    // --- 1. Three.js Scene Setup ---
    const container = document.getElementById('viewport-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030305, 0.1);

    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(2.8, 2.2, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- 2. Shaders & Textures ---
    function createCarbonTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#08080a';
      ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = '#181820';
      for (let i = 0; i < 256; i += 16) {
        for (let j = 0; j < 256; j += 16) {
          if ((i / 16 + j / 16) % 2 === 0) {
            ctx.fillRect(i, j, 8, 8);
            ctx.fillRect(i + 8, j + 8, 8, 8);
          }
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    const carbonTexture = createCarbonTexture();
    carbonTexture.wrapS = THREE.RepeatWrapping;
    carbonTexture.wrapT = THREE.RepeatWrapping;
    carbonTexture.repeat.set(8, 8);

    const rainbowMaterial = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec3 vWorldPosition;
        vec3 rainbow(float t) {
          return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67)));
        }
        void main() {
          float grad = vWorldPosition.x * 0.8 + vWorldPosition.z * 0.8 + uTime * 0.7;
          gl_FragColor = vec4(rainbow(grad) * 2.5, 1.0);
        }
      `
    });

    const holoMaterial = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          vUv = uv;
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          float scanline = sin(vPos.y * 80.0 - uTime * 10.0) * 0.5 + 0.5;
          float ring = sin(length(vPos.xz) * 20.0 - uTime * 5.0) * 0.5 + 0.5;
          float alpha = (1.0 - vUv.y) * (scanline * 0.5 + ring * 0.3 + 0.2);
          gl_FragColor = vec4(vec3(0.0, 0.85, 1.0) * 2.0, alpha * 0.7);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });

    // --- 3. Hardware Construction ---
    const macMini = new THREE.Group();
    scene.add(macMini);

    // Slim Chassis Body
    const bodyGeom = new THREE.BoxGeometry(2.0, 0.22, 2.0);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x08080a, map: carbonTexture, roughness: 0.25, metalness: 0.9 });
    const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
    macMini.add(bodyMesh);

    // Glowing RGB Border
    const borderGeom = new THREE.BoxGeometry(2.02, 0.015, 2.02);
    const borderMesh = new THREE.Mesh(borderGeom, rainbowMaterial);
    borderMesh.position.y = 0.11;
    macMini.add(borderMesh);

    // Top Glowing Apple Emblem
    const logoShape = new THREE.Shape();
    logoShape.absarc(0, 0, 0.18, 0, Math.PI * 2);
