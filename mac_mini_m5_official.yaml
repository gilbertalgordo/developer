    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      rainbowMaterial.uniforms.uTime.value = time;
      holoMaterial.uniforms.uTime.value = time;
      macMini.rotation.y = Math.sin(time * 0.3) * 0.25;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- 4. Dynamic ZIP File Generator ---
    document.getElementById('downloadZipBtn').addEventListener('click', () => {
      const zip = new JSZip();

      // README file
      zip.file("README.md", `# Mac Mini M5 Carbon Black Edition Architecture
Created by: gilbert_algordo (https://g.dev/gilbert_algordo)

## Architectural Blueprint
- **Chassis:** Anodized Carbon Black Composite
- **Processor:** Apple M5 Next-Gen Silicon Matrix
- **Motherboard:** High-Density Matte-Red PCB Assembly
- **Wireless:** Multi-Node BLE Low-Latency Microchip
- **Sealing:** Invisible Hydrophobic IP68 Waterproof Nano-Coating
- **IO Array:** Multi-Port High-Speed USB-C / USB-A / HDMI 2.1
- **Visual Display:** Top Border Glowing Rainbow LED Array + Holographic Field Emitter

## Files Included
- \`index.html\`: Complete 3D WebGL Visualization Suite
- \`hardware_spec.json\`: Extended System Technical Specifications
`);

      // Hardware Configuration JSON
      zip.file("hardware_spec.json", JSON.stringify({
        architecture: "Mac Mini M5 Pro Carbon Edition",
        author: "gilbert_algordo",
        profile: "https://g.dev/gilbert_algordo",
        hardware: {
          chassis_material: "Carbon Black Fiber Composite",
          motherboard_type: "Matte Red High-Thermal Multi-Layer PCB",
          cpu: "Apple M5 Ultra Silicon",
          wireless: "BLE Mesh Module v5.4",
          waterproof_rating: "Invisible Hydrophobic Nano Seal (IP68)",
          ports: {
            usb_c_thunderbolt_5: 6,
            usb_a_high_speed: 4,
            hdmi_2_1: 2
          },
          lighting: "Top Border Addressable RGB LED + Dual-Layer Apple Logo",
          display_interface: "360 Degree Holographic Projection Emitter"
        }
      }, null, 2));

      // Embed HTML source into index.html inside the ZIP
      zip.file("index.html", `<!DOCTYPE html>\n${document.documentElement.outerHTML}`);

      // Generate & Download ZIP
      zip.generateAsync({ type: "blob" }).then((content) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "Mac_Mini_M5_Carbon_Architecture.zip";
        a.click();
        URL.revokeObjectURL(a.href);
      });
