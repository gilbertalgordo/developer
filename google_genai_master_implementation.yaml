import React, { useRef, useEffect } from 'react';

interface HUDCanvasProps {
  size?: number;
  primaryColor?: string;   // Google Blue
  secondaryColor?: string; // Gemini Purple
  accentColor?: string;    // HUD Green/Gold
}

export const GoogleAIMasterHUDCanvas: React.FC<HUDCanvasProps> = ({
  size = 400,
  primaryColor = '#4285F4',
  secondaryColor = '#A142F4',
  accentColor = '#34A853',
}) => {
  const canvasRef = useRef<HTMLCanvasElement | null>(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let animationFrameId: number;
    let angle = 0;
    let pulse = 0;

    // Convert size for high DPI displays
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.scale(dpr, dpr);

    const center = size / 2;

    const render = () => {
      angle += 0.015;
      pulse += 0.03;
      const glowIntensity = Math.sin(pulse) * 8 + 16; // Pulsing shadowBlur

      // 1. Clear background
      ctx.clearRect(0, 0, size, size);

      // 2. Draw Outer HUD Rotating Arc
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(angle);
      
      ctx.shadowBlur = glowIntensity;
      ctx.shadowColor = primaryColor;
      ctx.strokeStyle = primaryColor;
      ctx.lineWidth = 3;

      // Segmented outer ring
      ctx.beginPath();
      ctx.arc(0, 0, center - 20, 0, Math.PI * 0.7);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, center - 20, Math.PI, Math.PI * 1.7);
      ctx.stroke();
      ctx.restore();

      // 3. Draw Counter-Rotating Segmented Tech Ring
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(-angle * 1.5);

      ctx.shadowBlur = glowIntensity * 0.75;
      ctx.shadowColor = accentColor;
      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 12]);

      ctx.beginPath();
      ctx.arc(0, 0, center - 35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 4. Draw Google Developer Brackets (< >) with Glow
      ctx.save();
      ctx.shadowBlur = glowIntensity * 1.2;
      ctx.shadowColor = primaryColor;
      ctx.strokeStyle = primaryColor;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Left bracket '<'
      ctx.beginPath();
      ctx.moveTo(center - 70, center - 40);
      ctx.lineTo(center - 100, center);
      ctx.lineTo(center - 70, center + 40);
      ctx.stroke();

      // Right bracket '>'
      ctx.shadowColor = accentColor;
      ctx.strokeStyle = accentColor;
      ctx.beginPath();
      ctx.moveTo(center + 70, center - 40);
      ctx.lineTo(center + 100, center);
      ctx.lineTo(center + 70, center + 40);
      ctx.stroke();
      ctx.restore();

      // 5. Central Gemini Sparkle Star (Vector Path Scale Pulsing)
      ctx.save();
      ctx.translate(center, center);
      const scale = 1 + Math.sin(pulse) * 0.08;
      ctx.scale(scale, scale);

      ctx.shadowBlur = glowIntensity * 1.5;
      ctx.shadowColor = secondaryColor;

      // Create Radial Gradient Fill for Gemini Sparkle
      const gradient = ctx.createRadialGradient(0, 0, 5, 0, 0, 50);
      gradient.addColorStop(0, '#8AB4F8');
      gradient.addColorStop(0.5, secondaryColor);
      gradient.addColorStop(1, '#E91E63');
      ctx.fillStyle = gradient;

      // 4-point Gemini star path formula
      ctx.beginPath();
      const rOuter = 45;
      const rInner = 10;
      for (let i = 0; i < 8; i++) {
        const r = i % 2 === 0 ? rOuter : rInner;
        const a = (i * Math.PI) / 4;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 6. HUD Center Crosshair Ring
      ctx.save();
      ctx.translate(center, center);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1;
      ctx.shadowBlur = 4;
      ctx.shadowColor = '#FFFFFF';

      ctx.beginPath();
      ctx.arc(0, 0, 60, 0, Math.PI * 2);
      ctx.stroke();

      // Center crosshair tick marks
      ctx.beginPath();
      ctx.moveTo(-68, 0); ctx.lineTo(-52, 0);
      ctx.moveTo(52, 0);  ctx.lineTo(68, 0);
      ctx.moveTo(0, -68); ctx.lineTo(0, -52);
      ctx.moveTo(0, 52);  ctx.lineTo(0, 68);
      ctx.stroke();
      ctx.restore();

      // Next frame loop
      animationFrameId = requestAnimationFrame(render);
    };

    render();

    return () => {
      cancelAnimationFrame(animationFrameId);
    };
  }, [size, primaryColor, secondaryColor, accentColor]);

  return (
    <div style={{ display: 'inline-block', background: '#0D1117', padding: '16px', borderRadius: '24px' }}>
      <canvas
        ref={canvasRef}
        style={{
          width: `${size}px`,
          height: `${size}px`,
          display: 'block',
        }}
      />
    </div>
  );
};



import React, { useRef, useState, useEffect, useCallback } from 'react';

export const InteractiveHud = () => {
  const containerRef = useRef(null);
  const canvasRef = useRef(null);
  
  // Track continuous target and animated transform values
  const [transform, setTransform] = useState({ rotateX: 0, rotateY: 0, scale: 1 });
  const animFrameId = useRef(null);
  const targetTransform = useRef({ rotateX: 0, rotateY: 0, scale: 1 });

  // Smooth interpolation (LERP) loop for fluid motion
  useEffect(() => {
    let currentX = 0;
    let currentY = 0;
    let currentScale = 1;

    const animate = () => {
      // Linear interpolation factor (0.1 = smooth easing)
      currentX += (targetTransform.current.rotateX - currentX) * 0.1;
      currentY += (targetTransform.current.rotateY - currentY) * 0.1;
      currentScale += (targetTransform.current.scale - currentScale) * 0.1;

      setTransform({
        rotateX: currentX,
        rotateY: currentY,
        scale: currentScale
      });

      animFrameId.current = requestAnimationFrame(animate);
    };

    animFrameId.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(animFrameId.current);
  }, []);

  // Mouse Move Event Handler
  const handleMouseMove = useCallback((e) => {
    if (!containerRef.current) return;

    const rect = containerRef.current.getBoundingClientRect();
    
    // Calculate cursor position relative to center (-0.5 to 0.5)
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    const mouseX = (e.clientX - centerX) / (rect.width / 2);
    const mouseY = (e.clientY - centerY) / (rect.height / 2);

    // Max rotation angles (in degrees)
    const maxTiltX = 15; // Vertical tilt angle
    const maxTiltY = 15; // Horizontal tilt angle

    // Invert mouseY for natural pitch tilt
    targetTransform.current = {
      rotateX: -mouseY * maxTiltX,
      rotateY: mouseX * maxTiltY,
      scale: 1.03 // Slight zoom effect on hover
    };
  }, []);

  // Mouse Leave Handler - Reset to rest position
  const handleMouseLeave = useCallback(() => {
    targetTransform.current = { rotateX: 0, rotateY: 0, scale: 1 };
  }, []);

  return (
    <div 
      className="hud-viewport"
      style={{
        perspective: '1000px', // Set visual depth threshold
        width: '100%',
        height: '100vh',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        overflow: 'hidden',
        backgroundColor: '#030712'
      }}
      onMouseMove={handleMouseMove}
      onMouseLeave={handleMouseLeave}
    >
      <div
        ref={containerRef}
        className="hud-card-wrapper"
        style={{
          transformStyle: 'preserve-3d',
          transform: `rotateX(${transform.rotateX.toFixed(2)}deg) rotateY(${transform.rotateY.toFixed(2)}deg) scale(${transform.scale.toFixed(3)})`,
          willChange: 'transform',
          transition: 'box-shadow 0.3s ease',
          borderRadius: '16px',
          boxShadow: `${-transform.rotateY * 2}px ${transform.rotateX * 2}px 30px rgba(0, 240, 255, 0.15)`
        }}
      >
        <canvas
          ref={canvasRef}
          width={800}
          height={500}
          style={{
            display: 'block',
            borderRadius: '16px',
            background: 'rgba(10, 15, 30, 0.85)',
            border: '1px solid rgba(0, 240, 255, 0.3)'
          }}
        />
      </div>
    </div>
  );
};



import React, { useRef, useState, useEffect, useCallback } from 'react';

export const ParallaxHudCanvas = () => {
  const containerRef = useRef(null);
  const canvasRef = useRef(null);

  // Normalized mouse target coordinates offset (-1.0 to 1.0)
  const targetOffset = useRef({ x: 0, y: 0 });
  // Interpolated smooth mouse coordinates
  const currentOffset = useRef({ x: 0, y: 0 });

  // 1. Render Loop: Draw elements with Z-Depth offsets
  const drawHud = useCallback((ctx, width, height, mouse) => {
    ctx.clearRect(0, 0, width, height);

    const centerX = width / 2;
    const centerY = height / 2;

    /**
     * Helper to compute parallax translation vector based on depth coefficient.
     * @param {number} depthMultiplier - Higher value = closer to screen (larger movement offset).
     */
    const getLayerOffset = (depthMultiplier) => {
      const maxOffset = 35; // Maximum pixel displacement limit
      return {
        x: mouse.x * maxOffset * depthMultiplier,
        y: mouse.y * maxOffset * depthMultiplier,
      };
    };

    // --- LAYER 1: Deep Background (Depth = 0.2) ---
    const bgOffset = getLayerOffset(0.2);
    ctx.save();
    ctx.translate(bgOffset.x, bgOffset.y);
    
    // Draw background grid
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < width; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
      ctx.stroke();
    }
    for (let y = 0; y < height; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }
    ctx.restore();

    // --- LAYER 2: Midground Radar & Coordinates (Depth = 0.6) ---
    const midOffset = getLayerOffset(0.6);
    ctx.save();
    ctx.translate(midOffset.x, midOffset.y);

    // Draw central tactical ring
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 120, 0, Math.PI * 2);
    ctx.stroke();

    // Draw static HUD telemetry text
    ctx.fillStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.font = '12px monospace';
    ctx.fillText('SYS.LOC // 34.0522° N, 118.2437° W', centerX - 110, centerY + 145);
    ctx.restore();

    // --- LAYER 3: Foreground Crosshair Reticle (Depth = 1.2) ---
    const fgOffset = getLayerOffset(1.2);
    ctx.save();
    ctx.translate(fgOffset.x, fgOffset.y);

    // Dynamic central target crosshair
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    const rSize = 20;

    // Crosshair ticks
    ctx.beginPath();
    ctx.moveTo(centerX - rSize, centerY);
    ctx.lineTo(centerX - 5, centerY);
    ctx.moveTo(centerX + 5, centerY);
    ctx.lineTo(centerX + rSize, centerY);
    ctx.moveTo(centerX, centerY - rSize);
    ctx.lineTo(centerX, centerY - 5);
    ctx.moveTo(centerX, centerY + 5);
    ctx.lineTo(centerX, centerY + rSize);
    ctx.stroke();

    // Target reticle box
    ctx.strokeRect(centerX - 35, centerY - 35, 70, 70);
    ctx.restore();
  }, []);

  // 2. Animation loop for linear interpolation (LERP) and canvas redrawing
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animId;

    const render = () => {
      // Easing calculation for smooth parallax inertia
      currentOffset.current.x += (targetOffset.current.x - currentOffset.current.x) * 0.08;
      currentOffset.current.y += (targetOffset.current.y - currentOffset.current.y) * 0.08;

      drawHud(ctx, canvas.width, canvas.height, currentOffset.current);
      animId = requestAnimationFrame(render);
    };

    render();
    return () => cancelAnimationFrame(animId);
  }, [drawHud]);

  // 3. Normalized Mouse Movement Handler
  const handleMouseMove = useCallback((e) => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();

    // Normalize cursor position to range [-1.0, 1.0] from center
    const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;

    targetOffset.current = { x, y };
  }, []);

  const handleMouseLeave = useCallback(() => {
    targetOffset.current = { x: 0, y: 0 };
  }, []);

  return (
    <div
      ref={containerRef}
      onMouseMove={handleMouseMove}
      onMouseLeave={handleMouseLeave}
      style={{
        width: '100%',
        height: '100vh',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        background: '#030712'
      }}
    >
      <canvas
        ref={canvasRef}
        width={800}
        height={500}
        style={{
          borderRadius: '12px',
          background: 'rgba(5, 10, 25, 0.9)',
          boxShadow: '0 0 40px rgba(0, 240, 255, 0.1)',
          border: '1px solid rgba(0, 240, 255, 0.2)'
        }}
      />
    </div>
  );
};



import { useRef, useState, useCallback } from 'react';

export const useCanvasRecorder = (canvasRef, fps = 60) => {
  const [isRecording, setIsRecording] = useState(false);
  const [recordingTime, setRecordingTime] = useState(0);
  const mediaRecorderRef = useRef(null);
  const recordedChunksRef = useRef([]);
  const timerIntervalRef = useRef(null);

  // Start recording the canvas context stream
  const startRecording = useCallback(() => {
    if (!canvasRef.current) return;

    const canvas = canvasRef.current;
    
    // Capture continuous video stream from canvas
    const stream = canvas.captureStream(fps);
    
    // Fallback options for MIME types supported across Chrome/Safari/Firefox
    const options = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 5000000 }
      : { mimeType: 'video/webm', videoBitsPerSecond: 5000000 };

    try {
      const recorder = new MediaRecorder(stream, options);
      mediaRecorderRef.current = recorder;
      recordedChunksRef.current = [];

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunksRef.current.push(e.data);
        }
      };

      // When stopped, build blob and prompt download link
      recorder.onstop = () => {
        const blob = new Blob(recordedChunksRef.current, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `hud-recording-${Date.now()}.webm`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
      };

      recorder.start(100); // Collect data chunks every 100ms
      setIsRecording(true);
      setRecordingTime(0);

      // Track elapsed recording time
      timerIntervalRef.current = setInterval(() => {
        setRecordingTime((prev) => prev + 1);
      }, 1000);
    } catch (err) {
      console.error('Failed to initialize MediaRecorder:', err);
    }
  }, [canvasRef, fps]);

  // Stop recording and finalize video file export
  const stopRecording = useCallback(() => {
    if (mediaRecorderRef.current && isRecording) {
      mediaRecorderRef.current.stop();
      clearInterval(timerIntervalRef.current);
      setIsRecording(false);
    }
  }, [isRecording]);

  return { isRecording, recordingTime, startRecording, stopRecording };
};



