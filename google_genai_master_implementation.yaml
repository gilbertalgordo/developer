import { GoogleGenAI, FunctionDeclaration, Type, ApiError } from "@google/genai";

const ai = new GoogleGenAI({});

// 1. Function Declaration with Explicit JSON Schema Definitions
const processPaymentDeclaration: FunctionDeclaration = {
  name: "processPayment",
  description: "Processes a payment for an invoice with amount, currency, and payment method validation.",
  parametersJsonSchema: {
    type: "object",
    properties: {
      invoiceId: {
        type: "string",
        description: "The unique identifier of the invoice, e.g., 'INV-2026-001'",
      },
      amount: {
        type: "number",
        description: "The monetary value to pay. Must be positive.",
      },
      currency: {
        type: "string",
        enum: ["USD", "EUR", "GBP"],
        description: "3-letter ISO currency code.",
      },
      paymentMethod: {
        type: "string",
        enum: ["credit_card", "bank_transfer"],
        description: "Method of payment.",
      },
    },
    required: ["invoiceId", "amount", "currency", "paymentMethod"],
  },
};

// 2. Executable Function with Robust Function-Level Error Handling
async function processPayment(args: {
  invoiceId: string;
  amount: number;
  currency: string;
  paymentMethod: string;
}) {
  console.log(`\n[Tool Executing] Attempting payment for ${args.invoiceId}...`);

  try {
    // Parameter Validation Error Handling
    if (args.amount <= 0) {
      return {
        success: false,
        error: "INVALID_AMOUNT",
        message: "Payment amount must be greater than 0.",
      };
    }

    // Simulated Business Logic Exception (e.g. Database/API failure)
    if (args.invoiceId === "INV-EXPIRED") {
      return {
        success: false,
        error: "INVOICE_EXPIRED",
        message: "The requested invoice has expired and can no longer accept payment.",
      };
    }

    // Successful execution result
    return {
      success: true,
      transactionId: `TXN-${Math.floor(Math.random() * 100000)}`,
      status: "COMPLETED",
      invoiceId: args.invoiceId,
      amount: args.amount,
      currency: args.currency,
    };
  } catch (err: any) {
    // Catch unhandled exceptions & return a structured error response
    // so Gemini can explain the error to the user gracefully.
    return {
      success: false,
      error: "INTERNAL_SYSTEM_ERROR",
      message: err.message || "An unexpected error occurred during payment processing.",
    };
  }
}

// 3. Multi-Turn Chat execution with API & Tool Error Handling
async function runAgentWithErrorHandling() {
  // Combine declaration schema with executable function logic
  const executableTool = Object.assign(processPayment, {
    declaration: processPaymentDeclaration,
  });

  const chat = ai.chats.create({
    model: "gemini-2.5-flash",
    config: {
      systemInstruction:
        "You are an automated billing agent. Use processPayment to execute payments. " +
        "If a tool returns an error, explain the issue clearly to the user without hallucinating a successful payment.",
      tools: [executableTool],
    },
  });

  // Helper function to safely send messages with API-level error handling
  async function sendMessageSafely(prompt: string) {
    console.log(`\nUser: ${prompt}`);
    try {
      const response = await chat.sendMessage({ message: prompt });
      console.log(`Agent: ${response.text}`);
    } catch (error) {
      // API-Level Error Handling (Network errors, quota limits, or invalid keys)
      if (error instanceof ApiError) {
        console.error(`[API Error] Code ${error.status}: ${error.message}`);
      } else {
        console.error("[Unexpected Error]:", error);
      }
    }
  }

  // Turn 1: Attempting an invalid payment (triggers Tool Error Recovery)
  await sendMessageSafely(
    "Please pay invoice 'INV-EXPIRED' for $150 USD using credit_card."
  );

  // Turn 2: Correcting the input (triggers Successful Tool Execution)
  await sendMessageSafely(
    "Okay, try processing invoice 'INV-2026-001' for $150 USD using credit_card instead."
  );
}

runAgentWithErrorHandling();




import { GoogleGenAI } from "@google/genai";

const ai = new GoogleGenAI({});

// 1. Define Local Executable Functions
async function fetchStockPrice({ symbol }: { symbol: string }) {
  console.log(`\n[AFC System] Executing fetchStockPrice for symbol: ${symbol}...`);
  const mockMarket: Record<string, { price: number; currency: string; change: string }> = {
    GOOGL: { price: 182.5, currency: "USD", change: "+1.2%" },
    AAPL: { price: 224.3, currency: "USD", change: "-0.4%" },
  };

  return mockMarket[symbol.toUpperCase()] || { error: "Symbol not found" };
}

async function convertCurrency({
  amount,
  from,
  to,
}: {
  amount: number;
  from: string;
  to: string;
}) {
  console.log(`\n[AFC System] Executing convertCurrency (${amount} ${from} -> ${to})...`);
  const rates: Record<string, number> = {
    USD_EUR: 0.92,
    USD_JPY: 155.4,
  };
  const key = `${from.toUpperCase()}_${to.toUpperCase()}`;
  const rate = rates[key] || 1.0;

  return {
    convertedAmount: (amount * rate).toFixed(2),
    targetCurrency: to,
    exchangeRate: rate,
  };
}

// 2. Chat Agent with Streaming & AFC
async function runStreamingAFCAgent() {
  const chat = ai.chats.create({
    model: "gemini-2.5-flash",
    config: {
      systemInstruction:
        "You are an energetic financial assistant. Use tools to look up stocks and convert currencies, then summarize clearly.",
      // Pass executable functions to enable Automatic Function Calling
      tools: [fetchStockPrice, convertCurrency],
    },
  });

  async function streamPrompt(userQuery: string) {
    console.log(`\nUser: ${userQuery}`);
    process.stdout.write("Agent: ");

    // Use sendMessageStream to stream text while retaining AFC execution
    const responseStream = await chat.sendMessageStream({
      message: userQuery,
    });

    for await (const chunk of responseStream) {
      if (chunk.text) {
        process.stdout.write(chunk.text);
      }
    }
    console.log("\n");
  }

  // Single-tool execution with streaming response
  await streamPrompt("What is the current stock price for GOOGL?");

  // Sequential multi-tool execution (stock fetch -> currency conversion) fully streamed
  await streamPrompt(
    "How much is 10 shares of GOOGL worth in EUR?"
  );
}

