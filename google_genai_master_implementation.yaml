import { useState, useCallback, useRef } from 'react';
import GIF from 'gif.js';

interface GifExportOptions {
  width: number;
  height: number;
  totalFrames: number;
  fps: number;
  quality?: number; // 1 = best quality/slowest, 20 = lowest quality/fastest
  workerPath?: string;
}

export const useGifExporter = () => {
  const [isEncoding, setIsEncoding] = useState(false);
  const [progress, setProgress] = useState(0); // 0.0 to 1.0

  /**
   * Renders and encodes a deterministic GIF from a canvas draw function
   * @param canvas Target HTML5 Canvas element
   * @param drawFrame Callback function to draw frame 'i' given frame index and total frames
   * @param options GIF render options
   */
  const exportGif = useCallback(
    async (
      canvas: HTMLCanvasElement,
      drawFrame: (ctx: CanvasRenderingContext2D, frameIndex: number, totalFrames: number) => void,
      options: GifExportOptions
    ) => {
      const {
        width,
        height,
        totalFrames,
        fps,
        quality = 10,
        workerPath = '/gif.worker.js', // Located in public/ folder
      } = options;

      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      setIsEncoding(true);
      setProgress(0);

      // Initialize gif.js worker engine
      const gif = new GIF({
        workers: 4, // Utilize multi-core Web Workers
        quality,
        width,
        height,
        workerScript: workerPath,
      });

      // Track encoding progress from worker thread
      gif.on('progress', (p: number) => {
        setProgress(p);
      });

      // Handle encoding complete
      gif.on('finished', (blob: Blob) => {
        setIsEncoding(false);
        setProgress(1);

        // Download GIF blob
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `canvas-animation-${Date.now()}.gif`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      });

      const delay = Math.round(1000 / fps);

      // Deterministically step through each frame
      for (let i = 0; i < totalFrames; i++) {
        // 1. Draw frame deterministically at exact index i
        drawFrame(ctx, i, totalFrames);

        // 2. Add rendered canvas state into GIF queue with fixed delay
        gif.addFrame(ctx, { copy: true, delay });
      }

      // Start asynchronous encoding inside background Web Worker threads
      gif.render();
    },
    []
  );

  return { exportGif, isEncoding, progress };
};



import React, { useRef, useEffect, useCallback } from 'react';
import { useGifExporter } from './useGifExporter';

const CANVAS_WIDTH = 400;
const CANVAS_HEIGHT = 400;
const TOTAL_FRAMES = 60; // 60 frames @ 30fps = 2 second seamless loop
const FPS = 30;

export const DeterministicGifHUD: React.FC = () => {
  const canvasRef = useRef<HTMLCanvasElement | null>(null);
  const { exportGif, isEncoding, progress } = useGifExporter();

  /**
   * Deterministic Draw Function
   * Given frameIndex, calculates exact rotation state regardless of system performance/lag.
   */
  const drawFrame = useCallback(
    (ctx: CanvasRenderingContext2D, frameIndex: number, totalFrames: number) => {
      const width = ctx.canvas.width;
      const height = ctx.canvas.height;
      const center = width / 2;

      // Calculate normalized progress (0.0 -> 1.0) for a seamless loop
      const progressRatio = frameIndex / totalFrames;
      const angle = progressRatio * Math.PI * 2; // Full 360deg loop

      // Clear background
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, width, height);

      // Draw Rotating HUD Ring
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(angle);

      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 4;
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00f0ff';

      ctx.beginPath();
      ctx.arc(0, 0, 100, 0, Math.PI * 1.2);
      ctx.stroke();
      ctx.restore();

      // Draw Counter-Rotating Inner Ring
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(-angle * 2);

      ctx.strokeStyle = '#34A853';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]);

      ctx.beginPath();
      ctx.arc(0, 0, 70, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Center Telemetry Text
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`FRAME: ${frameIndex + 1}/${totalFrames}`, center, center + 5);
    },
    []
  );

  // Real-time canvas preview loop when not exporting
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || isEncoding) return;

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let animId: number;
    let currentFrame = 0;

    const render = () => {
      drawFrame(ctx, currentFrame, TOTAL_FRAMES);
      currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
      animId = requestAnimationFrame(render);
    };

    render();
    return () => cancelAnimationFrame(animId);
  }, [drawFrame, isEncoding]);

  const handleExport = () => {
    if (!canvasRef.current) return;

    exportGif(canvasRef.current, drawFrame, {
      width: CANVAS_WIDTH,
      height: CANVAS_HEIGHT,
      totalFrames: TOTAL_FRAMES,
      fps: FPS,
      quality: 5, // Higher quality for vector graphics
    });
  };

  return (
    <div style={{ padding: '24px', background: '#0D1117', color: '#fff', borderRadius: '16px', width: 'fit-content' }}>
      <div style={{ marginBottom: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <h3 style={{ margin: 0, fontFamily: 'monospace' }}>HUD GIF Exporter</h3>
        <button
          onClick={handleExport}
          disabled={isEncoding}
          style={{
            background: isEncoding ? '#30363D' : '#238636',
            color: '#fff',
            border: 'none',
            padding: '8px 16px',
            borderRadius: '6px',
            cursor: isEncoding ? 'not-allowed' : 'pointer',
            fontWeight: 'bold',
            fontFamily: 'monospace',
          }}
        >
          {isEncoding ? `Encoding... ${Math.round(progress * 100)}%` : 'Export Seamless GIF'}
        </button>
      </div>

      <canvas
        ref={canvasRef}
        width={CANVAS_WIDTH}
        height={CANVAS_HEIGHT}
        style={{
          display: 'block',
          borderRadius: '12px',
          border: '1px solid #30363D',
        }}
      />
    </div>
  );
};



