import { GoogleGenAI } from "@google/genai";

// Initialize the client (automatically uses GEMINI_API_KEY environment variable)
const ai = new GoogleGenAI({});

interface MasterPromptConfig {
  profileUrl: string;
  taskDescription: string;
  systemInstruction?: string;
}

/**
 * Executes a developer/agent AI task using Gemini
 */
async function runGoogleAIMaster(config: MasterPromptConfig): Promise<void> {
  const { profileUrl, taskDescription, systemInstruction } = config;

  try {
    const response = await ai.models.generateContent({
      model: "gemini-2.5-flash",
      contents: [
        {
          role: "user",
          parts: [
            {
              text: `Developer Context: ${profileUrl}\n\nTask: ${taskDescription}`
            }
          ]
        }
      ],
      config: {
        systemInstruction: systemInstruction || "You are an expert Google Developer AI Assistant specializing in open-source AI integration, agentic workflows, and cloud architecture.",
        temperature: 0.7,
      }
    });

    console.log("--- Generated Output ---");
    console.log(response.text);
  } catch (error) {
    console.error("Error executing Google AI generation:", error);
  }
}

// Example Execution
async function main() {
  const profileUrl = "https://g.dev/gilbert_algordo";
  const taskDescription = "Design a high-level architecture outline for an open-source multimodal AI application using Google Cloud and Gemini API.";

  await runGoogleAIMaster({
    profileUrl,
    taskDescription,
  });
}

main();



import { GoogleGenAI, FunctionDeclaration, Type } from "@google/genai";

// 1. Initialize Gemini Client
const ai = new GoogleGenAI({});

// 2. Define Function Declarations (Tools)
const getWeatherDeclaration: FunctionDeclaration = {
  name: "getWeather",
  description: "Retrieves current temperature and weather conditions for a city.",
  parametersJsonSchema: {
    type: "object",
    properties: {
      location: {
        type: "string",
        description: "The city and state/country, e.g. San Francisco, CA or Tokyo, Japan",
      },
    },
    required: ["location"],
  },
};

// Local tool execution logic
async function getWeather(location: string) {
  // Mock external API response
  return {
    location,
    temperature: "22°C",
    condition: "Partly Cloudy",
    humidity: "65%",
  };
}

// 3. Streaming Response with Tool Handling
async function streamWithFunctionCalling() {
  const userPrompt = "What is the current weather in Tokyo? Give me a short summary.";

  console.log(`User: ${userPrompt}\n`);

  // Call stream endpoint with tools configured
  const responseStream = await ai.models.generateContentStream({
    model: "gemini-2.5-flash",
    contents: [{ role: "user", parts: [{ text: userPrompt }] }],
    config: {
      tools: [{ functionDeclarations: [getWeatherDeclaration] }],
    },
  });

  let detectedFunctionCall: any = null;

  // Process stream chunks as they arrive
  for await (const chunk of responseStream) {
    // Check if the chunk contains text
    if (chunk.text) {
      process.stdout.write(chunk.text);
    }

    // Check if the chunk contains a function call request
    if (chunk.functionCalls && chunk.functionCalls.length > 0) {
      detectedFunctionCall = chunk.functionCalls[0];
    }
  }

  // 4. Handle Function Execution & Continuation
  if (detectedFunctionCall) {
    console.log(`\n\n[System] Tool Call Detected: ${detectedFunctionCall.name}`);
    console.log(`[System] Arguments:`, JSON.stringify(detectedFunctionCall.args));

    let functionResult: any;

    if (detectedFunctionCall.name === "getWeather") {
      const args = detectedFunctionCall.args as { location: string };
      functionResult = await getWeather(args.location);
    }

    console.log(`[System] Tool Result:`, JSON.stringify(functionResult));
    console.log(`\n[AI Streaming Answer]:`);

    // Pass original user turn, tool request, and tool response back for the final stream
    const followUpStream = await ai.models.generateContentStream({
      model: "gemini-2.5-flash",
      contents: [
        { role: "user", parts: [{ text: userPrompt }] },
        {
          role: "model",
          parts: [{ functionCall: detectedFunctionCall }],
        },
        {
          role: "user",
          parts: [
            {
              functionResponse: {
                name: detectedFunctionCall.name,
                response: functionResult,
              },
            },
          ],
        },
      ],
    });

    for await (const chunk of followUpStream) {
      if (chunk.text) {
        process.stdout.write(chunk.text);
      }
    }
    console.log("\n");
  }
}

streamWithFunctionCalling();




import { GoogleGenAI, FunctionDeclaration } from "@google/genai";

// 1. Initialize the Google Gen AI Client
const ai = new GoogleGenAI({});

// 2. Define the Function Declaration (Tool)
const checkInventoryDeclaration: FunctionDeclaration = {
  name: "checkInventory",
  description: "Checks stock quantity and availability for a product SKU.",
  parametersJsonSchema: {
    type: "object",
    properties: {
      sku: {
        type: "string",
        description: "The product SKU, e.g. 'CPU-32GB-RAM' or 'GPU-RTX'",
      },
    },
    required: ["sku"],
  },
};

// Simulated backend service/tool execution
async function checkInventory(sku: string) {
  const database: Record<string, { inStock: boolean; count: number; warehouse: string }> = {
    "CPU-32GB-RAM": { inStock: true, count: 42, warehouse: "US-West" },
    "GPU-RTX": { inStock: false, count: 0, warehouse: "US-East" },
  };

  return database[sku] || { inStock: false, count: 0, warehouse: "Unknown" };
}

// 3. Multi-Turn Agent Loop
async function runChatAgent() {
  // Create stateful chat session with tools attached
  const chat = ai.chats.create({
    model: "gemini-2.5-flash",
    config: {
      systemInstruction: "You are an intelligent inventory management agent. Use the checkInventory tool when users query product availability.",
      tools: [{ functionDeclarations: [checkInventoryDeclaration] }],
    },
  });

  console.log("=== Turn 1: Direct User Question ===");
  // Turn 1
  let response = await chat.sendMessage({
    message: "Hello! Do we have 'CPU-32GB-RAM' in stock?",
  });

  // Check if Gemini invoked a function call
  if (response.functionCalls && response.functionCalls.length > 0) {
    const call = response.functionCalls[0];
    console.log(`[Agent Action] Gemini called tool '${call.name}' with args:`, call.args);

    // Execute local function logic
    const args = call.args as { sku: string };
    const toolOutput = await checkInventory(args.sku);

    // Pass tool execution result back into the active chat session
    response = await chat.sendMessage({
      message: [
        {
          functionResponse: {
            name: call.name,
            response: toolOutput,
          },
        },
      ],
    });
  }

  // Output Gemini's response after consuming tool output
  console.log(`Agent: ${response.text}\n`);

  console.log("=== Turn 2: Follow-up Question (Conversation context maintained) ===");
  // Turn 2: Gemini retains memory of Turn 1 SKU and context automatically
  const followUpResponse = await chat.sendMessage({
    message: "Which warehouse is that stock located in?",
  });

  console.log(`Agent: ${followUpResponse.text}\n`);
}

runChatAgent();



