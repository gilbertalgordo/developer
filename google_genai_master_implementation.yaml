import sharp from 'sharp';
import ico from 'png-to-ico';
import fs from 'node:fs/promises';
import path from 'node:path';

const SVG_SOURCE = './public/favicon.svg';
const OUTPUT_DIR = './public';

async function generateFaviconPackage() {
  console.log('⚡ Generating HUD Favicon Package...');

  // 1. Generate PNG variants
  const pngSizes = [
    { name: 'favicon-16x16.png', size: 16 },
    { name: 'favicon-32x32.png', size: 32 },
    { name: 'apple-touch-icon.png', size: 180 }, // iOS Home Screen
    { name: 'android-chrome-192x192.png', size: 192 }, // Android PWA
    { name: 'android-chrome-512x512.png', size: 512 }, // Android PWA Splash
  ];

  for (const { name, size } of pngSizes) {
    await sharp(SVG_SOURCE)
      .resize(size, size)
      .png()
      .toFile(path.join(OUTPUT_DIR, name));
    console.log(`  ✔ Created ${name}`);
  }

  // 2. Generate multi-resolution ICO file (combines 16x16 and 32x32)
  const icoBuffer = await ico([
    path.join(OUTPUT_DIR, 'favicon-16x16.png'),
    path.join(OUTPUT_DIR, 'favicon-32x32.png'),
  ]);
  await fs.writeFile(path.join(OUTPUT_DIR, 'favicon.ico'), icoBuffer);
  console.log('  ✔ Created favicon.ico');

  console.log('🚀 Favicon Package Generation Complete!');
}

generateFaviconPackage().catch(console.error);



