import express from "express";
import http from "http";
import { WebSocketServer, WebSocket } from "ws";
import { GoogleGenAI } from "@google/genai";
import dotenv from "dotenv";

dotenv.config();

const app = express();
const PORT = process.env.PORT || 8080;

// Initialize Gemini SDK Client
const ai = new GoogleGenAI({});

// Create native HTTP server wrapping Express
const server = http.createServer(app);

// Attach WebSocket server on top of HTTP server
const wss = new WebSocketServer({ server, path: "/ws/chat" });

app.use(express.json());

// Health Check Endpoint
app.get("/health", (_req, res) => {
  res.status(200).json({ status: "OK", websocketPath: "/ws/chat" });
});

// Manage active connections & agent sessions
wss.on("connection", (ws: WebSocket) => {
  console.log("[WebSocket] Client connected");

  // Create a dedicated stateful chat session for each socket connection
  const chat = ai.chats.create({
    model: "gemini-2.5-flash",
    config: {
      systemInstruction:
        "You are a low-latency, real-time AI assistant. Keep responses direct and concise.",
    },
  });

  ws.on("message", async (data: Buffer) => {
    try {
      const payload = JSON.parse(data.toString());
      const userMessage = payload.prompt;

      if (!userMessage) {
        ws.send(JSON.stringify({ type: "error", message: "Missing prompt" }));
        return;
      }

      // Notify client that response generation has started
      ws.send(JSON.stringify({ type: "start" }));

      // Stream text chunks directly over WebSocket as they arrive from Gemini
      const responseStream = await chat.sendMessageStream({
        message: userMessage,
      });

      for await (const chunk of responseStream) {
        if (chunk.text && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              type: "chunk",
              text: chunk.text,
            })
          );
        }
      }

      // Notify client that turn is complete
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "done" }));
      }
    } catch (error: any) {
      console.error("[WebSocket Error]:", error);
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(
          JSON.stringify({
            type: "error",
            message: error.message || "Execution error",
          })
        );
      }
    }
  });

  ws.on("close", () => {
    console.log("[WebSocket] Client disconnected");
  });
});

server.listen(PORT, () => {
  console.log(`Server running on port ${PORT}`);
});




