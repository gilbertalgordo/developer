export class MasterAgentService {
  private chatSession: any;

  constructor(public developerProfile: string) {
    this.chatSession = ai.chats.create({
      model: "gemini-2.5-pro",
      config: {
        systemInstruction: `You are the Google AI Master Agent servicing ${developerProfile}. Provide production-ready, concise, and technically accurate solutions.`,
        tools: [{ googleSearch: {} }, { codeExecution: {} }, repoTool],
      },
    });
  }

  // Stream token-by-token response over SSE
  async *chatStream(prompt: string): AsyncGenerator<string> {
    const responseStream = await this.chatSession.sendMessageStream({
      message: prompt,
    });

    for await (const chunk of responseStream) {
      if (chunk.text) {
        yield chunk.text;
      }
    }
  }

  // Generate structured architecture JSON
  async generateBlueprint(topic: string) {
    const response = await ai.models.generateContent({
      model: "gemini-2.5-pro",
      contents: `Generate architecture blueprint for: ${topic}`,
      config: {
        responseMimeType: "application/json",
        responseSchema: {
          type: Type.OBJECT,
          properties: {
            projectName: { type: Type.STRING },
            architectureType: { type: Type.STRING },
            primaryTechStack: {
              type: Type.ARRAY,
              items: { type: Type.STRING },
            },
            estimatedDeployTimeMinutes: { type: Type.NUMBER },
          },
          required: ["projectName", "architectureType", "primaryTechStack"],
        },
      },
    });

    return JSON.parse(response.text || "{}");
  }
}



import express, { Request, Response } from "express";
import cors from "cors";
import dotenv from "dotenv";
import { MasterAgentService } from "./agent";

dotenv.config();

const app = express();
app.use(cors());
app.use(express.json());

// PORT assigned dynamically by Cloud Run (default: 8080)
const PORT = process.env.PORT || 8080;
const DEVELOPER_PROFILE = "https://g.dev/gilbert_algordo";

// Singleton Agent instance
const agent = new MasterAgentService(DEVELOPER_PROFILE);

// Cloud Run Health Check
app.get("/health", (_req: Request, res: Response) => {
  res.status(200).json({ status: "OK", timestamp: new Date().toISOString() });
});

// Streaming Chat API (Server-Sent Events)
app.post("/api/chat/stream", async (req: Request, res: Response) => {
  const { prompt } = req.body;

  if (!prompt) {
    return res.status(400).json({ error: "Missing 'prompt' in request body." });
  }

  // Set headers for SSE streaming
  res.setHeader("Content-Type", "text/event-stream");
  res.setHeader("Cache-Control", "no-cache");
  res.setHeader("Connection", "keep-alive");

  try {
    for await (const chunk of agent.chatStream(prompt)) {
      res.write(`data: ${JSON.stringify({ text: chunk })}\n\n`);
    }
    res.write("data: [DONE]\n\n");
    res.end();
  } catch (error: any) {
    res.write(`data: ${JSON.stringify({ error: error.message })}\n\n`);
    res.end();
  }
});

// JSON Blueprint API Endpoint
app.post("/api/blueprint", async (req: Request, res: Response) => {
  const { topic } = req.body;

  if (!topic) {
    return res.status(400).json({ error: "Missing 'topic' in request body." });
  }

  try {
    const blueprint = await agent.generateBlueprint(topic);
    res.status(200).json({ success: true, data: blueprint });
  } catch (error: any) {
    res.status(500).json({ success: false, error: error.message });
  }
});

app.listen(PORT, () => {
  console.log(`Server listening on port ${PORT}`);
});




