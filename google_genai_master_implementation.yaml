import React, { useRef, useEffect, useState, useCallback } from 'react';

export const CanvasHudDashboard = () => {
  const canvasRef = useRef(null);
  const animationFrameRef = useRef(null);
  
  // Interactive mouse/targeting coordinates
  const mousePos = useRef({ x: 400, y: 250 });
  const targetPos = useRef({ x: 400, y: 250 });

  // Telemetry log state
  const [telemetryLogs, setTelemetryLogs] = useState([
    'SYS.INIT // CORE ONLINE',
    'NEURAL_LINK // 99.8% SYNC',
    'AI_ENGINE // ACTIVE',
  ]);

  // Handle Mouse Hover/Target Tracking
  const handleMouseMove = useCallback((e) => {
    if (!canvasRef.current) return;
    const rect = canvasRef.current.getBoundingClientRect();
    mousePos.current = {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
    };
  }, []);

  // Main Canvas Render Loop
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let frameCount = 0;

    const render = () => {
      frameCount++;
      const width = canvas.width;
      const height = canvas.height;

      // Smooth targeting crosshair position via LERP (Linear Interpolation)
      targetPos.current.x += (mousePos.current.x - targetPos.current.x) * 0.1;
      targetPos.current.y += (mousePos.current.y - targetPos.current.y) * 0.1;

      // Clear background with translucent trail for subtle motion blur
      ctx.fillStyle = 'rgba(3, 7, 18, 0.95)';
      ctx.fillRect(0, 0, width, height);

      // --- 1. BACKGROUND GRID ---
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // --- 2. TELEMETRY GAUGES (Left & Right Panels) ---
      const time = frameCount * 0.03;
      
      // Left Gauge: Power Load
      const powerVal = 0.5 + Math.sin(time) * 0.3;
      drawCircularGauge(ctx, 100, 120, 45, powerVal, 'PWR.LOAD', '#00f0ff');

      // Right Gauge: Neural Sync Rate
      const syncVal = 0.85 + Math.cos(time * 0.7) * 0.1;
      drawCircularGauge(ctx, width - 100, 120, 45, syncVal, 'SYNC.NET', '#34A853');

      // --- 3. DYNAMIC CENTER ROTATING RETICLE ---
      const centerX = width / 2;
      const centerY = height / 2;

      ctx.save();
      ctx.translate(centerX, centerY);

      // Outer Rotating Arc Ring
      ctx.save();
      ctx.rotate(frameCount * 0.01);
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 110, 0, Math.PI * 1.5);
      ctx.stroke();
      ctx.restore();

      // Counter-rotating Segmented Arc
      ctx.save();
      ctx.rotate(-frameCount * 0.02);
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.7)';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.arc(0, 0, 90, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.restore();

      // --- 4. MOUSE-INTERACTIVE TARGETING BRACKET ---
      const tx = targetPos.current.x;
      const ty = targetPos.current.y;
      const bSize = 24;

      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00f0ff';

      // Top-Left Corner
      ctx.beginPath();
      ctx.moveTo(tx - bSize, ty - bSize + 8);
      ctx.lineTo(tx - bSize, ty - bSize);
      ctx.lineTo(tx - bSize + 8, ty - bSize);
      ctx.stroke();

      // Top-Right Corner
      ctx.beginPath();
      ctx.moveTo(tx + bSize - 8, ty - bSize);
      ctx.lineTo(tx + bSize, ty - bSize);
      ctx.lineTo(tx + bSize, ty - bSize + 8);
      ctx.stroke();

      // Bottom-Left Corner
      ctx.beginPath();
      ctx.moveTo(tx - bSize, ty + bSize - 8);
      ctx.lineTo(tx - bSize, ty + bSize);
      ctx.lineTo(tx - bSize + 8, ty + bSize);
      ctx.stroke();

      // Bottom-Right Corner
      ctx.beginPath();
      ctx.moveTo(tx + bSize - 8, ty + bSize);
      ctx.lineTo(tx + bSize, ty + bSize);
      ctx.lineTo(tx + bSize, ty + bSize - 8);
      ctx.stroke();

      // Reset shadow
      ctx.shadowBlur = 0;

      // Coordinate readout next to targeting reticle
      ctx.fillStyle = 'rgba(0, 240, 255, 0.8)';
      ctx.font = '10px monospace';
      ctx.fillText(`X:${Math.round(tx)} Y:${Math.round(ty)}`, tx + bSize + 6, ty + 4);

      animationFrameRef.current = requestAnimationFrame(render);
    };

    render();

    return () => {
      if (animationFrameRef.current) {
        cancelAnimationFrame(animationFrameRef.current);
      }
    };
  }, []);

  // Periodic Telemetry Stream Simulator
  useEffect(() => {
    const interval = setInterval(() => {
      const hex = Math.floor(Math.random() * 0xffff).toString(16).toUpperCase();
      const newLog = `DATA.STREAM // 0x${hex} OK`;

      setTelemetryLogs((prev) => [...prev.slice(-4), newLog]);
    }, 2000);

    return () => clearInterval(interval);
  }, []);

  return (
    <div
      style={{
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        justifyContent: 'center',
        minHeight: '100vh',
        backgroundColor: '#030712',
        color: '#00f0ff',
        fontFamily: 'monospace',
        padding: '20px',
      }}
    >
      <div style={{ position: 'relative', width: '800px', height: '500px' }}>
        {/* Canvas HUD viewport */}
        <canvas
          ref={canvasRef}
          width={800}
          height={500}
          onMouseMove={handleMouseMove}
          style={{
            display: 'block',
            borderRadius: '12px',
            border: '1px solid rgba(0, 240, 255, 0.3)',
            boxShadow: '0 0 30px rgba(0, 240, 255, 0.1)',
            cursor: 'crosshair',
          }}
        />

        {/* Real-time Telemetry Data Log Overlay */}
        <div
          style={{
            position: 'absolute',
            bottom: '20px',
            left: '20px',
            backgroundColor: 'rgba(3, 7, 18, 0.85)',
            border: '1px solid rgba(0, 240, 255, 0.2)',
            padding: '10px 14px',
            borderRadius: '6px',
            fontSize: '11px',
            pointerEvents: 'none',
          }}
        >
          <div style={{ color: '#00f0ff', marginBottom: '6px', fontWeight: 'bold' }}>
            LIVE TELEMETRY LOGS
          </div>
          {telemetryLogs.map((log, index) => (
            <div key={index} style={{ opacity: 0.5 + (index / telemetryLogs.length) * 0.5 }}>
              {log}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// --- HELPER FUNCTION: DRAW CIRCULAR HUD GAUGE ---
function drawCircularGauge(ctx, x, y, radius, value, label, color) {
  const startAngle = Math.PI * 0.75;
  const endAngle = Math.PI * 2.25;
  const currentAngle = startAngle + (endAngle - startAngle) * value;

  // Track Background
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(x, y, radius, startAngle, endAngle);
  ctx.stroke();

  // Active Gauge Fill
  ctx.strokeStyle = color;
  ctx.lineWidth = 6;
  ctx.shadowBlur = 10;
  ctx.shadowColor = color;
  ctx.beginPath();
  ctx.arc(x, y, radius, startAngle, currentAngle);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Text Readout
  ctx.fillStyle = '#ffffff';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.round(value * 100)}%`, x, y + 4);

  // Gauge Label
  ctx.fillStyle = 'rgba(0, 240, 255, 0.7)';
  ctx.font = '10px monospace';
  ctx.fillText(label, x, y + radius + 18);
}



