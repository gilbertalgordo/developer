// =============================================================================
// 3. Icon Generation Script (Node.js + sharp)
// =============================================================================

/*
// Prerequisites:
// 1. Install Node.js
// 2. Create directory: /icons_source
// 3. Place a high-resolution source image (e.g., 'logo-master-512.png') in /icons_source
// 4. Run: npm install sharp

const sharp = require('sharp');
const fs = require('fs');

const sourceImage = './icons_source/logo-master-512.png';
const outputDir = './public/icons/'; // Adjust output path as needed

// Ensure output directory exists
if (!fs.existsSync(outputDir)){
    fs.mkdirSync(outputDir, { recursive: true });
}

// Standard PWA icon sizes required for cross-device compatibility
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

console.log('Starting Google NFC Active AI Icon Generation...');

sizes.forEach(size => {
    sharp(sourceImage)
        .resize(size, size)
        .toFile(`\({outputDir}icon-\){size}x${size}.png`)
        .then(() => {
            console.log(`Generated icon-\({size}x\){size}.png`);
        })
        .catch(err => {
            console.error(`Error generating \({size}x\){size}:`, err);
        });
});

// Generate Maskable Icon (Optional, improves display on Android)
sharp(sourceImage)
    .resize(512, 512)
    .flatten({ background: '#ffffff' }) // Ensure solid background
    .toFile(`${outputDir}icon-512x512-maskable.png`)
    .then(() => {
        console.log('Generated maskable icon.');
    });

console.log('Icon generation sequence complete. Reference manifest.json for implementation.');
*/

