def save_icons_to_directory(output_dir: str = "./gundam_hud_icons") -> None:
    """Saves generated SVG icon strings into local directory structure."""
    os.makedirs(output_dir, exist_ok=True)
    icons = generate_gundam_wing_svg_icons()

    print(f"[{output_dir}] Initializing HUD Icon Asset Export...")
    for filename, svg_content in icons.items():
        file_path = os.path.join(output_dir, filename)
        with open(file_path, "w", encoding="utf-8") as f:
            f.write(svg_content)
        print(f"-> Generated Asset: {file_path}")
    print("All active Gundam Wing mobile suit icons rendered successfully.")


if __name__ == "__main__":
    save_icons_to_directory()
