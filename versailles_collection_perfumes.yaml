class Perfume:
    def __init__(self, name: str, inspiration: str, top_notes: list, heart_notes: list, base_notes: list):
        self.name = name
        self.inspiration = inspiration
        self.top_notes = top_notes
        self.heart_notes = heart_notes
        self.base_notes = base_notes

    def get_profile(self) -> str:
        """Returns a beautifully formatted description of the perfume's olfactory pyramid."""
        return (
            f"✨ Fragrance: {self.name} ✨\n"
            f"📜 Inspiration: {self.inspiration}\n"
            f"  • Top Notes: {', '.join(self.top_notes)}\n"
            f"  • Heart Notes: {', '.join(self.heart_notes)}\n"
            f"  • Base Notes: {', '.join(self.base_notes)}\n"
        )


class VersaillesVault:
    def __init__(self):
        self.collection = {}

    def add_perfume(self, perfume: Perfume):
        self.collection[perfume.name] = perfume

    def display_collection(self):
        for perfume in self.collection.values():
            print(perfume.get_profile())
            print("-" * 50)


# --- Initializing the Marie Antoinette Inspired Collection ---
vault = VersaillesVault()

vault.add_perfume(Perfume(
    name="Le Petit Trianon",
    inspiration="The Queen's private rustic escape, heavy with fresh, natural florals away from court etiquette.",
    top_notes=["Bergamot", "Green Galbanum", "Lavender"],
    heart_notes=["Centifolia Rose", "Jasmine", "Tuberose", "Orange Blossom"],
    base_notes=["Sandalwood", "Ambergris", "White Musk"]
))

vault.add_perfume(Perfume(
    name="Rococo Decadence",
    inspiration="The lavish, pastel-hued sweets, silk ribbons, and legendary extravagance of the Versailles balls.",
    top_notes=["Glazed Apricot", "Mandarin Zest"],
    heart_notes=["Powdery Iris", "Violet Petals", "Macaron Accord"],
    base_notes=["Madagascar Vanilla", "Tonka Bean", "Spun Sugar"]
))

vault.add_perfume(Perfume(
    name="L'Autrichienne",
    inspiration="A complex, regal blend honoring her Austrian heritage meeting French high society.",
    top_notes=["Neroli", "Petitgrain"],
    heart_notes=["Austrian Elderflower", "Carnation", "Spiced Clove"],
    base_notes=["Oakmoss", "Cedarwood", "Frankincense"]
))

# --- Execution ---
if __name__ == "__main__":
    print("⚜️ WELCOME TO THE VERSAILLES PERFUME VAULT ⚜️\n")
    vault.display_collection()



from dataclasses import dataclass, field
from typing import Dict, List, Tuple
import enum


class NoteLayer(enum.Enum):
    TOP = "Top Note (High Volatility)"
    HEART = "Heart Note (Medium Volatility)"
    BASE = "Base Note (Low Volatility)"


@dataclass(frozen=True)
class RawMaterial:
    name: str
    layer: NoteLayer
    volatility_rate: float  # Percent evaporated per hour under standard conditions
    ifra_limit: float       # Maximum safe concentration percentage in finished product
    cost_per_kg: float


@dataclass
class FormulaIngredient:
    material: RawMaterial
    percentage: float  # Concentration within the pure oil compound


class OlfactoryMatrixEngine:
    """Advanced formulation engine simulating evaporation profiles and regulatory safety."""
    
    def __init__(self, formula_name: str, historical_concept: str):
        self.formula_name = formula_name
        self.historical_concept = historical_concept
        self.ingredients: List[FormulaIngredient] = []

    def add_ingredient(self, material: RawMaterial, percentage: float) -> 'OlfactoryMatrixEngine':
        self.ingredients.append(FormulaIngredient(material=material, percentage=percentage))
        return self

    def validate_formula(self) -> Tuple[bool, List[str]]:
        """Audits formula for 100% distribution and IFRA compliance flags."""
        logs = []
        total_percentage = sum(item.percentage for item in self.ingredients)
        is_compliant = True

        if abs(total_percentage - 100.0) > 0.001:
            logs.append(f"❌ Composition Error: Formula total equals {total_percentage:.2f}%. Must be exactly 100.0%.")
            is_compliant = False

        for item in self.ingredients:
            if item.percentage > item.material.ifra_limit:
                logs.append(f"⚠️ IFRA Violation: {item.material.name} is at {item.percentage}%. Max limit is {item.material.ifra_limit}%.")
                is_compliant = False
                
        if is_compliant:
            logs.append("✅ Formula structural integrity and IFRA compliance verified.")
            
        return is_compliant, logs

    def simulate_evaporation_profile(self, hours: int = 8) -> Dict[int, Dict[str, float]]:
        """Simulates skin performance by projecting remaining material concentration over time."""
        profile = {}
        for hour in range(hours + 1):
            hourly_state = {NoteLayer.TOP.name: 0.0, NoteLayer.HEART.name: 0.0, NoteLayer.BASE.name: 0.0}
            total_remaining = 0.0

            # Calculate raw remaining mass based on independent material decay rates
            for item in self.ingredients:
                decay = (1.0 - item.material.volatility_rate) ** hour
                remaining = item.percentage * decay
                hourly_state[item.material.layer.name] += remaining
                total_remaining += remaining

            # Normalize to show relative projection dominance per hour
            if total_remaining > 0:
                profile[hour] = {k: (v / total_remaining) * 100 for k, v in hourly_state.items()}
            else:
                profile[hour] = {k: 0.0 for k in hourly_state.keys()}
                
        return profile


# --- Historical Raw Material Register ---
# Authentic materials sourced based on Jean-Louis Fargeon's accounts (Marie Antoinette's personal perfumer)
MATERIALS = {
    "Centifolia_Rose_Abs": RawMaterial("Rose de Mai Absolute", NoteLayer.HEART, 0.12, 2.50, 8500.0),
    "Jasmine_Grandiflorum": RawMaterial("Jasmine Grandiflorum", NoteLayer.HEART, 0.15, 0.70, 6200.0),
    "Bergamot_Calabria": RawMaterial("Bergamot (Furocoumarin-free)", NoteLayer.TOP, 0.45, 5.00, 320.0),
    "Italian_Iris_Irisone": RawMaterial("Orris Butter (15% Irones)", NoteLayer.BASE, 0.04, 100.0, 15000.0),
    "Galbanum_Resin": RawMaterial("Green Galbanum Oil", NoteLayer.TOP, 0.25, 1.20, 450.0),
    "Genuine_Sandalwood": RawMaterial("Sandalwood (Album)", NoteLayer.BASE, 0.02, 100.0, 3100.0),
    "Ambrette_Seed": RawMaterial("Ambrette Seed (Natural Musk)", NoteLayer.BASE, 0.05, 0.80, 4800.0)
}

# --- Constructing Formula: "Le Petit Trianon No. 4" ---
# An architectural reconstruction of her preferred crisp, herbal-botanical profile
trianon_formula = (
    OlfactoryMatrixEngine("Le Petit Trianon No. 4", "The Queen's escape into wild, crisp botanicals.")
    .add_ingredient(MATERIALS["Bergamot_Calabria"], 25.0)
    .add_ingredient(MATERIALS["Galbanum_Resin"], 5.0)
    .add_ingredient(MATERIALS["Centifolia_Rose_Abs"], 2.2)      # Keeping under IFRA safe limits
    .add_ingredient(MATERIALS["Jasmine_Grandiflorum"], 0.6)     # Kept safe from skin-sensitization flags
    .add_ingredient(MATERIALS["Italian_Iris_Irisone"], 15.2)
    .add_ingredient(MATERIALS["Genuine_Sandalwood"], 51.3)
    .add_ingredient(MATERIALS["Ambrette_Seed"], 0.7)
)

# --- Process & Output ---
if __name__ == "__main__":
    print(f"🔬 RUNNING ENGINE ANALYSIS: {trianon_formula.formula_name.upper()}")
    print(f"📖 CONCEPT: {trianon_formula.historical_concept}\n")
    
    # 1. Compliance Audit
    passed, audit_logs = trianon_formula.validate_formula()
    print("📋 REGULATORY AND BALANCE AUDIT:")
    for log in audit_logs:
        print(f"  {log}")
        
    # 2. Olfactory Projection Decay Simulation
    print("\n⏱️ 8-HOUR EVAPORATION RADAR (Relative Scent Presence):")
    evap_curve = trianon_formula.simulate_evaporation_profile(hours=8)
    
    print(f" {'Hour':<6} | {'Top Notes %':<13} | {'Heart Notes %':<15} | {'Base Notes %':<13}")
    print("-" * 55)
    for hr in [0, 1, 3, 6, 8]:
        curve = evap_curve[hr]
        print(f" Hr {hr:<2}   | {curve[NoteLayer.TOP.name]:<13.1f} | {curve[NoteLayer.HEART.name]:<15.1f} | {curve[NoteLayer.BASE.name]:<13.1f}")
