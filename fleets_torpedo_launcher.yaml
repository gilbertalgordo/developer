import numpy as np
import matplotlib.pyplot as plt
from mpl_toolkits.mplot3d import Axes3D

# Set up simulation parameters for a fleet
np.random.seed(42)
num_units = 15

# Initialize positions (underwater/surface transition)
# X, Y coordinates for the fleet formation, Z represents depth/altitude (Z=0 is sea level)
x_pos = np.random.uniform(-50, 50, num_units)
y_pos = np.random.uniform(-50, 50, num_units)
z_pos = np.random.uniform(-20, -5, num_units) # Underwater starting depth

# Velocity vectors for ascent and flight
vx = np.random.uniform(-2, 2, num_units)
vy = np.random.uniform(-2, 2, num_units)
vz = np.random.uniform(5, 10, num_units) # Upward thrust speed

# Simulate trajectory steps
steps = 30
trajectory_x = np.zeros((steps, num_units))
trajectory_y = np.zeros((steps, num_units))
trajectory_z = np.zeros((steps, num_units))

for t in range(steps):
    # Physics updates: accelerating upwards, breaking the water surface at Z=0
    trajectory_x[t] = x_pos + vx * t
    trajectory_y[t] = y_pos + vy * t
    trajectory_z[t] = z_pos + vz * t + (0.5 * 0.5 * (t**2)) # Gravitational/thrust dynamic

# Plotting the 3D Fleet Maneuver
fig = plt.figure(figsize=(12, 8))
ax = fig.add_subplot(111, projection='3d')

# Plot sea level reference plane
xx, yy = np.meshgrid(np.linspace(-100, 100, 10), np.linspace(-100, 100, 10))
zz = np.zeros_like(xx)
ax.plot_surface(xx, yy, zz, color='cyan', alpha=0.2, edgecolor='none')

# Plot trajectories of each hybrid launcher in the fleet
for i in range(num_units):
    ax.plot(trajectory_x[:, i], trajectory_y[:, i], trajectory_z[:, i], label=f'Unit {i+1}' if i < 3 else "", color='orange', alpha=0.7)
    # Scatter current end position
    ax.scatter(trajectory_x[-1, i], trajectory_y[-1, i], trajectory_z[-1, i], color='red', s=50)

ax.set_title("Fleet Simulation: Hybrid Underwater-Flying Rocket-Torpedo Launchers", fontsize=12, fontweight='bold')
ax.set_xlabel("X Coordinate (m)")
ax.set_ylabel("Y Coordinate (m)")
ax.set_zlabel("Depth / Altitude (m) [Z=0 Sea Level]")
ax.set_zlim(-30, 150)

plt.tight_layout()
plt.show()



import numpy as np
import matplotlib.pyplot as plt
from mpl_toolkits.mplot3d import Axes3D
import time

class HybridUnitState:
    SUBMERGED_PATROL = 0
    BREACH_LAUNCH = 1
    AIRBORNE_FLIGHT = 2

class HybridLauncherUnit:
    def __init__(self, unit_id, initial_pos):
        self.id = unit_id
        self.pos = np.array(initial_pos, dtype=float) # [x, y, z] (z=0 is sea level)
        self.vel = np.array([0.0, 0.0, 1.0], dtype=float) # Initial low-speed underwater crawl
        self.accel = np.array([0.0, 0.0, 0.0], dtype=float)
        self.state = HybridUnitState.SUBMERGED_PATROL
        self.fuel = 100.0  # Fuel/propellant percentage
        self.trajectory_history = [self.pos.copy()]
        
    def update_physics(self, dt, target_vel):
        # Constants
        G = 9.81
        rho_water = 1000.0
        rho_air = 1.225
        area = 1.5 # Cross-sectional area reference
        
        # Determine medium and forces based on altitude/depth (z)
        if self.pos[2] < 0:
            # Underwater Phase: Supercavitation mode
            if self.state == HybridUnitState.SUBMERGED_PATROL and self.pos[2] > -2.0:
                self.state = HybridUnitState.BREACH_LAUNCH
                
            current_rho = rho_water
            cd = 0.05  # Reduced drag coefficient due to supercavitative gas envelope
            thrust = 450.0 if self.fuel > 0 else 0.0
        else:
            # Airborne Phase: Rocket-Torpedo Flight Mode
            if self.state != HybridUnitState.AIRBORNE_FLIGHT:
                self.state = HybridUnitState.AIRBORNE_FLIGHT
                self.vel[2] += 15.0 # Boost kick upon breaking water surface
                
            current_rho = rho_air
            cd = 0.25  # Aerodynamic profile drag
            thrust = 1200.0 if self.fuel > 0 else 0.0 # High-power rocket motors active
            
        # Flocking steering force towards target velocity vector
        steering = target_vel - self.vel
        steering = np.clip(steering, -2.0, 2.0)
        
        # Drag force: F_d = 0.5 * rho * v^2 * Cd * Area
        speed = np.linalg.norm(self.vel)
        drag_force = -0.5 * current_rho * (speed * self.vel) * cd * area
        
        # Thrust force vector (aligned with velocity or upward during breach)
        if speed > 0:
            unit_vel = self.vel / speed
        else:
            unit_vel = np.array([0, 0, 1])
            
        thrust_force = thrust * unit_vel
        
        # Gravity acting on Z axis
        gravity_force = np.array([0.0, 0.0, -G * 150.0]) # Mass factored
        
        # Net acceleration calculation (F = ma -> a = F/m, assuming mass = 150kg)
        mass = 150.0
        net_force = thrust_force + drag_force + gravity_force + (steering * 50.0)
        self.accel = net_force / mass
        
        # Integrate velocity and position (Euler method)
        self.vel += self.accel * dt
        self.pos += self.vel * dt
        
        # Consume fuel
        if thrust > 0:
            self.fuel = max(0.0, self.fuel - (dt * 1.5))
            
        # Record trajectory
        self.trajectory_history.append(self.pos.copy())

class FleetCommander:
    def __init__(self, num_units=12):
        self.units = []
        # Initialize fleet in a tactical grid formation underwater
        cols = 4
        for i in range(num_units):
            row = i // cols
            col = i % cols
            start_pos = [(col - cols/2) * 15.0, (row - cols/2) * 15.0, -30.0 - (i * 2.0)]
            self.units.append(HybridLauncherUnit(i + 1, start_pos))
            
    def run_simulation_steps(self, steps=60, dt=0.1):
        print("[HUD TELEMETRY] Initializing Hybrid Fleet Launch Sequence...")
        print(f"[HUD TELEMETRY] Active Units Deployed: {len(self.units)}")
        
        for step in range(steps):
            # Command fleet vector: moving forward on X/Y, escalating upward on Z
            target_vector = np.array([15.0, 5.0, 25.0]) 
            
            for unit in self.units:
                unit.update_physics(dt, target_vector)
                
            if step % 15 == 0:
                active_state_counts = {
                    "Submerged": sum(1 for u in self.units if u.state == HybridUnitState.SUBMERGED_PATROL),
                    "Breaching": sum(1 for u in self.units if u.state == HybridUnitState.BREACH_LAUNCH),
                    "Airborne": sum(1 for u in self.units if u.state == HybridUnitState.AIRBORNE_FLIGHT)
                }
                print(f"[STEP {step:02d}] FSM Status -> Submerged: {active_state_counts['Submerged']} | Breaching: {active_state_counts['Breaching']} | Airborne: {active_state_counts['Airborne']}")

# Execute Fleet Simulation Backend
commander = FleetCommander(num_units=16)
commander.run_simulation_steps(steps=75, dt=0.1)

# Visualization Setup (HUD Dark Theme)
fig = plt.figure(figsize=(14, 9))
ax = fig.add_subplot(111, projection='3d')
fig.patch.set_facecolor('#0b0f19')
ax.set_facecolor('#0b0f19')

# Render Ocean Surface Plane (Z = 0)
xx, yy = np.meshgrid(np.linspace(-100, 200, 20), np.linspace(-100, 100, 20))
zz = np.zeros_like(xx)
ax.plot_surface(xx, yy, zz, color='#00f0ff', alpha=0.15, edgecolor='none')

# Plot Trajectories
for unit in commander.units:
    traj = np.array(unit.trajectory_history)
    ax.plot(traj[:, 0], traj[:, 1], traj[:, 2], color='#ff007f', alpha=0.8, linewidth=1.5)
    ax.scatter(traj[-1, 0], traj[-1, 1], traj[-1, 2], color='#39ff14', s=35) # Current position nodes

ax.set_title("ADVANCED FLEET TELEMETRY: HYBRID UNDERWATER-AIR TORPEDO LAUNCH", color='#ffffff', fontsize=11, fontweight='bold', fontfamily='monospace')
ax.set_xlabel("X Vector (m)", color='#8a99ad')
ax.set_ylabel("Y Vector (m)", color='#8a99ad')
ax.set_zlabel("Depth/Altitude (m) [Z=0 Sea Level]", color='#8a99ad')
ax.set_zlim(-40, 180)

# Styling axes for a glassmorphic/HUD look
for dim in [ax.xaxis, ax.yaxis, ax.zaxis]:
    dim.pane.set_facecolor('#111827')
    dim.pane.set_edgecolor('#1f2937')

plt.tight_layout()
plt.show()



