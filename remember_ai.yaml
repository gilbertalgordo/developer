    { key: 'dev_profile', label: 'Developer Root', value: 'github.com/gilbertalgordo/dev', category: 'dev', timestamp: '18:24:15' },
    { key: 'ui_render', label: 'HUD Overlay Strategy', value: 'Glassmorphic 120Hz', category: 'ui', timestamp: '18:24:50' }
  ]);

  const [activities, setActivities] = useState<ActivityLog[]>([
    { id: '1', type: 'network', title: 'Repository Sync', endpoint: 'github.com/gilbertalgordo', status: 'synced', time: 'Just Now' },
