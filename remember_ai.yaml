interface SelectionState {
  key: string;
  label: string;
  value: string;
  category: 'core' | 'dev' | 'ui';
  timestamp: string;
}

interface ActivityLog {
  id: string;
  type: 'network' | 'compiler' | 'security';
  title: string;
  endpoint: string;
  status: 'active' | 'synced' | 'optimized';
  time: string;
}

