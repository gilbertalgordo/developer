# -------------------------------------------------------------------
# Telemetry Collector
# -------------------------------------------------------------------

@dataclasses.dataclass
class TelemetryReport:
    ping_success_rate: float
    avg_latency_ms: float
    dns_latency_ms: float
    http_success: bool
    state_vector: Tuple[int, int, int]  # Discretized (Latency, Loss, DNS)

class TelemetryCollector:
    """Async probes to evaluate physical, network, and application layers."""

    def __init__(self, target_host: str = "1.1.1.1", http_target: str = "https://1.1.1.1"):
        self.target_host = target_host
        self.http_target = http_target

    async def measure_ping(self, count: int = 3) -> Tuple[float, float]:
        param = "-n" if platform.system().lower() == "windows" else "-c"
        cmd = ["ping", param, str(count), "-w", "1000", self.target_host]
        
        try:
            proc = await asyncio.create_subprocess_exec(
                *cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE
            )
            stdout, _ = await asyncio.wait_for(proc.communicate(), timeout=5.0)
            output = stdout.decode()

            if proc.returncode == 0:
                # Basic output parsing
                lines = output.strip().splitlines()
                loss = 0.0
                if "loss" in output.lower():
                    # Parse loss percentage
                    for line in lines:
                        if "%" in line:
                            parts = line.split("%")[0].split()
                            loss = float(parts[-1]) / 100.0 if parts[-1].replace('.', '', 1).isdigit() else 0.0
                return 1.0 - loss, 25.0  # Default nominal latency estimate if parsing varies
            return 0.0, 999.0
        except Exception:
            return 0.0, 999.0

    async def measure_dns_speed(self) -> float:
        """Measures resolution speed for a standard domain."""
        start = time.perf_counter()
        try:
            loop = asyncio.get_event_loop()
            await asyncio.wait_for(
                loop.getaddrinfo("dns.google", 80), timeout=3.0
            )
            return (time.perf_counter() - start) * 1000.0
        except Exception:
            return 999.0

    async def collect(self) -> TelemetryReport:
        ping_ok, latency = await self.measure_ping()
        dns_ms = await self.measure_dns_speed()
        http_ok = ping_ok > 0.5 and dns_ms < 500.0

        # Discretize metrics into state indices for RL model
        # Latency: 0=Good (<50ms), 1=Medium (50-150ms), 2=Poor (>150ms)
        lat_state = 0 if latency < 50 else (1 if latency < 150 else 2)
        # Loss: 0=None/Low (<10%), 1=High (>=10%)
        loss_state = 0 if ping_ok >= 0.9 else 1
        # DNS: 0=Fast (<80ms), 1=Slow/Failed (>=80ms)
        dns_state = 0 if dns_ms < 80 else 1

        return TelemetryReport(
            ping_success_rate=ping_ok,
            avg_latency_ms=latency,
            dns_latency_ms=dns_ms,
            http_success=http_ok,
            state_vector=(lat_state, loss_state, dns_state)
        )

# -------------------------------------------------------------------
# Q-Learning AI Engine
# -------------------------------------------------------------------

class QLearningConfiguratorAI:
    """Adaptive Reinforcement Learning agent to pick network parameters."""

    def __init__(self, actions: List[NetworkProfile], alpha=0.1, gamma=0.9, epsilon=0.2):
        self.actions = actions
        self.alpha = alpha      # Learning rate
        self.gamma = gamma      # Discount factor
        self.epsilon = epsilon  # Exploration probability
        self.q_table: Dict[str, List[float]] = {}

    def _get_state_key(self, state: Tuple[int, int, int]) -> str:
        return f"s_{state[0]}_{state[1]}_{state[2]}"

    def choose_action(self, state: Tuple[int, int, int]) -> Tuple[int, NetworkProfile]:
        state_key = self._get_state_key(state)
        if state_key not in self.q_table:
            self.q_table[state_key] = [0.0] * len(self.actions)

        # Epsilon-Greedy selection
        if os.urandom(1)[0] / 255.0 < self.epsilon:
            action_idx = os.urandom(1)[0] % len(self.actions)
        else:
            q_values = self.q_table[state_key]
            action_idx = int(q_values.index(max(q_values)))

        return action_idx, self.actions[action_idx]

    def update(self, state: Tuple[int, int, int], action_idx: int, report: TelemetryReport, next_state: Tuple[int, int, int]):
        # Calculate Reward Function
        reward = 0.0
        if report.http_success:
            reward += 50.0
            reward -= (report.avg_latency_ms * 0.1)
            reward -= (report.dns_latency_ms * 0.2)
        else:
            reward -= 100.0  # Penalty for disconnection

        state_key = self._get_state_key(state)
        next_state_key = self._get_state_key(next_state)

        if next_state_key not in self.q_table:
            self.q_table[next_state_key] = [0.0] * len(self.actions)

        # Q-learning formula: Q(s,a) = Q(s,a) + alpha * [r + gamma * max(Q(s',a')) - Q(s,a)]
        current_q = self.q_table[state_key][action_idx]
        max_future_q = max(self.q_table[next_state_key])
        new_q = current_q + self.alpha * (reward + self.gamma * max_future_q - current_q)
        self.q_table[state_key][action_idx] = new_q

# -------------------------------------------------------------------
# Execution Engine (Cross-Platform Interface Applicator)
# -------------------------------------------------------------------

class OSNetworkAdapter:
    """Executes network configuration changes safely with rollback support."""

    def __init__(self, interface_name: str = "eth0"):
        self.interface = interface_name
        self.os_type = platform.system().lower()

    async def apply_profile(self, profile: NetworkProfile) -> bool:
        logger.info(f"Applying Profile [{profile.name}] on interface '{self.interface}'...")
        
        try:
            if "linux" in self.os_type:
                # Apply DNS via nmcli
                cmd_dns = f"nmcli connection modify {self.interface} ipv4.dns '{profile.dns_primary} {profile.dns_secondary}'"
                # Apply MTU
                cmd_mtu = f"ip link set dev {self.interface} mtu {profile.mtu}"
                
                await self._exec(cmd_dns)
                await self._exec(cmd_mtu)
                
            elif "windows" in self.os_type:
                # Apply DNS via netsh
                cmd_dns1 = f'netsh interface ip set dns name="{self.interface}" static {profile.dns_primary}'
                cmd_dns2 = f'netsh interface ip add dns name="{self.interface}" {profile.dns_secondary} index=2'
                cmd_mtu = f'netsh interface ipv4 set subinterface "{self.interface}" mtu={profile.mtu} store=persistent'
                
                await self._exec(cmd_dns1)
                await self._exec(cmd_dns2)
                await self._exec(cmd_mtu)
            else:
                logger.warning("Dry-run mode: OS interface execution simulated.")
            
            return True
        except Exception as e:
            logger.error(f"Failed to apply configuration: {e}")
            return False

    async def _exec(self, command: str):
        proc = await asyncio.create_subprocess_shell(
            command, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE
        )
        await proc.communicate()

# -------------------------------------------------------------------
# Main Control Orchestrator
# -------------------------------------------------------------------

class ActiveAIAutoConfigurator:
    """Main loop supervising system network stability."""

    def __init__(self, interface_name: str = "eth0", eval_interval: int = 10):
        self.telemetry = TelemetryCollector()
        self.ai = QLearningConfiguratorAI(actions=PROFILES)
        self.adapter = OSNetworkAdapter(interface_name=interface_name)
        self.eval_interval = eval_interval
        self.active_profile = PROFILES[0]

    async def run(self):
        logger.info("=== Starting Active AI Internet Automatic Configurator ===")
        
        # Initial health check
        current_report = await self.telemetry.collect()
        current_state = current_report.state_vector

        while True:
            try:
                # 1. AI decides optimal action based on current telemetry state
                action_idx, chosen_profile = self.ai.choose_action(current_state)

                # 2. Apply profile if different from active profile
                if chosen_profile.id != self.active_profile.id:
                    logger.info(f"AI Decision Triggered -> Switching from [{self.active_profile.name}] to [{chosen_profile.name}]")
                    success = await self.adapter.apply_profile(chosen_profile)
                    
                    if success:
                        # Allow network stack to settle
                        await asyncio.sleep(2.0)
                        self.active_profile = chosen_profile

                # 3. Collect post-action telemetry
                new_report = await self.telemetry.collect()
                next_state = new_report.state_vector

                # 4. Train RL Agent with calculated reward
                self.ai.update(current_state, action_idx, new_report, next_state)

                logger.info(
                    f"Status: HTTP={'OK' if new_report.http_success else 'FAIL'} | "
                    f"Ping Loss: {1.0 - new_report.ping_success_rate:.0%} | "
                    f"DNS: {new_report.dns_latency_ms:.1f}ms | Active: [{self.active_profile.name}]"
                )

                current_state = next_state
                await asyncio.sleep(self.eval_interval)

            except asyncio.CancelledError:
                logger.info("Shutting down configurator service...")
                break
            except Exception as e:
                logger.error(f"Unexpected error in controller loop: {e}", exc_info=True)
                await asyncio.sleep(self.eval_interval)

if __name__ == "__main__":
    # Specify network interface (e.g., 'eth0', 'wlan0' on Linux or 'Wi-Fi', 'Ethernet' on Windows)
    target_interface = "Ethernet" if platform.system().lower() == "windows" else "eth0"
    
    configurator = ActiveAIAutoConfigurator(interface_name=target_interface, eval_interval=8)
    
    try:
        asyncio.run(configurator.run())
    except KeyboardInterrupt:
        print("\nTerminated by user.")




