def build_directory_tree(base_path, structure):
    for name, content in structure.items():
        current_path = os.path.join(base_path, name)
        if isinstance(content, dict):
            os.makedirs(current_path, exist_ok=True)
            build_directory_tree(current_path, content)
        else:
            with open(current_path, "w", encoding="utf-8") as f:
                f.write(content)

def create_zip_archive(source_dir, output_zip_path):
    with zipfile.ZipFile(output_zip_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
        for root, dirs, files in os.walk(source_dir):
            for file in files:
                full_path = os.path.join(root, file)
                relative_path = os.path.relpath(full_path, start=os.path.join(source_dir, ".."))
                zipf.write(full_path, relative_path)

if __name__ == "__main__":
    workspace = "./nasa_ai_workspace"
    os.makedirs(workspace, exist_ok=True)
    
    # Construct files and directories
    build_directory_tree(workspace, ADVANCED_PROJECT_STRUCTURE)
    
    # Bundle into distribution zip file
    zip_output = "nasa_space_telescope_active_ai.zip"
    create_zip_archive(os.path.join(workspace, "nasa_active_ai_core"), zip_output)
    
    print(f"Successfully generated advanced NASA Active AI architecture and compiled bundle: {zip_output}")



