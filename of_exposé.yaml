class ActiveRelationshipExposéEngine:
    def __init__(self):
        # High-performance compiled MatchEx lookup tables
        self.patterns = {
            "onlyfans": re.compile(r'(?:https?://)?(?:www\.)?(?:onlyfans\.com/|of\.com/)([a-z0-9_\.]{3,30})', re.IGNORECASE),
            "bridges": re.compile(r'(?:https?://)?(?:www\.)?(?:linktr\.ee|carrd\.co|beacons\.ai|allmylinks\.com)/([a-z0-9_\.-]+)', re.IGNORECASE),
            "socials": re.compile(r'(?:https?://)?(?:www\.)?(?:instagram\.com|x\.com|twitter\.com|tiktok\.com|reddit\.com/u/)([a-z0-9_\.-]+)', re.IGNORECASE),
            "obfuscated": re.compile(r'(?:(?:ig|insta|instagram|twitter|x|tt|tiktok)[\s:|-]*@?)([a-z0-9_\.]{3,30})', re.IGNORECASE)
        }
        
    def extract_footprints(self, text: str) -> Dict[str, List[str]]:
        """Extracts all matching network identifiers from raw text blocks."""
        return {
            "of_identities": list(set(self.patterns["onlyfans"].findall(text))),
            "bridge_links": list(set(self.patterns["bridges"].findall(text))),
            "social_networks": list(set(self.patterns["socials"].findall(text) + self.patterns["obfuscated"].findall(text)))
        }

    def correlate_identities(self, stream: List[Dict[str, Any]]) -> Dict[str, Any]:
        """Builds a global identity matrix mapping exposed platform relationships."""
        identity_graph = {}
        
        # Phase 1: Identity Extraction & Mapping
        for record in stream:
            footprint = self.extract_footprints(record["bio_content"])
            
            # Aggregate all normalization targets across platforms
            all_handles = []
            for key in footprint:
                all_handles.extend([h.lower() for h in footprint[key]])
            
            if not all_handles:
                continue
                
            # Direct resolution fallback: Link back to primary target handle
            primary_pivot = all_handles[0]
            
            if primary_pivot not in identity_graph:
                identity_graph[primary_pivot] = {
                    "associated_onlyfans": set(),
                    "associated_bridges": set(),
                    "associated_socials": set(),
                    "raw_source_records": []
                }
                
            # Map identities out dynamically
            identity_graph[primary_pivot]["associated_onlyfans"].update(footprint["of_identities"])
            identity_graph[primary_pivot]["associated_bridges"].update(footprint["bridge_links"])
            identity_graph[primary_pivot]["associated_socials"].update(footprint["social_networks"])
            identity_graph[primary_pivot]["raw_source_records"].append(record["internal_id"])

        # Phase 2: Cross-link Resolution (Exposing hidden relationships between disparate profiles)
        final_exposé_report = {}
        for handle, data in identity_graph.items():
            # Conversion to serialization formats
            final_exposé_report[handle] = {
                "onlyfans_footprints": list(data["associated_onlyfans"]),
                "bridge_funnels": list(data["associated_bridges"]),
                "cross_platform_socials": list(data["associated_socials"]),
                "linked_source_ids": data["raw_source_records"],
                "confidence_score": "HIGH_CONFIRMATION" if len(data["associated_onlyfans"]) > 0 and len(data["associated_socials"]) > 0 else "PARTIAL_LINKAGE"
            }
            
        return final_exposé_report

# Instantiate and execute Active AI engine
engine = ActiveRelationshipExposéEngine()
exposé_report = engine.correlate_identities(PROFILE_DATA_STREAM)

# Output formatting
print(json.dumps(exposé_report, indent=2))





