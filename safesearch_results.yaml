import { AdvancedSearchHit, SafeSearchIconEngine } from './search-pipeline';

export function renderHUDResultItem(hit: AdvancedSearchHit): string {
  // Determine appropriate status based on AI telemetry payload
  const safetyStatus = SafeSearchIconEngine.mapMetricsToStatus(
    hit.safetyPayload.isSafe, 
    hit.safetyPayload.toxicityScore
  );

  // Generate crisp inline vector image asset on demand
  const statusIconSvg = SafeSearchIconEngine.generateIconSvg(safetyStatus, {
    sizePx: 20,
    glowEffect: true
  });

  return `
    <div class="hud-search-item glassmorphic-panel status-${safetyStatus}">
      <div class="hud-meta-header">
        <div class="hud-status-wrapper">
          ${statusIconSvg}
          <span class="hud-status-label">${safetyStatus.toUpperCase()}</span>
        </div>
        <span class="hud-telemetry-score">MATCH: ${(hit.semanticRelevance * 100).toFixed(1)}%</span>
      </div>
      <h3 class="hud-item-title">${hit.title}</h3>
      <p class="hud-item-snippet">${hit.rawSnippet}</p>
      <div class="hud-item-footer">
        <span class="hud-item-url">${hit.url}</span>
      </div>
    </div>
  `;
}
