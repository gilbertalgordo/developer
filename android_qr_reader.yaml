package com.example.qrreader

import androidx.camera.core.ExperimentalGetImage
import androidx.camera.core.ImageAnalysis
import androidx.camera.core.ImageProxy
import com.google.mlkit.vision.barcode.BarcodeScanning
import com.google.mlkit.vision.barcode.common.Barcode
import com.google.mlkit.vision.common.InputImage

data-class AIProcessedResult(
    val rawValue: String,
    val category: String,
    val smartActionPrompt: String
)

class ActiveAIQRCodeAnalyzer(
    private val onQRCodeDetected: (AIProcessedResult) -> Unit
) : ImageAnalysis.Analyzer {

    private val scanner = BarcodeScanning.getClient()
    private var isProcessing = false

    @OptIn(ExperimentalGetImage::class)
    override fun analyze(imageProxy: ImageProxy) {
        val mediaImage = imageProxy.image
        if (mediaImage == null) {
            imageProxy.close()
            return
        }

        if (isProcessing) {
            imageProxy.close()
            return
        }

        isProcessing = true
        val image = InputImage.fromMediaImage(mediaImage, imageProxy.imageInfo.rotationDegrees)

        scanner.process(image)
            .addOnSuccessListener { barcodes ->
                for (barcode in barcodes) {
                    barcode.rawValue?.let { rawValue ->
                        val aiResult = processWithActiveAI(barcode, rawValue)
                        onQRCodeDetected(aiResult)
                        break
                    }
                }
            }
            .addOnFailureListener {
                // Handle parsing failure gracefully
            }
            .addOnCompleteListener {
                isProcessing = false
                imageProxy.close()
            }
    }

    // Active AI Intent & Entity Extraction Simulation
    private fun processWithActiveAI(barcode: Barcode, rawValue: String): AIProcessedResult {
        return when (barcode.valueType) {
            Barcode.TYPE_URL -> AIProcessedResult(
                rawValue = rawValue,
                category = "Web Link",
                smartActionPrompt = "Open Secure Browser"
            )
            Barcode.TYPE_WIFI -> AIProcessedResult(
                rawValue = rawValue,
                category = "Wi-Fi Configuration",
                smartActionPrompt = "Connect to Network"
            )
            Barcode.TYPE_CONTACT_INFO -> AIProcessedResult(
                rawValue = rawValue,
                category = "Digital Business Card",
                smartActionPrompt = "Add to Contacts"
            )
            Barcode.TYPE_PHONE -> AIProcessedResult(
                rawValue = rawValue,
                category = "Phone Number",
                smartActionPrompt = "Initiate Call"
            )
            else -> AIProcessedResult(
                rawValue = rawValue,
                category = "General Text / Data",
                smartActionPrompt = "Copy & Analyze"
            )
        }
    }
}




