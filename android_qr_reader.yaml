@OptIn(ExperimentalMaterial3Api::class)
@Composable
fun AdvancedQRScannerScreen() {
    val context = LocalContext.current
    val lifecycleOwner = LocalLifecycleOwner.current
    val cameraExecutor = remember { Executors.newSingleThreadExecutor() }

    var hasPermission by remember { mutableStateOf(false) }
    var activeInsight by remember { mutableStateOf<AIEntityInsight?>(null) }
    var showBottomSheet by remember { mutableStateOf(false) }
    var isTorchOn by remember { mutableStateOf(false) }
    var cameraInstance by remember { mutableStateOf<Camera?>(null) }

    val analyzer = remember {
        QRImageAnalyzer { insight ->
            // Trigger Haptic Feedback
            val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
            vibrator.vibrate(VibrationEffect.createOneShot(50, VibrationEffect.DEFAULT_AMPLITUDE))

            activeInsight = insight
            showBottomSheet = true
        }
    }

    val launcher = rememberLauncherForActivityResult(
        contract = ActivityResultContracts.RequestPermission()
    ) { granted -> hasPermission = granted }

    LaunchedEffect(Unit) {
        launcher.launch(Manifest.permission.CAMERA)
    }

    Box(modifier = Modifier.fillMaxSize()) {
        if (hasPermission) {
            AndroidView(
                factory = { ctx ->
                    val previewView = PreviewView(ctx)
                    val cameraProviderFuture = ProcessCameraProvider.getInstance(ctx)

                    cameraProviderFuture.addListener({
                        val cameraProvider = cameraProviderFuture.get()
                        val preview = Preview.Builder().build().also {
                            it.setSurfaceProvider(previewView.surfaceProvider)
                        }

                        val imageAnalysis = ImageAnalysis.Builder()
                            .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                            .build()
                            .also { it.setAnalyzer(cameraExecutor, analyzer) }

                        try {
                            cameraProvider.unbindAll()
                            cameraInstance = cameraProvider.bindToLifecycle(
                                lifecycleOwner,
                                CameraSelector.DEFAULT_BACK_CAMERA,
                                preview,
                                imageAnalysis
                            )
                        } catch (e: Exception) {
                            // Catch camera initialization binding exceptions safely
                        }
                    }, ContextCompat.getMainExecutor(ctx))

                    previewView
                },
                modifier = Modifier.fillMaxSize()
            )

            // Real-time Bounding Box Canvas Overlay
            activeInsight?.boundingBox?.let { box ->
                Canvas(modifier = Modifier.fillMaxSize()) {
                    drawRect(
                        color = Color.Green,
                        topLeft = Offset(box.left.toFloat(), box.top.toFloat()),
                        size = Size(box.width().toFloat(), box.height().toFloat()),
                        style = Stroke(width = 8f)
                    )
                }
            }

            // Top Floating Control Bar (Torch Toggle)
            Row(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(24.dp)
                    .align(Alignment.TopCenter),
                horizontalArrangement = Arrangement.End
            ) {
                IconButton(
                    onClick = {
                        isTorchOn = !isTorchOn
                        cameraInstance?.cameraControl?.enableTorch(isTorchOn)
                    },
                    colors = IconButtonDefaults.iconButtonColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)
                ) {
                    Icon(
                        imageVector = if (isTorchOn) Icons.Default.FlashlightOn else Icons.Default.FlashlightOff,
                        contentDescription = "Toggle Torch"
                    )
                }
            }
        } else {
            Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                Text("Camera permission is required to run the AI engine.")
            }
        }

        // Active AI Intelligence Bottom Sheet
        if (showBottomSheet && activeInsight != null) {
            ModalBottomSheet(
                onDismissRequest = {
                    showBottomSheet = false
                    activeInsight = null
                    analyzer.resetLock()
                }
            ) {
                Column(
                    modifier = Modifier
                        .fillMaxWidth()
                        .padding(24.dp)
                ) {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalArrangement = Arrangement.SpaceBetween,
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Text(
                            text = "🛡️ Active AI Intelligence",
                            style = MaterialTheme.typography.labelLarge,
                            color = MaterialTheme.colorScheme.primary
                        )
                        
                        val riskColor = if (activeInsight!!.securityRiskScore > 0.5f) Color.Red else Color.Green
                        Surface(color = riskColor.copy(alpha = 0.2f), shape = MaterialTheme.shapes.small) {
                            Text(
                                text = if (activeInsight!!.securityRiskScore > 0.5f) "Risk Detected" else "Verified Safe",
                                modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp),
                                style = MaterialTheme.typography.labelSmall,
                                color = riskColor
                            )
                        }
                    }

                    Spacer(modifier = Modifier.height(8.dp))
                    Text(text = activeInsight!!.category, style = MaterialTheme.typography.headlineMedium)
                    Spacer(modifier = Modifier.height(12.dp))

                    // Dynamic Parsed Key-Value Parameters
                    Card(
                        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant),
                        modifier = Modifier.fillMaxWidth()
                    ) {
                        Column(modifier = Modifier.padding(12.dp)) {
                            activeInsight!!.parsedDetails.forEach { (key, value) ->
                                Text(text = "$key: $value", style = MaterialTheme.typography.bodyMedium)
                            }
                        }
                    }

                    Spacer(modifier = Modifier.height(24.dp))

                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalArrangement = Arrangement.spacedBy(12.dp)
                    ) {
                        OutlinedButton(
                            modifier = Modifier.weight(1f),
                            onClick = {
                                val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                clipboard.setPrimaryClip(ClipData.newPlainText("QR Payload", activeInsight!!.rawValue))
                                Toast.makeText(context, "Copied payload to clipboard", Toast.LENGTH_SHORT).show()
                                showBottomSheet = false
                                analyzer.resetLock()
                            }
                        ) {
                            Text("Copy Raw")
                        }

                        Button(
                            modifier = Modifier.weight(1f),
                            onClick = {
                                Toast.makeText(context, "Executing Action: ${activeInsight!!.primaryActionLabel}", Toast.LENGTH_SHORT).show()
                                showBottomSheet = false
                                analyzer.resetLock()
                            }
                        ) {
                            Text(activeInsight!!.primaryActionLabel)
                        }
                    }
                    Spacer(modifier = Modifier.height(32.dp))
                }
            }
        }
    }
}




