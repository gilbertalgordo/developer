package com.example.advancedqr.ai

import android.graphics.Rect
import com.google.mlkit.vision.barcode.common.Barcode

data class AIEntityInsight(
    val rawValue: String,
    val category: String,
    val securityRiskScore: Float, // 0.0 (Safe) to 1.0 (High Risk)
    val parsedDetails: Map<String, String>,
    val primaryActionLabel: String,
    val boundingBox: Rect?
)

class ActiveAIIntelligentParser {

    fun analyze(barcode: Barcode): AIEntityInsight {
        val raw = barcode.rawValue ?: "Unknown Data"
        val bounds = barcode.boundingBox

        return when (barcode.valueType) {
            Barcode.TYPE_URL -> {
                val isHttps = raw.startsWith("https://", ignoreCase = true)
                AIEntityInsight(
                    rawValue = raw,
                    category = "Secure Web URL",
                    securityRiskScore = if (isHttps) 0.0f else 0.4f,
                    parsedDetails = mapOf("Domain" to (raw.split("/").getOrNull(2) ?: raw)),
                    primaryActionLabel = "Launch Browser",
                    boundingBox = bounds
                )
            }
            Barcode.TYPE_WIFI -> {
                val ssid = barcode.wifi?.ssid ?: "Hidden Network"
                val type = when (barcode.wifi?.encryptionType) {
                    Barcode.WiFi.TYPE_WEP -> "WEP"
                    Barcode.WiFi.TYPE_WPA -> "WPA/WPA2"
                    else -> "Open"
                }
                AIEntityInsight(
                    rawValue = raw,
                    category = "Wi-Fi Configuration",
                    securityRiskScore = if (type == "Open") 0.7f else 0.1f,
                    parsedDetails = mapOf("SSID" to ssid, "Security" to type),
                    primaryActionLabel = "Connect Network",
                    boundingBox = bounds
                )
            }
            Barcode.TYPE_GEO -> {
                val lat = barcode.geoPoint?.lat ?: 0.0
                val lng = barcode.geoPoint?.lng ?: 0.0
                AIEntityInsight(
                    rawValue = raw,
                    category = "Geographic Coordinates",
                    securityRiskScore = 0.0f,
                    parsedDetails = mapOf("Latitude" to "$lat", "Longitude" to "$lng"),
                    primaryActionLabel = "Open in Maps",
                    boundingBox = bounds
                )
            }
            Barcode.TYPE_CONTACT_INFO -> {
                val name = barcode.contactInfo?.formattedName ?: "Unnamed Contact"
                val phone = barcode.contactInfo?.phones?.firstOrNull()?.number ?: "No Phone"
                AIEntityInsight(
                    rawValue = raw,
                    category = "Digital vCard Contact",
                    securityRiskScore = 0.0f,
                    parsedDetails = mapOf("Name" to name, "Phone" to phone),
                    primaryActionLabel = "Save to Contacts",
                    boundingBox = bounds
                )
            }
            else -> {
                AIEntityInsight(
                    rawValue = raw,
                    category = "Plain Text / Metadata",
                    securityRiskScore = 0.2f,
                    parsedDetails = mapOf("Length" to "${raw.length} chars"),
                    primaryActionLabel = "Copy Text",
                    boundingBox = bounds
                )
            }
        }
    }
}




package com.example.advancedqr.camera

import androidx.camera.core.ExperimentalGetImage
import androidx.camera.core.ImageAnalysis
import androidx.camera.core.ImageProxy
import com.example.advancedqr.ai.AIEntityInsight
import com.example.advancedqr.ai.ActiveAIIntelligentParser
import com.google.mlkit.vision.barcode.BarcodeScanning
import com.google.mlkit.vision.common.InputImage

class QRImageAnalyzer(
    private val onQRCodeAnalyzed: (AIEntityInsight) -> Unit
) : ImageAnalysis.Analyzer {

    private val scanner = BarcodeScanning.getClient()
    private val parser = ActiveAIIntelligentParser()
    private var isLocked = false

    @OptIn(ExperimentalGetImage::class)
    override fun analyze(imageProxy: ImageProxy) {
        val mediaImage = imageProxy.image
        if (mediaImage == null || isLocked) {
            imageProxy.close()
            return
        }

        isLocked = true
        val image = InputImage.fromMediaImage(mediaImage, imageProxy.imageInfo.rotationDegrees)

        scanner.process(image)
            .addOnSuccessListener { barcodes ->
                val barcode = barcodes.firstOrNull()
                if (barcode != null) {
                    val insight = parser.analyze(barcode)
                    onQRCodeAnalyzed(insight)
                } else {
                    isLocked = false
                }
            }
            .addOnFailureListener {
                isLocked = false
            }
            .addOnCompleteListener {
                imageProxy.close()
            }
    }

    fun resetLock() {
        isLocked = false
    }
}




