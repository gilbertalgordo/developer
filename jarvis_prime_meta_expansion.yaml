:root {
  --cyan-primary: #00f3ff;
  --cyan-glow: rgba(0, 243, 255, 0.6);
  --blue-primary: #0084ff;
  --blue-glow: rgba(0, 132, 255, 0.4);
  --danger-red: #ff2a5f;
  --bg-hud: rgba(10, 13, 20, 0.95);
}

/* ==========================================================================
   1. KEYFRAME DEFINITIONS
   ========================================================================== */

/* Dual-axis orbital rotation for HUD rings */
@keyframes orbitalSpin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

@keyframes reverseOrbitalSpin {
  0% {
    transform: rotate(360deg);
  }
  100% {
    transform: rotate(0deg);
  }
}

/* High-frequency radar / energy core pulse */
@keyframes energyPulse {
  0% {
    transform: scale(0.96);
    filter: drop-shadow(0 0 4px var(--cyan-primary));
    opacity: 0.8;
  }
  50% {
    transform: scale(1.06);
    filter: drop-shadow(0 0 16px var(--cyan-primary));
    opacity: 1;
  }
  100% {
    transform: scale(0.96);
    filter: drop-shadow(0 0 4px var(--cyan-primary));
    opacity: 0.8;
  }
}

/* Vertical HUD CRT Scanline Sweep */
@keyframes hudScanline {
  0% {
    top: -100%;
  }
  100% {
    top: 200%;
  }
}

/* Neon Telemetry Glitch Effect (Activated on hover or click) */
@keyframes telemetryGlitch {
  0% {
    transform: translate(0, 0);
  }
  20% {
    transform: translate(-2px, 1px);
  }
  40% {
    transform: translate(2px, -1px);
  }
  60% {
    transform: translate(-1px, -2px);
  }
  80% {
    transform: translate(1px, 2px);
  }
  100% {
    transform: translate(0, 0);
  }
}

/* Dash array offset for active data transmission rings */
@keyframes dataTransmission {
  0% {
    stroke-dashoffset: 100;
  }
  100% {
    stroke-dashoffset: 0;
  }
}

/* ==========================================================================
   2. UTILITY & SVG CLASS ATTACHMENTS
   ========================================================================== */

/* Outer Radar / Telemetry Ring */
.spin-ring {
  transform-origin: 50px 50px;
  animation: orbitalSpin 10s linear infinite;
}

.spin-ring-reverse {
  transform-origin: 50px 50px;
  animation: reverseOrbitalSpin 6s linear infinite;
}

/* Central AI Core Lightning & Nodes */
.ring-pulse {
  transform-origin: 50px 50px;
  animation: energyPulse 2.5s ease-in-out infinite;
}

/* Streaming Data Ring */
.data-stream-ring {
  stroke-dasharray: 20, 10;
  animation: dataTransmission 4s linear infinite;
}

/* Card Container Hover & Scanline FX */
.hud-icon-card {
  position: relative;
  background: var(--bg-hud);
  border: 1px solid rgba(0, 243, 255, 0.2);
  border-radius: 12px;
  padding: 20px;
  overflow: hidden;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

/* Scanline Overlay */
.hud-icon-card::after {
  content: '';
  position: absolute;
  left: 0;
  width: 100%;
  height: 50%;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(0, 243, 255, 0.15),
    transparent
  );
  animation: hudScanline 4s linear infinite;
  pointer-events: none;
}

/* Interactive Hover Triggering Increased Telemetry Output */
.hud-icon-card:hover {
  border-color: var(--cyan-primary);
  box-shadow: 0 0 25px var(--cyan-glow), inset 0 0 15px rgba(0, 243, 255, 0.1);
}

.hud-icon-card:hover .spin-ring {
  animation-duration: 3s; /* Accelerates rotation on interaction */
}

.hud-icon-card:hover .hud-svg {
  animation: telemetryGlitch 0.2s ease-in-out 2;
}

/* CTA Launcher Button Animation */
.hud-link {
  display: inline-block;
  padding: 8px 16px;
  background: linear-gradient(135deg, var(--blue-primary), #000524);
  color: var(--cyan-primary);
  border: 1px solid var(--cyan-primary);
  border-radius: 6px;
  text-decoration: none;
  font-family: monospace;
  font-weight: bold;
  letter-spacing: 1px;
  transition: all 0.2s ease;
}

.hud-link:hover {
  background: var(--cyan-primary);
  color: #000;
  box-shadow: 0 0 15px var(--cyan-primary);
}
