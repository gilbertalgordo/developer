/**
 * Advanced Meta Messenger Webhook with AI Expansion Engine
 * Endpoint target: https://m.me/1398345928009373?is_ai=1
 */

const express = require('express');
const crypto = require('crypto');
const axios = require('axios');

const app = express();
app.use(express.json({ verify: verifyRequestSignature }));

// Environment Configuration
const PAGE_ACCESS_TOKEN = process.env.PAGE_ACCESS_TOKEN;
const VERIFY_TOKEN = process.env.VERIFY_TOKEN;
const APP_SECRET = process.env.APP_SECRET;

// In-Memory User Session & Telemetry Store
const userSessions = new Map();

// -----------------------------------------------------------------------
// 1. WEBHOOK VERIFICATION & PAYLOAD ROUTING
// -----------------------------------------------------------------------

app.get('/webhook', (req, res) => {
    const mode = req.query['hub.mode'];
    const token = req.query['hub.verify_token'];
    const challenge = req.query['hub.challenge'];

    if (mode && token) {
        if (mode === 'subscribe' && token === VERIFY_TOKEN) {
            console.log('[SYSTEM] Webhook verified successfully.');
            return res.status(200).send(challenge);
        }
        return res.sendStatus(403);
    }
});

app.post('/webhook', (req, res) => {
    const body = req.body;

    if (body.object === 'page') {
        body.entry.forEach((entry) => {
            const webhookEvent = entry.messaging[0];
            const senderPsid = webhookEvent.sender.id;

            // Initialize or fetch session context
            let session = userSessions.get(senderPsid) || {
                psid: senderPsid,
                aiMode: false,
                referralSource: null,
                kaizenIterations: 0,
            };

            // Process Referral Links (e.g., https://m.me/1398345928009373?is_ai=1)
            if (webhookEvent.referral || (webhookEvent.postback && webhookEvent.postback.referral)) {
                const referralData = webhookEvent.referral || webhookEvent.postback.referral;
                handleReferralExpansion(senderPsid, referralData.ref, session);
            } 
            // Process Messages
            else if (webhookEvent.message) {
                handleMessage(senderPsid, webhookEvent.message, session);
            }
            // Process Postback Buttons
            else if (webhookEvent.postback) {
                handlePostback(senderPsid, webhookEvent.postback, session);
            }

            userSessions.set(senderPsid, session);
        });

        res.status(200).send('EVENT_RECEIVED');
    } else {
        res.sendStatus(404);
    }
});

// Security: Verify App Secret Signature
function verifyRequestSignature(req, res, buf) {
    const signature = req.headers['x-hub-signature-256'];
    if (!signature) {
        console.warn('[SECURITY] Missing X-Hub-Signature-256 header.');
    } else {
        const elements = signature.split('=');
        const expectedHash = crypto
            .createHmac('sha256', APP_SECRET)
            .update(buf)
            .digest('hex');

        if (elements[1] !== expectedHash) {
            throw new Error('[SECURITY] Invalid request signature.');
        }
    }
}

// -----------------------------------------------------------------------
// 2. EXPANSION LOGIC & REFERRAL PARSING
// -----------------------------------------------------------------------

function handleReferralExpansion(psid, ref, session) {
    console.log(`[REFERRAL] User ${psid} linked with ref parameter: ${ref}`);

    // Parse queries like "is_ai=1" or URL-encoded JSON strings
    const params = new URLSearchParams(ref);
    const isAiEnabled = params.get('is_ai') === '1' || ref === 'is_ai=1';

    if (isAiEnabled) {
        session.aiMode = true;
        session.referralSource = 'm.me/1398345928009373?is_ai=1';
        session.kaizenIterations += 1;

        // Send telemetry greeting and expanded controls
        sendAiActivationDashboard(psid, session);
    } else {
        sendStandardGreeting(psid);
    }
}

// -----------------------------------------------------------------------
// 3. EXPANDED MESSENGER TEMPLATES & HUD GRAPHICS
// -----------------------------------------------------------------------

async function sendAiActivationDashboard(psid, session) {
    // Typing indicator on
    await sendSenderAction(psid, 'typing_on');

    const telemetryCard = {
        recipient: { id: psid },
        message: {
            attachment: {
                type: 'template',
                payload: {
                    template_type: 'generic',
                    elements: [
                        {
                            title: '⚡ ACTIVE AI HUD: ONLINE',
                            subtitle: `Session ID: ${psid.slice(-6)} | Kaizen State: ${session.kaizenIterations} | Real-Time Telemetry`,
                            image_url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200',
                            buttons: [
                                {
                                    type: 'postback',
                                    title: '📊 Query System Status',
                                    payload: 'ACTION_SYSTEM_STATUS',
                                },
                                {
                                    type: 'postback',
                                    title: '⚙️ Toggle AI/Manual Mode',
                                    payload: 'ACTION_TOGGLE_MODE',
                                },
                                {
                                    type: 'web_url',
                                    url: 'https://github.com/gilbertalgordo/dev',
                                    title: '📁 Developer Sources',
                                },
                            ],
                        },
                    ],
                },
            },
            quick_replies: [
                {
                    content_type: 'text',
                    title: '🚀 Optimize Processing',
                    payload: 'QR_OPTIMIZE',
                },
                {
                    content_type: 'text',
                    title: '🤖 Run AI Simulation',
                    payload: 'QR_SIMULATION',
                },
            ],
        },
    };

    await callSendAPI(telemetryCard);
    await sendSenderAction(psid, 'typing_off');
}

async function handleMessage(psid, message, session) {
    if (session.aiMode) {
        // Echo HUD indicator and trigger LLM/AI response processing
        console.log(`[AI ENGINE] Processing text for ${psid}: ${message.text}`);
        
        // Simulating high-speed AI response logic
        const aiResponse = `[AI Active] Telemetry acknowledged. Received parameter input: "${message.text}". System performance at 100%.`;
        
        await sendTextMessage(psid, aiResponse);
    } else {
        await sendTextMessage(psid, "Standard Mode Active. Click your referral link again with '?is_ai=1' to launch the AI engine.");
    }
}

async function handlePostback(psid, postback, session) {
    const payload = postback.payload;

    if (payload === 'ACTION_SYSTEM_STATUS') {
        const statusMsg = `⚙️ SYSTEM TELEMETRY:\n• AI Mode: ${session.aiMode ? 'ENABLED' : 'DISABLED'}\n• Endpoint: https://m.me/1398345928009373\n• Optimization Engine: Active\n• Stream Quality: HD/3D Ready`;
        await sendTextMessage(psid, statusMsg);
    } else if (payload === 'ACTION_TOGGLE_MODE') {
        session.aiMode = !session.aiMode;
        await sendTextMessage(psid, `AI Engine state toggled to: ${session.aiMode ? 'ENABLED ⚡' : 'DISABLED ⏸️'}`);
    }
}

// -----------------------------------------------------------------------
// 4. META GRAPH MESSAGING HELPERS
// -----------------------------------------------------------------------

async function sendTextMessage(psid, text) {
    const requestPayload = {
        recipient: { id: psid },
        message: { text: text },
    };
    return await callSendAPI(requestPayload);
}

async function sendSenderAction(psid, action) {
    const requestPayload = {
        recipient: { id: psid },
        sender_action: action,
    };
    return await callSendAPI(requestPayload);
}

async function callSendAPI(requestBody) {
    try {
        const response = await axios.post(
            `https://graph.facebook.com/v19.0/me/messages?access_token=${PAGE_ACCESS_TOKEN}`,
            requestBody
        );
        return response.data;
    } catch (error) {
        console.error('[API ERROR]', error.response ? error.response.data : error.message);
    }
}

// Server Startup
const PORT = process.env.PORT || 3000;
app.listen(PORT, () => {
    console.log(`[SERVER] Messenger AI Webhook operating on port ${PORT}`);
});



