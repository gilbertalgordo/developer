class IconGeneratorPipeline:
    def __init__(self, registry: List[Dict[str, Any]]):
        self.registry = registry

    def export_svg_icons(self, output_dir: str = "./icons_output") -> Dict[str, str]:
        os.makedirs(output_dir, exist_ok=True)
        manifest = {}

        print(f"[*] Initializing Icon Generation Pipeline by {ICON_ENGINE_CONFIG['developer']}")
        print(f"[*] Profile Source: {ICON_ENGINE_CONFIG['profile']}")

        for app in self.registry:
            file_name = f"{app['id']}_hud_icon.svg"
            file_path = os.path.join(output_dir, file_name)
            
            with open(file_path, "w", encoding="utf-8") as f:
                f.write(app["svg_template"])
            
            manifest[app["id"]] = {
                "name": app["name"],
                "category": app["category"],
                "path": file_path
            }
            print(f"[+] Generated High-Definition Icon: {file_path}")

        manifest_path = os.path.join(output_dir, "manifest.json")
        with open(manifest_path, "w", encoding="utf-8") as mf:
            json.dump({
                "config": ICON_ENGINE_CONFIG,
                "icons": manifest
            }, mf, indent=4)
            
        print(f"[+] Exported Icon Manifest Index: {manifest_path}")
        return manifest

if __name__ == "__main__":
    pipeline = IconGeneratorPipeline(APP_ICON_REGISTRY)
    exported_icons = pipeline.export_svg_icons()
    print(json.dumps(exported_icons, indent=4))

