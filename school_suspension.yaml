const express = require('express');
const axios = require('axios');
const cron = require('node-cron');
const http = require('http');
const { Server } = require('socket.io');

const app = express();
const server = http.createServer(app);
const io = new Server(server);

app.use(express.json());
app.use(express.static('public'));

// Global HUD State
let systemState = {
    status: 'NORMAL',
    triggerSource: 'None',
    details: 'All systems normal. Monitoring weather maps and news feeds.',
    affectedLevels: 'None',
    workSuspension: false,
    timestamp: new Date().toISOString()
};

// Simulated AI Decision Matrix based on official disaster criteria
function evaluateDisasterData(weatherData, newsData) {
    const { typhoonSignal, rainfallWarning, floodDetected } = weatherData;
    const { LGUDeclaration } = newsData;

    // Automatic triggers (e.g., Orange/Red rainfall, TCWS 3+, or severe flooding)
    if (rainfallWarning === 'RED' || rainfallWarning === 'ORANGE' || typhoonSignal >= 2 || floodDetected || LGUDeclaration) {
        return {
            status: 'CRITICAL',
            triggerSource: LGUDeclaration ? 'Official News / LGU Bulletin' : 'PAGASA Weather Map / Sensor Array',
            details: `Alert Level Met. Signal: ${typhoonSignal}, Rainfall: ${rainfallWarning}, Flood Status: ${floodDetected ? 'Active' : 'Clear'}`,
            affectedLevels: 'All Levels (Preschool to Tertiary & Graduate School)',
            workSuspension: typhoonSignal >= 3 || rainfallWarning === 'RED' || LGUDeclaration
        };
    }
    
    return {
        status: 'NORMAL',
        triggerSource: 'None',
        details: 'Weather parameters within safe operational bounds.',
        affectedLevels: 'None',
        workSuspension: false
    };
}

// Polling simulation for Weather Maps and News Feeds
async function runAIMonitoringLoop() {
    try {
        // In production, fetch from real APIs (e.g., PAGASA open API, NewsAPI, Mapbox hazard layers)
        // Mock payload representing live fetched data check:
        const simulatedLiveFeed = {
            weatherData: {
                typhoonSignal: 0, // e.g., 0 to 5
                rainfallWarning: 'NONE', // NONE, YELLOW, ORANGE, RED
                floodDetected: false
            },
            newsData: {
                LGUDeclaration: false // Flag picked up from web scraping or news parsing tickers
            }
        };

        const evaluation = evaluateDisasterData(simulatedLiveFeed.weatherData, simulatedLiveFeed.newsData);
        
        if (evaluation.status !== systemState.status) {
            systemState = { ...evaluation, timestamp: new Date().toISOString() };
            
            // Broadcast update to all HUD clients via WebSockets
            io.emit('hudUpdate', systemState);

            if (systemState.status === 'CRITICAL') {
                await dispatchNotifications(systemState);
            }
        }
    } catch (error) {
        console.error('Error in AI Monitoring Loop:', error);
    }
}

// Notification Dispatcher (SMS, Push, Webhook)
async function dispatchNotifications(state) {
    console.log('[NOTIFICATION DISPATCHER] Critical Weather Event Detected!');
    console.log(`-> ANNOUNCEMENT: NO CLASSES IN ALL LEVELS & WORK SUSPENSION`);
    console.log(`-> Details: ${state.details}`);
    
    // Example integration hook for Twilio / OneSignal / Firebase Cloud Messaging (FCM)
    /*
    await axios.post('https://api.twilio.com/2010-04-10/Accounts/...', {
        To: '+63917XXXXXXXX',
        Body: `WALANG PASOK: Classes in all levels and work suspended due to severe weather warnings.`
    });
    */
}

// Schedule AI check every 1 minute
cron.schedule('* * * * *', () => {
    runAIMonitoringLoop();
});

// Manual override endpoint for testing or admin override
app.post('/api/trigger-emergency', (req, res) => {
    systemState = {
        status: 'CRITICAL',
        triggerSource: 'Manual Admin Override / Direct News Feed Match',
        details: 'Manual forced activation due to rapid flash flood reports.',
        affectedLevels: 'All Levels (Pre-school to Tertiary)',
        workSuspension: true,
        timestamp: new Date().toISOString()
    };
    io.emit('hudUpdate', systemState);
    dispatchNotifications(systemState);
    res.json({ success: true, state: systemState });
});

app.get('/api/status', (req, res) => {
    res.json(systemState);
});

server.listen(3000, () => {
    console.log('AI Disaster Response & HUD Server running on port 3000');
});



