        socket.on('hudSync', (state) => {
            renderHUD(state);
        });

        fetch('/api/telemetry')
            .then(res => res.json())
            .then(state => renderHUD(state));

        function renderHUD(state) {
            const banner = document.getElementById('statusBanner');
            document.getElementById('systemStatus').innerText = state.systemStatus;
            document.getElementById('threatLevel').innerText = state.threatLevel;
            document.getElementById('classesDirective').innerText = state.directive.classes;
            document.getElementById('workDirective').innerText = state.directive.work;

            const triggerUl = document.getElementById('triggersList');
            triggerUl.innerHTML = '';
            if (state.activeTriggers.length === 0) {
                triggerUl.innerHTML = '<li>None</li>';
            } else {
                state.activeTriggers.forEach(t => {
                    const li = document.createElement('li');
                    li.innerText = t;
                    triggerUl.appendChild(li);
                });
            }

            if (state.systemStatus === 'CRITICAL_EMERGENCY') {
                banner.classList.add('critical');
            } else {
                banner.classList.remove('critical');
            }

            const logBox = document.getElementById('logBox');
            logBox.innerHTML = '';
            state.telemetryLogs.forEach(log => {
                const div = document.createElement('div');
                div.innerText = `[${log.timestamp.slice(11, 19)}] [${log.level}] ${log.message}`;
                logBox.appendChild(div);
            });
        }

        function triggerManualOverride() {
            fetch('/api/force-trigger', { method: 'POST' })
                .then(res => res.json())
                .then(data => console.log('Manual override response:', data));
        }
