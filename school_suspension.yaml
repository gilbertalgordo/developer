                <p style="margin-top: 15px;">Work Suspension Directive:</p>
                <div id="workDirective" class="directive-highlight">Normal Operations</div>
                <p style="margin-top: 15px;">Active Triggers detected by Map/News AI:</p>
                <ul id="triggersList" style="color: #fca5a5; margin: 0; padding-left: 20px;">
                    <li>None</li>
                </ul>
            </div>

            <div class="panel">
                <h3>⚙️ Command Controls</h3>
                <p style="font-size: 0.9rem; color: #9ca3af;">Manually override autonomic sensors to test message notifications and HUD alarm states.</p>
                <button onclick="triggerManualOverride()">FORCE EMERGENCY BROADCAST</button>
                
