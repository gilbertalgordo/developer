    # Generate main system HUD Icon
    engine_svg = generate_svg_icon("engine")
    engine_path = os.path.join(output_dir, "unlimited_engine_hud.svg")
    with open(engine_path, "w", encoding="utf-8") as f:
        f.write(engine_svg)
        
    # Generate stream transmission node Icon
    stream_svg = generate_svg_icon("stream")
    stream_path = os.path.join(output_dir, "media_stream_node.svg")
    with open(stream_path, "w", encoding="utf-8") as f:
        f.write(stream_svg)
        
    print(f"Icons compiled successfully to directory: {output_dir}")
    print(f" - {engine_path}")
    print(f" - {stream_path}")

if __name__ == "__main__":
