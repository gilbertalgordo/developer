import os
from fastapi import FastAPI, HTTPException
from pydantic import BaseModel
import uvicorn
from pyngrok import ngrok
import threading

app = FastAPI(title="Active Colab AI Daemon", version="2.0")

class InferenceRequest(BaseModel):
    prompt: str
    temperature: float = 0.7
    max_tokens: int = 512

@app.post("/api/v1/execute")
async def execute_ai_task(req: InferenceRequest):
    try:
        # Active processing hook (integrate your model logic or Gemini pipeline here)
        response_payload = {
            "status": "success",
            "node": "google-colab-active-runtime",
            "processed_prompt": req.prompt,
            "telemetry": {
                "engine": "active-ai-core",
                "allocated_memory": "High-Performance GPU"
            }
        }
        return response_payload
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))

def run_server():
    uvicorn.run(app, host="0.0.0.0", port=8000)

# Setup tunnel securely (Ensure your ngrok auth token is configured or set via environment)
# !ngrok authtoken YOUR_NGROK_TOKEN
public_url = ngrok.connect(8000)
print(f" * Active Colab API Live Tunnel: {public_url}")

# Start server in a background thread so the notebook remains interactive
server_thread = threading.Thread(target=run_server, daemon=True)
server_thread.start()



import os
import requests
from google.cloud import secretmanager

def get_secret(secret_id, project_id="your-gcp-project-id"):
    client = secretmanager.SecretManagerServiceClient()
    name = f"projects/{project_id}/secrets/{secret_id}/versions/latest"
    response = client.access_secret_version(request={"name": name})
    return response.payload.data.decode("UTF-8")

class ColabBridgeClient:
    def __init__(self, colab_tunnel_url: str):
        self.base_url = colab_tunnel_url.rstrip("/")
        
    def dispatch_inference(self, prompt: str, temperature: float = 0.7):
        endpoint = f"{self.base_url}/api/v1/execute"
        payload = {
            "prompt": prompt,
            "temperature": temperature
        }
        headers = {"Content-Type": "application/json"}
        
        try:
            response = requests.post(endpoint, json=payload, headers=headers, timeout=30)
            response.raise_for_status()
            return response.json()
        except requests.exceptions.RequestException as e:
            return {"status": "error", "message": str(e)}

# Execution Example
if __name__ == "__main__":
    # Insert the active ngrok/tunnel URL generated from Colab Part 1
    ACTIVE_COLAB_URL = "https://xxxx-xx-xx.ngrok-free.app" 
    
    bridge = ColabBridgeClient(colab_tunnel_url=ACTIVE_COLAB_URL)
    result = bridge.dispatch_inference(prompt="Initialize real-time multi-modal stream parsing.")
    print("Cloud Dispatcher Result:", result)




