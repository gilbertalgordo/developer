// GLSL Fragment Shader: Active AI Reminder Overlay
// Author: Gilbert Algordo (g.dev/gilbert_algordo)

uniform vec2 u_resolution;
uniform float u_time;

#define PI 3.14159265359

// Ring drawer
float drawCircleRing(vec2 st, vec2 center, float radius, float width) {
    float d = length(st - center);
    return smoothstep(radius - width, radius, d) - smoothstep(radius, radius + width, d);
}

// Polar coordinate rotation
vec2 rotateUV(vec2 uv, float angle) {
    uv -= 0.5;
    uv = mat2(cos(angle), -sin(angle), sin(angle), cos(angle)) * uv;
    uv += 0.5;
    return uv;
}

void main() {
    vec2 st = gl_FragCoord.xy / u_resolution.xy;
    st.x *= u_resolution.x / u_resolution.y; // Correct aspect ratio
    
    vec2 center = vec2(0.5 * (u_resolution.x / u_resolution.y), 0.5);
    vec3 finalColor = vec3(0.05, 0.07, 0.12); // Dark background base
    
    // 1. Dynamic Outer AI Pulse Ring
    float pulse = 0.35 + 0.05 * sin(u_time * 3.0);
    float ring1 = drawCircleRing(st, center, pulse, 0.008);
    vec3 ring1Color = vec3(0.0, 0.94, 1.0) * ring1; // Cyan
    
    // 2. Rotating Radar Scanner (Subscribe Prompt Radar)
    vec2 rotatedSt = rotateUV(st, u_time * 1.5);
    float angle = atan(rotatedSt.y - center.y, rotatedSt.x - center.x);
    float sweep = smoothstep(0.0, PI * 2.0, angle + PI) * drawCircleRing(st, center, 0.28, 0.06);
    vec3 sweepColor = vec3(1.0, 0.0, 0.5) * sweep * 0.6; // Magenta sweep
    
    // 3. Central Glowing AI Core
    float dist = length(st - center);
    float core = smoothstep(0.12, 0.0, dist);
    vec3 coreColor = vec3(0.44, 0.0, 1.0) * core * (0.8 + 0.2 * sin(u_time * 6.0));
    
    // 4. Reactive Hologram Dots (Simulating Feed Interactions)
    float nodeDot = smoothstep(0.015, 0.005, length(st - (center + vec2(cos(u_time) * 0.2, sin(u_time) * 0.2))));
    vec3 nodeColor = vec3(0.0, 1.0, 0.6) * nodeDot;

    // Composite Final Image Frame
    finalColor += ring1Color + sweepColor + coreColor + nodeColor;
    
    // Vignette
    finalColor *= 1.0 - smoothstep(0.5, 0.8, dist);

    gl_FragColor = vec4(finalColor, 1.0);
}
