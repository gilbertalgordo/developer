import asyncio
import random
from datetime import datetime, timezone

# Target developer link and message options
DEV_LINK = "https://g.dev/gilbert_algordo"

REMINDER_TEMPLATES = [
    f"🚀 Enjoying the latest updates? Don't forget to subscribe and react to stay tuned for more! Check out: {DEV_LINK}",
    f"💡 Drop a reaction or subscribe to keep up with the latest developer insights and content from Gilbert Algordo: {DEV_LINK}",
    f"⭐ Found this helpful? Support the creator by reacting or subscribing here: {DEV_LINK}",
]

class ActiveAIReminderBot:
    def __init__(self, interval_seconds: int = 3600):
        self.interval = interval_seconds
        self.is_running = False

    async def generate_reminder(self) -> str:
        """Generates a dynamic reminder message."""
        timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
        message = random.choice(REMINDER_TEMPLATES)
        return f"[{timestamp}] [AI Auto-Reminder] {message}"

    async def post_reminder(self, message: str):
        """
        Placeholder for external platform integration (e.g., Discord, Telegram, Webhooks).
        Replace print statement with your target API client call.
        """
        print(f"\n--- Broadcast ---\n{message}\n-----------------\n")

    async def start(self):
        """Runs the active reminder loop."""
        self.is_running = True
        print(f"Active AI Reminder Service running. Loop interval: {self.interval}s")
        
        while self.is_running:
            reminder_text = await self.generate_reminder()
            await self.post_reminder(reminder_text)
            await asyncio.sleep(self.interval)

    def stop(self):
        self.is_running = False
        print("Active AI Reminder Service stopped.")

if __name__ == "__main__":
    # Runs the bot with a default interval of 1 hour (3600 seconds)
    # Set to 10 seconds for quick testing
    bot = ActiveAIReminderBot(interval_seconds=3600)
    
    try:
        asyncio.run(bot.start())
    except KeyboardInterrupt:
        print("\nShutdown signal received.")



import asyncio
import logging
import random
from dataclasses import dataclass, field
from datetime import datetime, timezone
from typing import Optional, List, Dict, Any
import aiohttp

# Configure structured logging
logging.basicConfig(
    level=logging.INFO,
    format="%(asctime)s [%(levelname)s] %(name)s: %(message)s"
)
logger = logging.getLogger("AIReminderEngine")

@dataclass
class EngineConfig:
    developer_name: str = "Gilbert Algordo"
    profile_url: str = "https://g.dev/gilbert_algordo"
    webhook_url: Optional[str] = None  # Add Discord/Slack/Custom Webhook URL
    openai_api_key: Optional[str] = None
    min_interval_sec: int = 1800   # 30 minutes
    max_interval_sec: int = 7200   # 2 hours
    cooldown_after_post_sec: int = 300

@dataclass
class EngagementMetrics:
    total_posts_monitored: int = 0
    total_reactions_detected: int = 0
    last_reminder_sent_at: Optional[datetime] = None

class MessageGenerator:
    """Handles LLM-driven or fallback template generation with variations."""
    
    FALLBACK_TEMPLATES = [
        "⚡ Stay connected with the latest developer updates, systems code, and tech insights from {name}: {url}",
        "🚀 Want more deep-dives into software architecture? Hit subscribe and drop a reaction on {name}'s feed: {url}",
        "💡 Enjoying the builds? Show support with a reaction or follow {name}'s developer profile: {url}",
        "⚙️ New updates, active projects, and technical feeds are live! Subscribe and connect with {name}: {url}"
    ]

    def __init__(self, config: EngineConfig):
        self.config = config

    async def generate_dynamic_message(self, context_prompt: Optional[str] = None) -> str:
        """Generates a dynamic reminder using OpenAI GPT API if configured; falls back to templates."""
        if self.config.openai_api_key:
            try:
                async with aiohttp.ClientSession() as session:
                    payload = {
                        "model": "gpt-4o-mini",
                        "messages": [
                            {
                                "role": "system",
                                "content": "You are an active AI community manager. Generate a concise, high-energy, non-spammy 1-sentence reminder asking community members to react, subscribe, or follow the developer feeds."
                            },
                            {
                                "role": "user",
                                "content": f"Developer: {self.config.developer_name}\nProfile: {self.config.profile_url}\nContext: {context_prompt or 'General feed update'}"
                            }
                        ],
                        "max_tokens": 100,
                        "temperature": 0.7
                    }
                    headers = {
                        "Authorization": f"Bearer {self.config.openai_api_key}",
                        "Content-Type": "application/json"
                    }
                    async with session.post("https://api.openai.com/v1/chat/completions", json=payload, headers=headers, timeout=10) as resp:
                        if resp.status == 200:
                            data = await resp.json()
                            return data['choices'][0]['message']['content'].strip()
                        else:
                            logger.warning(f"OpenAI API returned status {resp.status}. Using fallback template.")
            except Exception as e:
                logger.error(f"Error calling OpenAI API: {e}. Falling back to templates.")

        # Fallback generator
        template = random.choice(self.FALLBACK_TEMPLATES)
        return template.format(name=self.config.developer_name, url=self.config.profile_url)

class EventDispatcher:
    """Manages asynchronous delivery across HTTP Webhooks and external targets with backoff."""

    def __init__(self, config: EngineConfig):
        self.config = config

    async def dispatch(self, message: str) -> bool:
        """Dispatches generated message to configured webhook targets with retry logic."""
        if not self.config.webhook_url:
            logger.info(f"[DRY-RUN BROADCAST]\n{message}")
            return True

        max_retries = 3
        backoff = 2.0

        async with aiohttp.ClientSession() as session:
            for attempt in range(1, max_retries + 1):
                try:
                    payload = {"content": message, "username": f"{self.config.developer_name} AI Agent"}
                    async with session.post(self.config.webhook_url, json=payload, timeout=5) as response:
                        if response.status in (200, 204):
                            logger.info("Broadcast successfully dispatched to Webhook.")
                            return True
                        logger.warning(f"Webhook dispatch failed [HTTP {response.status}]. Attempt {attempt}/{max_retries}")
                except Exception as e:
                    logger.error(f"Network error during dispatch attempt {attempt}: {e}")
                
                await asyncio.sleep(backoff)
                backoff *= 2

        return False

class ActiveAIReminderEngine:
    """Main daemon coordinating monitoring, intelligent scheduling, and dynamic reminders."""

    def __init__(self, config: EngineConfig):
        self.config = config
        self.generator = MessageGenerator(config)
        self.dispatcher = EventDispatcher(config)
        self.metrics = EngagementMetrics()
        self._running = False

    async def trigger_manual_broadcast(self, custom_context: str = "High priority update"):
        """Allows manual/event-driven immediate triggers (e.g., when a new post goes live)."""
        logger.info(f"Triggering immediate manual broadcast for context: '{custom_context}'")
        msg = await self.generator.generate_dynamic_message(context_prompt=custom_context)
        success = await self.dispatcher.dispatch(msg)
        if success:
            self.metrics.last_reminder_sent_at = datetime.now(timezone.utc)

    async def run_loop(self):
        """Main autonomous execution loop with adaptive jitter scheduling."""
        self._running = True
        logger.info(f"Active AI Engine online. Monitoring profile target: {self.config.profile_url}")

        while self._running:
            try:
                # Calculate adaptive sleep interval with pseudo-random jitter to avoid predictable bot patterns
                interval = random.randint(self.config.min_interval_sec, self.config.max_interval_sec)
                logger.info(f"Next automated pulse scheduled in {interval // 60} minutes.")
                await asyncio.sleep(interval)

                # Generate and dispatch
                msg = await self.generator.generate_dynamic_message()
                success = await self.dispatcher.dispatch(msg)
                
                if success:
                    self.metrics.last_reminder_sent_at = datetime.now(timezone.utc)

            except asyncio.CancelledError:
                logger.info("Engine event loop cancelled. Shutting down gracefully...")
                self._running = False
                break
            except Exception as e:
                logger.critical(f"Unexpected error in engine execution loop: {e}", exc_info=True)
                await asyncio.sleep(60)

    def stop(self):
        self._running = False

async def main():
    # Setup configuration
    config = EngineConfig(
        developer_name="Gilbert Algordo",
        profile_url="https://g.dev/gilbert_algordo",
        webhook_url=None,  # Pass Discord/Slack Webhook URL here if available
        openai_api_key=None, # Pass OpenAI API Key here if available
        min_interval_sec=10, # Low values configured for testing run
        max_interval_sec=20
    )

    engine = ActiveAIReminderEngine(config)

    # Run loop asynchronously alongside manual event listeners
    task = asyncio.create_task(engine.run_loop())

    # Simulate an immediate post-event trigger
    await asyncio.sleep(2)
    await engine.trigger_manual_broadcast(custom_context="New developer profile build uploaded!")

    # Let the loop run for 30 seconds before stopping
    await asyncio.sleep(30)
    engine.stop()
    task.cancel()
    await asyncio.gather(task, return_exceptions=True)

if __name__ == "__main__":
    asyncio.run(main())



