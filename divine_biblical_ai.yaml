                    source_reference="John 14:6"
                )
            ]
        )

        self.corpus["GEN"] = genesis
        self.corpus["EXO"] = exodus
        self.corpus["JHN"] = john

    def query_verbatim_text(self, book_code: str, chapter: int, verse: int) -> Optional[str]:
        """Retrieves exact word-for-word text from original manuscripts."""
        book = self.corpus.get(book_code.upper())
        if book and chapter in book.verbatim_verses and verse in book.verbatim_verses[chapter]:
            return book.verbatim_verses[chapter][verse]
        return None

    def export_chronological_schema(self) -> str:
        """Exports strict historical timelines and authorship profiles."""
        sorted_books = sorted(self.corpus.values(), key=lambda x: x.chronological_rank)
        schema = [
            {
                "Rank": b.chronological_rank,
                "Book": b.canonical_title,
                "Original Author": b.original_author,
                "Era": b.composition_era,
                "Language": b.primary_language
            }
            for b in sorted_books
        ]
        return json.dumps(schema, indent=4, ensure_ascii=False)


