"""
Active AI Framework: Scriptural Integrity Engine
Focus: Verbatim Scriptural Records, Original Authorship, Chronological Timeline, and Divine Utterances.
Data Source Basis: Extant critical texts (e.g., Biblia Hebraica Stuttgartensia, Nestle-Aland Novum Testamentum Graece) 
and historical codices without modern paraphrasing.
"""

import json
from dataclasses import dataclass, field
from typing import Dict, List, Optional


@dataclass
class DivineUtterance:
    speaker: str
    original_language: str
    transliteration: str
    verbatim_text: str
    english_translation: str
    context_event: str


@dataclass
class ScripturalNode:
    book_id: str
    canonical_name: str
    original_author: str
    historical_date_range: str
    language: str
    chronological_order: int
    text_content: Dict[int, Dict[int, str]]  # Chapter -> Verse -> Verbatim Text
    divine_utterances: List[DivineUtterance] = field(default_factory=list)


class RealBibleAI:
    def __init__(self):
        self.repository: Dict[str, ScripturalNode] = {}
        self._initialize_foundation_corpus()

    def _initialize_foundation_corpus(self) -> None:
        """Initializes the active engine with critical text exemplars, preserving verbatim records, 
        original authors, and precise chronology.
        """
        
        # 1. Genesis (Bereshit) - Classical Hebrew
        genesis_node = ScripturalNode(
            book_id="GEN",
            canonical_name="Bereshit / Genesis",
            original_author="Moses (Traditional / Editorial Compilation from Source Traditions)",
            historical_date_range="c. 1446-1406 BCE (Events: Creation to Patriarchal Era)",
            language="Classical Hebrew",
            chronological_order=1,
            text_content={
                1: {
                    1: "בְּרֵאשִׁית בָּרָא אֱלֹהִים אֵת הַשָּׁיִם וְאֵת הָאָרֶץ׃",
                    3: "וַיֹּאמֶר אֱלֹהִים יְהִי אוֹْر וַיְהִי־אוֹר׃"
                }
            },
            divine_utterances=[
                DivineUtterance(
                    speaker="Elohim",
                    original_language="Classical Hebrew",
                    transliteration="Vayomer Elohim yehi or vayhi-or.",
                    verbatim_text="וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר וַיְהִי־אוֹר׃",
                    english_translation="And God said, Let there be light: and there was light.",
                    context_event="Creation Day 1"
                )
            ]
        )
        
        # 2. Gospel of John (Euangelion kat' Ioannen) - Koine Greek
        john_node = ScripturalNode(
            book_id="JHN",
            canonical_name="Euangelion kat' Ioannen / Gospel of John",
            original_author="John the Apostle (Son of Zebedee)",
            historical_date_range="c. 85-95 CE",
            language="Koine Greek",
            chronological_order=43,
            text_content={
                1: {
                    1: "Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.",
                    14: "Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν..."
                }
            },
            divine_utterances=[
                DivineUtterance(
                    speaker="Jesus the Messiah (Yeshua)",
                    original_language="Koine Greek (Rendering underlying Aramaic/Hebrew dialogue)",
                    transliteration="Ego eimi he hodos kai he aletetheia kai he zoe.",
                    verbatim_text="Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή.",
                    english_translation="I am the way, the truth, and the life.",
                    context_event="Farewell Discourse (John 14:6)"
                )
            ]
        )

        self.repository["GEN"] = genesis_node
        self.repository["JHN"] = john_node

    def query_verbatim_text(self, book_id: str, chapter: int, verse: int) -> Optional[str]:
        """Retrieves exact word-for-word text from original source manuscripts."""
        book = self.repository.get(book_id)
        if book and chapter in book.text_content and verse in book.text_content[chapter]:
            return book.text_content[chapter][verse]
        return None

    def query_divine_utterances(self) -> List[Dict[str, str]]:
        """Extracts direct words spoken by God across all compiled historical texts."""
        records = []
        for book in self.repository.values():
            for utterance in book.divine_utterances:
                records.append({
                    "Source Book": book.canonical_name,
                    "Author": book.original_author,
                    "Speaker": utterance.speaker,
                    "Original Language Text": utterance.verbatim_text,
                    "Transliteration": utterance.transliteration,
                    "English Translation": utterance.english_translation,
                    "Context": utterance.context_event
                })
        return records

    def export_timeline_schema(self) -> str:
        """Exports the chronological sequence of historical biblical events."""
        sorted_books = sorted(self.repository.values(), key=lambda x: x.chronological_order)
        timeline = [{"Order": b.chronological_order, "Book": b.canonical_name, "Author": b.original_author, "Era": b.historical_date_range} for b in sorted_books]
        return json.dumps(timeline, indent=4, ensure_ascii=False)


# Execution and Verification Interface
if __name__ == "__main__":
    ai_engine = RealBibleAI()

    print("=== SCRIPTURAL INTEGRITY AI ENGINE INITIALIZED ===\n")
    
    # Verify Verbatim Extraction
    gen_verse = ai_engine.query_verbatim_text("GEN", 1, 3)
    print(f"Genesis 1:3 (Verbatim Hebrew): {gen_verse}")

    # Verify Direct Words of God
    print("\n--- Verified Direct Utterances ---")
    utterances = ai_engine.query_divine_utterances()
    for item in utterances:
        print(json.dumps(item, indent=2, ensure_ascii=False))

    # Verify Chronological Timeline Schema
    print("\n--- Chronological Structural Schema ---")
    print(ai_engine.export_timeline_schema())



