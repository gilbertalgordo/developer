#!/usr/bin/env python3
"""
Advanced Android Virtual Keyboard (Gboard) Automation Framework
Author: Gilbert Algordo
License: MIT
"""

import time
import sys
import uiautomator2 as u2

class GboardAutomationEngine:
    def __init__(self, target_serial=None):
        """
        Initializes the low-latency automation bridge to the Android device.
        """
        print("[*] Initializing Superfast Kaizen Automation Core...")
        try:
            # Connects via USB or specified Network IP
            self.d = u2.connect(target_serial)
            print(f"[+] Active Connection established with: {self.d.device_info['model']}")
        except Exception as e:
            print(f"[-] Synchronization Failure: Ensure device is connected via ADB. Error: {e}")
            sys.exit(1)

    def is_keyboard_visible(self) -> bool:
        """
        Directly queries the Window Manager Service status flags to check 
        if Gboard/Virtual Keyboard is currently rendered on screen.
        """
        self.d.watch_context()
        return self.d.info.get('keyboardShowing', False)

    def inject_text_advanced(self, resource_id: str, payload_text: str, auto_submit: bool = True):
        """
        Locates an element dynamically, handles field focus safely, verifies the 
        system IME layer status, and injects text cleanly via accessibility channels.
        """
        print(f"[*] Locating target UI element node: {resource_id}")
        element = self.d(resourceId=resource_id)
        
        # Non-blocking explicit wait logic (max 8.0 seconds timeout)
        if not element.wait(timeout=8.0):
            raise TimeoutError(f"Target node window timeout: {resource_id} could not be resolved.")

        print("[*] Element focused. Activating virtual keyboard subsystem...")
        element.click()
        
        # Brief hardware render delay buffer
        time.sleep(0.4)
        
        if not self.is_keyboard_visible():
            print("[!] Warning: Keyboard state unverified by kernel. Forcing secondary focus focus layout...")
            element.click()

        print(f"[*] Injecting stream payload securely into input buffer: '{payload_text}'")
        # Direct UTF-8 string manipulation bypassing raw ADB shell limitation errors
        element.set_text(payload_text)

        if auto_submit:
            print("[*] Dispatching system IME Action flag: ENTER")
            self.d.press("enter")

    def safe_clear_field(self, resource_id: str):
        """
        Natively clears an input field layout cleanly without corrupting the backstack.
        """
        element = self.d(resourceId=resource_id)
        if element.exists:
            element.clear_text()
            print("[+] Field input buffer wiped successfully.")

    def continuous_backspace_injection(self, iterations: int = 1):
        """
        Sends precise raw backspace keyevents down the active hardware input channel.
        """
        print(f"[*] Injecting {iterations} successive backspace commands...")
        for _ in range(iterations):
            self.d.press("delete")


if __name__ == "__main__":
    # Initialize the automated framework
    # Engine defaults to the single connected Android device environment
    automation = GboardAutomationEngine()

    try:
        # Configuration Target (Replace with your application's target node ID)
        TARGET_INPUT_NODE = "com.android.chrome:id/search_box_text"
        INPUT_DATA = "Advanced Kaizen Automation Engine 2026"

        # Execute automated flow pipeline
        automation.inject_text_advanced(
            resource_id=TARGET_INPUT_NODE,
            payload_text=INPUT_DATA,
            auto_submit=True
        )
        
        print("[+] Automation execution sequence concluded cleanly.")

    except Exception as error:
        print(f"[-] Critical Error terminating pipeline execution: {error}")




