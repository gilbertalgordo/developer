<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for the Smartphone Screen -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111726" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Gboard Spacebar Accent Glow -->
    <linearGradient id="spaceGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Key Engine Soft Shadow Filter -->
    <filter id="keyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Glassmorphic HUD Header Gradient -->
    <linearGradient id="hudHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .hud-label { font-size: 10px; fill: #0284c7; letter-spacing: 2px; font-weight: bold; opacity: 0.8; }
    .hud-value { font-size: 12px; fill: #f8fafc; font-family: monospace; }
    .key-text { font-size: 22px; fill: #e2e8f0; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
    .key-subtext { font-size: 10px; fill: #64748b; text-anchor: end; }
    .special-key { font-size: 14px; fill: #94a3b8; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .icon-glyph { fill: #94a3b8; }
    .trace-line { stroke: #38bdf8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 800; stroke-dashoffset: 0; filter: drop-shadow(0px 0px 8px #0ea5e9); opacity: 0.85; }
    .trace-node { fill: #ffffff; stroke: #0ea5e9; stroke-width: 3; filter: drop-shadow(0px 0px 6px #38bdf8); }
  </style>

  <!-- Main UI Canvas Background -->
  <rect width="800" height="500" rx="24" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- ==================== AUTOMATION HUD OVERLAY ==================== -->
  <g id="hud-dashboard" class="font-sans">
