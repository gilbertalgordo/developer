    <rect x="0" y="0" width="800" height="65" fill="url(#hudHeader)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    <line x1="0" y1="65" x2="800" y2="65" stroke="#1e293b" stroke-width="1" />

    <!-- Brand / Author Tagging -->
