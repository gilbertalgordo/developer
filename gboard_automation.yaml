      <!-- Emoji/Globe Language Key Layout Modifiers -->
      <g transform="translate(131, 0)">
        <rect width="65" height="54" rx="6" fill="#19202e" filter="url(#keyShadow)"/>
        <!-- Globe Grid Web Wireframe Icon Circle Vector -->
        <circle cx="32" cy="27" r="11" fill="none" stroke="#94a3b8" stroke-width="2" />
