        <!-- Backspace Left facing Arrow X icon -->
        <path d="M 52,27 L 62,17 M 62,27 L 52,17" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" transform="translate(10, 5)"/>
        <path d="M 68,15 H 52 L 40,27 L 52,39 H 68 Z" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />
      </g>
    </g>

    <!-- ROW 4 (SYMBOL MODIFIERS / COMMA / SPACEBAR ENGINE / PERIOD / IME ACTIONS) -->
    <g id="key-row-4" transform="translate(0, 242)">
      <!-- Numeric System Layout Toggle Key (?123) -->
      <g transform="translate(8, 0)">
        <rect width="115" height="54" rx="6" fill="#19202e" filter="url(#keyShadow)"/>
        <text x="57" y="29" class="font-sans special-key">?123</text>
