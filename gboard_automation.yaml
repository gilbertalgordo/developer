      <path d="M 265,15 V 19 M 265,31 V 35 M 255,25 H 259 M 271,25 H 275" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

      <!-- Vocal Voice Dictation Wave Mic Icon -->
      <g transform="translate(750, 12)">
        <rect x="0" y="2" width="10" height="16" rx="5" fill="#94a3b8" />
        <path d="M -4,10 Q 5,21 14,10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        <line x1="5" y1="18" x2="5" y2="22" stroke="#94a3b8" stroke-width="2" />
