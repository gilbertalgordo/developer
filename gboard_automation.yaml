      <!-- J --> <g transform="translate(515, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">J</text><text x="66" y="14" class="font-sans key-subtext">+</text></g>
      <!-- K --> <g transform="translate(593, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">K</text><text x="66" y="14" class="font-sans key-subtext">(</text></g>
      <!-- L --> <g transform="translate(671, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">L</text><text x="66" y="14" class="font-sans key-subtext">)</text></g>
    </g>

    <!-- ROW 3 (SHIFT CAPS / Z X C V B N M / BACKSPACE DEL) -->
    <g id="key-row-3" transform="translate(0, 180)">
      <!-- Advanced Capitalization / Shift Key Node -->
      <g transform="translate(8, 0)">
        <rect width="105" height="54" rx="6" fill="#19202e" filter="url(#keyShadow)"/>
        <!-- Upward Arrow Vector Glyph -->
        <path d="M 52,16 L 38,32 H 46 V 40 H 58 V 32 H 66 Z" fill="#94a3b8" />
      </g>
      
      <!-- Character Set Keys -->
      <!-- Z --> <g transform="translate(121, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">Z</text><text x="66" y="14" class="font-sans key-subtext">!</text></g>
      <!-- X --> <g transform="translate(199, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">X</text><text x="66" y="14" class="font-sans key-subtext">"</text></g>
      <!-- C --> <g transform="translate(277, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">C</text><text x="66" y="14" class="font-sans key-subtext">'</text></g>
      <!-- V --> <g transform="translate(355, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">V</text><text x="66" y="14" class="font-sans key-subtext">:</text></g>
      <!-- B --> <g transform="translate(433, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">B</text><text x="66" y="14" class="font-sans key-subtext">;</text></g>
      <!-- N --> <g transform="translate(511, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">N</text><text x="66" y="14" class="font-sans key-subtext">/</text></g>
      <!-- M --> <g transform="translate(589, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">M</text><text x="66" y="14" class="font-sans key-subtext">?</text></g>

