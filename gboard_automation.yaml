import time
from ppadb.client import Client as AdbClient

def connect_device():
    # Connect to the local ADB server
    client = AdbClient(host="127.0.0.1", port=5037)
    devices = client.devices()
    
    if len(devices) == 0:
        print("[-] No devices found. Make sure USB Debugging is enabled.")
        return None
    
    print(f"[+] Connected to: {devices[0].serial}")
    return devices[0]

def keyboard_automation():
    device = connect_device()
    if not device:
        return

    # 1. Open a target app (e.g., Google Chrome)
    print("[*] Opening application...")
    device.shell("am start -a android.intent.action.VIEW -d https://www.google.com")
    time.sleep(3) # Wait for app to load

    # 2. Simulate a click on the search/text bar to wake up GBoard
    # Adjust X and Y coordinates based on your screen resolution
    print("[*] Focusing text field...")
    device.shell("input tap 500 1000") 
    time.sleep(1)

    # 3. Input text directly into the focused field
    print("[*] Typing text...")
    message = "Hello_World_from_Automation" # Use underscores or escape spaces
    device.shell(f"input text '{message}'")
    time.sleep(1)

    # 4. Press 'Enter' key to submit
    print("[*] Pressing Enter key...")
    device.shell("input keyevent 66") # 66 is the keycode for KEYCODE_ENTER

if __name__ == "__main__":
    keyboard_automation()




