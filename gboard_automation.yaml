    <text x="30" y="48" class="hud-value" style="font-size: 16px; font-weight: bold; fill: #38bdf8;">GBOARD_AUTOMATION_v2.6</text>

    <!-- Automation Parameters Status Matrix -->
    <text x="320" y="28" class="hud-label">TARGET IME</text>
    <text x="320" y="46" class="hud-value">com.google.android.inputmethod.latin</text>

    <text x="610" y="28" class="hud-label">KERNEL STATUS</text>
    <circle cx="618" cy="42" r="5" fill="#10b981" />
    <text x="630" y="46" class="hud-value" style="fill: #10b981; font-weight: bold;">KEYBOARD_SHOWING</text>
  </g>

  <!-- ==================== GBOARD WRAPPER CONTAINER ==================== -->
  <!-- Base Keyboard Frame Grid Positioning -->
  <g id="gboard-core" transform="translate(0, 75)">
