import time
import uiautomator2 as u2

class AdvancedKeyboardAutomation:
    def __init__(self, device_ip_or_serial=None):
        """
        Initializes connection to the device. 
        If device_ip_or_serial is None, it connects to the only USB-connected device.
        """
        print("[*] Connecting to device via UIAutomator2 engine...")
        self.d = u2.connect(device_ip_or_serial)
        print(f"[+] Connected to device: {self.d.device_info['model']}")

    def ensure_keyboard_ready(self):
        """Checks if the virtual keyboard (IME) is actively showing on screen."""
        self.d.watch_context()
        # Returns True/False regarding keyboard visibility status
        return self.d.info.get('keyboardShowing', False)

    def advanced_type(self, search_resource_id, text_to_type, submit=True):
        """
        Dynamically finds an element by ID, focuses it, verifies the keyboard 
        state, types the text smoothly, and handles submissions.
        """
        print(f"[*] Searching for target input element: {search_resource_id}")
        
        # 1. Dynamic Wait (Implicit/Explicit blend) up to 10 seconds instead of sleep()
        element = self.d(resourceId=search_resource_id)
        if not element.wait(timeout=10.0):
            raise TimeoutError(f"Element {search_resource_id} not found on screen.")

        # 2. Precision click to focus the element and invoke Gboard safely
        print("[*] Element found. Focusing field...")
        element.click()
        
        # 3. Dynamic verification of keyboard visibility
        time.sleep(0.5) # Quick buffer for keyboard rendering engine
        if not self.ensure_keyboard_ready():
            print("[!] Warning: Keyboard layer not explicitly reported by system. Retrying focus...")
            element.click()

        # 4. Input injection via native IME wrapper (handles spaces and special characters perfectly)
        print(f"[*] Injecting string data safely: '{text_to_type}'")
        element.set_text(text_to_type)

        # 5. Native IME action triggers (Simulating Gboard 'Search' or 'Go' Action flags)
        if submit:
            print("[*] Dispatching Keyevent: ENTER/SUBMIT")
            # Action code 66 handles IME_ACTION_DONE / ENTER natively
            self.d.press("enter")

    def clear_input_field(self, search_resource_id):
        """Natively clears a text field cleanly using UIAutomator selection methods."""
        element = self.d(resourceId=search_resource_id)
        if element.exists:
            element.clear_text()
            print("[+] Field cleared successfully.")

    def continuous_backspace(self, count=5):
        """Simulates native hardware backspace strokes directly down the input channel."""
        print(f"[*] Sending {count} consecutive backspace inputs...")
        for _ in range(count):
            self.d.press("delete")


if __name__ == "__main__":
    # Initialize engine (Auto-detects USB connected phone/emulator)
    automation = AdvancedKeyboardAutomation()

    try:
        # Example Scenario: Automating a search field inside a target app
        # Replace with your target package's exact Resource ID found via Appium Inspector / uiautomatorviewer
        TARGET_INPUT_ID = "com.android.chrome:id/search_box_text"
        
        # Automate the process cleanly
        automation.advanced_type(
            search_resource_id=TARGET_INPUT_ID,
            text_to_type="Advanced Open Source Android Automation 2026",
            submit=True
        )
        
        # Optional: structural manipulation after typing
        # automation.continuous_backspace(count=4)
        
    except Exception as e:
        print(f"[-] Automation Pipeline Error: {e}")



