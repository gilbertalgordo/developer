      <rect x="0" y="0" width="800" height="50" fill="#19202e" />
      <line x1="0" y1="50" x2="800" y2="50" stroke="#222f43" stroke-width="1" />
      
      <!-- Gboard Menu Icons Chevron -->
      <path d="M 25,25 L 35,17 L 35,33 Z" class="icon-glyph" />
      
      <!-- Quick Feature Icon Elements -->
