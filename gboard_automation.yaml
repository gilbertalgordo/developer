      <!-- Y --> <g transform="translate(398, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">Y</text><text x="66" y="14" class="font-sans key-subtext">6</text></g>
      <!-- U --> <g transform="translate(476, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">U</text><text x="66" y="14" class="font-sans key-subtext">7</text></g>
      <!-- I --> <g transform="translate(554, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">I</text><text x="66" y="14" class="font-sans key-subtext">8</text></g>
      <!-- O --> <g transform="translate(632, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">O</text><text x="66" y="14" class="font-sans key-subtext">9</text></g>
      <!-- P --> <g transform="translate(710, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">P</text><text x="66" y="14" class="font-sans key-subtext">0</text></g>
    </g>

    <!-- ROW 2 (A S D F G H J K L) -->
    <g id="key-row-2" transform="translate(0, 118)">
      <!-- Indented Padding alignment for A-L Row -->
      <!-- A --> <g transform="translate(47, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">A</text><text x="66" y="14" class="font-sans key-subtext">@</text></g>
      <!-- S --> <g transform="translate(125, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">S</text><text x="66" y="14" class="font-sans key-subtext">#</text></g>
      <!-- D --> <g transform="translate(203, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">D</text><text x="66" y="14" class="font-sans key-subtext">$</text></g>
      <!-- F --> <g transform="translate(281, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">F</text><text x="66" y="14" class="font-sans key-subtext">%</text></g>
      <!-- G --> <g transform="translate(359, 0)"><rect width="72" height="54" rx="6" fill="#212a3a" filter="url(#keyShadow)"/><text x="36" y="29" class="font-sans key-text">G</text><text x="66" y="14" class="font-sans key-subtext">&amp;</text></g>
