    android:description="@string/advanced_gboard_control_description" />



import os
import re
import subprocess
import time

def get_gboard_coordinates():
    """
    Queries Android Window Manager dumpsys to find the exact bounding box 
    of GBoard's active input window frame.
    """
    try:
        # Querying the window manager configuration state
        cmd = "adb shell dumpsys window windows"
        output = subprocess.check_output(cmd, shell=True, text=True)
        
        # Regex to capture the window bounds of the target Input Method window frame
        # Looks for lines like: Window #X Window{... com.google.android.inputmethod.latin/...}:
        # followed by frames geometry info
        lines = output.split('\n')
        for idx, line in enumerate(lines):
            if "com.google.android.inputmethod.latin" in line and "mFrame" in line:
                # Find geometry bounds matching text pattern e.g., mFrame=[0,1434][1080,2340]
                match = re.search(r'mFrame=\[(\d+),(\d+)\]\[(\d+),(\d+)\]', line)
                if match:
                    left, top, right, bottom = map(int, match.groups())
                    return {"left": left, "top": top, "right": right, "bottom": bottom}
    except Exception as e:
        print(f"Error parsing GBoard window bounds: {e}")
    
    # Fallback default coordinates for common 1080p display if layout calculation fails
    return {"left": 0, "top": 1450, "right": 1080, "bottom": 2340}

def advanced_inject_scroll(direction="down", speed_multiplier=1.0):
    bounds = get_gboard_coordinates()
    print(f"Targeting GBoard absolute active frame bounds: {bounds}")
    
    # Calculate dimensions
    width = bounds["right"] - bounds["left"]
    height = bounds["bottom"] - bounds["top"]
    
    x_center = bounds["left"] + (width // 2)
    
    # Calculate responsive internal touch limits utilizing 15% inner padding safety margins
    y_upper = int(bounds["top"] + (height * 0.15))
    y_lower = int(bounds["bottom"] - (height * 0.15))
    
    # Scale speed/inertia (Lower duration = Faster velocity scroll)
    duration_ms = int(200 * speed_multiplier)

    if direction == "down":
        # Finger moves upward, dragging content down to reveal lower selections
        command = f"adb shell input swipe {x_center} {y_lower} {x_center} {y_upper} {duration_ms}"
    else:
        # Finger moves downward, scrolling layout up
        command = f"adb shell input swipe {x_center} {y_upper} {x_center} {y_lower} {duration_ms}"
        
    os.system(command)

if __name__ == "__main__":
    print("Initializing Dynamic Scroll Hook...")
    # Scroll layout down smoothly
    advanced_inject_scroll(direction="down", speed_multiplier=1.2)
    time.sleep(0.5)
    # Fast flick back up
    advanced_inject_scroll(direction="up", speed_multiplier=0.8)
