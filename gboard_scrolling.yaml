package com.example.gboardcontrol

import android.accessibilityservice.AccessibilityService
import android.accessibilityservice.GestureDescription
import android.graphics.Path
import android.graphics.Rect
import android.view.accessibility.AccessibilityEvent
import android.view.accessibility.AccessibilityNodeInfo

class AdvancedGBoardController : AccessibilityService() {

    companion object {
        const val GBOARD_PACKAGE = "com.google.android.inputmethod.latin"
    }

    override fun onAccessibilityEvent(event: AccessibilityEvent) {
        // Real-time tracking of keyboard window adjustments
        if (event.packageName == GBOARD_PACKAGE) {
            val rootNode = rootInActiveWindow ?: return
            analyzeLayoutHierarchy(rootNode)
        }
    }

    /**
     * Recursively searches the current view hierarchy to locate GBoard's 
     * scrollable view containers.
     */
    private fun analyzeLayoutHierarchy(node: AccessibilityNodeInfo?) {
        if (node == null) return

        // Check if the node is scrollable (e.g., Emoji grids, sticker selectors, setting lists)
        if (node.isScrollable) {
            val bounds = Rect()
            node.getBoundsInScreen(bounds)
            // Found a valid target container area inside GBoard boundaries
            executePreciseScroll(bounds, scrollUp = false)
        }

        for (i in 0 until node.childCount) {
            analyzeLayoutHierarchy(node.getChild(i))
        }
    }

    /**
     * Generates a precise, dynamic gesture bounded entirely within the target node's coordinates.
     * Prevents accidental system navigation gestures or clicking items outside the keyboard.
     */
    fun executePreciseScroll(targetBounds: Rect, scrollUp: Boolean) {
        if (targetBounds.isEmpty) return

        val path = Path()
        
        // Calculate the horizontal midpoint of the specific GBoard component
        val centerX = targetBounds.centerX().toFloat()
        
        // Keep inside bounds by applying a 10% safety padding from top and bottom edges
        val padding = (targetBounds.height() * 0.10).toFloat()
        val topLimit = targetBounds.top.toFloat() + padding
        val bottomLimit = targetBounds.bottom.toFloat() - padding

        if (scrollUp) {
            // Drag finger from top to bottom to slide content down (scroll up)
            path.moveTo(centerX, topLimit)
            path.lineTo(centerX, bottomLimit)
        } else {
            // Drag finger from bottom to top to slide content up (scroll down)
            path.moveTo(centerX, bottomLimit)
            path.lineTo(centerX, topLimit)
        }

        val gestureBuilder = GestureDescription.Builder()
        // 50ms initial delay, 200ms quick swipe duration for snappy control response
        gestureBuilder.addStroke(GestureDescription.StrokeDescription(path, 540, 200))
        
        dispatchGesture(gestureBuilder.build(), object : GestureResultCallback() {
            override fun onCompleted(gestureDescription: GestureDescription?) {
                super.onCompleted(gestureDescription)
                // Gesture successfully delivered to the GBoard subview
            }
            override fun onCancelled(gestureDescription: GestureDescription?) {
                super.onCancelled(gestureDescription)
            }
        }, null)
    }

    override fun onInterrupt() {
        // Gracefully clean up threads or states if the system cuts the service
    }
}



