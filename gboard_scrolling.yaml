import android.accessibilityservice.AccessibilityService
import android.accessibilityservice.GestureDescription
import android.graphics.Path
import android.view.accessibility.AccessibilityEvent

class GBoardScrollController : AccessibilityService() {

    override fun onAccessibilityEvent(event: AccessibilityEvent) {
        // Optional: Detect if GBoard or an input view is currently active
        if (event.packageName == "com.google.android.inputmethod.latin") {
            // GBoard is active or changed state
        }
    }

    override fun onInterrupt() {
        // Handle service interruption safely
    }

    /**
     * Injects a vertical scroll gesture
     * @param scrollUp True to scroll up, False to scroll down
     */
    fun performScroll(scrollUp: Boolean) {
        val path = Path()
        
        // Adjust these coordinates based on target device screen real estate (usually bottom third for GBoard)
        if (scrollUp) {
            path.moveTo(540f, 1800f) // Start low
            path.lineTo(540f, 1400f) // Move up
        } else {
            path.moveTo(540f, 1400f) // Start high
            path.lineTo(540f, 1800f) // Move down
        }

        val gestureBuilder = GestureDescription.Builder()
        // 100ms delay, 300ms duration for a smooth scroll gesture
        gestureBuilder.addStroke(GestureDescription.StrokeDescription(path, 100, 300))
        
        dispatchGesture(gestureBuilder.build(), object : GestureResultCallback() {
            override fun onCompleted(gestureDescription: GestureDescription?) {
                super.onCompleted(gestureDescription)
                // Scroll gesture executed successfully
            }
        }, null)
    }
}



import os
import time

def adb_scroll(direction="down"):
    """
    Simulates a scroll swipe within the typical GBoard boundary area.
    Coordinates assume a standard 1080x2340 screen resolution.
    """
    # X, Y coordinates
    x_center = 540
    y_high = 1500
    y_low = 1900
    duration_ms = 250

    if direction == "down":
        # Swipe from high to low to scroll content downward (or reveal upper items)
        cmd = f"adb shell input swipe {x_center} {y_high} {x_center} {y_low} {duration_ms}"
    elif direction == "up":
        # Swipe from low to high to scroll content upward
        cmd = f"adb shell input swipe {x_center} {y_low} {x_center} {y_high} {duration_ms}"
    else:
        raise ValueError("Direction must be 'up' or 'down'")

    os.system(cmd)

if __name__ == "__main__":
    print("Scrolling GBoard area down...")
    adb_scroll("down")
    time.sleep(1)
    print("Scrolling GBoard area up...")
    adb_scroll("up")




