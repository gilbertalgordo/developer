import numpy as np
from scipy.signal import lfilter, butter

class ActiveAudioProcessor:
    def __init__(self, sample_rate=44100):
        self.fs = sample_rate
        # Adaptive noise floor estimate
        self.noise_floor = np.zeros(1024)
        
    def apply_noise_cancellation(self, audio_chunk):
        """
        AI-driven spectral subtraction.
        Isolates signal by subtracting estimated noise floor.
        """
        # Fast Fourier Transform for spectral analysis
        spectrum = np.fft.rfft(audio_chunk)
        magnitude = np.abs(spectrum)
        
        # Adaptive gating
        mask = (magnitude > (self.noise_floor * 1.5)).astype(float)
        cleaned_spectrum = spectrum * mask
        
        return np.fft.irfft(cleaned_spectrum)

    def apply_correction_eq(self, audio_chunk, target_freqs):
        """
        Applies band-pass filtering for clarity.
        """
        b, a = butter(2, [300, 3400], btype='bandpass', fs=self.fs)
        return lfilter(b, a, audio_chunk)

    def amplify(self, audio_chunk, gain_db=10):
        """
        Active gain control with clipping prevention.
        """
        gain_linear = 10**(gain_db / 20)
        amplified = audio_chunk * gain_linear
        # Hard limiter to prevent distortion
        return np.clip(amplified, -1.0, 1.0)

# Implementation flow
processor = ActiveAudioProcessor()

def process_stream(input_buffer):
    # 1. Noise reduction
    clean_audio = processor.apply_noise_cancellation(input_buffer)
    # 2. Clarity correction
    corrected_audio = processor.apply_correction_eq(clean_audio, [300, 3400])
    # 3. Final amplification
    final_output = processor.apply_amplify(corrected_audio, gain_db=12)
    return final_output



import numpy as np
import scipy.signal as signal

class AdvancedAudioProcessor:
    def __init__(self, n_fft=1024, hop_length=256):
        self.n_fft = n_fft
        self.hop_length = hop_length
        self.window = np.hanning(n_fft)
        self.noise_profile = None  # Learned noise floor

    def _get_stft(self, audio_chunk):
        # Transform time-domain to frequency-domain
        return np.fft.rfft(audio_chunk * self.window)

    def apply_ai_cancellation(self, audio_chunk, alpha=2.0, beta=0.01):
        """
        Spectral Subtraction with Adaptive Noise Gating.
        'alpha' controls the amount of noise reduction.
        'beta' prevents artifacts (musical noise).
        """
        spectrum = self._get_stft(audio_chunk)
        mag = np.abs(spectrum)
        phase = np.angle(spectrum)

        if self.noise_profile is None:
            self.noise_profile = mag
        
        # Estimate noise mask
        mask = np.maximum(beta, 1 - (alpha * (self.noise_profile / mag)))
        
        # Apply mask and transform back
        cleaned_spectrum = (mag * mask) * np.exp(1j * phase)
        return np.fft.irfft(cleaned_spectrum)

    def apply_dynamic_eq(self, audio_chunk, gain_map):
        """
        Applies a frequency-dependent correction based on target gains.
        gain_map: dictionary mapping frequencies to gain multipliers.
        """
        # Implement FIR filter bank for precise spectral correction
        sos = signal.iirfilter(4, [300, 3400], btype='bandpass', 
                               fs=44100, output='sos')
        return signal.sosfilt(sos, audio_chunk)

# Real-time Execution Loop
def run_audio_engine(stream_input):
    processor = AdvancedAudioProcessor()
    
    # Process incoming audio frames in a high-speed buffer
    for frame in stream_input:
        # 1. Noise Suppression
        denoised = processor.apply_ai_cancellation(frame)
        
        # 2. Spectral Correction
        final_signal = processor.apply_dynamic_eq(denoised, {"clarity": 1.2})
        
        # 3. Output to hardware
        yield final_signal
