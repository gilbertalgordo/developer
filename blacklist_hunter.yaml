    format="%(asctime)s [%(levelname)s] %(name)s: %(message)s"
)
logger = logging.getLogger("BlacklistHunterAI")

class ActiveAIBlacklistHunter:
    def __init__(self, threshold: float = 0.75):
        self.threshold = threshold
        self.active_blocklist = set()
        self.susposity_scores = {}

    def analyze_heuristics(self, log_entry: dict) -> float:
        """
        Lightweight active AI scoring mechanism evaluating multiple vectors:
        - Failed authentication attempts
        - Request frequency anomalies
        - Malicious user-agent signatures
        """
        score = 0.0
        
        # Factor 1: Failed logins or unauthorized actions
        if log_entry.get("status_code") in [401, 403]:
            score += 0.3
            
        # Factor 2: Known exploit scanners / suspicious user agents
        ua = log_entry.get("user_agent", "").lower()
        malicious_keywords = ["sqlmap", "nikto", "nmap", "masscan", "zgrab", "dirbuster"]
        if any(keyword in malicious_keywords for keyword in malicious_keywords if keyword in ua):
            score += 0.5

        # Factor 3: Rapid-fire requests (simulated rate-spike indicator)
        if log_entry.get("request_rate_per_min", 0) > 120:
            score += 0.4

        return min(score, 1.0)

    async def verify_external_threat_intel(self, ip_address: str) -> bool:
        """
        Optional asynchronous check against public or custom threat intel feeds.
        Placeholder hook for live API integration.
        """
        try:
            # Example asynchronous HTTP lookup simulation
            async with aiohttp.ClientSession() as session:
                # Replace with real API endpoint e.g., AbuseIPDB or custom intel gateway
                # async with session.get(f"https://api.threatintel.example/v1/check/{ip_address}") as resp:
                #     data = await resp.json()
                #     return data.get("is_blacklisted", False)
            return False
        except Exception as e:
            logger.error(f"Threat intel lookup failed for {ip_address}: {e}")
            return False

    async def evaluate_and_hunt(self, log_entry: dict):
        """
        Core active processing loop for incoming traffic signals.
        """
        ip = log_entry.get("ip")
        if not ip:
            return

        try:
            # Validate IP format
            ip_obj = ipaddress.ip_address(ip)
            if ip_obj.is_private or ip_obj.is_loopback:
                return  # Skip internal network traffic
        except ValueError:
            logger.warning(f"Malformed IP received: {ip}")
            return

        if ip in self.active_blocklist:
            return

        # Calculate AI heuristic score
        ai_score = self.analyze_heuristics(log_entry)
        
        # Accumulate score state
        current_score = self.susposity_scores.get(ip, 0.0) + ai_score
        self.susposity_scores[ip] = current_score

        logger.debug(f"Evaluated IP {ip} | Score Increment: {ai_score} | Cumulative: {current_score}")

        # Trigger active hunt response if threshold crossed
        if current_score >= self.threshold or await self.verify_external_threat_intel(ip):
            await self.enforce_blacklist(ip, current_score)

    async def enforce_blacklist(self, ip: str, score: float):
        """
        Action layer: Adds IP to active blocklist and pushes defensive rules.
        """
        if ip not in self.active_blocklist:
            self.active_blocklist.add(ip)
            logger.critical(f"🔒 [BLOCKLIST APPLIED] Threat isolated: IP {ip} with risk score {score:.2f}")
            
            # Hook into system-level firewalls (e.g., iptables, Cloudflare API, or Nginx map files)
            await self.sync_firewall_rule(ip)

    async def sync_firewall_rule(self, ip: str):
        """
        Simulates writing/syncing rules to edge firewalls or blocklist configurations.
        """
        rule_payload = {
            "action": "BLOCK",
            "ip": ip,
            "timestamp": datetime.utcnow().isoformat()
        }
        # In production, write to an automated JSON/YAML ruleset or execute subprocess shell command:
        # e.g., subprocess.run(["iptables", "-A", "INPUT", "-s", ip, "-j", "DROP"])
        logger.info(f"Firewall synchronization completed for target: {json.dumps(rule_payload)}")

# Simulation Harness
async def simulate_traffic_stream(hunter: ActiveAIBlacklistHunter):
    sample_traffic = [
        {"ip": "192.0.2.45", "status_code": 200, "user_agent": "Mozilla/5.0", "request_rate_per_min": 10},
