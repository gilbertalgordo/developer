def draw_raster_icon(size: int) -> Image.Image:
    """Renders high-resolution fallback raster icons for non-SVG systems."""
    img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
    draw = ImageDraw.Draw(img)
    
    scale = size / 512.0
    pad = int(10 * scale)
    
    # Outer dark body
    draw.rounded_rectangle([pad, pad, size - pad, size - pad], radius=int(80 * scale), fill=(15, 23, 42, 255), outline=(56, 189, 248, 255), width=max(1, int(6 * scale)))
    
    # HUD Circles
    center = size // 2
    r1 = int(160 * scale)
    draw.ellipse([center - r1, center - r1, center + r1, center + r1], outline=(48, 54, 61, 255), width=max(1, int(3 * scale)))
    
    # Core Diamond
    r2 = int(90 * scale)
    pts = [
        (center, center - r2),
        (center + r2, center),
        (center, center + r2),
        (center - r2, center)
    ]
    draw.polygon(pts, outline=(16, 185, 129, 255), width=max(1, int(4 * scale)))
    
    # Inner Core
    r3 = int(20 * scale)
    draw.ellipse([center - r3, center - r3, center + r3, center + r3], fill=(56, 189, 248, 255))
    
    return img

def main():
    os.makedirs(OUTPUT_DIR, exist_ok=True)
    
    # 1. Save Master SVG
    svg_path = os.path.join(OUTPUT_DIR, "icon-master.svg")
    with open(svg_path, "w", encoding="utf-8") as f:
        f.write(SVG_ICON)
    print(f"[+] Exported Master Vector: {svg_path}")

    # 2. Render PNG Formats
    sizes = [16, 32, 48, 64, 128, 256, 512]
    png_images = []
    
    for s in sizes:
        img = draw_raster_icon(s)
        out_png = os.path.join(OUTPUT_DIR, f"icon-{s}x{s}.png")
        img.save(out_png, "PNG")
        png_images.append(img)
        print(f"[+] Rendered PNG Asset: {out_png}")

    # 3. Export Windows ICO File (Multi-Resolution Bundle)
    ico_path = os.path.join(OUTPUT_DIR, "favicon.ico")
    png_images[0].save(
        ico_path,
        format="ICO",
        sizes=[(s, s) for s in [16, 32, 48, 64, 128, 256]]
    )
    print(f"[+] Generated Multi-Resolution ICO: {ico_path}")

if __name__ == "__main__":
    main()



import os
import zipfile
import json

ZIP_FILENAME = "google-ai-master-icons.zip"
SRC_DIR = "./generated_icons"

MANIFEST_DATA = {
    "name": "Google AI Master Offline Mode - Icon Pack",
    "developer": "https://g.dev/gilbert_algordo",
    "theme": "HUD Dark Cyber / Emerald Neon",
    "formats": ["SVG", "PNG", "ICO"],
    "resolutions": ["16x16", "32x32", "48x48", "64x64", "128x128", "256x256", "512x512"]
}

def package_bundle():
    # Execute generator first if assets do not exist
    if not os.path.exists(SRC_DIR):
        import generate_icons
        generate_icons.main()

    print(f"[*] Packaging assets into archive: {ZIP_FILENAME}")
    
    with zipfile.ZipFile(ZIP_FILENAME, 'w', zipfile.ZIP_DEFLATED) as zipf:
        # Include Manifest metadata
        zipf.writestr("manifest.json", json.dumps(MANIFEST_DATA, indent=2))
        print("  + Added manifest.json")

        # Include generated icons
        for root, _, files in os.walk(SRC_DIR):
            for file in files:
                filepath = os.path.join(root, file)
                arcname = os.path.relpath(filepath, SRC_DIR)
                zipf.write(filepath, arcname)
                print(f"  + Compressed: {arcname}")

    print(f"\n[+] Archive successfully generated: {ZIP_FILENAME}")

if __name__ == "__main__":
    package_bundle()
