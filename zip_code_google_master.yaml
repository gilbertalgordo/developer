            </div>
        </div>

        <!-- Main Output -->
        <div class="hud-border p-4 rounded h-96 overflow-y-auto space-y-2" id="outputConsole">
            <div class="text-gray-500">[SYSTEM] Local engine ready. Offline pipeline active.</div>
        </div>

        <!-- Telemetry Metrics Bar -->
        <div class="hud-border p-2 rounded text-xs flex justify-between text-sky-300">
            <span>TOKENS: <b id="tokCount">0</b></span>
            <span>SPEED: <b id="tokSpeed">0.00</b> tok/s</span>
            <span>LATENCY: <b id="elapsedTime">0.00</b>s</span>
        </div>

        <!-- Control Inputs -->
        <div class="flex gap-2">
            <input type="text" id="promptInput" placeholder="Enter prompt for local AI engine..." class="flex-1 bg-gray-900 border border-gray-700 p-3 rounded text-sm focus:outline-none focus:border-sky-500">
            <button onclick="runInference()" class="bg-sky-600 hover:bg-sky-500 text-white px-6 py-3 rounded text-sm font-bold">EXECUTE</button>
        </div>
    </div>

    <script>
        async function updateTelemetry() {
            try {
                const res = await fetch('/telemetry');
                const data = await res.json();
                document.getElementById('telemetry').innerText = `CPU: ${data.cpu_usage_percent}% | RAM: ${data.ram_used_gb}/${data.ram_total_gb} GB (${data.ram_percent}%)`;
            } catch (e) {}
        }
        setInterval(updateTelemetry, 2000);

        async function runInference() {
            const input = document.getElementById('promptInput');
            const consoleDiv = document.getElementById('outputConsole');
            const prompt = input.value.trim();
            if(!prompt) return;

            consoleDiv.innerHTML += `<div class="text-sky-300 font-bold">> ${prompt}</div>`;
            const responseContainer = document.createElement('div');
            responseContainer.className = "text-gray-200 pb-2 border-b border-gray-800";
            consoleDiv.appendChild(responseContainer);
            input.value = '';

            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt, max_tokens: 1024 })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ') && !line.includes('[DONE]')) {
                        const parsed = JSON.parse(line.replace('data: ', ''));
                        responseContainer.innerText += parsed.token;
                        document.getElementById('tokCount').innerText = parsed.metrics.tokens_generated;
                        document.getElementById('tokSpeed').innerText = parsed.metrics.tokens_per_sec;
                        document.getElementById('elapsedTime').innerText = parsed.metrics.elapsed_sec;
                        consoleDiv.scrollTop = consoleDiv.scrollHeight;
                    }
                }
            }
        }
    </script>
