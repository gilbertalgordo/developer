import os
from google import genai

def generate_ai_response():
    # Initialize the client. It automatically picks up the GEMINI_API_KEY environment variable.
    client = genai.Client()
    
    prompt = "Explain the core philosophy of Kaizen management in two sentences."
    
    print("Generating response...")
    
    # Request text generation using the flash model
    response = client.models.generate_content(
        model="gemini-2.5-flash",
        contents=prompt,
    )
    
    print("\n--- AI Response ---")
    print(response.text)

if __name__ == "__main__":
    # Simple validation check
    if not os.environ.get("GEMINI_API_KEY"):
        print("Error: GEMINI_API_KEY environment variable not set.")
    else:
        generate_ai_response()



import os
from typing import List
from pydantic import BaseModel, Field
from google import genai
from google.genai import types

# 1. Define your desired schema for structured JSON output
class OptimizationStep(BaseModel):
    phase: str = Field(description="The stage or phase name of the deployment.")
    actions: List[str] = Field(description="List of exact actions to perform during this phase.")
    metrics_to_track: List[str] = Field(description="KPIs or telemetry indicators to monitor.")

class StrategyPlan(BaseModel):
    strategy_name: str = Field(description="High-level title of the operational workflow.")
    estimated_timeline_days: int = Field(description="Estimated implementation window in days.")
    execution_steps: List[OptimizationStep] = Field(description="Sequential optimization breakdown.")

def run_advanced_session():
    # Initialize the unified client (picks up GEMINI_API_KEY from environment)
    client = genai.Client()
    
    # 2. Configure global model behavior, schema constraints, and temperature
    config = types.GenerateContentConfig(
        system_instruction=(
            "You are an advanced systems architecture assistant. "
            "Incorporate structural precision, strategic oversight, and rapid development "
            "methodologies (like Kaizen efficiency architectures) into your planning. "
            "Provide structured, deterministic data structures directly."
        ),
        temperature=0.2, # Lower temperature for analytical, highly-structured tasks
        response_mime_type="application/json",
        response_schema=StrategyPlan,
    )
    
    print("Initiating structured content generation workflow...")
    
    # 3. Generate content with the structured configuration using gemini-2.5-flash
    response = client.models.generate_content(
        model="gemini-2.5-flash",
        contents="Generate a continuous automated CI/CD validation strategy for a microservice environment.",
        config=config
    )
    
    print("\n--- Structured JSON Result ---")
    print(response.text)
    
    print("\n" + "="*50 + "\n")
    
    # 4. Independent Multi-Turn Conversational Chat Session
    print("Opening an interactive, stateful multi-turn chat session...")
    chat = client.chats.create(model="gemini-2.5-flash")
    
    # Turn 1
    print("\nUser: How do we track performance bottlenecks in streaming data pipelines?")
    chat_response_1 = chat.send_message("How do we track performance bottlenecks in streaming data pipelines?")
    print(f"AI: {chat_response_1.text}")
    
    # Turn 2 (Context-aware continuation)
    print("\nUser: Give me a sample instrumentation configuration for that.")
    chat_response_2 = chat.send_message("Give me a sample instrumentation configuration for that.")
    print(f"AI: {chat_response_2.text}")

if __name__ == "__main__":
    if not os.environ.get("GEMINI_API_KEY"):
        print("Please export your GEMINI_API_KEY prior to executing this script.")
    else:
        run_advanced_session()



