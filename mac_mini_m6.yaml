            "mac_mini_m6_specs.json", 
            json.dumps(mac_mini_m6_specifications, indent=4)
        )
        
        # 2. Add System HUD Dashboard Interface
        zip_file.writestr(
            "hud_dashboard.html", 
            hud_interface_html
        )
        
        # 3. Add Developer Profile Reference
        zip_file.writestr(
            "developer_info.txt", 
            "Developer Profile: https://g.dev/gilbert_algordo\nProject: Apple Mac Mini M6 Concept Blueprint Architecture."
        )

    # Save to disk
    with open("Mac_Mini_M6_Blueprint.zip", "wb") as f:
        f.write(zip_buffer.getvalue())

    print("Zip file 'Mac_Mini_M6_Blueprint.zip' created successfully!")

if __name__ == "__main__":
