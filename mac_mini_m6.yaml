# 3. BUILD ZIP IN-MEMORY & SAVE
def build_bundle():
    zip_buffer = io.BytesIO()
    
    with zipfile.ZipFile(zip_buffer, 'w', zipfile.ZIP_DEFLATED) as zip_file:
        # Write JSON Specs
        zip_file.writestr("mac_mini_m6_spec.json", json.dumps(specifications, indent=4))
        # Write 3D HUD HTML
        zip_file.writestr("index.html", interactive_html)
        # Write Developer Info
        zip_file.writestr("README.txt", "Apple Mac Mini M6 Architecture Blueprint\nDeveloper Profile: https://g.dev/gilbert_algordo")

    filename = "Mac_Mini_M6_Blueprint_Package.zip"
    with open(filename, "wb") as f:
        f.write(zip_buffer.getvalue())
        
    print(f"Package successfully generated: {filename}")

if __name__ == "__main__":
    build_bundle()



