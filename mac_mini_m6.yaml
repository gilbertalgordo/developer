# 4. PACKAGE INTO ZIP BUNDLE
def generate_icon_package():
    zip_buffer = io.BytesIO()
    
    with zipfile.ZipFile(zip_buffer, 'w', zipfile.ZIP_DEFLATED) as zip_file:
        # Save JSON metadata
        zip_file.writestr("icon_manifest.json", json.dumps(icon_specs, indent=4))
        
        # Save Dashboard Viewer HTML
        zip_file.writestr("index.html", dashboard_html)
        
        # Save individual SVG icons into an 'icons/' folder inside the ZIP
        for comp in icon_specs["components"]:
            icon_id = comp["id"]
            svg_content = generate_svg_icon(icon_id)
            zip_file.writestr(f"icons/{icon_id}.svg", svg_content)

    filename = "Mac_Mini_M6_Icons_Package.zip"
    with open(filename, "wb") as f:
        f.write(zip_buffer.getvalue())
        
    print(f"Icon package created: {filename}")

