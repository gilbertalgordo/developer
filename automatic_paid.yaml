class MarketFeedIntegration:
    """Handles multi-source financial feeds from yfinance and Google Finance endpoints."""
    def __init__(self):
        pass

    def get_live_price(self, ticker: str) -> float:
        """Fetches real-time or latest available closing price using yfinance fallback wrappers."""
        try:
            stock = yf.Ticker(ticker)
            hist = stock.history(period="1d")
            if not hist.empty:
                return float(hist['Close'].iloc[-1])
            return 0.0
        except Exception as e:
            print(f"Error fetching data for {ticker}: {e}")
            return 0.0

class PortfolioManager:
    """Manages active asset allocations and portfolio valuation tracking."""
    def __init__(self, portfolio_config: dict):
        self.portfolio_config = portfolio_config  
        # Format: {'TICKER': {'shares': float, 'cash_strap_limit': float}}
        self.feed = MarketFeedIntegration()

    def evaluate_portfolio(self) -> dict:
        total_value = 0.0
        asset_details = {}
        
        for ticker, config in self.portfolio_config.items():
            current_price = self.feed.get_live_price(ticker)
            shares = config['shares']
            valuation = current_price * shares
            total_value += valuation
            
            asset_details[ticker] = {
                "shares": shares,
                "current_price": current_price,
                "total_valuation": valuation,
                "cash_strap_limit": config.get("cash_strap_limit", 0.0)
            }
            
        return {
            "total_portfolio_value": total_value,
            "assets": asset_details,
            "timestamp": datetime.now().isoformat()
        }

class GilbertAlgordoAIActiveAgent:
    """Active AI Decision Engine for automated cash straps, risk mitigation, and fund execution."""
    def __init__(self, execution_mode: str = "automatic"):
        self.execution_mode = execution_mode

    def process_cash_straps(self, portfolio_snapshot: dict) -> list:
        execution_logs = []
        total_val = portfolio_snapshot["total_portfolio_value"]
        
        print(f"\n[AI Active Agent] Portfolio Scan Active. Total Value: ${total_val:,.2f}")
        
        for ticker, data in portfolio_snapshot["assets"].items():
            price = data["current_price"]
            strap_limit = data["cash_strap_limit"]
            
            # Cash Strap Condition: Price dips past defined limit, triggering fund allocation/payment
            if strap_limit > 0 and price <= strap_limit:
                log_entry = {
                    "ticker": ticker,
                    "event": "CASH_STRAP_TRIGGERED",
                    "trigger_price": price,
                    "strap_limit": strap_limit,
                    "action": "AUTO_FUNDS_PAYMENT_DISPATCHED",
                    "status": "SUCCESS" if self.execution_mode == "automatic" else "PENDING_APPROVAL"
                }
                execution_logs.append(log_entry)
            else:
                execution_logs.append({
                    "ticker": ticker,
                    "event": "NORMAL_OPERATION",
                    "current_price": price,
                    "action": "HOLD_POSITION",
                    "status": "STABLE"
                })
                
        return execution_logs

