class PortfolioEngineController:
    """Main Orchestrator tying data feeds, risk management, and the AI execution agent together."""
    
    def __init__(self, portfolio_config: dict):
        self.config = portfolio_config
        self.tickers = list(portfolio_config.keys())
        self.market_feed = MultiSourceMarketFeed(self.tickers)
        self.ai_agent = ActiveAIAgentCore(execution_mode="automatic")

    async def run_cycle(self):
        # 1. Fetch live concurrent prices from yfinance / Google Finance feeds
        live_prices = await self.market_feed.get_live_prices()
        
        # 2. Build portfolio snapshot
        total_valuation = 0.0
        holdings_data = {}
        
        for ticker, cfg in self.config.items():
            price = live_prices.get(ticker, 0.0)
            valuation = price * cfg['shares']
            total_valuation += valuation
            holdings_data[ticker] = {
                "shares": cfg['shares'],
                "last_price": price,
                "cash_strap_limit": cfg['cash_strap_limit']
            }
            
        snapshot = {
            "total_valuation": total_valuation,
            "holdings": holdings_data
        }
        
        # 3. Process via Active AI Agent
        audit_logs = await self.ai_agent.evaluate_and_execute(snapshot, live_prices)
        return audit_logs


