class MultiSourceMarketFeed:
    """Asynchronous multi-source market feed aggregating yfinance and Google Finance endpoints."""
    
    def __init__(self, tickers: List[str]):
        self.tickers = tickers

    async def fetch_yfinance_async(self, ticker: str) -> float:
        """Fetches ticker data asynchronously via thread pool execution."""
        try:
            loop = asyncio.get_running_loop()
            def _get():
                stock = yf.Ticker(ticker)
                hist = stock.history(period="1d")
                return float(hist['Close'].iloc[-1]) if not hist.empty else 0.0
            
            return await loop.run_in_executor(None, _get)
        except Exception as e:
            logger.error(f"yfinance fetch error for {ticker}: {e}")
            return 0.0

    async def fetch_google_finance_fallback(self, ticker: str) -> float:
        """Simulates or interfaces with Google Finance data feeds as a redundant primary feed."""
        # In production, integrate structured API endpoints or high-speed parsing wrappers here
        await asyncio.sleep(0.05) # Simulate network latency
        return 0.0  # Fallback return if primary yfinance succeeds

    async def get_live_prices(self) -> Dict[str, float]:
        """Concurrently resolves pricing across all configured portfolio assets."""
        tasks = [self.fetch_yfinance_async(ticker) for ticker in self.tickers]
        prices = await asyncio.gather(*tasks)
        return {self.tickers[i]: prices[i] for i in range(len(self.tickers))}


class RiskAndLiquidityModel:
    """Calculates portfolio risk, Value at Risk (VaR), and dynamic cash-strap thresholds."""
    
    @staticmethod
    def calculate_cash_strap_buffer(portfolio_value: float, volatility_factor: float = 0.05) -> float:
        """Computes dynamic liquidity requirements to prevent margin or cash shortfalls."""
        return portfolio_value * volatility_factor


