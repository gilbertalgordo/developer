# Project: Ace Combat - Next Generation (Console Icon & Tile Generator)
# Target: Automated UI Asset Pipeline for PlayStation, Xbox, Switch, and PC
# ==============================================================================

import os
from PIL import Image, ImageDraw, ImageFont

class ConsoleIconGenerator:
    def __init__(self, platform_name, output_size=(1024, 1024)):
        self.platform = platform_name.upper()
        self.size = output_size
        self.image = Image.new("RGBA", self.size, (15, 17, 23, 255))  # Deep tactical dark matte
        self.draw = ImageDraw.Draw(self.image)

    def draw_hud_grid(self):
        """Draws a futuristic telemetry HUD grid overlay onto the icon tile."""
        width, height = self.size
        # Draw tech grid lines (cyan/violet iridescent theme)
        step = 64
        for x in range(0, width, step):
            self.draw.line([(x, 0), (x, height)], fill=(30, 41, 59, 100), width=1)
        for y in range(0, height, step):
            self.draw.line([(0, y), (width, y)], fill=(30, 41, 59, 100), width=1)
            
        # Draw targeting reticle frame
        margin = 80
        self.draw.rectangle(
            [margin, margin, width - margin, height - margin], 
            outline=(0, 243, 255, 180), 
            width=3
        )

    def draw_aircraft_silhouette(self):
        """Renders a stylized vector outline of the tailless F-47 cranked-kite configuration."""
        w, h = self.size
        center_x, center_y = w // 2, h // 2
        
        # F-47 Tailless Delta / Cranked-Kite Polygon Points
        points = [
            (center_x, center_y - 220),       # Nose cone
            (center_x + 320, center_y + 160), # Right wingtip
            (center_x + 180, center_y + 240), # Right exhaust nozzle area
            (center_x, center_y + 180),       # Tail center
            (center_x - 180, center_y + 240), # Left exhaust nozzle area
            (center_x - 320, center_y + 160)  # Left wingtip
        ]
        # Glow layer
        self.draw.polygon(points, fill=(20, 110, 150, 100), outline=(0, 243, 255, 255), width=4)

    def add_branding_and_badges(self):
        """Applies platform badges, title text, and telemetry readouts."""
        w, h = self.size
        
        # Platform Header Banner
        self.draw.rectangle([80, 80, w - 80, 160], fill=(10, 14, 20, 220), outline=(139, 92, 246, 200), width=2)
        
        # Text simulation (Using default PIL font or fallback)
        try:
            font_large = ImageFont.truetype("arial.ttf", 40)
            font_small = ImageFont.truetype("arial.ttf", 24)
        except IOError:
            font_large = ImageFont.load_default()
            font_small = ImageFont.load_default()

        # Draw Labels
        self.draw.text((110, 100), f"ACE COMBAT: NGAD — {self.platform}", fill=(255, 255, 255, 255), font=font_large)
        self.draw.text((110, h - 140), "BOEING F-47 SIMULATION | 6TH-GEN STEALTH", fill=(0, 243, 255, 255), font=font_small)

    def save_asset(self, filename="f47_icon.png"):
        self.draw_hud_grid()
        self.draw_aircraft_silhouette()
        self.add_branding_and_badges()
        
        os.makedirs("output_icons", exist_ok=True)
        path = os.path.join("output_icons", filename)
        self.image.save(path)
        print(f"[SUCCESS] Generated console icon asset saved to: {path}")

if __name__ == "__main__":
    # Generate tailored icon templates for every target platform
    platforms = ["PS5", "PS4", "Xbox_Series_X", "Xbox_One", "Nintendo_Switch", "PC_Steam"]
    
    for console in platforms:
        generator = ConsoleIconGenerator(platform_name=console, output_size=(1024, 1024))
        generator.save_asset(filename=f"f47_ngad_{console.lower()}_icon.png")
