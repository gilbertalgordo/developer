function FindProxyForURL(url, host) {
    // Bypass proxy for local network and specific domains
    if (isPlainHostName(host) || 
        dnsDomainIs(host, ".local") || 
        dnsDomainIs(host, ".yourcompany.com")) {
        return "DIRECT";
    }

    // Use a primary proxy, fallback to secondary, or go direct
    return "PROXY proxy.example.com:8080; PROXY backup.example.com:8080; DIRECT";
}




# Sets the AutoConfigURL to a specific PAC file
reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings" /v AutoConfigURL /t REG_SZ /d "http://yourserver.com/proxy.pac" /f



function FindProxyForURL(url, host) {
    // 1. PERFORMANCE: Bypass proxy for simple/local hostnames
    if (isPlainHostName(host) || dnsDomainIs(host, ".local")) {
        return "DIRECT";
    }

    // 2. PERFORMANCE: Bypass for internal/intranet domains
    if (dnsDomainIs(host, ".racecorp.com") || dnsDomainIs(host, ".internal")) {
        return "DIRECT";
    }

    // 3. SECURITY/SPECIFICITY: Force specific proxy for sensitive traffic
    if (shExpMatch(host, "*.finance.gov") || shExpMatch(host, "*.bank.com")) {
        return "PROXY secure-gateway.racecorp.com:8080";
    }

    // 4. LOAD BALANCING & FAILOVER: 
    // Try primary, then secondary, then fallback to DIRECT if all fail
    return "PROXY primary-proxy.racecorp.com:8080; PROXY backup-proxy.racecorp.com:8080; DIRECT";
}





