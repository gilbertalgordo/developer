<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OmniOS - 3D & File Inspector</title>
  <style>
    body { margin: 0; background: #030712; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    canvas { width: 70vw; height: 65vh; background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { font-size: 16px; color: #38bdf8; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>OmniOS WebGL / Canvas 3D Subsystem Viewport</h2>
  <canvas id="viewCanvas"></canvas>
  <script>
    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let rotation = 0;
    function renderFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 2;
      
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = 60;
      
      // Draw dynamic rotating 3D vector representation
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const angle = rotation + (i * Math.PI / 2);
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
      
      rotation += 0.02;
      requestAnimationFrame(renderFrame);
    }
    renderFrame();
  </script>
</body>
</html>



/**
 * OmniOS Extension Icon Generator
 * Requires Node.js and the 'canvas' package (`npm install canvas`)
 */
const { createCanvas } = require('canvas');
const fs = require('fs');
const path = require('path');

const SIZES = [16, 32, 48, 128];
const OUTPUT_DIR = path.join(__dirname, 'icons');

if (!fs.existsSync(OUTPUT_DIR)) {
  fs.mkdirSync(OUTPUT_DIR, { recursive: true });
}

function drawOmniOsIcon(size) {
  const canvas = createCanvas(size, size);
  const ctx = canvas.getContext('2d');
  const scale = size / 128; // Base coordinate system on 128x128 standard

  // 1. Background Rounded Rect with Dark Obsidian Plate style
  ctx.save();
  ctx.beginPath();
  const radius = 28 * scale;
  ctx.roundRect(4 * scale, 4 * scale, 120 * scale, 120 * scale, radius);
  
  const bgGrad = ctx.createLinearGradient(0, 0, 128 * scale, 128 * scale);
  bgGrad.addColorStop(0, '#0f172a');
  bgGrad.addColorStop(1, '#020617');
  ctx.fillStyle = bgGrad;
  ctx.fill();

  // Subtle border highlight (Iridescent Cyan/Indigo HUD border)
  ctx.lineWidth = 3 * scale;
  const borderGrad = ctx.createLinearGradient(0, 0, 128 * scale, 128 * scale);
  borderGrad.addColorStop(0, '#0ea5e9');
  borderGrad.addColorStop(0.5, '#6366f1');
  borderGrad.addColorStop(1, '#10b981');
  ctx.strokeStyle = borderGrad;
  ctx.stroke();
  ctx.restore();

  // 2. Central Core Symbol: 3D Multi-Layered Hyper-Cube / Shield Grid
  ctx.save();
  ctx.translate(64 * scale, 64 * scale);

  // Outer Telemetry Ring (Boosters & OS Subsystems)
  ctx.beginPath();
  ctx.arc(0, 0, 36 * scale, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(14, 165, 233, 0.3)';
  ctx.lineWidth = 2 * scale;
  ctx.setLineDash([4 * scale, 3 * scale]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Inner 3D Geometric Vector Representation (3D Viewer & AI Security Core)
  ctx.beginPath();
  const hexRadius = 22 * scale;
  for (let i = 0; i < 6; i++) {
    const angle = (i * Math.PI) / 3 - Math.PI / 6;
    const hx = Math.cos(angle) * hexRadius;
    const hy = Math.sin(angle) * hexRadius;
    if (i === 0) ctx.moveTo(hx, hy);
    else ctx.lineTo(hx, hy);
  }
  ctx.closePath();
  
  const coreGrad = ctx.createLinearGradient(-hexRadius, -hexRadius, hexRadius, hexRadius);
  coreGrad.addColorStop(0, '#0ea5e9');
  coreGrad.addColorStop(1, '#10b981');
  ctx.fillStyle = coreGrad;
  ctx.fill();
  ctx.lineWidth = 2 * scale;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();

  // Center Core Node (Google Direct Integration & Account Nexus)
  ctx.beginPath();
  ctx.arc(0, 0, 8 * scale, 0, Math.PI * 2);
  ctx.fillStyle = '#0f172a';
  ctx.fill();
  ctx.lineWidth = 2 * scale;
  ctx.strokeStyle = '#38bdf8';
  ctx.stroke();

  ctx.restore();
  return canvas;
}

// Generate files for all Chrome specification scales
SIZES.forEach(size => {
  const canvas = drawOmniOsIcon(size);
  const buffer = canvas.toBuffer('image/png');
  const filePath = path.join(OUTPUT_DIR, `icon${size}.png`);
  fs.writeFileSync(filePath, buffer);
  console.log(`Generated: icon${size}.png successfully.`);
});



