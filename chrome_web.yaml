{
  "manifest_version": 3,
  "name": "OmniOS Chrome Web Enterprise Suite",
  "version": "1.0.0",
  "description": "Cross-platform OS extension featuring built-in AI security, 3D viewers, system boosters, and Google app integrations.",
  "permissions": [
    "storage",
    "activeTab",
    "scripting",
    "declarativeNetRequest",
    "system.cpu",
    "system.memory",
    "identity"
  ],
  "host_permissions": [
    "<all_urls>"
  ],
  "background": {
    "service_worker": "background.js"
  },
  "action": {
    "default_popup": "popup.html",
    "default_icon": {
      "16": "icons/icon16.png",
      "48": "icons/icon48.png",
      "128": "icons/icon128.png"
    }
  },
  "content_scripts": [
    {
      "matches": ["<all_urls>"],
      "js": ["content.js"]
    }
  ],
  "web_accessible_resources": [
    {
      "resources": ["viewer.html"],
      "matches": ["<all_urls>"]
    }
  ]
}



// Background Service Worker for OmniOS

chrome.runtime.onInstalled.addListener(() => {
  console.log("OmniOS Extension Initialized successfully.");
  
  // Set up security automation rules via declarativeNetRequest
  chrome.declarativeNetRequest.updateDynamicRules({
    addRules: [
      {
        id: 101,
        priority: 1,
        action: { type: "block" },
        condition: { 
          urlFilter: "*://malicious-tracker-example.com/*", 
          resourceTypes: ["script", "xmlhttprequest"] 
        }
      }
    ],
    removeRuleIds: [101]
  });
});

// Handle inter-subsystem and AI automation message passing
chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
  if (request.action === "runAiSecurityAudit") {
    // Simulating built-in browser AI or local model assessment
    setTimeout(() => {
      sendResponse({ status: "Secure", threatsNeutralized: 2, timestamp: Date.now() });
    }, 500);
    return true; // Keep channel open for async response
  }
  
  if (request.action === "getSystemMetrics") {
    // Fetching hardware specs via chrome.system APIs
    Promise.all([
      new Promise(resolve => chrome.system.cpu.getInfo(resolve)),
      new Promise(resolve => chrome.system.memory.getInfo(resolve))
    ]).then(([cpu, memory]) => {
      sendResponse({ cpu, memory });
    });
    return true;
  }
});



