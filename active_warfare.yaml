import React, { useState, useEffect, useRef, useMemo } from 'react';
import { Target, Shield, Zap, AlertTriangle, Crosshair, Cpu, RefreshCw, Radio } from 'lucide-react';

// --- TYPE DEFINITIONS ---
interface ThreatEntity {
  id: string;
  name: string;
  x: number; // relative position X (-100 to 100)
  y: number; // relative position Y (-100 to 100)
  z: number; // Altitude/Depth (meters)
  velocity: { dx: number; dy: number };
  threatLevel: 'LOW' | 'MEDIUM' | 'HIGH' | 'CRITICAL';
  signature: 'AERIAL' | 'GROUND' | 'ELECTRONIC';
}

interface HUDState {
  systemPower: number;
  shieldStrength: number;
  cpuThermal: number;
  weaponsArmed: boolean;
  activeSector: string;
}

export default function ActiveWarfareHUD() {
  // --- STATE ---
  const [hud, setHud] = useState<HUDState>({
    systemPower: 100.0,
    shieldStrength: 100.0,
    cpuThermal: 38.4,
    weaponsArmed: false,
    activeSector: "PH-R4-NCR"
  });

  const [entities, setEntities] = useState<ThreatEntity[]>([
    { id: 'ENT-09', name: 'Hypersonic Glide Vector', x: 45, y: -80, z: 12500, velocity: { dx: -0.8, dy: 1.2 }, threatLevel: 'CRITICAL', signature: 'AERIAL' },
    { id: 'ENT-22', name: 'SIGINT Electronic Jammer', x: -60, y: 30, z: 120, velocity: { dx: 0.2, dy: -0.1 }, threatLevel: 'HIGH', signature: 'ELECTRONIC' },
    { id: 'ENT-74', name: 'Mechanized Armor Column', x: 15, y: 40, z: 0, velocity: { dx: -0.1, dy: -0.05 }, threatLevel: 'MEDIUM', signature: 'GROUND' }
  ]);

  const [radarSweepAngle, setRadarSweepAngle] = useState(0);
  const simFrame = useRef<number>(0);

  // --- DETERMINISTIC 60FPS SIMULATION TICK ---
  useEffect(() => {
    let lastTime = performance.now();

    const updateSimulation = (time: number) => {
      const delta = (time - lastTime) / 1000; // in seconds
      lastTime = time;

      // 1. Rotate radar sweep indicator
      setRadarSweepAngle(prev => (prev + 90 * delta) % 360);

      // 2. Compute advanced kinematics on threat entities
      setEntities(prevEntities =>
        prevEntities.map(entity => {
          // Calculate new positions based on velocity vector
          let nextX = entity.x + entity.velocity.dx * delta * 15;
          let nextY = entity.y + entity.velocity.dy * delta * 15;

          // Boundary bouncing to simulate patrol patterns within sector bounds
          let nextDx = entity.velocity.dx;
          let nextDy = entity.velocity.dy;
          if (nextX > 90 || nextX < -90) nextDx = -nextDx;
          if (nextY > 90 || nextY < -90) nextDy = -nextDy;

          // Calculate direct Euclidean range from HUD origin (0, 0)
          const range = Math.sqrt(nextX * nextX + nextY * nextY);
          let level = entity.threatLevel;
          if (range < 35) level = 'CRITICAL';
          else if (range < 65) level = 'HIGH';
          else if (range < 85) level = 'MEDIUM';
          else level = 'LOW';

          return {
            ...entity,
            x: Number(nextX.toFixed(2)),
            y: Number(nextY.toFixed(2)),
            velocity: { dx: nextDx, dy: nextDy },
            threatLevel: level
          };
        })
      );

      // 3. Update environmental core metrics
      setHud(prev => {
        const tempFluctuation = (Math.random() - 0.5) * 0.4;
        const powerDrain = prev.weaponsArmed ? 0.05 : 0.01;
        return {
          ...prev,
          systemPower: Math.max(0, Number((prev.systemPower - powerDrain).toFixed(2))),
          cpuThermal: Math.min(105, Math.max(30, Number((prev.cpuThermal + tempFluctuation).toFixed(2))))
        };
      });

      simFrame.current = requestAnimationFrame(updateSimulation);
    };

    simFrame.current = requestAnimationFrame(updateSimulation);
    return () => cancelAnimationFrame(simFrame.current);
  }, []);

  // --- ACTIONS ---
  const handlePowerFlush = () => {
    setHud(prev => ({
      ...prev,
      systemPower: 100.0,
      cpuThermal: Math.max(35, prev.cpuThermal - 15)
    }));
  };

  const toggleWeaponSystems = () => {
    setHud(prev => ({ ...prev, weaponsArmed: !prev.weaponsArmed }));
  };

  // --- MEMOIZED CALCS ---
  const criticalThreatCount = useMemo(() => {
    return entities.filter(e => e.threatLevel === 'CRITICAL').length;
  }, [entities]);

  return (
    <div className="min-h-screen bg-slate-950 text-emerald-400 font-mono p-6 relative overflow-hidden select-none">
      {/* HUD Scanner Grid Overlay */}
      <div className="absolute inset-0 bg-[linear-gradient(to_right,#064e3b_1px,transparent_1px),linear-gradient(to_bottom,#064e3b_1px,transparent_1px)] bg-[size:3rem_3rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-20 pointer-events-none" />

      {/* TOP STATUS BAR */}
      <header className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-emerald-500/30 pb-4 mb-6 gap-4">
        <div>
          <div className="flex items-center gap-2">
            <Radio className="w-5 h-5 text-emerald-400 animate-pulse" />
            <span className="text-xs font-semibold tracking-widest text-emerald-500">TACTICAL BROADCAST NODE</span>
          </div>
          <h1 className="text-2xl font-black tracking-widest text-emerald-200">ACTIVE WARFARE CONTROL</h1>
        </div>
        
        <div className="flex flex-wrap gap-4 text-xs">
          <div className="bg-slate-900/80 border border-emerald-500/20 px-3 py-2 rounded">
            <span className="text-emerald-500/60 block">COORDINATE MAPPING</span>
            <span className="font-bold text-emerald-300">{hud.activeSector} // LIVE TRAFFIC</span>
          </div>
          <div className="bg-slate-900/80 border border-emerald-500/20 px-3 py-2 rounded">
            <span className="text-emerald-500/60 block">CRITICAL THREATS</span>
            <span className={`font-bold ${criticalThreatCount > 0 ? 'text-red-400 animate-pulse' : 'text-emerald-300'}`}>
              {criticalThreatCount} DETECTED
            </span>
          </div>
        </div>
      </header>

      {/* GRID INTERFACE */}
      <div className="relative z-10 grid grid-cols-1 xl:grid-cols-4 gap-6">
        
        {/* PANEL 1: SYSTEM CONTROLS & DIAGNOSTICS */}
        <section className="xl:col-span-1 bg-slate-900/70 border border-emerald-500/20 p-5 rounded-lg backdrop-blur-md flex flex-col justify-between">
          <div>
            <div className="flex items-center gap-2 mb-4 border-b border-emerald-500/20 pb-2">
              <Cpu className="w-5 h-5 text-emerald-300" />
              <h2 className="text-sm font-bold tracking-wider uppercase text-emerald-200">Power & Diagnostics</h2>
            </div>

            <div className="space-y-5">
              {/* SLIM QUANTUM CELL RESERVE */}
              <div>
