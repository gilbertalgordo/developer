/* Core styling for the icons */
.aw-icon-container {
  display: inline-flex;
  gap: 1rem;
  padding: 1rem;
  background-color: #020617; /* Dark slate background */
}

.aw-icon {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(16, 185, 129, 0.05); /* Very faint emerald backdrop */
  border: 1px solid rgba(16, 185, 129, 0.3); /* Subtle border */
  border-radius: 8px;
  position: relative;
  transition: all 0.2s ease-in-out;
}

/* The 'Active' state modifier: enhances color and adds glow */
.aw-icon.active {
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(52, 211, 153, 1); /* Brighter emerald */
  box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); /* The primary glow */
}

/* Secondary glow element */
.aw-icon.active::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 9px;
  background: rgba(52, 211, 153, 0.2);
  filter: blur(4px);
  z-index: -1;
}

/* Styling the SVG paths inside the icon */
.aw-icon svg {
  width: 24px;
  height: 24px;
  stroke: rgba(110, 231, 183, 0.6); /* Default faint stroke */
  fill: none;
  stroke-width: 1.5;
  transition: stroke 0.2s ease-in-out;
}

.aw-icon.active svg {
  stroke: #ffffff; /* Active icons have white/near-white strokes */
  filter: drop-shadow(0 0 2px rgba(52, 211, 153, 1)); /* Icon-specific glow */
}




