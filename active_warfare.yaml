            <h2 className="text-sm font-bold tracking-wider uppercase text-emerald-200">Threat Register</h2>
          </div>

          <div className="space-y-3 max-h-[350px] overflow-y-auto pr-1">
            {entities.map((entity) => {
              const directRange = Math.sqrt(entity.x * entity.x + entity.y * entity.y).toFixed(1);
              
              return (
                <div 
                  key={entity.id} 
                  className={`p-3 border rounded transition-all duration-200 ${
                    entity.threatLevel === 'CRITICAL' ? 'bg-red-950/20 border-red-500/80 text-red-400' :
                    entity.threatLevel === 'HIGH' ? 'bg-orange-950/20 border-orange-500/60 text-orange-300' :
                    'bg-slate-950 border-emerald-500/10 text-emerald-400'
                  }`}
                >
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-xs font-bold tracking-wider">{entity.id} : {entity.signature}</span>
                    <span className="text-[10px] px-1.5 py-0.5 rounded border border-current font-black">
                      {entity.threatLevel}
                    </span>
                  </div>
                  <div className="text-[11px] opacity-80 space-y-0.5">
                    <p className="font-semibold text-white truncate">{entity.name}</p>
                    <p>SECTOR DISTANCE: <span className="font-bold">{directRange}km</span></p>
                    <p>ALTITUDE TRACK: <span className="font-bold">{entity.z}m</span></p>
                  </div>
                </div>
              );
            })}
          </div>
        </section>

      </div>

      {/* FOOTER */}
      <footer className="mt-6 flex justify-between items-center text-[10px] text-emerald-500/40 border-t border-emerald-500/20 pt-4">
        <span>ACTIVE PIPELINE CLOCK: {(performance.now() / 1000).toFixed(1)}s</span>
        <span className="animate-pulse">● RADAR DUPLEX ACTIVE</span>
      </footer>
    </div>
  );
}





