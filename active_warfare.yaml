import React, { useState, useEffect } from 'react';
import { Target, Shield, Zap, AlertTriangle, Crosshair, Cpu, HardDrive } from 'lucide-react';

// --- TYPE DEFINITIONS ---
interface ThreatVector {
  id: string;
  source: string;
  distance: number; // in meters
  threatLevel: 'LOW' | 'MEDIUM' | 'HIGH' | 'CRITICAL';
  bearing: number; // degrees
}

interface SystemTelemetry {
  powerGrid: number; // percentage
  coreTemp: number; // °C
  quantumSync: boolean;
  gpsCoords: { lat: string; lng: string };
}

export default function TacticalHUD() {
  // --- STATE MANAGEMENT ---
  const [telemetry, setTelemetry] = useState<SystemTelemetry>({
    powerGrid: 98.4,
    coreTemp: 42.1,
    quantumSync: true,
    gpsCoords: { lat: "14°21'43\" N", lng: "121°03'05\" E" } // Calabarzon Sector
  });

  const [threats, setThreats] = useState<ThreatVector[]>([
    { id: 'T-01', source: 'Ariel Recon Drone', distance: 2400, threatLevel: 'LOW', bearing: 42 },
    { id: 'T-02', source: 'Heavy Armored Mech', distance: 850, threatLevel: 'HIGH', bearing: 184 },
    { id: 'T-03', source: 'Unknown EW Jammer', distance: 150, threatLevel: 'CRITICAL', bearing: 290 }
  ]);

  const [weaponReady, setWeaponReady] = useState(true);

  // --- KAIZEN SIMULATION LOOP (Continuous Updates) ---
  useEffect(() => {
    const activeUpdateLoop = setInterval(() => {
      // Shift telemetry values dynamically
      setTelemetry(prev => ({
        ...prev,
        powerGrid: Math.max(70, Number((prev.powerGrid - (Math.random() * 0.4) + (Math.random() * 0.3)).toFixed(1))),
        coreTemp: Math.min(95, Number((prev.coreTemp + (Math.random() * 0.8) - (Math.random() * 0.6)).toFixed(1)))
      }));

      // Update threat distances and bearings dynamically
      setThreats(prevThreats =>
        prevThreats.map(threat => {
          const distanceDelta = Math.floor(Math.random() * 80) - 50; // Approaching tendency
          const newDistance = Math.max(0, threat.distance + distanceDelta);
          const newBearing = (threat.bearing + Math.floor(Math.random() * 6) - 3 + 360) % 360;
          
          let threatLevel = threat.threatLevel;
          if (newDistance < 300) threatLevel = 'CRITICAL';
          else if (newDistance < 1000) threatLevel = 'HIGH';
          else if (newDistance < 2000) threatLevel = 'MEDIUM';
          else threatLevel = 'LOW';

          return { ...threat, distance: newDistance, bearing: newBearing, threatLevel };
        })
      );
    }, 800); // Superfast update speed

    return () => clearInterval(activeUpdateLoop);
  }, []);

  // --- RENDERING AUXILIARY STYLING ---
  const getThreatColor = (level: string) => {
    switch (level) {
      case 'CRITICAL': return 'text-red-500 border-red-500 bg-red-950/30 animate-pulse';
      case 'HIGH': return 'text-orange-500 border-orange-500 bg-orange-950/20';
      case 'MEDIUM': return 'text-yellow-500 border-yellow-500';
      default: return 'text-emerald-500 border-emerald-500';
    }
  };

  return (
    <div className="min-h-screen bg-slate-950 text-emerald-400 font-mono p-6 select-none relative overflow-hidden">
      {/* Background Military Grid Overlay */}
      <div className="absolute inset-0 bg-[linear-gradient(to_right,#022c22_1px,transparent_1px),linear-gradient(to_bottom,#022c22_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-30 pointer-events-none" />

      {/* HEADER: COMMAND STRIP */}
      <header className="relative flex justify-between items-center border-b border-emerald-500/30 pb-4 mb-6">
        <div>
          <h1 className="text-xl font-black tracking-widest text-emerald-300">ACTIVE WARFARE SYSTEM v9.2.6</h1>
          <p className="text-xs text-emerald-500/70">SECURE SHELL // ENCRYPTED NODE COMM_</p>
        </div>
        <div className="flex gap-6 text-right text-xs">
          <div>
            <div className="text-emerald-500/60 font-semibold">SECTOR GEO-LOCK</div>
            <div className="font-bold text-emerald-300">{telemetry.gpsCoords.lat} / {telemetry.gpsCoords.lng}</div>
          </div>
          <div className="border-l border-emerald-500/30 pl-6">
            <div className="text-emerald-500/60 font-semibold">QUANTUM SYNC</div>
            <div className={`font-bold ${telemetry.quantumSync ? 'text-cyan-400' : 'text-red-500'}`}>
              {telemetry.quantumSync ? 'CONNECTED [100%]' : 'DESYNCED'}
            </div>
          </div>
        </div>
      </header>

      {/* MAIN HUD LAYOUT */}
      <main className="grid grid-cols-1 lg:grid-cols-3 gap-6 relative z-10">
        
        {/* COLUMN 1: LIVE TELEMETRY & REACTOR STATS */}
        <section className="bg-slate-900/60 border border-emerald-500/20 rounded-lg p-5 backdrop-blur-md">
          <div className="flex items-center gap-2 mb-4 border-b border-emerald-500/20 pb-2">
            <Cpu className="w-5 h-5 text-emerald-400" />
            <h2 className="text-sm font-bold tracking-wider uppercase text-emerald-300">Reactor & Energy Grid</h2>
          </div>

          <div className="space-y-5">
            <div>
              <div className="flex justify-between text-xs mb-1">
                <span>SLIM QUANTUM CELL RESERVE</span>
                <span className="font-bold text-emerald-300">{telemetry.powerGrid}%</span>
              </div>
              <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-emerald-500/20">
                <div 
                  className="bg-emerald-400 h-full transition-all duration-300 ease-out" 
                  style={{ width: `${telemetry.powerGrid}%` }} 
                />
              </div>
            </div>

            <div>
              <div className="flex justify-between text-xs mb-1">
                <span>CORE TEMP LIMITERS</span>
                <span className={`font-bold ${telemetry.coreTemp > 75 ? 'text-red-400' : 'text-emerald-300'}`}>
                  {telemetry.coreTemp}°C
                </span>
              </div>
              <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-emerald-500/20">
                <div 
                  className={`h-full transition-all duration-300 ease-out ${telemetry.coreTemp > 75 ? 'bg-red-500' : 'bg-cyan-400'}`} 
                  style={{ width: `${(telemetry.coreTemp / 120) * 100}%` }} 
                />
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3 pt-2">
              <div className="bg-slate-950/80 border border-emerald-500/10 p-3 rounded text-center">
                <div className="text-[10px] text-emerald-500/60">INTELLIGENT REGEN</div>
                <div className="text-lg font-bold text-emerald-300">ACTIVE</div>
              </div>
              <div className="bg-slate-950/80 border border-emerald-500/10 p-3 rounded text-center">
                <div className="text-[10px] text-emerald-500/60">KINETIC SHIELD</div>
                <div className="text-lg font-bold text-cyan-400">92%</div>
              </div>
            </div>
          </div>
        </section>

        {/* COLUMN 2: ACTIVE TACTICAL radar DISPLAY */}
        <section className="bg-slate-900/60 border border-emerald-500/20 rounded-lg p-5 backdrop-blur-md flex flex-col justify-between min-h-[350px]">
          <div className="flex items-center gap-2 mb-2 border-b border-emerald-500/20 pb-2">
            <Crosshair className="w-5 h-5 text-emerald-400" />
            <h2 className="text-sm font-bold tracking-wider uppercase text-emerald-300">Tactical Targeting Array</h2>
          </div>

          {/* Animated Target Reticle Container */}
          <div className="flex-1 flex items-center justify-center relative my-4">
            <div className="w-44 h-44 rounded-full border border-dashed border-emerald-500/40 flex items-center justify-center animate-[spin_20s_linear_infinite]">
              <div className="w-32 h-32 rounded-full border border-emerald-500/20 flex items-center justify-center">
                <div className="w-16 h-16 rounded-full border border-double border-emerald-500/40" />
              </div>
            </div>
            
            {/* Target Locking Indicator */}
            <div className="absolute flex flex-col items-center">
              <Target className="w-10 h-10 text-emerald-400 animate-pulse" />
              <span className="text-[10px] tracking-widest text-emerald-300 mt-2 font-black">AUTO-LOCK ENGAGED</span>
            </div>
          </div>

          <button 
            onClick={() => setWeaponReady(!weaponReady)}
            className={`w-full py-3 font-bold text-sm tracking-wider uppercase border transition-all duration-200 ${
              weaponReady 
                ? 'bg-red-950/40 border-red-500 text-red-400 hover:bg-red-900/60' 
