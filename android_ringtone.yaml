package com.example.arcaderingtone

import android.content.ContentValues
import android.content.Context
import android.media.AudioAttributes
import android.media.AudioFormat
import android.media.AudioTrack
import android.media.RingtoneManager
import android.net.Uri
import android.os.Build
import android.os.Environment
import android.provider.MediaStore
import java.io.ByteArrayOutputStream
import java.io.OutputStream
import kotlin.math.sin

/**
 * 90s Arcade Style Instrumental Ringtone Generator & Installer
 * Synthesizes 16-bit FM/Chiptune audio programmatically and sets it as an official Android ringtone.
 */
class ArcadeRingtoneGenerator(private val context: Context) {

    private val sampleRate = 44100

    /**
     * Synthesizes a 90s Chiptune/Arcade track and saves it into MediaStore as a Ringtone.
     */
    fun generateAndSetRingtone(): Uri? {
        val pcmData = generateArcadeTrack()
        val wavData = convertPcmToWav(pcmData, sampleRate)

        val ringtoneUri = saveToMediaStore(wavData, "Arcade_90s_Ringtone.wav")
        ringtoneUri?.let { uri ->
            RingtoneManager.setActualDefaultRingtoneUri(
                context,
                RingtoneManager.TYPE_RINGTONE,
                uri
            )
        }
        return ringtoneUri
    }

    /**
     * Synthesizes 8-bit / 16-bit sound chips using Square Waves, Noise, and Arpeggios.
     */
    private fun generateArcadeTrack(): ByteArray {
        val durationSeconds = 8.0
        val numSamples = (sampleRate * durationSeconds).toInt()
        val pcm = ByteArray(numSamples)

        val bpm = 140.0
        val quarterNoteDuration = 60.0 / bpm
        val sixteenthNoteDuration = quarterNoteDuration / 4.0

        // MIDI note to Frequency helper
        fun m2f(note: Int): Double = 440.0 * Math.pow(2.0, (note - 69) / 12.0)

        // Classic 90s Arcade Arpeggio Lead Sequence (16th notes)
        val leadNotes = intArrayOf(
            60, 64, 67, 72, 60, 64, 67, 72, // C major arp
            58, 62, 65, 70, 58, 62, 65, 70, // Bb major arp
            57, 60, 64, 69, 57, 60, 64, 69, // A minor arp
            55, 59, 62, 67, 55, 59, 62, 67  // G major arp
        )

        // Bassline Notes (8th notes)
        val bassNotes = intArrayOf(
            48, 48, 48, 48,
            46, 46, 46, 46,
            45, 45, 45, 45,
            43, 43, 43, 43
        )

        var phaseLead = 0.0
        var phaseBass = 0.0

        for (i in 0 until numSamples) {
            val currentTime = i.toDouble() / sampleRate

            // 1. Lead Square Wave (Pulse Wave with bit-crushed texture)
            val leadStep = ((currentTime / sixteenthNoteDuration) % leadNotes.size).toInt()
            val freqLead = m2f(leadNotes[leadStep])
            phaseLead += 2.0 * Math.PI * freqLead / sampleRate
            val leadSample = if (sin(phaseLead) > 0.0) 0.3 else -0.3 // Square Wave

            // 2. Bass Triangle/Square Wave
            val bassStep = ((currentTime / (sixteenthNoteDuration * 2)) % bassNotes.size).toInt()
            val freqBass = m2f(bassNotes[bassStep])
            phaseBass += 2.0 * Math.PI * freqBass / sampleRate
            val bassSample = if (sin(phaseBass) > 0.2) 0.4 else -0.4

            // 3. Arcade Drum Noise (Snare / Hi-Hat emulation on beats)
            val beatPos = currentTime % sixteenthNoteDuration
            var noiseSample = 0.0
            val isSnarePos = ((currentTime / sixteenthNoteDuration).toInt() % 4 == 2)
            if (isSnarePos && beatPos < 0.08) {
                val decay = (1.0 - (beatPos / 0.08))
                noiseSample = (Math.random() * 2.0 - 1.0) * decay * 0.25
            }

            // Mix and Bit-Crush to 8-bit equivalent PCM (-128 to 127)
            val mixed = (leadSample + bassSample + noiseSample).coerceIn(-1.0, 1.0)
            pcm[i] = (mixed * 127.0).toInt().toByte()
        }

        return pcm
    }

    /**
     * Converts raw 8-bit PCM data into a valid WAV file format header and payload.
     */
    private fun convertPcmToWav(pcmData: ByteArray, sampleRate: Int): ByteArray {
        val totalAudioLen = pcmData.size
        val totalDataLen = totalAudioLen + 36
        val byteRate = sampleRate * 1 * 8 / 8

        val header = ByteArray(44)
        header[0] = 'R'.code.toByte(); header[1] = 'I'.code.toByte(); header[2] = 'F'.code.toByte(); header[3] = 'F'.code.toByte()
        header[4] = (totalDataLen and 0xff).toByte()
        header[5] = (totalDataLen shr 8 and 0xff).toByte()
        header[6] = (totalDataLen shr 16 and 0xff).toByte()
        header[7] = (totalDataLen shr 24 and 0xff).toByte()
        header[8] = 'W'.code.toByte(); header[9] = 'A'.code.toByte(); header[10] = 'V'.code.toByte(); header[11] = 'E'.code.toByte()
        header[12] = 'f'.code.toByte(); header[13] = 'm'.code.toByte(); header[14] = 't'.code.toByte(); header[15] = ' '.code.toByte()
        header[16] = 16; header[17] = 0; header[18] = 0; header[19] = 0 // Chunk size
        header[20] = 1; header[21] = 0 // Format (PCM = 1)
        header[22] = 1; header[23] = 0 // Channels (1 = Mono)
        header[24] = (sampleRate and 0xff).toByte()
        header[25] = (sampleRate shr 8 and 0xff).toByte()
        header[26] = (sampleRate shr 16 and 0xff).toByte()
        header[27] = (sampleRate shr 24 and 0xff).toByte()
        header[28] = (byteRate and 0xff).toByte()
        header[29] = (byteRate shr 8 and 0xff).toByte()
        header[30] = (byteRate shr 16 and 0xff).toByte()
        header[31] = (byteRate shr 24 and 0xff).toByte()
        header[32] = 1; header[33] = 0 // Block align
        header[34] = 8; header[35] = 0 // Bits per sample (8-bit)
        header[36] = 'd'.code.toByte(); header[37] = 'a'.code.toByte(); header[38] = 't'.code.toByte(); header[39] = 'a'.code.toByte()
        header[40] = (totalAudioLen and 0xff).toByte()
        header[41] = (totalAudioLen shr 8 and 0xff).toByte()
        header[42] = (totalAudioLen shr 16 and 0xff).toByte()
        header[43] = (totalAudioLen shr 24 and 0xff).toByte()

        val out = ByteArrayOutputStream()
        out.write(header)
        out.write(pcmData)
        return out.toByteArray()
    }

    /**
     * Saves the WAV byte array to Android MediaStore and sets metadata flags for Ringtone.
     */
    private fun saveToMediaStore(wavBytes: ByteArray, filename: String): Uri? {
        val values = ContentValues().apply {
            put(MediaStore.MediaColumns.DISPLAY_NAME, filename)
            put(MediaStore.MediaColumns.MIME_TYPE, "audio/wav")
            put(MediaStore.Audio.Media.IS_RINGTONE, true)
            put(MediaStore.Audio.Media.IS_NOTIFICATION, false)
            put(MediaStore.Audio.Media.IS_ALARM, false)
            put(MediaStore.Audio.Media.IS_MUSIC, false)

            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_RINGTONES)
            }
        }

        val contentUri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
        val uri = context.contentResolver.insert(contentUri, values)

        uri?.let {
            context.contentResolver.openOutputStream(it)?.use { os ->
                os.write(wavBytes)
            }
        }
        return uri
    }
}



