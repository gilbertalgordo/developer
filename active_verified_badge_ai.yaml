    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.icon-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-cyan);
}

.icon-wrapper {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-wrapper svg {
    width: 100%;
    height: 100%;
}

.icon-card span {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: center;
    font-weight: 600;
}

/* CSS3 Animations */
.hologram-glint svg {
    filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.6));
    animation: icon-pulse 2s infinite ease-in-out;
}

@keyframes icon-pulse {
    0%, 100% { filter: drop-shadow(0 0 5px rgba(6, 182, 212, 0.4)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.9)); transform: scale(1.06); }
}

.pulse-node svg {
    animation: node-hover 3s infinite ease-in-out;
}

@keyframes node-hover {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

.icon-wrapper.disabled {
    opacity: 0.5;
    filter: grayscale(80%);
}





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active AI - Verified Badge Generator (HUD Edition)</title>
    <style>
        :root {
            --bg-deep: #030712;
            --panel-bg: rgba(17, 24, 39, 0.85);
            --panel-border: rgba(56, 189, 248, 0.2);
            --accent-cyan: #06b6d4;
            --accent-blue: #38bdf8;
            --success-green: #10b981;
            --error-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.15;
        }
        .glow-1 { top: -10%; left: -10%; background: var(--accent-cyan); }
        .glow-2 { bottom: -10%; right: -10%; background: #6366f1; }

        .hud-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 960px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--panel-border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        .brand-text h1 {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fff;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--success-green);
            font-weight: 600;
            font-size: 0.75rem;
            font-family: var(--font-mono);
        }

        .pulse {
            width: 7px;
            height: 7px;
            background-color: var(--success-green);
            border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 24px;
        }

        @media(max-width: 768px) {
            .hud-grid { grid-template-columns: 1fr; }
        }

        .hud-panel {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 22px;
            transition: all 0.3s ease;
        }

        .hud-panel.locked {
            opacity: 0.35;
            pointer-events: none;
            filter: grayscale(40%);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .panel-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .panel-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper span.icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 12px 10px 38px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }

        .input-wrapper input:disabled {
            cursor: not-allowed;
            background: rgba(3, 7, 18, 0.3);
        }

        .feedback-box {
            margin-top: 14px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--success-green);
        }

        .feedback-box.hidden { display: none; }
        .feedback-box strong { display: block; font-weight: 600; }
        .feedback-box span { color: var(--text-muted); font-size: 0.75rem; }

        .matrix-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 18px 0;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.4);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .control-info strong {
            display: block;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .control-info span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e293b;
            transition: 0.3s;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-cyan); }
        input:checked + .slider:before { transform: translateX(22px); }

        .hud-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--accent-cyan); color: #030712; }
        .btn-primary:hover { background: var(--accent-blue); }

        .btn-success { background: var(--success-green); color: #030712; margin-top: 6px; }
        .btn-success:hover { background: #059669; }

        .preview-panel {
            margin: 0 24px 24px 24px;
        }

        .live-dot {
            font-size: 0.7rem;
            font-family: var(--font-mono);
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preview-canvas {
            background: rgba(3, 7, 18, 0.7);
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .simulated-profile-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
        }

        .sim-avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-cyan), #3b82f6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #030712;
            font-weight: bold;
        }

        .sim-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .sim-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sim-name-row span {
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
        }

        .verified-badge-node {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.6));
        }

        .hologram-glint {
            animation: glint-pulse 2s infinite ease-in-out;
        }

        @keyframes glint-pulse {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(6, 182, 212, 0.5)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.9)); transform: scale(1.08); }
        }

        .sim-url {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }

        .hud-terminal {
            background: #02040a;
            border-top: 1px solid var(--panel-border);
            padding: 12px 24px;
        }

        .terminal-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .terminal-screen {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent-cyan);
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 6px;
            max-height: 90px;
            overflow-y: auto;
            line-height: 1.4;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .log-time { color: #64748b; }
        .log-success { color: var(--success-green); }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="hud-container">
        <!-- Header -->
        <header class="hud-header">
            <div class="brand">
                <span>⚡</span>
                <div class="brand-text">
                    <h1>ACTIVE AI CORE</h1>
                    <span>Verified Badge Generator UI</span>
                </div>
            </div>
            <div class="status-pill">
                <span class="pulse"></span> ONLINE
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="hud-grid">
            
            <!-- Step 1: Authentication -->
            <section class="hud-panel" id="auth-panel">
                <div class="panel-header">
                    <h2><span>🔒</span> Step 1: Secure Node Auth</h2>
                    <span class="step-badge">01</span>
                </div>
                <p class="panel-desc">Authenticate session keys to initialize active agent pathways.</p>
                
                <form id="auth-form">
                    <div class="input-group">
                        <label for="node-id">Operator Handle / ID</label>
                        <div class="input-wrapper">
                            <span class="icon">👤</span>
                            <input type="text" id="node-id" placeholder="Enter handle" value="Gilbert Algordo" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="auth-key">Cryptographic Token</label>
                        <div class="input-wrapper">
                            <span class="icon">🔑</span>
                            <input type="password" id="auth-key" placeholder="••••••••••••••••••••" value="ai_sec_token" required>
                        </div>
                    </div>
                    <button type="submit" class="hud-btn btn-primary" id="auth-btn">
                        <span>🔓</span> Authenticate Session
                    </button>
                </form>
                
                <div id="auth-success-box" class="feedback-box hidden">
                    <span>✅</span>
                    <div>
                        <strong>Session Verified</strong>
                        <span>Node linked securely. Configuration parameters unlocked.</span>
                    </div>
                </div>
            </section>

            <!-- Step 2: Target URL & Features -->
            <section class="hud-panel locked" id="config-panel">
                <div class="panel-header">
                    <h2><span>⚙️</span> Step 2: Target & Badge Matrix</h2>
                    <span class="step-badge">02</span>
                </div>
                <p class="panel-desc">Define account endpoint URL and toggle verified badge attributes.</p>
                
                <div class="input-group">
                    <label for="target-url">Target Account URL Link</label>
                    <div class="input-wrapper">
                        <span class="icon">🌐</span>
                        <input type="url" id="target-url" placeholder="https://platform.com/account/profile" disabled>
                    </div>
                </div>

                <div class="matrix-controls">
                    <div class="control-row">
                        <div class="control-info">
                            <strong>Active Badge Feature</strong>
                            <span>Deploy verification checkmark</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="badge-feature-toggle" checked disabled>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="control-row">
                        <div class="control-info">
                            <strong>Disable Usage Limitations</strong>
                            <span>Bypass standard generation rate bounds</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="limit-toggle" checked disabled>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <button type="button" class="hud-btn btn-success" id="save-deploy-btn" disabled>
                    <span>💾</span> Save & Deploy Badge Generator
                </button>
            </section>

        </div>

        <!-- Live Preview -->
        <section class="hud-panel preview-panel">
            <div class="panel-header">
                <h2><span>👁️</span> Live Generated Badge Simulation</h2>
                <span class="live-dot"><span class="pulse"></span> LIVE</span>
            </div>
            <div class="preview-canvas">
                <div class="simulated-profile-card">
                    <div class="sim-avatar">GA</div>
                    <div class="sim-details">
                        <div class="sim-name-row">
                            <span id="sim-handle">@gilbert_algordo</span>
                            <div id="badge-container" class="verified-badge-node hologram-glint">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            </div>
                        </div>
                        <span id="sim-url-display" class="sim-url">Awaiting target configuration link...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Terminal Console -->
        <footer class="hud-terminal">
            <div class="terminal-bar">
                <span><span>💻</span> SYSTEM LOG CONSOLE</span>
                <span id="log-clock">00:00:00</span>
            </div>
            <div class="terminal-screen" id="terminal-logs">
                [SYSTEM] Active AI Framework loaded successfully. Waiting for operator authentication...
            </div>
        </footer>
    </div>

    <script>
        const authForm = document.getElementById('auth-form');
        const configPanel = document.getElementById('config-panel');
        const authSuccessBox = document.getElementById('auth-success-box');
        const authBtn = document.getElementById('auth-btn');
        const targetUrlInput = document.getElementById('target-url');
        const badgeToggle = document.getElementById('badge-feature-toggle');
        const limitToggle = document.getElementById('limit-toggle');
        const saveDeployBtn = document.getElementById('save-deploy-btn');
        const terminalLogs = document.getElementById('terminal-logs');
        const logClock = document.getElementById('log-clock');
        const simHandle = document.getElementById('sim-handle');
        const simUrlDisplay = document.getElementById('sim-url-display');
        const badgeContainer = document.getElementById('badge-container');

        setInterval(() => {
            logClock.textContent = new Date().toTimeString().split(' ')[0];
        }, 1000);

        function appendLog(message, type = 'info') {
            const timestamp = new Date().toTimeString().split(' ')[0];
            let colorClass = 'log-info';
            if (type === 'success') colorClass = 'log-success';
            terminalLogs.innerHTML += `<br><span class="log-time">[${timestamp}]</span> <span class="${colorClass}">${message}</span>`;
            terminalLogs.scrollTop = terminalLogs.scrollHeight;
        }

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const operatorId = document.getElementById('node-id').value;
            authBtn.disabled = true;
            authBtn.textContent = 'Verifying Handshake...';
            appendLog(`Initiating secure OAuth exchange for operator: ${operatorId}...`, 'info');

            setTimeout(() => {
                authBtn.textContent = 'Authenticated';
                authSuccessBox.classList.remove('hidden');
                configPanel.classList.remove('locked');
                targetUrlInput.disabled = false;
                badgeToggle.disabled = false;
                limitToggle.disabled = false;
                saveDeployBtn.disabled = false;
                simHandle.textContent = `@${operatorId.toLowerCase().replace(/\s+/g, '_')}`;
                appendLog(`Authentication sequence accepted. Matrix unlocked for node [${operatorId}].`, 'success');
            }, 800);
        });

        targetUrlInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val) {
                simUrlDisplay.textContent = val;
                simUrlDisplay.style.color = '#38bdf8';
            } else {
                simUrlDisplay.textContent = 'Awaiting target configuration link...';
                simUrlDisplay.style.color = '#64748b';
            }
        });

        badgeToggle.addEventListener('change', () => {
            if (badgeToggle.checked) {
                badgeContainer.style.display = 'inline-flex';
                appendLog("Verified Badge Feature: ENABLED", 'success');
            } else {
                badgeContainer.style.display = 'none';
                appendLog("Verified Badge Feature: DISABLED", 'info');
            }
        });

        limitToggle.addEventListener('change', () => {
            appendLog(`Usage Limitations Override: ${limitToggle.checked ? 'ENABLED (Bypassed)' : 'RESTRICTED'}`, 'success');
        });

        saveDeployBtn.addEventListener('click', () => {
            const targetUrlVal = targetUrlInput.value.trim();
            if (!targetUrlVal) {
                alert("Please input a valid target link before saving configuration.");
                targetUrlInput.focus();
                return;
            }

            saveDeployBtn.disabled = true;
            saveDeployBtn.textContent = 'Compiling & Deploying...';
            appendLog(`Compiling target profile endpoint: ${targetUrlVal}`, 'info');

            setTimeout(() => {
                saveDeployBtn.disabled = false;
                saveDeployBtn.textContent = 'Save & Deploy Badge Generator';
                appendLog(`SUCCESS: Verified badge agent compiled and deployed securely to [${targetUrlVal}]`, 'success');
                alert("Active AI Verified Badge generator parameters saved and deployed successfully!");
            }, 1000);
        });
    </script>
</body>
</html>
