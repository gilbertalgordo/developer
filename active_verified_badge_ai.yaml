:root {
    --bg-deep: #030712;
    --panel-bg: rgba(17, 24, 39, 0.8);
    --border-color: rgba(56, 189, 248, 0.2);
    --accent-cyan: #06b6d4;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --font-ui: 'Segoe UI', system-ui, sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.icon-showcase-container {
    width: 100%;
    max-width: 800px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent-cyan);
    margin-bottom: 6px;
}

header p {
    font-size: 0.85rem;
    color: var(--text-muted);
}

/* Icon Grid Layout */
.icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 20px;
}

.icon-card {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.icon-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-cyan);
}

.icon-wrapper {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-wrapper svg {
    width: 100%;
    height: 100%;
}

.icon-card span {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: center;
    font-weight: 600;
}

/* CSS3 Animations for Icons */
.hologram-glint svg {
    filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.6));
    animation: icon-pulse 2s infinite ease-in-out;
}

@keyframes icon-pulse {
    0%, 100% { filter: drop-shadow(0 0 5px rgba(6, 182, 212, 0.4)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.9)); transform: scale(1.06); }
}

.pulse-node svg {
    animation: node-hover 3s infinite ease-in-out;
}

@keyframes node-hover {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

.icon-wrapper.disabled {
    opacity: 0.5;
    filter: grayscale(80%);
}




