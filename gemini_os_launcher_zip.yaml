const geminiShaderMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0.0 },
    uBaseColor: { value: new THREE.Color(0x00E5FF) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    uniform vec3 uBaseColor;
    void main() {
      float wave = sin(vUv.x * 10.0 + uTime) * 0.5 + 0.5;
      vec3 finalColor = mix(uBaseColor, vec3(0.1, 0.4, 0.9), wave);
      gl_FragColor = vec4(finalColor, 0.95);
    }
  `,
  transparent: true
});
