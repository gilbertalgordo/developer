data class GeminiThemeSpec(
    val themeName: String,
    val primaryAccent: Color,
    val backgroundSurface: Color,
    val glassmorphismOpacity: Float
)

class GeminiThemeState : androidx.lifecycle.ViewModel() {
    var activeTheme by mutableStateOf(
        GeminiThemeSpec(
            themeName = "Quantum Void",
            primaryAccent = Color(0xFF00E5FF),
            backgroundSurface = Color(0xFF0B0F19),
            glassmorphismOpacity = 0.85f
        )
    )
    private set

    fun switchTheme(newSpec: GeminiThemeSpec) {
        activeTheme = newSpec
    }
}



from PIL import Image, ImageDraw, ImageFont
import os

def generate_gemini_icon(icon_name, primary_color, bg_color, output_dir="icons"):
    os.makedirs(output_dir, exist_ok=True)
    size = (512, 512)
    image = Image.new("RGBA", size, bg_color)
    draw = ImageDraw.Draw(image)
    
    # Draw geometric background frame
    draw.rounded_rectangle([32, 32, 480, 480], radius=96, outline=primary_color, width=12)
    
    # Draw central Gemini OS emblem lines
    draw.line([150, 350, 256, 160, 362, 350], fill=primary_color, width=16, joint="curve")
    draw.arc([180, 240, 332, 390], start=0, end=180, fill=primary_color, width=12)
    
    file_path = os.path.join(output_dir, f"{icon_name}.png")
    image.save(file_path, "PNG")
    print(f"Generated icon asset: {file_path}")

# Execute generation for launcher modules
generate_gemini_icon("ic_launcher_quantum", (0, 229, 255, 255), (11, 15, 25, 255))
