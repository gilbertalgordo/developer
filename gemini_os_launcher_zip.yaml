import android.content.Context
import java.io.File
import java.io.FileOutputStream
import java.util.zip.ZipInputStream

object ThemeZipInstaller {
    fun extractThemeZip(context: Context, zipFile: File, targetThemeName: String): File? {
        val themesDir = File(context.filesDir, "themes/$targetThemeName")
        if (!themesDir.exists()) themesDir.mkdirs()

        try {
            ZipInputStream(zipFile.inputStream()).use { zis ->
                var zipEntry = zis.nextEntry
                while (zipEntry != null) {
                    val newFile = File(themesDir, zipEntry.name)
                    if (zipEntry.isDirectory) {
                        newFile.mkdirs()
                    } else {
                        newFile.parentFile?.mkdirs()
                        FileOutputStream(newFile).use { fos ->
                            zis.copyTo(fos)
                        }
                    }
                    zis.closeEntry()
                    zipEntry = zis.nextEntry
                }
            }
            return themesDir
        } catch (e: Exception) {
            e.printStackTrace()
            return null
        }
    }
}



import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import java.io.File
import java.net.URL

object LauncherUpdater {
    suspend fun downloadUpdatePackage(updateUrl: String, outputFile: File): Boolean = withContext(Dispatchers.IO) {
        try {
            URL(updateUrl).openStream().use { input ->
                outputFile.outputStream().use { output ->
                    input.copyTo(output)
                }
            }
            true
        } catch (e: Exception) {
            e.printStackTrace()
            false
        }
    }
}




