<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gilbert Algordo | Glassmorphic HUD Profile</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 10% 20%, rgba(15, 23, 42, 1) 0%, rgba(30, 41, 59, 1) 90%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: #38bdf8;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background shapes for glass refraction effect */
        .ambient-shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 10s ease-in-out infinite alternate;
        }

        .shape-1 {
            width: 350px;
            height: 350px;
            background: rgba(56, 189, 248, 0.25);
            top: 10%;
            left: 15%;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background: rgba(168, 85, 247, 0.2);
            bottom: 10%;
            right: 15%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-20px) scale(1.05); }
        }

        /* Main Glassmorphic Container */
        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            position: relative;
            z-index: 10;
        }

        /* HUD Scanner Accent Line */
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 1.2rem auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .hud-ring {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border: 1px dashed var(--accent-glow);
            border-radius: 50%;
            animation: spin 20s linear infinite;
            opacity: 0.6;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 0.3rem;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-glow);
            background: rgba(56, 189, 248, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 0.8rem;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Metric / HUD Grid */
        .hud-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 1rem;
            border-radius: 14px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .metric-box:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Action Links / Buttons */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .glass-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.9rem;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        .glass-btn.primary {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(14, 165, 233, 0.3));
            border-color: rgba(56, 189, 248, 0.4);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            transform: translateY(-1px);
        }

        /* HUD Status Footer */
        .hud-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Refractive Ambient Background Gradients -->
    <div class="ambient-shape shape-1"></div>
    <div class="ambient-shape shape-2"></div>

    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar-container">
                <div class="hud-ring"></div>
                <!-- Profile Avatar linked via configured developer asset source -->
                <img src="https://avatars.githubusercontent.com/u/105086884?v=4" alt="Gilbert Algordo" class="avatar">
            </div>
            <span class="badge">Certified CEO</span>
            <h1>Gilbert Algordo</h1>
        </div>

        <p class="bio">
            Technology Executive & Systems Architect. Directing active AI automation frameworks, high-performance hybrid simulation models, and enterprise software engineering.
        </p>

        <div class="hud-metrics">
            <div class="metric-box">
                <div class="metric-value">Race Corp</div>
                <div class="metric-label">Leadership</div>
            </div>
            <div class="metric-box">
                <div class="metric-value">Kaizen</div>
                <div class="metric-label">Philosophy</div>
            </div>
        </div>

        <div class="actions">
            <a href="https://g.dev/gilbert_algordo" target="_blank" class="glass-btn primary">
                Developer Profile (g.dev)
            </a>
            <a href="https://www.linkedin.com/in/gilbert-algordo-b35b95249" target="_blank" class="glass-btn">
                Connect on LinkedIn
            </a>
            <a href="https://github.com/gilbertalgordo" target="_blank" class="glass-btn">
                GitHub Repositories
            </a>
        </div>

        <div class="hud-footer">
            <div class="status-indicator">
                <span class="status-dot"></span>
                System Active
            </div>
            <div>HUD v2.6</div>
        </div>
    </div>

</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gilbert Algordo | Advanced Glassmorphic HUD Core</title>
    <style>
        :root {
            --bg-deep: #030712;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(56, 189, 248, 0.18);
            --glass-border-glow: rgba(56, 189, 248, 0.6);
            --glass-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.03);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --accent-emerald: #34d399;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Mesh Background Gradients */
        .mesh-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.6;
        }

        .mesh-blob {
            position: absolute;
            border-radius: 50%;
            animation: drift 15s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: rgba(56, 189, 248, 0.2);
            top: -10%;
            left: -10%;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: rgba(168, 85, 247, 0.15);
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            background: rgba(52, 211, 153, 0.1);
            top: 40%;
            left: 30%;
            animation-delay: -10s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* Advanced Glass HUD Container */
        .hud-wrapper {
            position: relative;
            width: 100%;
            max-width: 540px;
            padding: 2rem;
            z-index: 10;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 28px;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .glass-card:hover {
            border-color: var(--glass-border-glow);
            box-shadow: 0 20px 50px 0 rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(56, 189, 248, 0.1);
        }

        /* HUD Holographic Corner Brackets */
        .corner-bracket {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--accent-cyan);
            border-style: solid;
            opacity: 0.7;
        }
        .bracket-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
        .bracket-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
        .bracket-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
        .bracket-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

        /* Profile Header Section */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .avatar-box {
            position: relative;
            width: 90px;
            height: 90px;
            flex-shrink: 0;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(56, 189, 248, 0.4);
        }

        .hud-radar {
            position: absolute;
            inset: -8px;
            border: 1px dashed var(--accent-cyan);
            border-radius: 50%;
            animation: radarSpin 15s linear infinite;
            opacity: 0.5;
        }

        @keyframes radarSpin {
            100% { transform: rotate(360deg); }
        }

        .identity-meta h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
        }

        .identity-meta .title-sub {
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            margin-bottom: 0.5rem;
        }

        .certified-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
        }

        /* Telemetry / Metric Grid */
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }

        .telemetry-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 0.9rem 0.5rem;
            text-align: center;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .telemetry-card:hover {
            background: rgba(56, 189, 248, 0.05);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .telemetry-val {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            font-family: var(--font-mono);
            margin-bottom: 0.1rem;
        }

        .telemetry-lbl {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Bio Description Box */
        .system-bio {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.8rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-left: 2px solid var(--accent-cyan);
            border-radius: 0 12px 12px 0;
        }

        /* Interactive Action Matrix */
        .action-matrix {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .matrix-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .matrix-btn.primary {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(14, 165, 233, 0.25));
            border-color: rgba(56, 189, 248, 0.4);
        }

        .matrix-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
            transform: translateY(-2px);
            color: var(--accent-cyan);
        }

        .matrix-arrow {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            opacity: 0.6;
            transition: transform 0.2s ease;
        }

        .matrix-btn:hover .matrix-arrow {
            transform: translateX(4px);
            opacity: 1;
        }

        /* Status Bar Footer */
        .hud-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.68rem;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-sync {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .sync-pulse {
            width: 6px;
            height: 6px;
            background-color: var(--accent-emerald);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-emerald);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 1; }
        }
    </style>
</head>
