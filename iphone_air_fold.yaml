<!DOCTYPE html>
<html lang="in">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Air Fold - Technical Blueprint & Specification</title>
    <style>
        :root {
            --blueprint-bg: #0b2545;
            --grid-color: rgba(255, 255, 255, 0.08);
            --line-color: #64dfdf;
            --text-color: #90e0ef;
            --accent-red: #ff4d4d;
            --accent-glow: #00f5d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--blueprint-bg);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            border: 2px solid var(--line-color);
            padding: 15px;
            margin-bottom: 25px;
            background: rgba(11, 37, 69, 0.9);
            box-shadow: 0 0 15px rgba(100, 223, 223, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--line-color);
            text-transform: uppercase;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .view-panel {
            border: 1px dashed var(--line-color);
            padding: 20px;
            background: rgba(11, 37, 69, 0.5);
            position: relative;
        }

        .view-panel h2 {
            font-size: 1.1rem;
            border-bottom: 1px solid var(--line-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .schematic-box {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 380px;
            border: 1px solid rgba(100, 223, 223, 0.3);
            margin-bottom: 15px;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
        }

        /* CSS Phone Mockups representing Front & Rear Views */
        .phone-mockup {
            width: 140px;
            height: 280px;
            border: 3px solid var(--line-color);
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            box-shadow: inset 0 0 10px rgba(100, 223, 223, 0.2);
        }

        .phone-mockup.unfolded {
            width: 220px;
            height: 280px;
        }

        .screen-content {
            flex: 1;
            border: 1px solid var(--line-color);
            font-size: 0.6rem;
            padding: 5px;
            background: rgba(100, 223, 223, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Internal Component Layers for Rear View */
        .internal-layer {
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 4px;
        }

        .motherboard-red {
            background-color: var(--accent-red);
            height: 80px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 5px var(--accent-red);
        }

        .battery-quantum {
            background-color: #2a9d8f;
            height: 90px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            color: #fff;
        }

        .chips-row {
            display: flex;
            gap: 4px;
            height: 35px;
        }

        .chip {
            flex: 1;
            background: #e76f51;
            border-radius: 3px;
            font-size: 0.45rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
        }

        .camera-module-rear {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            border: 2px solid var(--accent-glow);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-glow);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px var(--accent-glow); }
            50% { box-shadow: 0 0 15px var(--accent-glow), 0 0 5px #fff; }
            100% { box-shadow: 0 0 5px var(--accent-glow); }
        }

        .specs-list {
            list-style: none;
            font-size: 0.85rem;
        }

        .specs-list li {
            padding: 6px 0;
            border-bottom: 1px dotted rgba(100, 223, 223, 0.2);
            display: flex;
            justify-content: space-between;
        }

        .specs-list span.highlight {
            color: var(--line-color);
            font-weight: bold;
        }

        .specs-list span.code-val {
            color: #ffb703;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.75rem;
            border-top: 1px solid var(--line-color);
            padding-top: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>iPhone Air Fold — Technical Blueprint & Architecture</h1>
        <p>Actual Size Scale 1:1 | Slim Sleek Titanium Siding | Lengthwise Hinge Styling</p>
    </header>

    <div class="container">
        <!-- LEFT VIEW: FRONT ELEVATION -->
        <div class="view-panel">
            <h2>Left View: Front Elevation (Folded & Unfolded)</h2>
            <div class="schematic-box">
                <!-- Unfolded State -->
                <div class="phone-mockup unfolded">
                    <div class="screen-content">
                        <div>[ Dynamic Island ]</div>
                        <div style="text-align:center;">Strong LCD Panel<br>Flexible Layer Active</div>
                        <div>Status: Unfolded (1:1 Scale)</div>
                    </div>
                </div>
                <!-- Folded State -->
                <div class="phone-mockup">
                    <div class="screen-content">
                        <div>[ Cover Display ]</div>
                        <div style="text-align:center; font-size: 0.5rem;">Lengthwise Closing</div>
                        <div>10:09</div>
                    </div>
                </div>
            </div>
            <ul class="specs-list">
                <li><span>1. Strong LCD Display</span> <span class="code-val">High-Durability Flexible IPS LCD</span></li>
                <li><span>Titanium Siding</span> <span class="code-val">Grade 5 Aerospace Alloy</span></li>
                <li><span>Opening/Closing Style</span> <span class="code-val">Lengthwise Vertical Axis Hinge</span></li>
                <li><span>7. Invisible Waterproofing</span> <span class="code-val">Nanoscale IP68 Internal Sealing</span></li>
            </ul>
        </div>

        <!-- RIGHT VIEW: REAR ELEVATION & INTERNAL ARCHITECTURE -->
        <div class="view-panel">
            <h2>Right View: Rear Chassis & Internals</h2>
            <div class="schematic-box" style="justify-content: center;">
                <div class="phone-mockup" style="width: 180px; background: rgba(5, 15, 30, 0.8);">
                    <div class="camera-module-rear"></div>
                    <div class="internal-layer">
                        <div class="motherboard-red">
                            2. RED MOTHERBOARD + 3. NEW APPLE PROCESSOR
                        </div>
                        <div class="battery-quantum">
                            4. QUANTUM MICRO BATTERY (Ultra-Slim)
                        </div>
                        <div class="chips-row">
                            <div class="chip">5. BLE Micro Chip</div>
                            <div class="chip">Secure Enclave</div>
                        </div>
                    </div>
                </div>
            </div>
            <ul class="specs-list">
                <li><span>2. Red Motherboards</span> <span class="code-val">Custom High-Density PCB Layout</span></li>
                <li><span>3. New Apple Processor</span> <span class="code-val">Next-Gen A-Series Silicon Core</span></li>
                <li><span>4. Quantum Micro Battery</span> <span class="code-val">Solid-State Slim Architecture</span></li>
                <li><span>5. BLE Micro Chip</span> <span class="code-val">Ultra-Low Power Bluetooth 5.5</span></li>
                <li><span>6. LED Camera Border Lights</span> <span class="code-val">RGB Programmable Ring Halo</span></li>
            </ul>
        </div>
    </div>

    <footer>
        Schematic Blueprint Version 3.1 | Designed for Precision Engineering & Hardware Specification
    </footer>

</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
