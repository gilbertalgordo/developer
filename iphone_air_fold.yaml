    <title>iPhone Air Fold - Advanced Engineering HUD Blueprint</title>
    <style>
        :root {
            --bg-deep: #030a14;
            --grid-line: rgba(0, 245, 212, 0.05);
            --hud-cyan: #00f5d4;
            --hud-blue: #48cae4;
            --hud-dim: rgba(72, 202, 228, 0.6);
            --accent-red: #ff3366;
            --accent-gold: #ffd166;
            --panel-bg: rgba(5, 20, 35, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--hud-blue);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            border: 1px solid var(--hud-cyan);
            background: var(--panel-bg);
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.15);
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--hud-cyan);
        }

        h1 {
            font-size: 1.25rem;
            letter-spacing: 3px;
            color: var(--hud-cyan);
            text-transform: uppercase;
        }

        .sys-status {
            font-size: 0.8rem;
            color: var(--accent-gold);
            display: flex;
            gap: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .blueprint-panel {
            border: 1px solid var(--hud-dim);
            background: var(--panel-bg);
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .blueprint-panel h2 {
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: var(--hud-cyan);
            border-bottom: 1px solid var(--hud-dim);
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .viewport-3d {
            height: 420px;
            border: 1px dashed var(--hud-dim);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
            background: radial-gradient(circle at center, rgba(3,37,69,0.4) 0%, rgba(2,10,20,0.8) 100%);
            margin-bottom: 15px;
            perspective: 1000px;
        }

        /* Phone Hardware Mockups */
        .device-shell {
            width: 150px;
            height: 300px;
            border: 2px solid var(--hud-cyan);
            border-radius: 14px;
            position: relative;
            background: rgba(10, 15, 25, 0.9);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .device-shell.unfolded {
            width: 230px;
        }

        .screen-lcd {
            flex: 1;
            border: 1px solid var(--hud-blue);
            background: rgba(0, 245, 212, 0.03);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.6rem;
            color: #fff;
            position: relative;
        }

        .titanium-rail {
            position: absolute;
            left: -4px; top: 15%; bottom: 15%; width: 4px;
            background: linear-gradient(to bottom, #8d99ae, #2b2d42);
            border-radius: 2px;
        }

        /* Internal Component Layers (Rear View) */
        .internal-chassis {
            position: absolute;
            inset: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pcb-red {
            background: linear-gradient(135deg, var(--accent-red), #b7094c);
            height: 95px;
            border-radius: 4px;
            border: 1px solid #ff70a6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.4);
        }

        .quantum-battery {
            background: linear-gradient(135deg, #1d3557, #457b9d);
            height: 110px;
            border-radius: 4px;
            border: 1px solid var(--hud-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .chips-cluster {
            display: flex;
            gap: 6px;
            height: 40px;
        }

        .micro-chip-box {
            flex: 1;
            background: #2b2d42;
            border: 1px solid var(--accent-gold);
            border-radius: 3px;
            font-size: 0.45rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            text-align: center;
        }

        .camera-cluster-hud {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--hud-cyan);
            box-shadow: 0 0 12px var(--hud-cyan), inset 0 0 8px var(--hud-cyan);
            animation: ringGlow 2s infinite alternate;
        }

        @keyframes ringGlow {
            0% { border-color: var(--hud-cyan); box-shadow: 0 0 5px var(--hud-cyan); }
            50% { border-color: var(--accent-red); box-shadow: 0 0 15px var(--accent-red); }
            100% { border-color: var(--accent-gold); box-shadow: 0 0 10px var(--accent-gold); }
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        .specs-table th, .specs-table td {
            border: 1px solid rgba(72, 202, 228, 0.2);
            padding: 6px 10px;
            text-align: left;
        }

        .specs-table th {
            background: rgba(0, 245, 212, 0.08);
            color: var(--hud-cyan);
        }

        .specs-table td span {
            color: var(--accent-gold);
        }

        .watermark-hud {
            position: absolute;
            bottom: 5px;
            right: 10px;
            font-size: 0.5rem;
            opacity: 0.5;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>iPhone Air Fold // Advanced HUD Architecture</h1>
            <p style="font-size: 0.75rem; color: var(--hud-dim);">Scale 1:1 Engineering Build | Lengthwise Dynamic Axis</p>
        </div>
        <div class="sys-status">
            <span>SYS: OPTIMAL</span>
            <span>SECURE: IP68 ACTIVE</span>
        </div>
    </header>

    <div class="grid-container">
        <!-- FRONT ELEVATION VIEW -->
        <div class="blueprint-panel">
            <h2><span>View 01: Front Elevation</span> <span>Unfolded / Folded</span></h2>
            <div class="viewport-3d">
                <!-- Unfolded State -->
                <div class="device-shell unfolded">
                    <div class="titanium-rail"></div>
                    <div class="screen-lcd">
