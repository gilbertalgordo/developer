#!/usr/bin/env python3
"""
Acoustic Guitar Tablature E-Book Generator (EPUB 3 Format)
Author: Gilbert Algordo (https://g.dev/gilbert_algordo)
Compatible with: Apple Books, Google Play Books, Amazon Kindle (via conversion)
"""

import os
from ebooklib import epub

def create_guitar_ebook():
    book = epub.EpubBook()

    # Set Metadata
    book.set_identifier('id-guitar-tabs-a-to-g-2026')
    book.set_title('Complete Acoustic Guitar Tablature & Chord Reference: A to G')
    book.set_language('en')
    book.add_author('Gilbert Algordo (https://g.dev/gilbert_algordo)')

    # Define CSS Style for Clean Reading & Audio Player compatibility
    style = '''
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; padding: 1em; color: #333; }
        h1 { color: #1a1a1a; text-align: center; border-bottom: 2px solid #ccc; padding-bottom: 0.5em; }
        h2 { color: #2c3e50; margin-top: 1.5em; }
        .chord-box { background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-bottom: 15px; }
        pre { background: #272822; color: #f8f8f2; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 0.9em; }
        .audio-player { margin: 10px 0; background: #eef2f5; padding: 8px; border-radius: 4px; }
        .footer { text-align: center; font-size: 0.8em; color: #777; margin-top: 3em; }
    '''
    nav_css = epub.EpubItem(uid="style_css", file_name="style/style.css", media_type="text/css", content=style)
    book.add_item(nav_css)

    # Chapter 1: Introduction & Reading Guide
    c1 = epub.EpubHtml(title='Introduction & How to Read Tabs', file_name='chapter_1.xhtml', lang='en')
    c1.content = '''
    <h1>Introduction</h1>
    <p>Welcome to the comprehensive acoustic guitar reference manual, created by <strong>Gilbert Algordo</strong> (<a href="https://g.dev/gilbert_algordo">https://g.dev/gilbert_algordo</a>).</p>
    <p>This guide covers every standard acoustic guitar chord from <strong>A to G</strong>, spanning open positions up to high fretboard voicings across <strong>Major, Minor, Suspended (Sus2/Sus4), and Diminished</strong> variations.</p>
    <h2>How to Read Tablature</h2>
    <p>Guitar tablature (tab) represents the 6 strings of your acoustic guitar, where the top line is the high E string and the bottom line is the low E string. Numbers indicate the fret number to press down.</p>
    <pre>
E|-------------------|
B|-------------------|
G|-------------------|
D|-------------------|
A|-------------------|
E|-------------------|
    </pre>
    <p class="footer">Published by Gilbert Algordo | Open Source Developer Edition</p>
    '''
    c1.add_item(nav_css)
    book.add_item(c1)

    # Chapter 2: Open Chords & Lower Fretboard (Frets 0-4)
    c2 = epub.EpubHtml(title='Lower Fretboard & Open Chords (Frets 0-4)', file_name='chapter_2.xhtml', lang='en')
    c2.content = '''
    <h1>Lower Fretboard Reference (Frets 0-4)</h1>
    
    <div class="chord-box">
        <h2>A Major</h2>
        <p><strong>Frets:</strong> x-0-2-2-2-0</p>
        <pre>
E|---0---|
B|---2---|
G|---2---|
D|---2---|
A|---0---|
E|-------|
        </pre>
    </div>

    <div class="chord-box">
        <h2>A Minor</h2>
        <p><strong>Frets:</strong> x-0-2-2-1-0</p>
        <pre>
E|---0---|
B|---1---|
G|---2---|
D|---2---|
A|---0---|
E|-------|
        </pre>
    </div>

    <div class="chord-box">
        <h2>Asus2 / Asus4</h2>
        <p><strong>Asus2:</strong> x-0-2-2-0-0 | <strong>Asus4:</strong> x-0-2-2-3-0</p>
        <pre>
Asus2:
E|---0---|
B|---0---|
G|---2---|
D|---2---|
A|---0---|
E|-------|
        </pre>
    </div>

    <div class="chord-box">
        <h2>Adim / Adim7</h2>
        <p><strong>Frets:</strong> x-0-1-2-1-x</p>
        <pre>
E|-------|
B|---1---|
G|---2---|
D|---1---|
A|---0---|
E|-------|
        </pre>
    </div>
    
    <div class="chord-box">
        <h2>E Major & Minor</h2>
        <p><strong>E Maj:</strong> 0-2-2-1-0-0 | <strong>E Min:</strong> 0-2-2-0-0-0</p>
        <pre>
E Major:
E|---0---|
B|---0---|
G|---1---|
D|---2---|
A|---2---|
E|---0---|
        </pre>
    </div>
    '''
    c2.add_item(nav_css)
    book.add_item(c2)

    # Chapter 3: Movable Barre Chords & Mid Fretboard (Frets 5-9)
    c3 = epub.EpubHtml(title='Mid Fretboard & Barre Chords (Frets 5-9)', file_name='chapter_3.xhtml', lang='en')
    c3.content = '''
    <h1>Mid Fretboard Voicings & Barre Chords (Frets 5-9)</h1>
    
    <div class="chord-box">
        <h2>A Barre (5th Fret E-Shape)</h2>
        <p><strong>Frets:</strong> 5-7-7-6-5-5</p>
        <pre>
E|---5---|
B|---5---|
G|---6---|
D|---7---|
A|---7---|
E|---5---|
        </pre>
    </div>

    <div class="chord-box">
        <h2>C Barre (3rd Fret A-Shape) / D Barre (5th Fret)</h2>
        <pre>
C Major (A-Shape):
E|---3---|
B|---5---|
G|---5---|
D|---5---|
A|---3---|
E|-------|
        </pre>
    </div>
    '''
    c3.add_item(nav_css)
    book.add_item(c3)

    # Chapter 4: High Fretboard Voicings, Triads & Diminished (Frets 10-12+)
    c4 = epub.EpubHtml(title='High Fretboard Voicings & Diminished (Frets 10-12+)', file_name='chapter_4.xhtml', lang='en')
    c4.content = '''
    <h1>High Fretboard, Triads & Diminished Chords (Frets 10-12+)</h1>
    
    <div class="chord-box">
        <h2>High Fret Diminished & Sustained Voicings</h2>
        <p>Advanced chord variations across upper register positions up to the 12th fret and beyond.</p>
        <pre>
Adim7 (12th Fret position):
E|-------|
B|--13---|
G|--12---|
D|--13---|
A|--12---|
E|-------|
        </pre>
    </div>
    <p class="footer">Created by Gilbert Algordo | <a href="https://g.dev/gilbert_algordo">https://g.dev/gilbert_algordo</a></p>
    '''
    c4.add_item(nav_css)
    book.add_item(c4)

    # Define Table of Contents and Navigation Structure
    book.toc = (
        epub.Link('chapter_1.xhtml', 'Introduction & How to Read Tabs', 'intro'),
        epub.Link('chapter_2.xhtml', 'Lower Fretboard & Open Chords (Frets 0-4)', 'chords_open'),
        epub.Link('chapter_3.xhtml', 'Mid Fretboard & Barre Chords (Frets 5-9)', 'chords_mid'),
        epub.Link('chapter_4.xhtml', 'High Fretboard Voicings & Diminished (Frets 10-12+)', 'chords_high'),
    )

    # Add Default Navigation Files
    book.add_item(epub.EpubNcx())
    book.add_item(epub.EpubNav())

    # Define Spine (Reading Order)
    book.spine = ['nav', c1, c2, c3, c4]

    # Output EPUB file
    output_filename = 'complete_acoustic_guitar_tablature_gilbert_algordo.epub'
    epub.write_epub(output_filename, book)
    print(f"E-book successfully generated and saved as: {output_filename}")

if __name__ == '__main__':
    create_guitar_ebook()



