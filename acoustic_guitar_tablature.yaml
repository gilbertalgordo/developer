def generate_markdown_reference():
    markdown_output = "# Complete Acoustic Guitar Tablature & Chord Reference (A-G)\n\n"
    
    for section, chords in CHORD_DATABASE.items():
        markdown_output += f"## {section}\n\n"
        for chord_name, data in chords.items():
            markdown_output += f"### {chord_name}\n"
            markdown_output += f"* **Fret Positions:** `{data['frets']}`\n"
            markdown_output += f"```text\n{data['tab']}\n```\n\n"
            
    return markdown_output

if __name__ == "__main__":
    doc = generate_markdown_reference()
    with open("guitar_tab_reference.md", "w") as f:
        f.write(doc)
    print("Successfully generated 'guitar_tab_reference.md' containing the complete tab dataset!")



