import torch
from diffusers import StableDiffusionPipeline

# Load the model (Ensure you have a model checkpoint suitable for 3D/realistic styles)
model_id = "runwayml/stable-diffusion-v1-5" 
pipe = StableDiffusionPipeline.from_pretrained(model_id, torch_dtype=torch.float16)
pipe = pipe.to("cuda")

# Define the prompt for consistency
prompt = "A high-quality 3D rendered portrait of Gilbert Algordo, age 19, realistic skin texture, sharp focus, cinematic lighting"

# Generate the image
image = pipe(prompt).images[0]

# Save the result
image.save("gilbert_algordo_19.png")



