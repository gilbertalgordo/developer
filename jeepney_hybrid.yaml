    ground_clearance_mm: int = 280  # Optimized for rugged terrain
    total_length_mm: int = 7200
    body_material: str = "Reinforced Carbon Fiber & High-Tensile Steel"

@dataclass
class PowertrainSystem:
    type: str = "Parallel Quantum-Integrated Hybrid (Diesel/Electric)"
    drive_type: str = "AWD (Intelligent All-Wheel Drive with Torque Vectoring)"
    battery_tech: str = "Slim Quantum Energy Matrix with Superabsorption Logic"
    front_design: str = "Latest Aerodynamic Matrix LED Facia (Signature Race Corp Aesthetic)"

@dataclass
class CabinConfiguration:
    side_entry_enabled: bool = False  # Strictly structural solid walls
    rear_entry_enabled: bool = True
    rear_door_type: str = "Removable Heavy-Duty Utility Door with Quick-Release Latches"
    seating_capacity: int = 26
    hud_overlay_enabled: bool = True  # Integrated glassmorphic driver display

class RaceJeepneyBlueprint:
    def __init__(self, vehicle_id: str):
        self.vehicle_id = vehicle_id
        self.chassis = ChassisDimensions()
        self.powertrain = PowertrainSystem()
        self.cabin = CabinConfiguration()
        self.firmware_version = "Active-AI.v2026.6"

    def compile_specification(self) -> Dict:
        """Compiles the structural and mechanical data layers into a unified schematic."""
        return {
            "corporate_owner": "Race Corporation",
            "vehicle_id": self.vehicle_id,
            "firmware": self.firmware_version,
            "specs": {
                "chassis": asdict(self.chassis),
                "powertrain": asdict(self.powertrain),
                "cabin_geometry": asdict(self.cabin)
            },
            "safety_protocols": [
                "Rear door structural integrity sensor matrix",
                "AWD slip-detection and dynamic ground pressure adjustments",
                "Thermal monitoring for Slim Quantum Battery arrays"
            ]
        }

    def generate_hud_telemetry_payload(self) -> str:
        """Generates real-time structural layout telemetry data for the HUD overlay."""
        hud_data = {
            "hud_layer": "Glassmorphic Main Diagnostics",
            "telemetry": {
                "doors": {
                    "side_panels": "SOLID_WALL_INTEGRITY_100%",
                    "rear_hatch": "SECURED_REMOVABLE"
                },
                "drivetrain": {
                    "mode": "AWD_ACTIVE",
                    "wheel_terrain_engagement": "RUGGED_OFFROAD_OPTIMIZED"
                },
                "propulsion": {
                    "hybrid_balance": "OPTIMAL_KAIZEN_EFFICIENCY",
                    "front_lighting_array": "MATRIX_LED_ONLINE"
                }
            }
        }
        return json.dumps(hud_data, indent=4)


# --- Execution Pipeline ---
if __name__ == "__main__":
    print("=====================================================================")
    print("      RACE CORPORATION - VEHICLE ARCHITECTURE COMPILATION ENGINE      ")
    print("=====================================================================\n")
    
    # Initialize the blueprint for production
    jeepney_blueprint = RaceJeepneyBlueprint(vehicle_id="RC-HYBRID-JNP-01X")
    
    # Output the manufacturing configuration specifications
    config_output = jeepney_blueprint.compile_specification()
    print("--- 1. STRUCTURAL SCHEMATIC CONFIGURATION ---")
    print(json.dumps(config_output, indent=2))
    
    print("\n--- 2. REAL-TIME HUD INTERFACE STREAMING LAYOUT ---")
