/**
 * Adds a custom menu to Google Sheets upon opening.
 */
function onOpen() {
  var ui = SpreadsheetApp.getUi();
  ui.createMenu('Sheets Posting')
      .addItem('Generate Share Links (Selected Row)', 'generateShareLinksForSelectedRow')
      .addSeparator()
      .addItem('Post Row to Web App / API', 'postSelectedRowToWebhook')
      .addToUi();
}

/**
 * Reads the selected row, assuming columns are structured as:
 * Col A: Title / Caption
 * Col B: URL / Link to share
 * Col C: Platform (X, Facebook, Reddit, LinkedIn, YouTube, Snapchat)
 */
function generateShareLinksForSelectedRow() {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var range = sheet.getActiveRange();
  var row = range.getRow();
  
  // Skip header row
  if (row === 1) {
    SpreadsheetApp.getUi().alert('Please select a data row below the header.');
    return;
  }
  
  var text = sheet.getRange(row, 1).getValue(); // Title/Caption
  var url = sheet.getRange(row, 2).getValue();  // Target URL
  var platform = sheet.getRange(row, 3).getValue().toString().toLowerCase(); // Platform
  
  if (!text && !url) {
    SpreadsheetApp.getUi().alert('Row is empty. Please add a caption or URL.');
    return;
  }

  var encodedText = encodeURIComponent(text);
  var encodedUrl = encodeURIComponent(url);
  var shareLink = '';

  switch (platform) {
    case 'x':
    case 'twitter':
      shareLink = 'https://twitter.com/intent/tweet?text=' + encodedText + '&url=' + encodedUrl;
      break;
    case 'facebook':
    case 'fb':
      shareLink = 'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl;
      break;
    case 'linkedin':
      shareLink = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodedUrl;
      break;
    case 'reddit':
      shareLink = 'https://www.reddit.com/submit?url=' + encodedUrl + '&title=' + encodedText;
      break;
    case 'whatsapp':
      shareLink = 'https://api.whatsapp.com/send?text=' + encodedText + '%20' + encodedUrl;
      break;
    default:
      // Generic web intent fallback
      shareLink = url;
      break;
  }

  // Write the generated share link to Column 4 (Col D)
  sheet.getRange(row, 4).setValue(shareLink);
  SpreadsheetApp.getUi().alert('Success! Share link generated in Column D:\n\n' + shareLink);
}

/**
 * Posts the selected row data to an external web app or automation webhook (e.g., Zapier, Make, or custom API).
 */
function postSelectedRowToWebhook() {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var range = sheet.getActiveRange();
  var row = range.getRow();

  if (row === 1) {
    SpreadsheetApp.getUi().alert('Please select a data row below the header.');
    return;
  }

  // Gather data from the row (adjust column mappings as needed)
  var payloadData = {
    caption: sheet.getRange(row, 1).getValue(),
    url: sheet.getRange(row, 2).getValue(),
    platform: sheet.getRange(row, 3).getValue(),
    timestamp: new Date().toISOString()
  };

  // REPLACE THIS with your actual Web App URL (e.g., Zapier Webhook, Make.com, or custom endpoint)
  var webhookUrl = 'https://your-webhook-endpoint-url.com/api/post';

  var options = {
    'method': 'post',
    'contentType': 'application/json',
    'payload': JSON.stringify(payloadData),
    'muteHttpExceptions': true
  };

  try {
    var response = UrlFetchApp.fetch(webhookUrl, options);
    var responseCode = response.getResponseCode();
    
    if (responseCode === 200 || responseCode === 201) {
      sheet.getRange(row, 5).setValue('Posted Successfully (' + new Date() + ')');
      SpreadsheetApp.getUi().alert('Successfully posted row data to the web app webhook!');
    } else {
      sheet.getRange(row, 5).setValue('Failed: HTTP ' + responseCode);
      SpreadsheetApp.getUi().alert('Failed to post. Response code: ' + responseCode);
    }
  } catch (error) {
    SpreadsheetApp.getUi().alert('Error connecting to webhook: ' + error.toString());
  }
}



/**
 * @fileoverview Sheets Posting - Advanced Social Media Integration & Web App Dispatcher
 */

function onOpen() {
  SpreadsheetApp.getUi()
    .createMenu('🚀 Sheets Posting')
    .addItem('Open Management Sidebar', 'showSidebar')
    .addSeparator()
    .addItem('Process Selected Row (Immediate)', 'processSelectedRowAction')
    .addItem('Batch Process All Queued Rows', 'batchProcessQueue')
    .addToUi();
}

function showSidebar() {
  var html = HtmlService.createHtmlOutputFromFile('Sidebar')
      .setTitle('Sheets Posting Control Center')
      .setWidth(400);
  SpreadsheetApp.getUi().showSidebar(html);
}

/**
 * Core Social Poster Class Handling Multi-Platform Serialization & Webhooks
 */
class SocialPostingEngine {
  constructor(row, sheet) {
    this.row = row;
    this.sheet = sheet;
  }

  /**
   * Reads data from standard schema columns:
   * Col A: Title/Caption, Col B: Media/URL, Col C: Platform, Col D: Status, Col E: Output Link/Log
   */
  fetchRowData() {
    const data = this.sheet.getRange(this.row, 1, 1, 5).getValues()[0];
    return {
      title: data[0] || '',
      url: data[1] || '',
      platform: String(data[2] || '').trim().toLowerCase(),
      status: data[3] || '',
      output: data[4] || ''
    };
  }

  generateShareIntent() {
    const item = this.fetchRowData();
    const encText = encodeURIComponent(item.title);
    const encUrl = encodeURIComponent(item.url);
    let targetLink = '';

    switch (item.platform) {
      case 'x':
      case 'twitter':
        targetLink = `https://twitter.com/intent/tweet?text=${encText}&url=${encUrl}`;
        break;
      case 'facebook':
      case 'fb':
        targetLink = `https://www.facebook.com/sharer/sharer.php?u=${encUrl}&quote=${encText}`;
        break;
      case 'linkedin':
        targetLink = `https://www.linkedin.com/sharing/share-offsite/?url=${encUrl}`;
        break;
      case 'reddit':
        targetLink = `https://www.reddit.com/submit?url=${encUrl}&title=${encText}`;
        break;
      case 'youtube':
      case 'yt':
        // YouTube studio link helper or playlist reference structure
        targetLink = `https://studio.youtube.com/`; 
        break;
      case 'snapchat':
        targetLink = `https://www.snapchat.com/scan?attachmentUrl=${encUrl}`;
        break;
      default:
        targetLink = item.url;
        break;
    }

    // Write generated intent URL back to Column E
    this.sheet.getRange(this.row, 5).setValue(targetLink);
    this.sheet.getRange(this.row, 4).setValue('Intent Generated');
    return { success: true, link: targetLink };
  }

  postToWebhook(webhookUrl) {
    const item = this.fetchRowData();
    if (!webhookUrl) {
      throw new Error("Webhook endpoint URL is missing.");
    }

    const payload = {
      timestamp: new Date().toISOString(),
      platform: item.platform,
      caption: item.title,
      targetUrl: item.url,
      sourceSheet: this.sheet.getName(),
      rowId: this.row
    };

    const options = {
      method: 'post',
      contentType: 'application/json',
      payload: JSON.stringify(payload),
      muteHttpExceptions: true
    };

    try {
      const response = UrlFetchApp.fetch(webhookUrl, options);
      const code = response.getResponseCode();
      
      if (code >= 200 && code < 300) {
        this.sheet.getRange(this.row, 4).setValue('Synced / Posted');
        this.sheet.getRange(this.row, 5).setValue(`Success (HTTP ${code}) - ${new Date().toLocaleTimeString()}`);
        return { success: true, code: code };
      } else {
        this.sheet.getRange(this.row, 4).setValue('Failed');
        this.sheet.getRange(this.row, 5).setValue(`Error HTTP ${code}: ${response.getContentText().substring(0, 100)}`);
        return { success: false, code: code };
      }
    } catch (err) {
      this.sheet.getRange(this.row, 4).setValue('Error');
      this.sheet.getRange(this.row, 5).setValue(err.toString());
      return { success: false, error: err.toString() };
    }
  }
}

/**
 * Triggered via UI Menu or Sidebar for active row processing
 */
function processSelectedRowAction() {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const row = sheet.getActiveRange().getRow();
  
  if (row === 1) {
    SpreadsheetApp.getUi().alert('Please select a data row below the header row.');
    return;
  }

  const engine = new SocialPostingEngine(row, sheet);
  const result = engine.generateShareIntent();
  SpreadsheetApp.getUi().alert('Processed row ' + row + '\nGenerated Link: ' + result.link);
}

/**
 * Batch processing engine scanning rows with 'Queue' status
 */
function batchProcessQueue(webhookUrl) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const lastRow = sheet.getLastRow();
  if (lastRow < 2) return { processed: 0 };

  // Fetch columns A through E (Range: Row 2, Col 1, LastRow-1, 5)
  const dataRange = sheet.getRange(2, 1, lastRow - 1, 5);
  const values = dataRange.getValues();
  let processedCount = 0;

  for (let i = 0; i < values.length; i++) {
    const currentRow = i + 2;
    const status = String(values[i][3]).trim().toLowerCase();

    // Check if status specifies queued action
    if (status === 'queue' || status === 'pending') {
      const engine = new SocialPostingEngine(currentRow, sheet);
      if (webhookUrl) {
        engine.postToWebhook(webhookUrl);
      } else {
        engine.generateShareIntent();
      }
      processedCount++;
    }
  }
  return { processed: processedCount };
}



<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      body { font-family: Roboto, sans-serif; padding: 12px; color: #333; }
      .card { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .full-width { width: 100%; box-sizing: border-box; margin-top: 6px; }
      label { font-weight: 500; font-size: 12px; color: #5f6368; display: block; margin-top: 8px; }
      input, select { padding: 6px; border: 1px solid #dadce0; border-radius: 4px; }
      .btn-primary { background: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; }
      .btn-primary:hover { background: #1557b0; }
      #statusLog { font-size: 11px; color: #137333; background: #e6f4ea; padding: 8px; border-radius: 4px; margin-top: 10px; display: none; }
    </style>
  </head>
  <body>
    <h3>🌐 Sheets Posting Hub</h3>
    
    <div class="card">
      <label for="webhookUrl">External Webhook / API Endpoint (Optional for direct posts):</label>
      <input type="text" id="webhookUrl" class="full-width" placeholder="https://api.zapier.com/v1/hooks/...">
    </div>

    <div class="card">
      <h4>Actions</h4>
      <button class="btn-primary full-width" onclick="runActiveRow()">Generate Intent for Current Row</button>
      <br><br>
      <button class="btn-primary full-width" onclick="runBatchQueue()" style="background: #0f9d58;">Process All Queued Rows</button>
    </div>

    <div id="statusLog"></div>

    <script>
      function logMessage(msg) {
        const logBox = document.getElementById('statusLog');
        logBox.style.display = 'block';
        logBox.innerText = msg;
      }

      function runActiveRow() {
        logMessage("Processing active row...");
        google.script.run
          .withSuccessHandler(function(res) {
            logMessage("Success! Action completed for selected row.");
          })
          .withFailureHandler(function(err) {
            logMessage("Error: " + err.message);
          })
          .processSelectedRowAction();
      }

      function runBatchQueue() {
        const webhook = document.getElementById('webhookUrl').value;
        logMessage("Processing queued spreadsheet rows...");
        google.script.run
          .withSuccessHandler(function(res) {
            logMessage("Batch processing complete. Processed " + res.processed + " row(s).");
          })
          .withFailureHandler(function(err) {
            logMessage("Batch error: " + err.message);
          })
          .batchProcessQueue(webhook);
      }
    </script>
  </body>
</html>



